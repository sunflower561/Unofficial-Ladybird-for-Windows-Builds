      - name: Generate runtime dependency report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $paths = @(
            "Build\release",
            "Build\release\vcpkg_installed",
            "Build\vcpkg_installed",
            "dist\Ladybird"
          )

          "=== DLL INVENTORY ===" | Out-File dll-report.txt

          foreach ($path in $paths) {
            if (Test-Path $path) {
              "`n=== $path ===" | Out-File dll-report.txt -Append

              Get-ChildItem $path -Filter "*.dll" -File -Recurse |
                Select-Object FullName, Length |
                Format-Table -AutoSize |
                Out-String |
                Out-File dll-report.txt -Append
            }
          }

          "=== INSTALLED FILES ===" | Out-File dll-report.txt -Append

          Get-ChildItem "dist\Ladybird" -File -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize |
            Out-String |
            Out-File dll-report.txt -Append

      - name: Upload DLL diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-dll-report
          path: dll-report.txt
          retention-days: 7
