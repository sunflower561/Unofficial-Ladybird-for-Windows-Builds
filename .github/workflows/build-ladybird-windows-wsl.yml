
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish a GitHub prerelease"
        required: true
        default: true
        type: boolean

      clean_build:
        description: "Clean build directory before building"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 portable package
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CARGO_BUILD_JOBS: "4"
      BUILD_PRESET: Release
      ENABLE_CI_BASELINE_CPU: "ON"

    steps:
      # --------------------------------------------------
      # 1. Checkout upstream Ladybird
      # --------------------------------------------------

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Record upstream revision
        id: revision
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $short = $sha.Substring(0, 12)

          "UPSTREAM_SHA=$sha" >> $env:GITHUB_ENV
          "UPSTREAM_SHORT=$short" >> $env:GITHUB_ENV

          Write-Host "Upstream SHA: $sha"

      # --------------------------------------------------
      # 2. Build environment
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install build tools
        shell: pwsh
        run: |
          choco install llvm ninja nasm pkgconfiglite 7zip -y

          python -m pip install --upgrade pip
          python -m pip install cmake

          clang-cl --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version

      # --------------------------------------------------
      # 3. Cache vcpkg
      # --------------------------------------------------

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: ladybird-windows-x64-v2-clangcl-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.UPSTREAM_SHORT }}
          restore-keys: |
            ladybird-windows-x64-v2-clangcl-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Configure cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/vcpkg | Out-Null
          New-Item -ItemType Directory -Force .cache/ccache | Out-Null

          "VCPKG_DEFAULT_BINARY_CACHE=$pwd/.cache/vcpkg" >> $env:GITHUB_ENV
          "CCACHE_DIR=$pwd/.cache/ccache" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 4. Clean old build
      # --------------------------------------------------

      - name: Clean previous build
        if: inputs.clean_build
        shell: pwsh
        run: |
          Remove-Item Build/release -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue

      # --------------------------------------------------
      # 5. Inspect upstream build script
      # --------------------------------------------------

      - name: Inspect Ladybird build configuration
        shell: pwsh
        run: |
          if (!(Test-Path "Meta/ladybird.py")) {
            throw "Meta/ladybird.py was not found"
          }

          Write-Host "Checking build script CMake invocation..."

          Select-String `
            -Path "Meta/ladybird.py" `
            -Pattern "cmake|Build/release|BUILD_PRESET" `
            -Context 2,2

      # --------------------------------------------------
      # 6. Configure portable CPU baseline
      # --------------------------------------------------

      - name: Configure Release with x86-64-v2 baseline
        shell: pwsh
        run: |
          cmake --preset Release -B Build/release `
            -DENABLE_CI_BASELINE_CPU=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_LAGOM_TESTS=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

          $cache = Get-Content "Build/release/CMakeCache.txt" -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "Portable CPU baseline was not enabled"
          }

          Write-Host "Portable CPU baseline enabled."

      # --------------------------------------------------
      # 7. Build Ladybird
      # --------------------------------------------------

      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          py Meta/ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      # --------------------------------------------------
      # 8. Verify CPU baseline configuration
      # --------------------------------------------------

      - name: Verify CPU baseline
        shell: pwsh
        run: |
          $cacheFile = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cacheFile)) {
            throw "CMakeCache.txt missing"
          }

          $cache = Get-Content $cacheFile -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "CPU baseline is not ON"
          }

          if (!(Test-Path "Build/release/compile_commands.json")) {
            Write-Warning "compile_commands.json not found; compile flag audit unavailable."
          }
          else {
            $commands = Get-Content "Build/release/compile_commands.json" -Raw

            if ($commands -match '(?i)(-march=native|-mavx512|-mavx2|/arch:AVX2|/arch:AVX512)') {
              throw "Potential non-portable CPU compiler flags detected"
            }

            Write-Host "Compile command scan passed."
          }

          Write-Host "CPU baseline cache verification passed."

      # --------------------------------------------------
      # 9. Install
      # --------------------------------------------------

      - name: Install Ladybird
        shell: pwsh
        run: |
          cmake --install Build/release --prefix "$pwd/dist/Ladybird"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake installation failed"
          }

      # --------------------------------------------------
      # 10. Collect runtime DLLs
      # --------------------------------------------------

      - name: Bundle runtime dependencies
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          if (!(Test-Path $root)) {
            throw "Install directory missing"
          }

          $bin = Join-Path $root "bin"

          New-Item -ItemType Directory -Force $bin | Out-Null

          # Find vcpkg installed binaries.
          $vcpkgBin = Get-ChildItem `
            -Path "Build/release" `
            -Directory `
            -Recurse `
            -Filter "bin" |
            Where-Object {
              $_.FullName -match 'installed[/\\]x64-windows[/\\]bin$'
            } |
            Select-Object -First 1

          if ($vcpkgBin) {
            Write-Host "Found vcpkg runtime directory: $($vcpkgBin.FullName)"

            Get-ChildItem $vcpkgBin.FullName -Filter "*.dll" |
              Copy-Item -Destination $bin -Force
          }
          else {
            Write-Warning "vcpkg x64-windows bin directory not found."
          }

          # Locate Qt installation.
          $qtDlls = Get-ChildItem `
            -Path "Build/release" `
            -Filter "Qt6Core.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($qtDlls) {
            $qtBin = $qtDlls.Directory.FullName

            Write-Host "Qt runtime directory: $qtBin"

            Get-ChildItem $qtBin -Filter "*.dll" |
              Copy-Item -Destination $bin -Force

            # Qt platform plugins.
            $qtPlugins = Join-Path $qtBin "..\plugins"

            if (Test-Path $qtPlugins) {
              Copy-Item $qtPlugins "$root\plugins" -Recurse -Force
            }
          }
          else {
            Write-Warning "Qt6Core.dll not found in build tree."
          }

          # Copy helper executables into the main bin directory.
          Get-ChildItem `
            -Path "Build/release" `
            -Filter "*.exe" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -match 'Build[/\\]release[/\\](bin|libexec)[/\\]'
            } |
            ForEach-Object {
              Copy-Item $_.FullName $bin -Force
            }

      # --------------------------------------------------
      # 11. Runtime package validation
      # --------------------------------------------------

      - name: Validate package
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"
          $bin = Join-Path $root "bin"

          if (!(Test-Path $root)) {
            throw "Package directory missing"
          }

          $exe = Get-ChildItem $root -Filter "Ladybird.exe" -File -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found"
          }

          Write-Host "Main executable: $($exe.FullName)"

          $requiredDlls = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll"
          )

          foreach ($dll in $requiredDlls) {
            if (!(Test-Path (Join-Path $bin $dll))) {
              Write-Warning "Runtime DLL missing: $dll"
            }
          }

          Write-Host "Package validation completed."

      # --------------------------------------------------
      # 12. Remove development files
      # --------------------------------------------------

      - name: Remove development artifacts
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in @(
                ".pdb",
                ".ilk",
                ".obj",
                ".exp",
                ".lib"
              )
            } |
            Remove-Item -Force

      # --------------------------------------------------
      # 13. Create release ZIP
      # --------------------------------------------------

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          $zipName = "Ladybird-Windows-x64-x86-64-v2.zip"

          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive `
            -Path "$root\*" `
            -DestinationPath $zipName `
            -CompressionLevel Optimal

          if (!(Test-Path $zipName)) {
            throw "ZIP creation failed"
          }

          $size = (Get-Item $zipName).Length / 1MB

          Write-Host "ZIP size: $([math]::Round($size, 2)) MB"

          "PACKAGE_ZIP=$zipName" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 14. Verify ZIP contents
      # --------------------------------------------------

      - name: Verify ZIP contents
        shell: pwsh
        run: |
          $zip = $env:PACKAGE_ZIP

          $entries = tar -tf $zip

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity check failed"
          }

          if (!($entries -match 'Ladybird\.exe$')) {
            throw "Ladybird.exe missing from ZIP"
          }

          Write-Host "ZIP integrity check passed."

      # --------------------------------------------------
      # 15. Upload build artifact
      # --------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-x86-64-v2
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 16. Generate release information
      # --------------------------------------------------

      - name: Generate release notes
        shell: pwsh
        run: |
          $notes = @"
          # Ladybird Windows x64

          Upstream revision: $env:UPSTREAM_SHA

          ## CPU compatibility

          - Target: x86-64-v2
          - Requires SSE4.2 and POPCNT
          - Does not require AVX
          - Does not require AVX2
          - Does not require AVX-512

          ## Package

          - Windows x64
          - Portable ZIP
          - Release configuration
          - Built from upstream Ladybird

          ## Important

          This is an experimental third-party Windows native build.
          Windows native Clang-CL support is still experimental upstream.

          The CPU baseline setting is not a guarantee that every third-party
          dependency uses the same compiler baseline. Please report compatibility
          problems with your CPU model and Windows version.
          "@

          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      # --------------------------------------------------
      # 17. Publish GitHub prerelease
      # --------------------------------------------------

      - name: Publish GitHub prerelease
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          files: ${{ env.PACKAGE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
