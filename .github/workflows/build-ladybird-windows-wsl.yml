
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish GitHub prerelease"
        required: true
        default: false
        type: boolean

      clean_build:
        description: "Clean build directory"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CARGO_BUILD_JOBS: "4"
      VCPKG_DISABLE_METRICS: "1"

    steps:
      # ================================================
      # 1. Checkout
      # ================================================

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Record upstream revision
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $short = $sha.Substring(0, 12)

          "UPSTREAM_SHA=$sha" >> $env:GITHUB_ENV
          "UPSTREAM_SHORT=$short" >> $env:GITHUB_ENV

          Write-Host "Upstream revision: $sha"

      # ================================================
      # 2. Python
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ================================================
      # 3. MSVC
      # ================================================

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ================================================
      # 4. Rust
      # ================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ================================================
      # 5. Install build tools
      # ================================================

      - name: Install LLVM and Ninja
        shell: pwsh
        run: |
          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey installation failed"
          }

          python -m pip install --upgrade pip
          python -m pip install cmake

          $llvm = "C:\Program Files\LLVM\bin"
          $choco = "C:\ProgramData\chocolatey\bin"

          if (Test-Path "$llvm\clang-cl.exe") {
            $llvm | Out-File $env:GITHUB_PATH -Append
          }

          if (Test-Path "$choco\ninja.exe") {
            $choco | Out-File $env:GITHUB_PATH -Append
          }

          Write-Host "Installed tools:"
          clang-cl --version
          ninja --version
          cmake --version
          nasm -v
          rustc --version
          cargo --version

      # ================================================
      # 6. Verify toolchain
      # ================================================

      - name: Verify build environment
        shell: pwsh
        run: |
          $tools = @(
            "clang-cl.exe",
            "ninja.exe",
            "cmake.exe",
            "nasm.exe",
            "python.exe",
            "cargo.exe"
          )

          foreach ($tool in $tools) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue

            if (!$found) {
              throw "Required tool missing: $tool"
            }

            Write-Host "$tool : $($found.Source)"
          }

          Write-Host "MSVC environment:"
          cl.exe 2>&1 | Select-Object -First 3

      # ================================================
      # 7. Cache vcpkg
      # ================================================

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: ladybird-vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            ladybird-vcpkg-windows-x64-

      - name: Configure vcpkg cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".cache/vcpkg" | Out-Null

          $cache = Join-Path $pwd ".cache/vcpkg"

          "VCPKG_DEFAULT_BINARY_CACHE=$cache" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "vcpkg binary cache: $cache"

      # ================================================
      # 8. Clean build
      # ================================================

      - name: Clean previous build
        if: inputs.clean_build
        shell: pwsh
        run: |
          Remove-Item "Build/release" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Build directory cleaned."

      # ================================================
      # 9. Inspect upstream build script
      # ================================================

      - name: Inspect Ladybird build script
        shell: pwsh
        run: |
          if (!(Test-Path "Meta/ladybird.py")) {
            throw "Meta/ladybird.py not found"
          }

          Select-String `
            -Path "Meta/ladybird.py" `
            -Pattern "cmake|preset|Build/release" `
            -Context 2,2

      # ================================================
      # 10. Configure CMake
      # ================================================

      - name: Configure Release
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          Write-Host "Ninja: $ninja"

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            -DENABLE_CI_BASELINE_CPU=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

          $cacheFile = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cacheFile)) {
            throw "CMakeCache.txt missing"
          }

          $cache = Get-Content $cacheFile -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "Portable CPU baseline is not enabled"
          }

          Write-Host "CPU baseline configured."

      # ================================================
      # 11. Build Ladybird
      # ================================================

      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          py Meta/ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      # ================================================
      # 12. Verify CPU baseline
      # ================================================

      - name: Verify CPU baseline
        shell: pwsh
        run: |
          $cacheFile = "Build/release/CMakeCache.txt"
          $cache = Get-Content $cacheFile -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "CPU baseline was disabled during build"
          }

          Write-Host "CPU baseline cache verification passed."

          if (Test-Path "Build/release/compile_commands.json") {
            $commands = Get-Content "Build/release/compile_commands.json" -Raw

            $badFlags = @(
              "-march=native",
              "-mavx2",
              "-mavx512",
              "/arch:AVX2",
              "/arch:AVX512"
            )

            foreach ($flag in $badFlags) {
              if ($commands.Contains($flag)) {
                throw "Non-portable compiler flag detected: $flag"
              }
            }

            Write-Host "Compiler flag scan passed."
          }
          else {
            Write-Warning "compile_commands.json unavailable."
          }

      # ================================================
      # 13. Install
      # ================================================

      - name: Install Ladybird
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null

          cmake --install Build/release --prefix "$pwd/dist/Ladybird"

          if ($LASTEXITCODE -ne 0) {
            throw "Installation failed"
          }

      # ================================================
      # 14. Bundle dependencies
      # ================================================

      - name: Bundle runtime dependencies
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"
          $bin = Join-Path $root "bin"

          New-Item -ItemType Directory -Force $bin | Out-Null

          # vcpkg DLLs
          $vcpkgBin = Get-ChildItem `
            -Path "Build/release" `
            -Directory `
            -Recurse `
            -Filter "bin" |
            Where-Object {
              $_.FullName -match 'installed[/\\]x64-windows[/\\]bin$'
            } |
            Select-Object -First 1

          if ($vcpkgBin) {
            Get-ChildItem $vcpkgBin.FullName -Filter "*.dll" |
              Copy-Item -Destination $bin -Force
          }

          # Qt DLLs and plugins
          $qtCore = Get-ChildItem `
            -Path "Build/release" `
            -Filter "Qt6Core.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($qtCore) {
            $qtBin = $qtCore.Directory.FullName

            Get-ChildItem $qtBin -Filter "*.dll" |
              Copy-Item -Destination $bin -Force

            $plugins = Join-Path $qtBin "..\plugins"

            if (Test-Path $plugins) {
              Copy-Item $plugins "$root\plugins" -Recurse -Force
            }
          }

          # Helper executables
          Get-ChildItem "Build/release" -Filter "*.exe" -File -Recurse |
            Where-Object {
              $_.FullName -match '[/\\](bin|libexec)[/\\]'
            } |
            ForEach-Object {
              Copy-Item $_.FullName $bin -Force
            }

      # ================================================
      # 15. Validate package
      # ================================================

      - name: Validate package
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          $exe = Get-ChildItem $root -Filter "Ladybird.exe" -File -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found"
          }

          Write-Host "Executable: $($exe.FullName)"

          $dllCount = (Get-ChildItem $root -Filter "*.dll" -File -Recurse).Count

          Write-Host "Bundled DLL count: $dllCount"

      # ================================================
      # 16. Remove development files
      # ================================================

      - name: Remove development files
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in @(".pdb", ".ilk", ".obj", ".exp", ".lib")
            } |
            Remove-Item -Force

      # ================================================
      # 17. Create ZIP
      # ================================================

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $zip = "Ladybird-Windows-x64-x86-64-v2.zip"

          Compress-Archive `
            -Path "dist/Ladybird/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed"
          }

          "PACKAGE_ZIP=$zip" >> $env:GITHUB_ENV

          Write-Host "Package size: $((Get-Item $zip).Length / 1MB) MB"

      # ================================================
      # 18. Verify ZIP
      # ================================================

      - name: Verify ZIP
        shell: pwsh
        run: |
          tar -tf $env:PACKAGE_ZIP | Out-File zip-list.txt

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity check failed"
          }

          if (!(Select-String -Path zip-list.txt -Pattern 'Ladybird\.exe')) {
            throw "Ladybird.exe missing from ZIP"
          }

      # ================================================
      # 19. Release notes
      # ================================================

      - name: Generate release notes
        shell: pwsh
        run: |
          @"
          # Ladybird Windows x64

          Upstream revision: $env:UPSTREAM_SHA

          ## CPU target

          - x86-64-v2
          - SSE4.2 and POPCNT baseline
          - AVX is not a baseline requirement
          - AVX2 is not a baseline requirement
          - AVX-512 is not a baseline requirement

          ## Package

          - Windows x64
          - Portable ZIP
          - Release build

          ## Notice

          Experimental third-party native Windows build.
          Windows native Clang-CL support remains experimental upstream.

          Third-party dependencies may have independent CPU requirements.
          "@ | Out-File release-notes.md -Encoding utf8

      # ================================================
      # 20. Upload successful build
      # ================================================

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-x86-64-v2
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      # ================================================
      # 21. Publish prerelease
      # ================================================

      - name: Publish GitHub prerelease
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          files: ${{ env.PACKAGE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ================================================
      # 22. Print vcpkg failure information
      # ================================================

      - name: Print vcpkg failure details
        if: failure()
        shell: pwsh
        run: |
          $paths = @(
            "Build/release/vcpkg-manifest-install.log",
            "Build/release/vcpkg_installed/vcpkg/issue_body.md"
          )

          foreach ($file in $paths) {
            if (Test-Path $file) {
              Write-Host "`n========== $file =========="
              Get-Content $file -Tail 250
            }
          }

          Write-Host "`n========== vcpkg output logs =========="

          $logs = Get-ChildItem `
            -Path "Build/release" `
            -Filter "*-out.log" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($log in $logs) {
            Write-Host "`n--- $($log.FullName) ---"
            Get-Content $log.FullName -Tail 150
          }

          Write-Host "`n========== disk space =========="

          Get-PSDrive -PSProvider FileSystem

      # ================================================
      # 23. Upload vcpkg logs
      # ================================================

      - name: Upload vcpkg diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-vcpkg-debug-logs
          path: |
            Build/release/vcpkg-manifest-install.log
            Build/release/vcpkg_installed/vcpkg/issue_body.md
            Build/release/**/install-*-out.log
            Build/release/**/build-*-out.log
            Build/release/**/config-*-out.log
            Build/release/**/src/**
          if-no-files-found: warn
          retention-days: 14
