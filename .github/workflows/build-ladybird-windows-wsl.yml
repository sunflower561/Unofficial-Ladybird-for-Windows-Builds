
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit SHA"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Checkout workflow repository
      # --------------------------------------------------

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Validate upstream ref
      # --------------------------------------------------

      - name: Validate upstream ref
        id: source
        shell: pwsh
        run: |
          $ref = "${{ inputs.ref }}".Trim()

          if ([string]::IsNullOrWhiteSpace($ref)) {
              throw "Upstream ref cannot be empty."
          }

          "ref=$ref" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # 3. Checkout Ladybird upstream
      # --------------------------------------------------

      - name: Checkout Ladybird upstream
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ steps.source.outputs.ref }}
          path: ladybird
          fetch-depth: 1
          persist-credentials: false

      - name: Record source revision
        id: revision
        shell: pwsh
        working-directory: ladybird
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 12)

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT

          Write-Host "Ladybird source commit: $sha"

      # --------------------------------------------------
      # 4. Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------
      # 5. Rust
      # --------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --------------------------------------------------
      # 6. Install LLVM 22.1.8
      # --------------------------------------------------

      - name: Install LLVM 22.1.8
        shell: pwsh
        run: |
          $version = "22.1.8"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          $installer = "$env:RUNNER_TEMP\LLVM-$version-win64.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $expectedHash = "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
              throw "LLVM installer SHA256 verification failed."
          }

          $installDir = "C:\LLVM"

          $process = Start-Process -FilePath $installer `
              -ArgumentList "/S", "/D=$installDir" `
              -Wait -PassThru

          if ($process.ExitCode -ne 0) {
              throw "LLVM installation failed: $($process.ExitCode)"
          }

          "$installDir\bin" >> $env:GITHUB_PATH

          Write-Host "LLVM installation completed."

      # --------------------------------------------------
      # 7. Install build utilities
      # --------------------------------------------------

      - name: Install Ninja NASM and pkg-config
        shell: pwsh
        run: |
          choco install ninja nasm pkgconfiglite -y --no-progress

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue

          if (-not $ninja) {
              throw "Ninja was not found."
          }

          if (-not $nasm) {
              throw "NASM was not found."
          }

          ninja --version
          nasm -v

      # --------------------------------------------------
      # 8. Activate MSVC
      # --------------------------------------------------

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # 9. Verify compilers
      # --------------------------------------------------

      - name: Verify compiler versions
        shell: pwsh
        run: |
          clang-cl --version
          clang --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version

          $clang = (clang-cl --version | Select-Object -First 1)

          if ($clang -notmatch "22\.1\.8") {
              throw "Expected LLVM 22.1.8, got: $clang"
          }

      # --------------------------------------------------
      # 10. Read vcpkg baseline
      # --------------------------------------------------

      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        working-directory: ladybird
        run: |
          $manifestPath = Join-Path $PWD "vcpkg.json"

          if (-not (Test-Path $manifestPath)) {
              throw "Ladybird vcpkg.json was not found."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
              throw "builtin-baseline was not found in vcpkg.json."
          }

          "commit=$baseline" >> $env:GITHUB_OUTPUT

          Write-Host "vcpkg baseline: $baseline"

      # --------------------------------------------------
      # 11. Clone vcpkg at exact baseline
      # --------------------------------------------------

      - name: Checkout vcpkg baseline
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"

          if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
          }

          $baseline = "${{ steps.baseline.outputs.commit }}"

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Cloning vcpkg attempt $attempt..."

              if (Test-Path $root) {
                  Remove-Item $root -Recurse -Force
              }

              git clone https://github.com/microsoft/vcpkg.git $root

              if ($LASTEXITCODE -eq 0) {
                  $success = $true
                  break
              }

              Start-Sleep -Seconds 15
          }

          if (-not $success) {
              throw "Unable to clone vcpkg after 3 attempts."
          }

          Push-Location $root

          git checkout $baseline

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to checkout vcpkg baseline."
          }

          .\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed."
          }

          Pop-Location

          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_INSTALLATION_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "vcpkg root: $root"

      # --------------------------------------------------
      # 12. Configure CMake
      # --------------------------------------------------

      - name: Configure Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          $buildDir = Join-Path $PWD "Build\release"
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"
          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"

          if (Test-Path $buildDir) {
              Remove-Item $buildDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null

          if (-not (Test-Path $toolchain)) {
              throw "Local vcpkg toolchain was not found: $toolchain"
          }

          $overlayPorts = Join-Path $PWD "Meta\CMake\vcpkg\overlay-ports"
          $overlayTriplets = Join-Path $PWD "Meta\CMake\vcpkg\overlay-triplets"

          $arguments = @(
              "-S", ".",
              "-B", "Build/release",
              "-G", "Ninja",
              "-DCMAKE_BUILD_TYPE=Release",
              "-DCMAKE_C_COMPILER=clang-cl",
              "-DCMAKE_CXX_COMPILER=clang-cl",
              "-DCMAKE_TOOLCHAIN_FILE=$($toolchain.Replace('\','/'))",
              "-DVCPKG_ROOT=$($vcpkgRoot.Replace('\','/'))",
              "-DVCPKG_TARGET_TRIPLET=x64-windows",
              "-DVCPKG_OVERLAY_PORTS=$($overlayPorts.Replace('\','/'))",
              "-DVCPKG_OVERLAY_TRIPLETS=$($overlayTriplets.Replace('\','/'))",
              "-DLADYBIRD_BASELINE_CPU_TARGET=ON",
              "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          )

          Write-Host "Using local vcpkg toolchain:"
          Write-Host $toolchain

          & cmake @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "CMake configuration failed."
          }

      # --------------------------------------------------
      # 13. Verify CMake configuration
      # --------------------------------------------------

      - name: Verify CMake configuration
        shell: pwsh
        working-directory: ladybird
        run: |
          $cache = Get-Content "Build/release/CMakeCache.txt" -Raw

          $toolchainMatch = [regex]::Match(
              $cache,
              '(?m)^CMAKE_TOOLCHAIN_FILE:FILEPATH=(.+)$'
          )

          if (-not $toolchainMatch.Success) {
              throw "CMAKE_TOOLCHAIN_FILE is missing."
          }

          $actualToolchain = $toolchainMatch.Groups[1].Value.Trim()
          $expectedToolchain = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream\scripts\buildsystems\vcpkg.cmake"

          $actualNormalized = $actualToolchain.Replace('\','/').TrimEnd('/').ToLowerInvariant()
          $expectedNormalized = $expectedToolchain.Replace('\','/').TrimEnd('/').ToLowerInvariant()

          if ($actualNormalized -ne $expectedNormalized) {
              throw "CMake selected an incorrect vcpkg toolchain: $actualToolchain"
          }

          $rootMatch = [regex]::Match(
              $cache,
              '(?m)^Z_VCPKG_ROOT_DIR:PATH=(.+)$'
          )

          if (-not $rootMatch.Success) {
              $rootMatch = [regex]::Match(
                  $cache,
                  '(?m)^Z_VCPKG_ROOT_DIR:INTERNAL=(.+)$'
              )
          }

          if (-not $rootMatch.Success) {
              throw "Z_VCPKG_ROOT_DIR was not found in CMakeCache."
          }

          $actualRoot = $rootMatch.Groups[1].Value.Trim()
          $expectedRoot = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"

          if ($actualRoot.Replace('\','/').TrimEnd('/').ToLowerInvariant() -ne
              $expectedRoot.Replace('\','/').TrimEnd('/').ToLowerInvariant()) {
              throw "CMake selected an incorrect vcpkg root: $actualRoot"
          }

          if ($cache -notmatch '(?m)^LADYBIRD_BASELINE_CPU_TARGET:[^=]+=ON$') {
              throw "LADYBIRD_BASELINE_CPU_TARGET is not enabled."
          }

          Write-Host "CMake toolchain verification passed."
          Write-Host "Local vcpkg root verification passed."
          Write-Host "CPU baseline option is enabled."

      # --------------------------------------------------
      # 14. Build Ladybird
      # --------------------------------------------------

      - name: Build Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"

          cmake --build Build/release --parallel 4 2>&1 |
              Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
              throw "Ladybird build failed."
          }

      # --------------------------------------------------
      # 15. Verify CPU baseline
      # --------------------------------------------------

      - name: Verify x86-64-v2 compiler flags
        shell: pwsh
        working-directory: ladybird
        run: |
          $file = "Build/release/compile_commands.json"

          if (-not (Test-Path $file)) {
              throw "compile_commands.json was not generated."
          }

          $commands = Get-Content $file -Raw | ConvertFrom-Json

          $clangCommands = @(
              $commands | Where-Object {
                  $_.command -match "clang-cl" -or
                  $_.arguments -contains "clang-cl"
              }
          )

          if ($clangCommands.Count -eq 0) {
              throw "No clang-cl compilation entries were found."
          }

          $missing = @(
              $clangCommands | Where-Object {
                  ($_.command + " " + ($_.arguments -join " ")) -notmatch "-march=x86-64-v2"
              }
          )

          if ($missing.Count -gt 0) {
              Write-Host "Entries missing x86-64-v2: $($missing.Count)"
              throw "Some Clang compilation entries are missing x86-64-v2."
          }

          $avx = @(
              $clangCommands | Where-Object {
                  ($_.command + " " + ($_.arguments -join " ")) -match '(-mavx2?|-mavx512\S*|/arch:AVX)'
              }
          )

          if ($avx.Count -gt 0) {
              throw "Unexpected AVX compiler flags were detected."
          }

          Write-Host "Verified $($clangCommands.Count) Clang compilation entries."

      # --------------------------------------------------
      # 16. Clean development and test files
      # --------------------------------------------------

      - name: Clean development and test files
        shell: pwsh
        working-directory: ladybird
        run: |
          $root = (Resolve-Path "Build/release").Path

          Write-Host "Cleaning build directory: $root"

          # Remove development/debug/test file extensions.
          $extensions = @(
              ".obj",
              ".o",
              ".lib",
              ".a",
              ".pdb",
              ".ilk",
              ".exp",
              ".pch",
              ".gch",
              ".idb",
              ".ipch",
              ".tlog",
              ".lastbuildstate",
              ".recipe",
              ".sdf",
              ".VC.db",
              ".VC.VC.opendb"
          )

          Get-ChildItem -LiteralPath $root -Recurse -File -Force |
              Where-Object {
                  $extensions -contains $_.Extension.ToLowerInvariant() -or
                  $_.Name -in @(
                      "CMakeCache.txt",
                      "compile_commands.json",
                      ".ninja_log",
                      ".ninja_deps",
                      "build.ninja",
                      "rules.ninja",
                      "cmake_install.cmake",
                      "CTestTestfile.cmake",
                      "DartConfiguration.tcl"
                  )
              } |
              ForEach-Object {
                  Write-Host "Removing file: $($_.FullName.Substring($root.Length))"
                  Remove-Item -LiteralPath $_.FullName -Force
              }

          # Remove known build-system and test-result directories.
          $directoryNames = @(
              "CMakeFiles",
              "Testing",
              "TestResults",
              "test-results",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache"
          )

          Get-ChildItem -LiteralPath $root -Recurse -Directory -Force |
              Where-Object {
                  $directoryNames -contains $_.Name
              } |
              Sort-Object { $_.FullName.Length } -Descending |
              ForEach-Object {
                  if (Test-Path -LiteralPath $_.FullName) {
                      Write-Host "Removing directory: $($_.FullName.Substring($root.Length))"
                      Remove-Item -LiteralPath $_.FullName -Recurse -Force
                  }
              }

          # Remove common test executables, but preserve normal runtime binaries.
          $testExePatterns = @(
              "Test*.exe",
              "*Tests.exe",
              "*_test.exe",
              "*_tests.exe"
          )

          foreach ($pattern in $testExePatterns) {
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      Write-Host "Removing test executable: $($_.FullName.Substring($root.Length))"
                      Remove-Item -LiteralPath $_.FullName -Force
                  }
          }

          # Remove common test-only data files.
          $testDataNames = @(
              "CTestCostData.txt",
              "LastTestsFailed.log",
              "LastTest.log"
          )

          Get-ChildItem -LiteralPath $root -Recurse -File -Force |
              Where-Object {
                  $testDataNames -contains $_.Name
              } |
              Remove-Item -Force

          # Ensure that the main application executable still exists.
          $mainExe = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "Ladybird.exe" |
              Select-Object -First 1

          if (-not $mainExe) {
              throw "Ladybird.exe was not found after cleanup."
          }

          Write-Host "Main executable preserved: $($mainExe.FullName)"

          # Report remaining package size.
          $files = Get-ChildItem -LiteralPath $root -Recurse -File -Force
          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          $totalGB = [math]::Round($totalBytes / 1GB, 3)

          Write-Host "Remaining files: $($files.Count)"
          Write-Host "Remaining size: $totalGB GB"

      # --------------------------------------------------
      # 17. Verify runtime files
      # --------------------------------------------------

      - name: Verify runtime files
        shell: pwsh
        working-directory: ladybird
        run: |
          $root = (Resolve-Path "Build/release").Path

          $mainExe = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "Ladybird.exe" |
              Select-Object -First 1

          if (-not $mainExe) {
              throw "Ladybird.exe is missing."
          }

          $binDir = $mainExe.Directory.FullName

          Write-Host "Application directory: $binDir"

          $runtimeExecutables = @(
              "Ladybird.exe",
              "WebContent.exe",
              "RequestServer.exe"
          )

          foreach ($name in $runtimeExecutables) {
              $found = Get-ChildItem -LiteralPath $root -Recurse -File -Filter $name |
                  Select-Object -First 1

              if ($found) {
                  Write-Host "Found runtime component: $name"
              }
              elseif ($name -eq "Ladybird.exe") {
                  throw "Main executable is missing."
              }
              else {
                  Write-Host "Optional runtime component not found: $name"
              }
          }

          $dllCount = (
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter "*.dll"
          ).Count

          if ($dllCount -eq 0) {
              Write-Warning "No DLL files found. Check whether runtime dependencies are bundled."
          }

          Write-Host "DLL count: $dllCount"

      # --------------------------------------------------
      # 18. Generate package
      # --------------------------------------------------

      - name: Package Ladybird
        id: package
        shell: pwsh
        working-directory: ladybird
        run: |
          $root = (Resolve-Path "Build/release").Path
          $output = Join-Path $env:GITHUB_WORKSPACE "dist"

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $zip = Join-Path $output "Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path "$root\*" `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
              Set-Content "$zip.sha256"

          $size = [math]::Round((Get-Item $zip).Length / 1GB, 3)

          Write-Host "ZIP: $zip"
          Write-Host "Size: $size GB"
          Write-Host "SHA256: $hash"

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # 19. Upload diagnostics
      # --------------------------------------------------

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics-${{ github.run_number }}
          path: |
            build.log
            ladybird/Build/release/CMakeCache.txt
            ladybird/Build/release/compile_commands.json
          if-no-files-found: ignore
          retention-days: 7

      # --------------------------------------------------
      # 20. Upload release artifact
      # --------------------------------------------------

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-${{ steps.revision.outputs.short }}
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # --------------------------------------------------
      # 21. Publish GitHub Pre-release
      # --------------------------------------------------

      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}-${{ steps.revision.outputs.short }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          body: |
            ## Ladybird Windows x64

            - Upstream repository: LadybirdBrowser/ladybird
            - Upstream ref: ${{ inputs.ref }}
            - Upstream commit: ${{ steps.revision.outputs.sha }}
            - LLVM: 22.1.8
            - Build configuration: Release
            - CPU baseline: x86-64-v2

            This is an experimental Windows build.

            Runtime compatibility must be verified on a clean Windows system.

            SHA256:
            `${{ steps.package.outputs.hash }}`

          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
