
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch / tag / commit"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 Build
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      # ------------------------------------------------------------
      # 1. 获取 Ladybird 源码
      # ------------------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Show source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Requested ref: ${{ inputs.ref }}"
          Write-Host "Actual commit:"
          git rev-parse HEAD
          git log -1 --oneline

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ------------------------------------------------------------
      # 3. MSVC
      # ------------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # 4. Rust 固定为 1.98.0
      # 关键修复：不再使用最新 stable
      # ------------------------------------------------------------
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Verify Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          rustc --version
          cargo --version

          $version = rustc --version
          if ($version -notmatch "1\.98\.0") {
            throw "Expected Rust 1.98.0, got: $version"
          }

      # ------------------------------------------------------------
      # 5. 安装构建工具
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          python -m pip install --upgrade pip cmake

          $scripts = (python -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()
          $scripts | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$scripts;$env:PATH"

          if (!(Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            throw "clang-cl not found"
          }

          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            throw "ninja not found"
          }

          if (!(Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            throw "pkg-config not found"
          }

          clang-cl --version
          ninja --version
          cmake --version
          pkg-config --version
          nasm -version

      # ------------------------------------------------------------
      # 6. 缓存目录
      # ------------------------------------------------------------
      - name: Prepare cache directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force ".cache\vcpkg" | Out-Null
          New-Item -ItemType Directory -Force ".cache\ccache" | Out-Null

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: .cache\vcpkg
          key: ladybird-vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-vcpkg-windows-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache\ccache
          key: ladybird-ccache-windows-${{ hashFiles('**/CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            ladybird-ccache-windows-

      - name: Configure cache environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgCache = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg"
          $ccache = Join-Path $env:GITHUB_WORKSPACE ".cache\ccache"

          New-Item -ItemType Directory -Force $vcpkgCache | Out-Null
          New-Item -ItemType Directory -Force $ccache | Out-Null

          "VCPKG_DEFAULT_BINARY_CACHE=$vcpkgCache" >> $env:GITHUB_ENV
          "CCACHE_DIR=$ccache" >> $env:GITHUB_ENV

          "VCPKG_DEFAULT_BINARY_CACHE=$vcpkgCache"
          "CCACHE_DIR=$ccache"

      # ------------------------------------------------------------
      # 7. 检查工具链
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Python:"
          python --version

          Write-Host "Rust:"
          rustc --version
          cargo --version

          Write-Host "CMake:"
          cmake --version

          Write-Host "Ninja:"
          ninja --version

          Write-Host "Clang-CL:"
          clang-cl --version

          Write-Host "MSVC:"
          cl.exe

          Write-Host "pkg-config:"
          pkg-config --version

      # ------------------------------------------------------------
      # 8. 清理旧构建输出
      # ------------------------------------------------------------
      - name: Prepare build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item "Build\release" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "Ladybird-Windows-x64.zip" -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force "dist" | Out-Null

      # ------------------------------------------------------------
      # 9. 编译 Ladybird
      # ------------------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
          CCACHE_DIR: ${{ github.workspace }}\.cache\ccache
          VCPKG_MAX_CONCURRENCY: "4"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "Starting Ladybird Windows x64 build"
          Write-Host "======================================"

          Write-Host "Rust:"
          rustc --version

          Write-Host "Compiler:"
          clang-cl --version

          py Meta\ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed: $LASTEXITCODE"
          }

          Write-Host "Build completed."

      # ------------------------------------------------------------
      # 10. 检查 EXE
      # ------------------------------------------------------------
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem "Build" -Recurse -File -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe was not found"
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)

          if ($bytes.Length -lt 64) {
            throw "Invalid executable"
          }

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Not a Windows PE executable"
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if (
            $bytes[$peOffset] -ne 0x50 -or
            $bytes[$peOffset + 1] -ne 0x45 -or
            $bytes[$peOffset + 2] -ne 0 -or
            $bytes[$peOffset + 3] -ne 0
          ) {
            throw "Invalid PE signature"
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
            throw "Not an AMD64 executable. Machine: $machine"
          }

          "LADYBIRD_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

          Write-Host "Valid Windows x64 executable:"
          Write-Host $exe.FullName

      # ------------------------------------------------------------
      # 11. 使用 CMake 安装规则生成运行目录
      # ------------------------------------------------------------
      - name: Install Ladybird runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $env:GITHUB_WORKSPACE "Build\release"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"

          if (!(Test-Path $build)) {
            throw "Build\release directory not found"
          }

          New-Item -ItemType Directory -Force $prefix | Out-Null

          cmake --install $build --prefix $prefix

          if ($LASTEXITCODE -ne 0) {
            throw "CMake install failed: $LASTEXITCODE"
          }

      # ------------------------------------------------------------
      # 12. 检查安装目录
      # ------------------------------------------------------------
      - name: Verify install tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"

          $exe = Get-ChildItem $prefix -Recurse -File -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (!$exe) {
            Write-Host "Install directory contents:"
            Get-ChildItem $prefix -Recurse | Select-Object FullName
            throw "Ladybird.exe missing from install tree"
          }

          Write-Host "Installed executable:"
          Write-Host $exe.FullName

      # ------------------------------------------------------------
      # 13. 只清理调试符号和中间文件
      # 不删除 DLL、Qt 插件和资源
      # ------------------------------------------------------------
      - name: Remove development files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"

          foreach ($pattern in @("*.pdb", "*.ilk", "*.obj", "*.exp", "*.lib")) {
            Get-ChildItem $root -Recurse -File -Filter $pattern |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Runtime DLL count:"
          (Get-ChildItem $root -Recurse -File -Filter "*.dll").Count

          Write-Host "EXE files:"
          Get-ChildItem $root -Recurse -File -Filter "*.exe" |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # 14. 检查打包内容
      # ------------------------------------------------------------
      - name: Inspect package contents
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"

          $files = Get-ChildItem $root -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum

          Write-Host "File count: $($files.Count)"
          Write-Host "Total size: $([math]::Round($total / 1MB, 2)) MB"

          Write-Host "Largest files:"
          $files |
            Sort-Object Length -Descending |
            Select-Object -First 30 FullName,
              @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # 15. 生成 ZIP
      # ------------------------------------------------------------
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$root\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed"
          }

          $info = Get-Item $zip
          Write-Host "ZIP size: $([math]::Round($info.Length / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # 16. 上传 Artifact
      # ------------------------------------------------------------
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: Ladybird-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ------------------------------------------------------------
      # 17. 发布 GitHub Pre-release
      # ------------------------------------------------------------
      - name: Generate release tag
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "windows-$date-${{ github.run_number }}"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Ladybird Windows x64 ${{ env.RELEASE_TAG }}"
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Unofficial Ladybird Windows x64 build.

            Source ref: ${{ inputs.ref }}

            Rust toolchain: 1.98.0
            Compiler: Clang-CL + MSVC
            Build system: CMake + Ninja
          files: |
            Ladybird-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
