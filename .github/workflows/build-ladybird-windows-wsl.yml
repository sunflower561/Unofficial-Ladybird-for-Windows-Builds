
name: Ladybird Windows x64 - Fast Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird branch, tag or commit"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg

    steps:
      # 1. 获取源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          check-latest: true

      # 3. Visual Studio x64
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 安装最新 LLVM / NASM / pkg-config
      - name: Install LLVM
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          choco upgrade nasm -y --no-progress
          choco upgrade pkgconfiglite -y --no-progress

          $llvm = "$env:ProgramFiles\LLVM\bin"
          Add-Content $env:GITHUB_PATH $llvm

      # 5. 最新 CMake / Ninja / aqtinstall
      - name: Install Build Tools
        shell: pwsh
        run: |
          python -m pip install --upgrade `
            pip setuptools wheel cmake ninja aqtinstall

      # 6. Rust stable
      - name: Setup Rust
        uses: rust-lang/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 7. 查询最新 Qt 版本
      - name: Detect Qt Version
        id: qt
        shell: pwsh
        run: |
          $raw = & aqt list-qt windows desktop | Out-String

          if ($LASTEXITCODE -ne 0) {
            throw "Qt version query failed."
          }

          $versions = [regex]::Matches(
            $raw,
            '(?<!\d)6\.\d+\.\d+(?!\d)'
          ) |
            ForEach-Object { [version]$_.Value } |
            Sort-Object -Unique

          if (!$versions) {
            throw "No Qt 6 release found."
          }

          $version = $versions[-1].ToString()

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Qt version: $version"

      # 8. 缓存 Qt
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: Qt
          key: ladybird-qt-${{ steps.qt.outputs.version }}-msvc2022-x64

      # 9. 安装 Qt（仅缓存未命中时）
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          aqt install-qt `
            windows desktop ${{ steps.qt.outputs.version }} win64_msvc2022_64 `
            -m qtpositioning qttools `
            -O "$env:GITHUB_WORKSPACE\Qt"

          if ($LASTEXITCODE -ne 0) {
            throw "Qt installation failed."
          }

      # 10. 设置 Qt 路径
      - name: Configure Qt
        shell: pwsh
        run: |
          $qtRoot = "$env:GITHUB_WORKSPACE\Qt\${{ steps.qt.outputs.version }}\msvc2022_64"

          if (!(Test-Path "$qtRoot\lib\cmake\Qt6\Qt6Config.cmake")) {
            throw "Qt installation incomplete."
          }

          "QT_ROOT=$qtRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          "Qt6_DIR=$qtRoot\lib\cmake\Qt6" >> $env:GITHUB_ENV

      # 11. 缓存 vcpkg 二进制包
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: ladybird-vcpkg-win64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            ladybird-vcpkg-win64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            ladybird-vcpkg-win64-

      # 12. 缓存编译工具下载文件
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg-downloads
          key: ladybird-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            ladybird-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      # 13. 编译
      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:QT_ROOT\bin;$env:PATH"

          # 自动根据 CPU 和内存确定并发
          $cpu = [Environment]::ProcessorCount
          $memory = [math]::Floor(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          )

          $jobs = [math]::Min(
            $cpu,
            [math]::Max(1, [math]::Floor($memory / 3))
          )

          Write-Host "CPU cores: $cpu"
          Write-Host "RAM: $memory GB"
          Write-Host "Build jobs: $jobs"

          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$jobs"
          $env:VCPKG_MAX_CONCURRENCY = "$jobs"

          # vcpkg 下载缓存
          $downloadCache = "$env:GITHUB_WORKSPACE\.cache\vcpkg-downloads"
          New-Item -ItemType Directory -Force $downloadCache |
            Out-Null

          $env:VCPKG_DOWNLOADS = $downloadCache

          # 工具链检查
          clang-cl --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version

          # 正式构建
          py Meta\ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

          if (!(Test-Path "Build\release\bin\Ladybird.exe")) {
            throw "Ladybird.exe not found."
          }

      # 14. 准备发行目录
      - name: Prepare Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "Build\release\bin"
          $target = "dist\Ladybird-Windows-x64"

          New-Item -ItemType Directory -Force $target |
            Out-Null

          Copy-Item "$source\*" $target -Recurse -Force

          if (!(Test-Path "$target\Ladybird.exe")) {
            throw "Ladybird.exe missing."
          }

      # 15. 收集第三方 DLL
      - name: Collect Runtime DLLs
        shell: pwsh
        run: |
          $target = "dist\Ladybird-Windows-x64"

          $dirs = @(
            "Build\release\vcpkg_installed\x64-windows\bin"
          )

          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter *.dll -File |
                Copy-Item -Destination $target -Force
            }
          }

      # 16. 部署 Qt
      - name: Deploy Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $deploy = "$env:QT_ROOT\bin\windeployqt.exe"
          $app = "dist\Ladybird-Windows-x64\Ladybird.exe"

          & $deploy `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir "dist\Ladybird-Windows-x64" `
            $app

          if ($LASTEXITCODE -ne 0) {
            throw "Qt deployment failed."
          }

      # 17. 验证文件
      - name: Verify Package
        shell: pwsh
        run: |
          $target = "dist\Ladybird-Windows-x64"

          Get-ChildItem $target -Filter *.exe -Recurse
          Get-ChildItem $target -Filter *.dll -Recurse

          if (!(Test-Path "$target\Ladybird.exe")) {
            throw "Missing executable."
          }

      # 18. 快速压缩 ZIP
      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist |
            Out-Null

          $source = "dist\Ladybird-Windows-x64"
          $zip = "dist\Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=1 $zip "$source\*"
          } else {
            Compress-Archive `
              -Path "$source\*" `
              -DestinationPath $zip `
              -CompressionLevel Fastest
          }

          if (!(Test-Path $zip)) {
            throw "ZIP generation failed."
          }

          Get-Item $zip |
            Select-Object Name, Length

      # 19. 上传 ZIP
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: dist/Ladybird-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
