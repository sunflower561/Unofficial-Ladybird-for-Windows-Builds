
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird branch, tag, or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: workflow-repo
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Toolchains
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          python -m pip install --upgrade pip
          python -m pip install cmake

          Write-Host "Tool versions:"
          clang-cl --version
          clang --version
          cmake --version
          ninja --version
          python --version
          rustc --version
          cargo --version

      # ------------------------------------------------------------
      # 3. Resolve source and vcpkg baseline
      # ------------------------------------------------------------
      - name: Resolve source revision and vcpkg baseline
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Ladybird source revision:"
          git rev-parse HEAD

          $manifestPath = Join-Path $PWD "vcpkg.json"

          if (!(Test-Path $manifestPath)) {
            throw "Root vcpkg.json not found: $manifestPath"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline was not found in root vcpkg.json"
          }

          Write-Host "vcpkg baseline: $baseline"
          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

          Write-Host "Checking CPU baseline source..."
          Select-String `
            -Path "Meta/CMake/compile_options.cmake" `
            -Pattern "x86-64-v2|target-cpu" `
            -Context 2,2

      # ------------------------------------------------------------
      # 4. Restore dependency caches
      # ------------------------------------------------------------
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ladybird/.cache/vcpkg
            ladybird/Build/vcpkg
            ladybird/Build/vcpkg-release
            ladybird/Build/release/vcpkg_installed
          key: ladybird-vcpkg-windows-x64-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/Meta/CMake/vcpkg/**') }}
          restore-keys: |
            ladybird-vcpkg-windows-x64-

      # ------------------------------------------------------------
      # 5. Prepare the vcpkg source tree used by the nghttp2 overlay
      # ------------------------------------------------------------
      - name: Checkout vcpkg baseline source
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgSource = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $vcpkgSource) {
            Remove-Item $vcpkgSource -Recurse -Force
          }

          git clone --filter=blob:none --no-checkout `
            https://github.com/microsoft/vcpkg.git `
            $vcpkgSource

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Microsoft vcpkg."
          }

          git -C $vcpkgSource fetch origin $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch vcpkg baseline $env:VCPKG_BASELINE"
          }

          git -C $vcpkgSource checkout --detach $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout vcpkg baseline."
          }

          $basePort = Join-Path $vcpkgSource "ports/nghttp2/portfile.cmake"

          if (!(Test-Path $basePort)) {
            throw "nghttp2 base portfile missing: $basePort"
          }

          Write-Host "vcpkg source:"
          git -C $vcpkgSource rev-parse HEAD

          Write-Host "nghttp2 base portfile verified."

      # ------------------------------------------------------------
      # 6. Repair nghttp2 overlay root reference
      # ------------------------------------------------------------
      - name: Fix nghttp2 overlay path
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $overlay = Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports/nghttp2/portfile.cmake"
          $vcpkgSource = Join-Path $PWD ".vcpkg-upstream"

          if (!(Test-Path $overlay)) {
            throw "nghttp2 overlay portfile not found: $overlay"
          }

          if (!(Test-Path (Join-Path $vcpkgSource "ports/nghttp2/portfile.cmake"))) {
            throw "The checked-out vcpkg nghttp2 portfile is missing."
          }

          Write-Host "Original nghttp2 overlay:"
          Get-Content $overlay

          $content = Get-Content $overlay -Raw

          # The overlay currently resolves the base port through the
          # Visual Studio bundled VCPKG_ROOT_DIR on this runner.
          # Redirect that reference to the manifest-pinned vcpkg tree.
          $absoluteRoot = $vcpkgSource.Replace("\", "/")
          $content = $content.Replace('${VCPKG_ROOT_DIR}', $absoluteRoot)

          Set-Content -Path $overlay -Value $content -Encoding utf8

          Write-Host "Patched nghttp2 overlay:"
          Get-Content $overlay

          if ($content -match 'VCPKG_ROOT_DIR') {
            throw "The nghttp2 overlay still contains VCPKG_ROOT_DIR. Inspect the overlay before building."
          }

          if ($content -notmatch [regex]::Escape($absoluteRoot)) {
            throw "The expected vcpkg source path was not inserted into the overlay."
          }

      # ------------------------------------------------------------
      # 7. Prepare Ladybird vcpkg
      # ------------------------------------------------------------
      - name: Bootstrap Ladybird vcpkg
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $env:VCPKG_ROOT_DIR = Join-Path $PWD ".vcpkg-upstream"

          python Meta/ladybird.py vcpkg --preset Release

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird vcpkg bootstrap failed."
          }

      # ------------------------------------------------------------
      # 8. Clean old build output
      # ------------------------------------------------------------
      - name: Clean previous build
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "Build/release",
            "Build/vcpkg-release",
            "dist/Ladybird"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Force -Path "dist/Ladybird" | Out-Null

      # ------------------------------------------------------------
      # 9. Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake Release
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $ninjaCommand = Get-Command ninja.exe -ErrorAction Stop
          $ninjaPath = $ninjaCommand.Source

          if ([string]::IsNullOrWhiteSpace($ninjaPath)) {
            throw "Could not resolve ninja.exe path."
          }

          Write-Host "Ninja executable: $ninjaPath"
          & $ninjaPath --version

          $env:VCPKG_ROOT_DIR = Join-Path $PWD ".vcpkg-upstream"

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninjaPath" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      # ------------------------------------------------------------
      # 10. Verify CPU baseline configuration
      # ------------------------------------------------------------
      - name: Verify CPU baseline
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt not found."
          }

          $match = Select-String `
            -Path $cache `
            -Pattern "^LADYBIRD_BASELINE_CPU_TARGET:BOOL=ON$"

          if (!$match) {
            throw "LADYBIRD_BASELINE_CPU_TARGET is not ON."
          }

          Write-Host "CPU baseline option enabled."

          if (Test-Path "Build/release/compile_commands.json") {
            Copy-Item `
              "Build/release/compile_commands.json" `
              "compile_commands.json"
          }

      # ------------------------------------------------------------
      # 11. Build
      # ------------------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build Build/release --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # ------------------------------------------------------------
      # 12. Install
      # ------------------------------------------------------------
      - name: Install Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $PWD "dist/Ladybird"

          cmake --install Build/release `
            --config Release `
            --prefix $installDir

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird install failed."
          }

          if (!(Get-ChildItem $installDir -Recurse -Filter "Ladybird.exe" | Select-Object -First 1)) {
            Write-Host "Install directory contents:"
            Get-ChildItem $installDir -Recurse | Select-Object FullName
            throw "Ladybird.exe was not found in the install directory."
          }

      # ------------------------------------------------------------
      # 13. Package
      # ------------------------------------------------------------
      - name: Package ZIP
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $version = (git rev-parse --short HEAD).Trim()
          $zipName = "Ladybird-Windows-x64-$version.zip"

          if (!(Test-Path "dist/Ladybird")) {
            throw "Install directory does not exist."
          }

          7z a -tzip "dist/$zipName" ".\dist\Ladybird\*"

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP packaging failed."
          }

          $hash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content "dist/$zipName.sha256" -Encoding ascii

          Write-Host "Package:"
          Get-Item "dist/$zipName" | Select-Object Name, Length
          Write-Host "SHA256: $hash"

      # ------------------------------------------------------------
      # 14. Upload artifact
      # ------------------------------------------------------------
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/dist/Ladybird-Windows-x64-*.zip
            ladybird/dist/Ladybird-Windows-x64-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ------------------------------------------------------------
      # 15. Upload diagnostics
      # ------------------------------------------------------------
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-build-diagnostics
          path: |
            ladybird/Build/release/CMakeCache.txt
            ladybird/Build/release/compile_commands.json
            ladybird/Build/release/vcpkg-manifest-install.log
            ladybird/Meta/CMake/vcpkg/overlay-ports/nghttp2/portfile.cmake
            ladybird/vcpkg.json
            ladybird/.vcpkg-upstream/ports/nghttp2/portfile.cmake
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------
      # 16. Optional GitHub prerelease
      # ------------------------------------------------------------
      - name: Publish GitHub prerelease
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          files: |
            ladybird/dist/Ladybird-Windows-x64-*.zip
            ladybird/dist/Ladybird-Windows-x64-*.sha256
          generate_release_notes: true
