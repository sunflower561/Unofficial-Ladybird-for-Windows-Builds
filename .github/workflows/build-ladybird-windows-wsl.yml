
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_DISABLE_METRICS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:

      # ============================================================
      # 1. Checkout Ladybird
      # ============================================================

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 2. Install Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ============================================================
      # 3. Install Rust
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ============================================================
      # 4. Verify toolchain
      # ============================================================

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @(
            "cmake",
            "ninja",
            "git",
            "python",
            "rustc",
            "cargo"
          )) {
            $cmd = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool : $($cmd.Source)"
          }

          Write-Host "===== CMake ====="
          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake verification failed."
          }

          Write-Host "===== Ninja ====="
          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja verification failed."
          }

          Write-Host "===== Rust ====="
          rustc --version
          if ($LASTEXITCODE -ne 0) {
            throw "Rust verification failed."
          }

          Write-Host "===== Clang CL ====="
          clang-cl --version
          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl verification failed."
          }

          $global:LASTEXITCODE = 0

      # ============================================================
      # 5. Read vcpkg baseline
      # ============================================================

      - name: Read vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "vcpkg.json")) {
            throw "Ladybird vcpkg.json not found."
          }

          $manifest = Get-Content "vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline is missing."
          }

          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid vcpkg baseline: $baseline"
          }

          Write-Host "Ladybird vcpkg baseline:"
          Write-Host $baseline

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

      # ============================================================
      # 6. Full vcpkg clone
      # No partial clone
      # No shallow clone
      # ============================================================

      - name: Checkout complete vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          git config --global http.retry 5
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {

            Write-Host "=================================="
            Write-Host "Full vcpkg clone attempt $attempt / 3"
            Write-Host "=================================="

            if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
            }

            git clone --no-checkout `
              https://github.com/microsoft/vcpkg.git `
              $root

            $cloneExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($cloneExit -eq 0) {
              $success = $true
              break
            }

            Write-Warning "Clone failed: exit code $cloneExit"

            Start-Sleep -Seconds (20 * $attempt)
          }

          if (!$success) {
            Write-Host "===== DNS diagnostics ====="

            Resolve-DnsName github.com -ErrorAction Continue

            Test-NetConnection github.com `
              -Port 443 `
              -WarningAction Continue

            throw "Unable to clone complete vcpkg repository."
          }

          # Checkout exact Ladybird baseline.

          git -C $root checkout --detach $env:VCPKG_BASELINE

          $checkoutExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($checkoutExit -ne 0) {
            throw "Unable to checkout vcpkg baseline."
          }

          # Verify commit.

          $actual = git -C $root rev-parse HEAD

          $revExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($revExit -ne 0) {
            throw "Unable to read vcpkg commit."
          }

          $actual = $actual.Trim()

          if ($actual -ne $env:VCPKG_BASELINE) {
            throw "vcpkg baseline mismatch. Actual: $actual"
          }

          # Check optional promisor setting.
          # Exit code 1 means the setting does not exist.

          $promisor = git -C $root config --get remote.origin.promisor

          $promisorExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($promisorExit -gt 1) {
            throw "Unable to inspect vcpkg promisor configuration."
          }

          if ($promisor -eq "true") {
            throw "vcpkg is still configured as a promisor repository."
          }

          # Verify toolchain.

          $toolchain = Join-Path `
            $root `
            "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "vcpkg CMake toolchain not found."
          }

          # Verify required base ports.

          foreach ($port in @(
            "curl",
            "nghttp2",
            "freetype",
            "harfbuzz",
            "libpng",
            "openssl"
          )) {

            $portfile = Join-Path `
              $root `
              "ports/$port/portfile.cmake"

            if (!(Test-Path $portfile)) {
              throw "Missing vcpkg base port: $port"
            }

            Write-Host "Verified port: $port"
          }

          # Export vcpkg root.

          "LADYBIRD_VCPKG_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "=================================="
          Write-Host "vcpkg checkout completed"
          Write-Host "=================================="
          Write-Host "vcpkg root: $root"
          Write-Host "vcpkg commit: $actual"
          Write-Host "vcpkg toolchain: $toolchain"
          Write-Host "Promisor repository: false"

          # Critical: do not leave Git's optional exit code 1.

          $global:LASTEXITCODE = 0

      # ============================================================
      # 7. Verify Ladybird overlay configuration
      # ============================================================

      - name: Verify Ladybird vcpkg configuration
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overlay = Join-Path `
            $PWD `
            "Meta/CMake/vcpkg/overlay-ports"

          $triplets = Join-Path `
            $PWD `
            "Meta/CMake/vcpkg/release-triplets"

          if (!(Test-Path $overlay)) {
            throw "Ladybird overlay ports directory not found."
          }

          if (!(Test-Path $triplets)) {
            throw "Ladybird release triplets directory not found."
          }

          foreach ($port in @("curl", "nghttp2")) {

            $file = Join-Path `
              $overlay `
              "$port/portfile.cmake"

            if (!(Test-Path $file)) {
              throw "Missing overlay port: $port"
            }

            Write-Host "Verified overlay: $file"
          }

          Write-Host "Overlay ports: $overlay"
          Write-Host "Overlay triplets: $triplets"

      # ============================================================
      # 8. Configure CMake
      # ============================================================

      - name: Configure Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          $root = $env:LADYBIRD_VCPKG_ROOT

          $toolchain = Join-Path `
            $root `
            "scripts/buildsystems/vcpkg.cmake"

          $overlay = (
            Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports"
          ).Replace("\", "/")

          $triplets = (
            Join-Path $PWD "Meta/CMake/vcpkg/release-triplets"
          ).Replace("\", "/")

          $env:VCPKG_ROOT = $root

          Write-Host "Ninja: $ninja"
          Write-Host "Toolchain: $toolchain"
          Write-Host "vcpkg root: $root"
          Write-Host "Overlay ports: $overlay"
          Write-Host "Overlay triplets: $triplets"

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_ROOT=$root" `
            "-DVCPKG_ROOT_DIR=$root" `
            "-DVCPKG_OVERLAY_PORTS=$overlay" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON" `
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

          $configureExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($configureExit -ne 0) {
            throw "CMake configure failed: $configureExit"
          }

          # Verify generated cache.

          $cachePath = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cachePath)) {
            throw "CMakeCache.txt was not generated."
          }

          $cache = Get-Content $cachePath -Raw

          if ($cache -notmatch [regex]::Escape($root)) {
            throw "CMakeCache does not reference local vcpkg."
          }

          if ($cache -notmatch "LADYBIRD_BASELINE_CPU_TARGET:.*=ON") {
            throw "CPU baseline option is not enabled."
          }

          if ($cache -match "Program Files/Microsoft Visual Studio/.*/vcpkg") {
            throw "CMake is using Visual Studio bundled vcpkg."
          }

          Write-Host "CMake configuration verified."

      # ============================================================
      # 9. Build Ladybird
      # ============================================================

      - name: Build Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build Build/release --parallel 4

          $buildExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($buildExit -ne 0) {
            throw "Ladybird build failed: $buildExit"
          }

          Write-Host "Ladybird build completed."

      # ============================================================
      # 10. Package build
      # ============================================================

      - name: Package Windows build
        if: success()
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $PWD "Build/release"

          if (!(Test-Path $build)) {
            throw "Build output directory does not exist."
          }

          $executables = @(
            Get-ChildItem $build -Recurse -Filter "*.exe" -File
          )

          if ($executables.Count -eq 0) {
            throw "No executable files found."
          }

          Write-Host "Executables found:"

          $executables | ForEach-Object {
            Write-Host $_.FullName
          }

          $stage = Join-Path $PWD "Ladybird-Windows-x64"

          $zip = Join-Path $PWD "Ladybird-Windows-x64.zip"

          $shaFile = Join-Path `
            $PWD `
            "Ladybird-Windows-x64.zip.sha256"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (Test-Path $shaFile) {
            Remove-Item $shaFile -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stage |
            Out-Null

          # Preserve the complete build output.

          Copy-Item `
            "$build\*" `
            $stage `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP archive was not generated."
          }

          $hash = (
            Get-FileHash $zip -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content $shaFile

          Write-Host "Package created: $zip"
          Write-Host "SHA256: $hash"

      # ============================================================
      # 11. Upload build artifacts
      # ============================================================

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 12. Collect diagnostics
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $out = Join-Path $PWD "diagnostics"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out |
            Out-Null

          $files = @(
            "ladybird/vcpkg.json",
            "ladybird/Build/release/CMakeCache.txt",
            "ladybird/Build/release/compile_commands.json",
            "ladybird/Build/release/vcpkg-manifest-install.log"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item $file $out -Force
            }
          }

          if (Test-Path "ladybird/Build/release") {

            Get-ChildItem `
              "ladybird/Build/release" `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -match "CMakeError|CMakeOutput|\.log$"
              } |
              Select-Object -First 100 |
              ForEach-Object {

                Copy-Item `
                  $_.FullName `
                  (Join-Path $out $_.Name) `
                  -Force
              }
          }

          if (Test-Path "ladybird") {

            git -C ladybird rev-parse HEAD |
              Set-Content "$out/ladybird-commit.txt"

            $global:LASTEXITCODE = 0

            git -C ladybird status --short |
              Set-Content "$out/ladybird-status.txt"

            $global:LASTEXITCODE = 0
          }

          if ($env:LADYBIRD_VCPKG_ROOT -and
              (Test-Path "$env:LADYBIRD_VCPKG_ROOT/.git")) {

            git -C $env:LADYBIRD_VCPKG_ROOT rev-parse HEAD |
              Set-Content "$out/vcpkg-commit.txt"

            $global:LASTEXITCODE = 0

            $promisor = git -C $env:LADYBIRD_VCPKG_ROOT config --get remote.origin.promisor

            "promisor=$promisor" |
              Set-Content "$out/vcpkg-promisor.txt"

            $global:LASTEXITCODE = 0
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 13. Optional prerelease
      # ============================================================

      - name: Publish prerelease
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          files: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          body: |
            Automated Ladybird Windows x64 build.

            Source repository:
            https://github.com/LadybirdBrowser/ladybird

            Source ref: ${{ inputs.ref }}
            Workflow run: ${{ github.run_number }}

            CPU baseline:
            x86-64-v2

            Package:
            Complete CMake build output.

            Portability:
            Not yet verified on a clean Windows installation.
