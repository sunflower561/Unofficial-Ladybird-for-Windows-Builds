
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch / tag / commit SHA"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      LLVM_VERSION: "22.1.8"

    steps:

      # ------------------------------------------------------------
      # 1. Checkout workflow repository
      # ------------------------------------------------------------

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Checkout Ladybird upstream
      # ------------------------------------------------------------

      - name: Checkout Ladybird upstream
        shell: pwsh
        run: |
          $ref = "${{ inputs.ref }}".Trim()

          if ([string]::IsNullOrWhiteSpace($ref)) {
            throw "Ladybird ref cannot be empty."
          }

          git clone --no-tags https://github.com/LadybirdBrowser/ladybird.git ladybird

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Ladybird."
          }

          Push-Location ladybird

          git fetch origin $ref

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Failed to fetch Ladybird ref: $ref"
          }

          git checkout FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Failed to checkout Ladybird ref: $ref"
          }

          Write-Host "Selected ref: $ref"
          Write-Host "Selected commit:"
          git rev-parse HEAD

          Pop-Location

      # ------------------------------------------------------------
      # 3. Python
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      # ------------------------------------------------------------
      # 4. Rust
      # ------------------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 5. Install build tools
      # ------------------------------------------------------------

      - name: Install Ninja and build tools
        shell: pwsh
        run: |
          choco install ninja nasm pkgconfiglite --no-progress -y

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install build tools."
          }

          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"

          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue

          if (!$ninja) {
            throw "Ninja executable was not found."
          }

          Write-Host "Ninja: $($ninja.Source)"
          ninja --version

      # ------------------------------------------------------------
      # 6. Install LLVM 22.1.8
      # ------------------------------------------------------------

      - name: Install LLVM
        shell: pwsh
        run: |
          $version = "${{ env.LLVM_VERSION }}"
          $installer = "$env:RUNNER_TEMP\LLVM-$version-win64.exe"

          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "LLVM installer download failed."
          }

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S", "/D=C:\LLVM" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed: $($process.ExitCode)"
          }

          if (!(Test-Path "C:\LLVM\bin\clang-cl.exe")) {
            throw "clang-cl.exe was not found."
          }

          "C:\LLVM\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          & "C:\LLVM\bin\clang-cl.exe" --version

      # ------------------------------------------------------------
      # 7. Setup MSVC
      # ------------------------------------------------------------

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # 8. Verify build environment
      # ------------------------------------------------------------

      - name: Verify build environment
        shell: pwsh
        run: |
          Write-Host "===== MSVC ====="

          $cl = Get-Command cl.exe -ErrorAction Stop

          Write-Host "Compiler: $($cl.Source)"

          cl.exe

          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          Write-Host "VCToolsVersion=$env:VCToolsVersion"
          Write-Host "VisualStudioVersion=$env:VisualStudioVersion"

          Write-Host "===== LLVM ====="
          clang-cl.exe --version

          Write-Host "===== CMake ====="
          cmake --version

          Write-Host "===== Ninja ====="
          ninja --version

          Write-Host "===== Python ====="
          python --version

          Write-Host "===== Rust ====="
          rustc --version
          cargo --version

      # ------------------------------------------------------------
      # 9. Checkout local vcpkg at Ladybird baseline
      # ------------------------------------------------------------

      - name: Checkout vcpkg
        shell: pwsh
        run: |
          $manifest = Get-Content "ladybird/vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "vcpkg builtin-baseline was not found."
          }

          Write-Host "Ladybird vcpkg baseline: $baseline"

          git clone https://github.com/microsoft/vcpkg.git .vcpkg-upstream

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg."
          }

          Push-Location .vcpkg-upstream

          git checkout $baseline

          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Failed to checkout vcpkg baseline."
          }

          Pop-Location

          Write-Host "vcpkg commit:"
          git -C .vcpkg-upstream rev-parse HEAD

      # ------------------------------------------------------------
      # 10. Bootstrap vcpkg
      # ------------------------------------------------------------

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & ".vcpkg-upstream/bootstrap-vcpkg.bat" -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          if (!(Test-Path ".vcpkg-upstream/vcpkg.exe")) {
            throw "vcpkg.exe was not generated."
          }

          .\.vcpkg-upstream\vcpkg.exe version

      # ------------------------------------------------------------
      # 11. Configure Ladybird
      # ------------------------------------------------------------

      - name: Configure Ladybird
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE

          $ladybird = Join-Path $workspace "ladybird"
          $vcpkg = Join-Path $workspace ".vcpkg-upstream"

          $toolchain = Join-Path `
            $vcpkg `
            "scripts/buildsystems/vcpkg.cmake"

          $overlayPorts = Join-Path `
            $ladybird `
            "Meta/CMake/vcpkg/overlay-ports"

          $overlayTriplets = Join-Path `
            $ladybird `
            "Meta/CMake/vcpkg/release-triplets"

          # Verify all required paths.

          if (!(Test-Path $toolchain)) {
            throw "Local vcpkg toolchain not found: $toolchain"
          }

          if (!(Test-Path $overlayPorts)) {
            throw "Ladybird overlay ports not found: $overlayPorts"
          }

          if (!(Test-Path $overlayTriplets)) {
            throw "Ladybird release triplets not found: $overlayTriplets"
          }

          Write-Host "===== Release Triplets ====="

          Get-ChildItem $overlayTriplets -File |
            Select-Object Name

          Write-Host "===== Overlay Ports ====="

          Write-Host $overlayPorts
          Write-Host "===== vcpkg ====="
          Write-Host $vcpkg
          Write-Host "===== Toolchain ====="
          Write-Host $toolchain

          $env:VCPKG_ROOT = $vcpkg

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          Push-Location $ladybird

          $cmakeArgs = @(
            "-S", ".",
            "-B", "Build/release",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_MAKE_PROGRAM=$ninja",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_ROOT=$vcpkg",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DVCPKG_OVERLAY_PORTS=$overlayPorts",
            "-DVCPKG_OVERLAY_TRIPLETS=$overlayTriplets",
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON"
          )

          Write-Host "===== CMake Configure ====="

          & cmake @cmakeArgs

          $result = $LASTEXITCODE

          Pop-Location

          if ($result -ne 0) {
            throw "Ladybird CMake configuration failed: $result"
          }

      # ------------------------------------------------------------
      # 12. Verify CMake configuration
      # ------------------------------------------------------------

      - name: Verify CMake configuration
        shell: pwsh
        run: |
          $cache = "ladybird/Build/release/CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt was not generated."
          }

          $content = Get-Content $cache -Raw

          $checks = @(
            "CMAKE_TOOLCHAIN_FILE:FILEPATH=.*\.vcpkg-upstream",
            "Z_VCPKG_ROOT_DIR:INTERNAL=.*\.vcpkg-upstream",
            "VCPKG_TARGET_TRIPLET:STRING=x64-windows",
            "VCPKG_OVERLAY_TRIPLETS:STRING=.*release-triplets",
            "LADYBIRD_BASELINE_CPU_TARGET:UNINITIALIZED=ON"
          )

          foreach ($check in $checks) {
            if ($content -notmatch $check) {
              throw "CMakeCache validation failed: $check"
            }
          }

          Write-Host "===== CMakeCache ====="

          Select-String -Path $cache -Pattern `
            "CMAKE_TOOLCHAIN_FILE",
            "Z_VCPKG_ROOT_DIR",
            "VCPKG_ROOT",
            "VCPKG_MANIFEST_DIR",
            "VCPKG_OVERLAY_PORTS",
            "VCPKG_OVERLAY_TRIPLETS",
            "VCPKG_TARGET_TRIPLET",
            "CMAKE_GENERATOR",
            "LADYBIRD_BASELINE_CPU_TARGET",
            "CMAKE_BUILD_TYPE"

      # ------------------------------------------------------------
      # 13. Build Ladybird
      # ------------------------------------------------------------

      - name: Build Ladybird
        shell: pwsh
        run: |
          Push-Location ladybird

          $log = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ladybird-build.log"

          & cmake --build Build/release `
            --parallel $env:NUMBER_OF_PROCESSORS 2>&1 |
            Tee-Object -FilePath $log

          $result = $LASTEXITCODE

          Pop-Location

          if ($result -ne 0) {
            throw "Ladybird build failed: $result"
          }

      # ------------------------------------------------------------
      # 14. Verify build output
      # ------------------------------------------------------------

      - name: Verify build output
        shell: pwsh
        run: |
          $release = "ladybird/Build/release"

          if (!(Test-Path $release)) {
            throw "Build/release does not exist."
          }

          Write-Host "===== EXE files ====="

          Get-ChildItem $release -Recurse -Filter *.exe |
            Select-Object FullName, Length

          Write-Host "===== DLL files ====="

          Get-ChildItem $release -Recurse -Filter *.dll |
            Select-Object FullName, Length

          $ladybirdExe = Get-ChildItem `
            $release `
            -Recurse `
            -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (!$ladybirdExe) {
            throw "Ladybird.exe was not found."
          }

          Write-Host "Main executable: $($ladybirdExe.FullName)"

      # ------------------------------------------------------------
      # 15. Remove development and test files
      # ------------------------------------------------------------

      - name: Remove development and test files
        shell: pwsh
        run: |
          $release = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ladybird/Build/release"

          if (!(Test-Path $release)) {
            throw "Release directory not found."
          }

          Write-Host "Cleaning $release"

          # Intermediate development files.

          $extensions = @(
            ".obj",
            ".o",
            ".lib",
            ".a",
            ".pdb",
            ".ilk",
            ".exp",
            ".pch",
            ".gch",
            ".idb",
            ".ipch",
            ".tlog",
            ".lastbuildstate",
            ".recipe"
          )

          Get-ChildItem $release -Recurse -File -Force |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant()
            } |
            ForEach-Object {
              Remove-Item $_.FullName -Force `
                -ErrorAction SilentlyContinue
            }

          # Build and test directories.

          $directoryNames = @(
            "CMakeFiles",
            "Testing",
            "_deps",
            "tests",
            "Tests"
          )

          Get-ChildItem $release -Recurse -Directory -Force |
            Where-Object {
              $directoryNames -contains $_.Name
            } |
            Sort-Object FullName -Descending |
            ForEach-Object {
              Remove-Item $_.FullName -Recurse -Force `
                -ErrorAction SilentlyContinue
            }

          # CMake and Ninja metadata.

          $metadataNames = @(
            "CMakeCache.txt",
            "cmake_install.cmake",
            "compile_commands.json",
            "build.ninja",
            "build.ninja.d",
            ".ninja_deps",
            ".ninja_log",
            "rules.ninja"
          )

          Get-ChildItem $release -Recurse -File -Force |
            Where-Object {
              $metadataNames -contains $_.Name
            } |
            ForEach-Object {
              Remove-Item $_.FullName -Force `
                -ErrorAction SilentlyContinue
            }

          # Visual Studio project metadata.

          $metadataExtensions = @(
            ".sln",
            ".vcxproj",
            ".filters",
            ".user"
          )

          Get-ChildItem $release -Recurse -File -Force |
            Where-Object {
              $metadataExtensions -contains $_.Extension.ToLowerInvariant()
            } |
            ForEach-Object {
              Remove-Item $_.FullName -Force `
                -ErrorAction SilentlyContinue
            }

          # Common test executable names only.

          Get-ChildItem $release -Recurse -File -Filter *.exe |
            Where-Object {
              $_.BaseName -match '(^|[-_])(test|tests|unittest|benchmark)([-_]|$)'
            } |
            ForEach-Object {
              Write-Host "Removing test executable: $($_.FullName)"
              Remove-Item $_.FullName -Force `
                -ErrorAction SilentlyContinue
            }

          Write-Host "Cleanup completed."

          Write-Host "===== Remaining EXE ====="

          Get-ChildItem $release -Recurse -Filter *.exe |
            Select-Object FullName, Length

          Write-Host "===== Remaining DLL ====="

          Get-ChildItem $release -Recurse -Filter *.dll |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # 16. Package ZIP and SHA256
      # ------------------------------------------------------------

      - name: Package Ladybird
        shell: pwsh
        run: |
          $release = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ladybird/Build/release"

          $output = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist"

          New-Item -ItemType Directory -Force -Path $output |
            Out-Null

          $zip = Join-Path $output "Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP packaging failed."
          }

          $hash = Get-FileHash $zip -Algorithm SHA256

          "$($hash.Hash)  Ladybird-Windows-x64.zip" |
            Out-File `
              -FilePath "$output/Ladybird-Windows-x64.sha256" `
              -Encoding ascii

          Write-Host "===== Package ====="

          Get-Item $zip | Select-Object Name, Length

          Write-Host "===== SHA256 ====="

          Get-Content "$output/Ladybird-Windows-x64.sha256"

      # ------------------------------------------------------------
      # 17. Upload Actions Artifact
      # ------------------------------------------------------------

      - name: Upload Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ------------------------------------------------------------
      # 18. Optional GitHub Pre-release
      # ------------------------------------------------------------

      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.sha256

      # ------------------------------------------------------------
      # 19. Collect vcpkg failure logs
      # ------------------------------------------------------------

      - name: Collect vcpkg failure logs
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            ".vcpkg-upstream/buildtrees"

          $output = Join-Path `
            $env:GITHUB_WORKSPACE `
            "vcpkg-failure-logs"

          New-Item -ItemType Directory -Force -Path $output |
            Out-Null

          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match 'out\.log$|err\.log$|meson-log\.txt$|config\.log$'
              } |
              ForEach-Object {
                $relative = $_.FullName.Substring($root.Length).TrimStart('\')

                $destination = Join-Path $output $relative
                $destinationDir = Split-Path $destination -Parent

                New-Item -ItemType Directory -Force -Path $destinationDir |
                  Out-Null

                Copy-Item $_.FullName $destination -Force

                Write-Host "Collected: $relative"
              }
          }

          # Collect CMake manifest install log.

          $manifestLog = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ladybird/Build/release/vcpkg-manifest-install.log"

          if (Test-Path $manifestLog) {
            Copy-Item $manifestLog `
              (Join-Path $output "vcpkg-manifest-install.log") `
              -Force
          }

          # Collect CMake cache.

          $cache = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ladybird/Build/release/CMakeCache.txt"

          if (Test-Path $cache) {
            Copy-Item $cache `
              (Join-Path $output "CMakeCache.txt") `
              -Force
          }

          Write-Host "Failure log collection completed."

      - name: Upload vcpkg failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-failure-logs
          path: vcpkg-failure-logs/
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------
      # 20. Upload build log on failure
      # ------------------------------------------------------------

      - name: Upload build log
        if: ${{ failure() && hashFiles('ladybird-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-build-log
          path: ladybird-build.log
          if-no-files-found: warn
          retention-days: 7
