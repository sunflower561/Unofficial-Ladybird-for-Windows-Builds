
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag, or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean
      clean_build:
        description: "Clean previous build directories"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_MAX_CONCURRENCY: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CARGO_BUILD_JOBS: 4
      VCPKG_DISABLE_METRICS: 1
      PYTHONUTF8: 1
      PACKAGE_NAME: Ladybird-Windows-x64

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}
          submodules: recursive
          fetch-depth: 0

      - name: Record source revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null

          git rev-parse HEAD |
            Out-File diagnostics/source-revision.txt

          git status --short |
            Out-File diagnostics/source-status.txt

      # --------------------------------------------------
      # 2. Build environment
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        shell: pwsh
        run: |
          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          $paths = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files\Ninja",
            "C:\Program Files\7-Zip"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Add-Content $env:GITHUB_PATH $path
            }
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          clang-cl --version
          clang --version
          cmake --version
          python --version
          rustc --version
          cargo --version

          $ninjaCommand = Get-Command ninja.exe -ErrorAction Stop
          $ninjaPath = $ninjaCommand.Source

          if (-not (Test-Path $ninjaPath)) {
            throw "Ninja executable does not exist: $ninjaPath"
          }

          Write-Host "Ninja executable: $ninjaPath"
          & $ninjaPath --version

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja verification failed."
          }

          "NINJA_PATH=$ninjaPath" |
            Out-File diagnostics/toolchain.txt -Append

      # --------------------------------------------------
      # 3. Cache
      # --------------------------------------------------

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: ladybird-vcpkg-downloads-${{ runner.os }}-${{ hashFiles('Meta/CMake/vcpkg.json', 'Meta/CMake/vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-vcpkg-downloads-${{ runner.os }}-

      # --------------------------------------------------
      # 4. Clean
      # --------------------------------------------------

      - name: Clean previous build
        if: ${{ inputs.clean_build == true }}
        shell: pwsh
        run: |
          $paths = @(
            "Build/release",
            "Build/vcpkg-release",
            "dist/Ladybird",
            ".vcpkg-upstream"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      # --------------------------------------------------
      # 5. Inspect CPU baseline source
      # --------------------------------------------------

      - name: Inspect CPU baseline implementation
        shell: pwsh
        run: |
          $files = @(
            "Meta/CMake/cmake_options.cmake",
            "Meta/CMake/compile_options.cmake",
            "Meta/CMake/rust_crate.cmake"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              "===== $file =====" |
                Out-File diagnostics/cpu-baseline-source.txt -Append

              Select-String -Path $file `
                -Pattern "LADYBIRD_BASELINE_CPU_TARGET|x86-64-v2|target-cpu|march|/arch" `
                -Context 4,8 |
                Out-File diagnostics/cpu-baseline-source.txt -Append
            }
          }

          $found = Get-ChildItem Meta/CMake -Filter "*.cmake" -Recurse |
            Select-String -Pattern "LADYBIRD_BASELINE_CPU_TARGET" `
              -ErrorAction SilentlyContinue

          if (-not $found) {
            throw "CPU baseline option was not found in Ladybird source."
          }

      # --------------------------------------------------
      # 6. Prepare matching vcpkg source tree for overlay
      # --------------------------------------------------

      - name: Prepare vcpkg baseline source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = "Meta/CMake/vcpkg-configuration.json"

          if (-not (Test-Path $configPath)) {
            throw "vcpkg-configuration.json not found."
          }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          $baseline = $null

          if ($config.'default-registry' -and
              $config.'default-registry'.baseline) {
            $baseline = $config.'default-registry'.baseline
          }

          if (-not $baseline -and $config.'builtin-baseline') {
            $baseline = $config.'builtin-baseline'
          }

          if (-not $baseline) {
            throw "Could not determine the vcpkg baseline from vcpkg-configuration.json."
          }

          Write-Host "Ladybird vcpkg baseline: $baseline"

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"

          git clone --filter=blob:none --no-checkout `
            https://github.com/microsoft/vcpkg.git $vcpkgRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Microsoft vcpkg."
          }

          git -C $vcpkgRoot checkout $baseline

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout vcpkg baseline $baseline."
          }

          $nghttp2Port = Join-Path $vcpkgRoot "ports/nghttp2/portfile.cmake"

          if (-not (Test-Path $nghttp2Port)) {
            throw "nghttp2 base port was not found in the checked-out vcpkg tree."
          }

          "VCPKG_BASELINE=$baseline" |
            Out-File diagnostics/vcpkg-baseline.txt

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File diagnostics/vcpkg-baseline.txt -Append

          Write-Host "nghttp2 base port found: $nghttp2Port"

      # --------------------------------------------------
      # 7. Repair Ladybird nghttp2 overlay reference
      # --------------------------------------------------

      - name: Repair nghttp2 overlay path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overlay = "Meta/CMake/vcpkg/overlay-ports/nghttp2/portfile.cmake"

          if (-not (Test-Path $overlay)) {
            throw "Ladybird nghttp2 overlay portfile was not found."
          }

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"
          $basePort = Join-Path $vcpkgRoot "ports/nghttp2"

          if (-not (Test-Path "$basePort/portfile.cmake")) {
            throw "The replacement nghttp2 portfile does not exist."
          }

          $content = Get-Content $overlay -Raw

          $content |
            Out-File diagnostics/nghttp2-overlay-original.txt -Encoding utf8

          $replacement = $basePort.Replace("\", "/")

          $pattern = '(?m)(set\s*\(\s*CURRENT_PORT_DIR\s+")[^"]*VCPKG_ROOT_DIR[^"]*(/ports/nghttp2"\s*\))'

          if ($content -notmatch $pattern) {
            throw "The expected VCPKG_ROOT_DIR reference was not found. Overlay was not modified."
          }

          $updated = [regex]::Replace(
            $content,
            $pattern,
            ('$1' + $replacement + '$2'),
            1
          )

          Set-Content -Path $overlay -Value $updated -Encoding utf8

          $check = Get-Content $overlay -Raw

          if ($check -notmatch [regex]::Escape($replacement)) {
            throw "nghttp2 overlay path replacement failed."
          }

          $check |
            Out-File diagnostics/nghttp2-overlay-fixed.txt -Encoding utf8

          Write-Host "nghttp2 overlay now references:"
          Write-Host $basePort

      # --------------------------------------------------
      # 8. Install vcpkg dependencies
      # --------------------------------------------------

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python Meta/ladybird.py vcpkg --preset Release

          if ($LASTEXITCODE -ne 0) {
            $manifestLog = "Build/release/vcpkg-manifest-install.log"

            if (Test-Path $manifestLog) {
              Copy-Item $manifestLog diagnostics/vcpkg-manifest-install.log -Force
            }

            throw "vcpkg dependency installation failed."
          }

      # --------------------------------------------------
      # 9. Configure Release
      # --------------------------------------------------

      - name: Configure Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          Write-Host "Using Ninja: $ninja"

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          if ($LASTEXITCODE -ne 0) {
            $manifestLog = "Build/release/vcpkg-manifest-install.log"

            if (Test-Path $manifestLog) {
              Copy-Item $manifestLog diagnostics/vcpkg-manifest-install.log -Force
            }

            throw "CMake configuration failed."
          }

      # --------------------------------------------------
      # 10. Verify CPU baseline option
      # --------------------------------------------------

      - name: Verify CPU baseline option
        shell: pwsh
        run: |
          $cache = "Build/release/CMakeCache.txt"

          if (-not (Test-Path $cache)) {
            throw "CMakeCache.txt was not generated."
          }

          Copy-Item $cache diagnostics/CMakeCache.txt -Force

          $content = Get-Content $cache -Raw

          if ($content -notmatch '(?m)^LADYBIRD_BASELINE_CPU_TARGET:BOOL=ON$') {
            Select-String -Path $cache `
              -Pattern "BASELINE_CPU|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER" |
              Out-File diagnostics/cpu-baseline-cache.txt

            throw "LADYBIRD_BASELINE_CPU_TARGET is not ON."
          }

          "LADYBIRD_BASELINE_CPU_TARGET=ON" |
            Tee-Object diagnostics/cpu-baseline-status.txt

          Select-String -Path $cache `
            -Pattern "BASELINE_CPU|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_SYSTEM_PROCESSOR" |
            Out-File diagnostics/cpu-baseline-cache.txt

      # --------------------------------------------------
      # 11. Inspect compiler flags
      # --------------------------------------------------

      - name: Inspect compiler CPU flags
        shell: pwsh
        continue-on-error: true
        run: |
          $commands = "Build/release/compile_commands.json"

          if (Test-Path $commands) {
            Copy-Item $commands diagnostics/compile_commands.json -Force

            Select-String -Path $commands `
              -Pattern "march=x86-64-v2|target-cpu=x86-64-v2|avx2|avx512|/arch:" |
              Out-File diagnostics/compiler-cpu-flags.txt

            if ((Get-Item diagnostics/compiler-cpu-flags.txt).Length -eq 0) {
              "No matching CPU flags found." |
                Out-File diagnostics/compiler-cpu-flags.txt
            }
          } else {
            "compile_commands.json not found." |
              Out-File diagnostics/compiler-cpu-flags.txt
          }

      # --------------------------------------------------
      # 12. Build
      # --------------------------------------------------

      - name: Build Ladybird
        shell: pwsh
        run: |
          cmake --build Build/release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # --------------------------------------------------
      # 13. Install
      # --------------------------------------------------

      - name: Install Ladybird
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          cmake --install Build/release --prefix dist/Ladybird

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird installation failed."
          }

          if (-not (Test-Path "dist/Ladybird")) {
            throw "Install directory was not created."
          }

          Get-ChildItem dist/Ladybird -Recurse -File |
            Select-Object FullName, Length |
            Export-Csv diagnostics/install-files.csv -NoTypeInformation

      # --------------------------------------------------
      # 14. Package
      # --------------------------------------------------

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (-not (Test-Path $sevenZip)) {
            $command = Get-Command 7z.exe -ErrorAction SilentlyContinue

            if (-not $command) {
              throw "7-Zip executable not found."
            }

            $sevenZip = $command.Source
          }

          $zip = "dist/$env:PACKAGE_NAME.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          & $sevenZip a -tzip $zip ".\dist\Ladybird\*" -mx=5

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP packaging failed."
          }

          if (-not (Test-Path $zip)) {
            throw "ZIP file was not created."
          }

          Get-Item $zip | Format-List FullName, Length

      # --------------------------------------------------
      # 15. SHA256
      # --------------------------------------------------

      - name: Generate SHA256
        shell: pwsh
        run: |
          $zip = "dist/$env:PACKAGE_NAME.zip"
          $hash = Get-FileHash $zip -Algorithm SHA256

          "$($hash.Hash)  $([System.IO.Path]::GetFileName($zip))" |
            Out-File "dist/$env:PACKAGE_NAME.sha256" -Encoding ascii

          Get-Content "dist/$env:PACKAGE_NAME.sha256"

      # --------------------------------------------------
      # 16. Upload build
      # --------------------------------------------------

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --------------------------------------------------
      # 17. Upload diagnostics
      # --------------------------------------------------

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 18. Publish GitHub Pre-release
      # --------------------------------------------------

      - name: Publish GitHub Pre-release
        if: ${{ success() && inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
