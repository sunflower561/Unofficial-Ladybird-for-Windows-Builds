name: Build Ladybird Windows (WSL2, Fast Cache)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ladybird 分支或标签（如 master）'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Ladybird source
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      # 🚀 1. 恢复缓存（存放到 Windows 侧，方便 GitHub 提取）
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: .ladybird-cache/vcpkg_installed
          key: wsl-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: wsl-vcpkg-

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: .ladybird-cache/ccache
          key: wsl-ccache-${{ hashFiles('vcpkg.json') }}
          restore-keys: wsl-ccache-

      # 确保缓存目录存在
      - name: Prepare cache directories
        run: |
          mkdir -p .ladybird-cache/vcpkg_installed
          mkdir -p .ladybird-cache/ccache

      - name: Setup WSL2 (Ubuntu)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04

      - name: Build inside WSL2 (Optimized)
        shell: wsl-bash {0}
        run: |
          # 1. 创建用户
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # 2. 安装最新版 CMake 和 Make
          echo "=== Installing build tools ==="
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl zip unzip tar git autoconf autoconf-archive automake \
            build-essential ccache libtool nasm ninja-build pkg-config \
            python3-venv qt6-base-dev qt6-tools-dev-tools qt6-wayland \
            libpulse-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libdrm-dev libvulkan-dev glslang-tools fonts-liberation2 \
            software-properties-common wget rsync

          # 安装 Clang 19
          wget --timeout=30 --tries=3 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main"
          sudo apt-get update -y
          sudo apt-get install -y clang-19 lld-19

          # 安装 CMake 3.30
          wget -q https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.tar.gz
          tar -xzf cmake-3.30.2-linux-x86_64.tar.gz && sudo mv cmake-3.30.2-linux-x86_64 /opt/cmake
          sudo ln -sf /opt/cmake/bin/* /usr/local/bin/

          # 安装 Make 4.4
          wget -q https://ftp.gnu.org/gnu/make/make-4.4.tar.gz
          tar -xzf make-4.4.tar.gz && cd make-4.4
          ./configure --prefix=/usr/local && make -j4 && sudo make install
          cd ..

          # 3. 路径准备：将代码拉取到 WSL 的极速原生盘 (/home/builder/ladybird)
          WORKSPACE_DIR=$(wslpath '${{ github.workspace }}')
          CACHE_DIR=$(wslpath '${{ github.workspace }}/.ladybird-cache')
          
          mkdir -p /home/builder/ladybird
          cp -r "$WORKSPACE_DIR"/* /home/builder/ladybird/
          cp -r "$WORKSPACE_DIR"/.[!.]* /home/builder/ladybird/ 2>/dev/null || true
          chown -R builder:builder /home/builder/ladybird

          # 4. 核心：将 Windows 侧恢复的缓存，极速同步到 WSL 原生盘
          echo "=== Syncing caches to WSL native disk ==="
          mkdir -p /home/builder/ladybird/Build/release/vcpkg_installed
          mkdir -p /home/builder/ladybird/.ccache
          
          if [ -d "$CACHE_DIR/vcpkg_installed" ] && [ "$(ls -A "$CACHE_DIR/vcpkg_installed")" ]; then
            rsync -a "$CACHE_DIR/vcpkg_installed/" /home/builder/ladybird/Build/release/vcpkg_installed/
          fi
          if [ -d "$CACHE_DIR/ccache" ] && [ "$(ls -A "$CACHE_DIR/ccache")" ]; then
            rsync -a "$CACHE_DIR/ccache/" /home/builder/ladybird/.ccache/
          fi
          chown -R builder:builder /home/builder/ladybird/Build
          chown -R builder:builder /home/builder/ladybird/.ccache

          # 5. 开始编译
          echo "=== Starting Build ==="
          cd /home/builder/ladybird
          su builder -c "git config --global --add safe.directory '*'"
          
          # 限制并发，防止 15G 内存 OOM
          su builder -c "env CC=clang-19 CXX=clang++-19 CCACHE_DIR=/home/builder/ladybird/.ccache VCPKG_MAX_CONCURRENCY=4 CMAKE_BUILD_PARALLEL_LEVEL=4 bash -l -c 'chmod +x Meta/ladybird.py && ./Meta/ladybird.py build --preset Release'"

          # 6. 将新编译的依赖和 ccache 同步回 Windows 盘（供下次缓存）
          echo "=== Syncing caches back to Windows workspace ==="
          rsync -a /home/builder/ladybird/Build/release/vcpkg_installed/ "$CACHE_DIR/vcpkg_installed/"
          rsync -a /home/builder/ladybird/.ccache/ "$CACHE_DIR/ccache/"

          # 7. 拷贝成品
          mkdir -p "$WORKSPACE_DIR/dist"
          cp -R Build/release/bin "$WORKSPACE_DIR/dist/"
          chmod -R 777 "$WORKSPACE_DIR/dist"
          file "$WORKSPACE_DIR/dist/bin/Ladybird"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-wsl2-linux-${{ inputs.ref }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
