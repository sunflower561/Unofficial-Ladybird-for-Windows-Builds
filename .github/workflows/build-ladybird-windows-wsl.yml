
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_DISABLE_METRICS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:

      # ============================================================
      # 1. Checkout Ladybird source
      # ============================================================

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      - name: Record source revision
        id: source
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $commit = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Ladybird commit."
          }

          $commit = $commit.Trim()

          "commit=$commit" >> $env:GITHUB_OUTPUT

          Write-Host "Ladybird commit: $commit"

          $global:LASTEXITCODE = 0

      # ============================================================
      # 2. Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ============================================================
      # 3. Rust
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ============================================================
      # 4. Install official LLVM 22.1.8
      # ============================================================

      - name: Install LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "22.1.8"
          $installDir = "C:\LLVM-$version"

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "LLVM-$version-win64.exe"

          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"

          Write-Host "Downloading official LLVM $version"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "LLVM installer download failed."
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 100000000) {
            throw "LLVM installer is unexpectedly small: $size bytes"
          }

          Write-Host "Installing LLVM to $installDir"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/S",
              "/D=$installDir"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed: $($process.ExitCode)"
          }

          $clang = Join-Path $installDir "bin\clang-cl.exe"
          $clangxx = Join-Path $installDir "bin\clang++.exe"
          $lld = Join-Path $installDir "bin\lld-link.exe"

          if (!(Test-Path $clang)) {
            throw "LLVM clang-cl.exe not found."
          }

          if (!(Test-Path $clangxx)) {
            throw "LLVM clang++.exe not found."
          }

          if (!(Test-Path $lld)) {
            throw "LLVM lld-link.exe not found."
          }

          "$installDir\bin" >> $env:GITHUB_PATH

          "LADYBIRD_LLVM_ROOT=$installDir" >> $env:GITHUB_ENV

          Write-Host "===== Installed Clang ====="

          & $clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "Clang version check failed."
          }

          Write-Host "===== Installed LLD ====="

          & $lld --version

          if ($LASTEXITCODE -ne 0) {
            throw "LLD version check failed."
          }

          $global:LASTEXITCODE = 0

      # ============================================================
      # 5. Initialize MSVC x64 environment
      # ============================================================

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 6. Install Windows build prerequisites
      # ============================================================

      - name: Install NASM and pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "NASM installation failed."
            }
          }

          if (!(Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "pkgconfiglite installation failed."
            }
          }

          Write-Host "NASM:"
          nasm -v

          Write-Host "CMake:"
          cmake --version

          Write-Host "Ninja:"
          ninja --version

          Write-Host "Python:"
          python --version

          Write-Host "Rust:"
          rustc --version

          Write-Host "Cargo:"
          cargo --version

          Write-Host "Clang:"
          clang-cl --version

          $global:LASTEXITCODE = 0

      # ============================================================
      # 7. Verify actual compiler selection
      # ============================================================

      - name: Verify LLVM and MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expected = Join-Path `
            $env:LADYBIRD_LLVM_ROOT `
            "bin\clang-cl.exe"

          $actual = (Get-Command clang-cl.exe -ErrorAction Stop).Source

          Write-Host "Expected compiler: $expected"
          Write-Host "Actual compiler:   $actual"

          if ($actual -ne $expected) {
            throw "Wrong clang-cl selected."
          }

          $version = & $expected --version | Out-String

          Write-Host $version

          if ($version -notmatch "clang version 22\.") {
            throw "Expected LLVM 22.x."
          }

          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw "MSVC environment was not initialized."
          }

          Write-Host "MSVC tools: $env:VCToolsInstallDir"
          Write-Host "Windows SDK: $env:WindowsSdkDir"

          if (!(Test-Path $env:VCToolsInstallDir)) {
            throw "MSVC toolchain directory not found."
          }

          $global:LASTEXITCODE = 0

      # ============================================================
      # 8. Read exact vcpkg baseline from source manifest
      # ============================================================

      - name: Read vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifestPath = Join-Path $PWD "vcpkg.json"

          if (!(Test-Path $manifestPath)) {
            throw "vcpkg.json not found."
          }

          $manifest = Get-Content $manifestPath -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid vcpkg builtin-baseline: $baseline"
          }

          Write-Host "Source manifest baseline: $baseline"

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

          # Save exact manifest for diagnostics.

          Copy-Item `
            $manifestPath `
            "$env:RUNNER_TEMP\ladybird-vcpkg.json" `
            -Force

      # ============================================================
      # 9. Full vcpkg repository
      # ============================================================

      - name: Checkout complete vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          git config --global http.retry 5
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {

            Write-Host "Full vcpkg clone attempt $attempt / 3"

            if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
            }

            git clone --no-checkout `
              https://github.com/microsoft/vcpkg.git `
              $root

            $cloneExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($cloneExit -eq 0) {
              $success = $true
              break
            }

            Write-Warning "Clone failed: $cloneExit"

            Start-Sleep -Seconds (20 * $attempt)
          }

          if (!$success) {
            Resolve-DnsName github.com -ErrorAction Continue

            Test-NetConnection github.com `
              -Port 443 `
              -WarningAction Continue

            throw "Unable to clone complete vcpkg repository."
          }

          git -C $root checkout --detach $env:VCPKG_BASELINE

          $checkoutExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($checkoutExit -ne 0) {
            throw "Unable to checkout vcpkg baseline."
          }

          $actual = git -C $root rev-parse HEAD

          $revExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($revExit -ne 0) {
            throw "Unable to read vcpkg commit."
          }

          $actual = $actual.Trim()

          if ($actual -ne $env:VCPKG_BASELINE) {
            throw "vcpkg baseline mismatch."
          }

          $promisor = git -C $root config --get remote.origin.promisor

          $promisorExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($promisorExit -gt 1) {
            throw "Unable to inspect promisor configuration."
          }

          if ($promisor -eq "true") {
            throw "Partial clone detected."
          }

          $toolchain = Join-Path `
            $root `
            "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "vcpkg toolchain missing."
          }

          foreach ($port in @(
            "curl",
            "nghttp2",
            "freetype",
            "harfbuzz",
            "libpng",
            "openssl",
            "qtbase",
            "skia",
            "angle"
          )) {

            $portfile = Join-Path `
              $root `
              "ports/$port/portfile.cmake"

            if (!(Test-Path $portfile)) {
              throw "Missing vcpkg port: $port"
            }

            Write-Host "Verified vcpkg port: $port"
          }

          "LADYBIRD_VCPKG_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "vcpkg commit: $actual"
          Write-Host "vcpkg root: $root"
          Write-Host "Promisor: false"

          $global:LASTEXITCODE = 0

      # ============================================================
      # 10. Verify Ladybird overlays
      # ============================================================

      - name: Verify Ladybird vcpkg overlays
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overlay = Join-Path `
            $PWD `
            "Meta/CMake/vcpkg/overlay-ports"

          $triplets = Join-Path `
            $PWD `
            "Meta/CMake/vcpkg/release-triplets"

          if (!(Test-Path $overlay)) {
            throw "Overlay ports directory missing."
          }

          if (!(Test-Path $triplets)) {
            throw "Release triplets directory missing."
          }

          foreach ($port in @("curl", "nghttp2")) {

            $file = Join-Path `
              $overlay `
              "$port/portfile.cmake"

            if (!(Test-Path $file)) {
              throw "Overlay port missing: $port"
            }

            Write-Host "Verified overlay: $file"
          }

          $triplet = Join-Path `
            $triplets `
            "x64-windows.cmake"

          if (!(Test-Path $triplet)) {
            throw "x64-windows overlay triplet missing."
          }

          Write-Host "Overlay and triplet verified."

      # ============================================================
      # 11. Clean previous CMake build cache
      # ============================================================

      - name: Clean previous build directory
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $PWD "Build/release"

          if (Test-Path $build) {
            Remove-Item $build -Recurse -Force
          }

          if (Test-Path $build) {
            throw "Unable to clean previous CMake build."
          }

          Write-Host "Previous CMake cache removed."

      # ============================================================
      # 12. Configure Ladybird with explicit Clang 22
      # ============================================================

      - name: Configure Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $llvmBin = Join-Path `
            $env:LADYBIRD_LLVM_ROOT `
            "bin"

          $clang = Join-Path $llvmBin "clang-cl.exe"

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          $root = $env:LADYBIRD_VCPKG_ROOT

          $toolchain = Join-Path `
            $root `
            "scripts/buildsystems/vcpkg.cmake"

          $overlay = (
            Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports"
          ).Replace("\", "/")

          $triplets = (
            Join-Path $PWD "Meta/CMake/vcpkg/release-triplets"
          ).Replace("\", "/")

          $env:PATH = "$llvmBin;$env:PATH"
          $env:VCPKG_ROOT = $root

          if (!(Test-Path $clang)) {
            throw "Clang compiler missing."
          }

          Write-Host "Compiler: $clang"
          Write-Host "Ninja: $ninja"
          Write-Host "vcpkg: $root"

          & $clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "Clang failed."
          }

          cmake --preset Release `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clang" `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_ROOT=$root" `
            "-DVCPKG_ROOT_DIR=$root" `
            "-DVCPKG_OVERLAY_PORTS=$overlay" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON" `
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

          $configureExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($configureExit -ne 0) {
            throw "CMake configure failed: $configureExit"
          }

          $cachePath = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cachePath)) {
            throw "CMakeCache.txt missing."
          }

          $cache = Get-Content $cachePath -Raw

          if ($cache -notmatch [regex]::Escape($clang)) {
            throw "CMake did not select the requested Clang compiler."
          }

          if ($cache -notmatch "LADYBIRD_BASELINE_CPU_TARGET:.*=ON") {
            throw "CPU baseline is not enabled."
          }

          if ($cache -notmatch [regex]::Escape($root)) {
            throw "CMake is not using local vcpkg."
          }

          if ($cache -match "Program Files/Microsoft Visual Studio/.*/vcpkg") {
            throw "Visual Studio bundled vcpkg detected."
          }

          Write-Host "CMake compiler and vcpkg configuration verified."

      # ============================================================
      # 13. Verify exact compiler cache
      # ============================================================

      - name: Verify CMake compiler and dependencies
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Get-Content `
            "Build/release/CMakeCache.txt" `
            -Raw

          Write-Host "===== Compiler cache ====="

          Select-String `
            -Path "Build/release/CMakeCache.txt" `
            -Pattern "CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:|CMAKE_MAKE_PROGRAM:|CMAKE_TOOLCHAIN_FILE:|VCPKG_TARGET_TRIPLET:|LADYBIRD_BASELINE_CPU_TARGET:"

          Write-Host "===== vcpkg manifest ====="

          Get-Content "vcpkg.json" -TotalCount 30

          $installed = Join-Path `
            $PWD `
            "Build/release/vcpkg_installed/x64-windows"

          if (!(Test-Path $installed)) {
            throw "vcpkg x64-windows installation directory missing."
          }

          Write-Host "vcpkg installation directory exists."

      # ============================================================
      # 14. Build Ladybird
      # ============================================================

      - name: Build Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Ladybird Release build."

          cmake --build Build/release --parallel 4

          $buildExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($buildExit -ne 0) {
            throw "Ladybird build failed: $buildExit"
          }

          Write-Host "Ladybird build completed."

      # ============================================================
      # 15. Package build output
      # ============================================================

      - name: Package Windows build
        if: success()
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $PWD "Build/release"

          if (!(Test-Path $build)) {
            throw "Build output directory missing."
          }

          $executables = @(
            Get-ChildItem `
              $build `
              -Recurse `
              -Filter "*.exe" `
              -File
          )

          if ($executables.Count -eq 0) {
            throw "No Windows executable found."
          }

          Write-Host "Found executables:"

          $executables | ForEach-Object {
            Write-Host $_.FullName
          }

          $stage = Join-Path `
            $PWD `
            "Ladybird-Windows-x64"

          $zip = Join-Path `
            $PWD `
            "Ladybird-Windows-x64.zip"

          $shaFile = Join-Path `
            $PWD `
            "Ladybird-Windows-x64.zip.sha256"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (Test-Path $shaFile) {
            Remove-Item $shaFile -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stage |
            Out-Null

          Copy-Item `
            "$build\*" `
            $stage `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          $hash = (
            Get-FileHash $zip -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content $shaFile

          Write-Host "Package: $zip"
          Write-Host "SHA256: $hash"

      # ============================================================
      # 16. Upload build artifacts
      # ============================================================

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 17. Collect diagnostics
      # ============================================================

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $out = Join-Path $PWD "diagnostics"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out |
            Out-Null

          $files = @(
            "ladybird/vcpkg.json",
            "ladybird/Build/release/CMakeCache.txt",
            "ladybird/Build/release/compile_commands.json",
            "ladybird/Build/release/vcpkg-manifest-install.log",
            "ladybird/Build/release/vcpkg_installed/vcpkg/status"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item $file $out -Force
            }
          }

          if (Test-Path "ladybird/Build/release") {
            Get-ChildItem `
              "ladybird/Build/release" `
              -Recurse `
              -File |
              Where-Object {
                $_.Name -match "CMakeError|CMakeOutput|\.log$"
              } |
              Select-Object -First 100 |
              ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  (Join-Path $out $_.Name) `
                  -Force
              }
          }

          if (Test-Path "ladybird") {
            git -C ladybird rev-parse HEAD |
              Set-Content "$out/ladybird-commit.txt"

            $global:LASTEXITCODE = 0
          }

          if ($env:LADYBIRD_VCPKG_ROOT -and
              (Test-Path "$env:LADYBIRD_VCPKG_ROOT/.git")) {

            git -C $env:LADYBIRD_VCPKG_ROOT rev-parse HEAD |
              Set-Content "$out/vcpkg-commit.txt"

            $global:LASTEXITCODE = 0

            $promisor = git -C $env:LADYBIRD_VCPKG_ROOT config --get remote.origin.promisor

            "promisor=$promisor" |
              Set-Content "$out/vcpkg-promisor.txt"

            $global:LASTEXITCODE = 0
          }

          if ($env:LADYBIRD_LLVM_ROOT) {
            $clang = Join-Path `
              $env:LADYBIRD_LLVM_ROOT `
              "bin\clang-cl.exe"

            if (Test-Path $clang) {
              & $clang --version |
                Set-Content "$out/clang-version.txt"

              $global:LASTEXITCODE = 0
            }
          }

          if (Test-Path "ladybird/Build/release/CMakeCache.txt") {
            Select-String `
              -Path "ladybird/Build/release/CMakeCache.txt" `
              -Pattern "CMAKE_C_COMPILER:|CMAKE_CXX_COMPILER:|CMAKE_TOOLCHAIN_FILE:|VCPKG_TARGET_TRIPLET:|LADYBIRD_BASELINE_CPU_TARGET:" |
              Set-Content "$out/compiler-and-vcpkg-config.txt"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 18. Optional GitHub prerelease
      # ============================================================

      - name: Publish prerelease
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          files: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          body: |
            Automated Ladybird Windows x64 build.

            Source:
            https://github.com/LadybirdBrowser/ladybird

            Source ref: ${{ inputs.ref }}
            Source commit: ${{ steps.source.outputs.commit }}

            Compiler:
            LLVM Clang 22.1.8

            CPU baseline:
            x86-64-v2

            Dependencies:
            Pinned by the source vcpkg.json manifest and builtin-baseline.

            Package:
            Complete CMake build output.

            Portability:
            Not yet verified on a clean Windows installation.
