
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird Git ref (branch, tag, or commit)"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_DISABLE_METRICS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      # ------------------------------------------------------------
      # 1. Checkout Ladybird
      # ------------------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      # ------------------------------------------------------------
      # 2. Install build tools
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @("cmake", "ninja", "git", "python", "rustc", "cargo")) {
            $cmd = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool : $($cmd.Source)"
          }

          clang-cl --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version

      # ------------------------------------------------------------
      # 3. Read exact vcpkg baseline from Ladybird manifest
      # ------------------------------------------------------------
      - name: Read vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline not found in vcpkg.json"
          }

          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid vcpkg baseline commit: $baseline"
          }

          Write-Host "Ladybird vcpkg baseline: $baseline"
          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # 4. Full vcpkg clone
      # IMPORTANT:
      # No --filter=blob:none
      # No shallow clone
      # Versioned ports require Git history.
      # ------------------------------------------------------------
      - name: Checkout complete vcpkg baseline
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          git config --global http.retry 5
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Full vcpkg clone attempt $attempt / 3"

            if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
            }

            try {
              git clone --no-checkout `
                https://github.com/microsoft/vcpkg.git `
                $root

              if ($LASTEXITCODE -ne 0) {
                throw "git clone failed with exit code $LASTEXITCODE"
              }

              $success = $true
              break
            }
            catch {
              Write-Warning $_
              Start-Sleep -Seconds (20 * $attempt)
            }
          }

          if (!$success) {
            Write-Host "DNS diagnostics:"
            Resolve-DnsName github.com -ErrorAction Continue
            Test-NetConnection github.com -Port 443 -WarningAction Continue

            throw "Unable to obtain complete vcpkg repository."
          }

          git -C $root checkout --detach $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to checkout vcpkg baseline $env:VCPKG_BASELINE"
          }

          $actual = git -C $root rev-parse HEAD

          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:VCPKG_BASELINE) {
            throw "vcpkg baseline verification failed. Actual: $actual"
          }

          $promisor = git -C $root config --get remote.origin.promisor

          if ($promisor -eq "true") {
            throw "vcpkg repository is still configured as a promisor repository."
          }

          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "vcpkg CMake toolchain not found."
          }

          foreach ($port in @(
            "curl",
            "nghttp2",
            "freetype",
            "harfbuzz",
            "libpng",
            "openssl"
          )) {
            $portfile = Join-Path $root "ports/$port/portfile.cmake"

            if (!(Test-Path $portfile)) {
              throw "Missing vcpkg base port: $port"
            }
          }

          "LADYBIRD_VCPKG_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "vcpkg root: $root"
          Write-Host "vcpkg commit: $actual"
          Write-Host "vcpkg toolchain: $toolchain"

      # ------------------------------------------------------------
      # 5. Verify overlay ports and triplets
      # ------------------------------------------------------------
      - name: Verify Ladybird vcpkg configuration
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overlay = Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports"
          $triplets = Join-Path $PWD "Meta/CMake/vcpkg/release-triplets"

          if (!(Test-Path $overlay)) {
            throw "Ladybird overlay ports directory not found."
          }

          if (!(Test-Path $triplets)) {
            throw "Ladybird release triplets directory not found."
          }

          foreach ($port in @("curl", "nghttp2")) {
            $file = Join-Path $overlay "$port/portfile.cmake"

            if (!(Test-Path $file)) {
              throw "Missing Ladybird overlay port: $port"
            }

            Write-Host "Verified overlay: $file"
          }

          Write-Host "Overlay ports: $overlay"
          Write-Host "Overlay triplets: $triplets"

      # ------------------------------------------------------------
      # 6. Configure CMake
      # ------------------------------------------------------------
      - name: Configure Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $root = $env:LADYBIRD_VCPKG_ROOT
          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"
          $overlay = (Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports").Replace("\", "/")
          $triplets = (Join-Path $PWD "Meta/CMake/vcpkg/release-triplets").Replace("\", "/")

          $env:VCPKG_ROOT = $root

          Write-Host "Ninja: $ninja"
          Write-Host "Toolchain: $toolchain"
          Write-Host "vcpkg baseline: $env:VCPKG_BASELINE"

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_ROOT=$root" `
            "-DVCPKG_ROOT_DIR=$root" `
            "-DVCPKG_OVERLAY_PORTS=$overlay" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON" `
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed."
          }

          if (!(Test-Path "Build/release/CMakeCache.txt")) {
            throw "CMakeCache.txt was not generated."
          }

          # Verify that CMake actually uses the local vcpkg.
          $cache = Get-Content "Build/release/CMakeCache.txt" -Raw

          if ($cache -notmatch [regex]::Escape($root)) {
            throw "CMakeCache does not reference the local vcpkg root."
          }

          if ($cache -notmatch "LADYBIRD_BASELINE_CPU_TARGET:.*=ON") {
            throw "CPU baseline option is not enabled in CMakeCache."
          }

          if ($cache -match "Program Files/Microsoft Visual Studio/.*/vcpkg") {
            throw "CMake is unexpectedly using Visual Studio bundled vcpkg."
          }

          Write-Host "CMake configuration verified."

      # ------------------------------------------------------------
      # 7. Build
      # ------------------------------------------------------------
      - name: Build Ladybird
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build Build/release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # ------------------------------------------------------------
      # 8. Collect build output
      # ------------------------------------------------------------
      - name: Package Windows build
        if: success()
        working-directory: ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $PWD "Build/release"

          if (!(Test-Path $build)) {
            throw "Build output directory does not exist."
          }

          $executables = Get-ChildItem $build -Recurse -Filter "*.exe" -File

          if ($executables.Count -eq 0) {
            throw "No executable files found in build output."
          }

          Write-Host "Executables found:"
          $executables | ForEach-Object {
            Write-Host $_.FullName
          }

          $stage = Join-Path $PWD "Ladybird-Windows-x64"
          $zip = Join-Path $PWD "Ladybird-Windows-x64.zip"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          New-Item -ItemType Directory -Path $stage | Out-Null

          # Preserve the complete CMake build output.
          # This is a build archive, not yet a verified portable package.
          Copy-Item "$build\*" $stage -Recurse -Force

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP archive was not generated."
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content "$PWD/Ladybird-Windows-x64.zip.sha256"

          Write-Host "ZIP created: $zip"
          Write-Host "SHA256: $hash"

      # ------------------------------------------------------------
      # 9. Upload build artifact
      # ------------------------------------------------------------
      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ------------------------------------------------------------
      # 10. Upload diagnostics, even after failure
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $out = Join-Path $PWD "diagnostics"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $files = @(
            "ladybird/Build/release/CMakeCache.txt",
            "ladybird/Build/release/compile_commands.json",
            "ladybird/Build/release/vcpkg-manifest-install.log",
            "ladybird/vcpkg.json"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item $file $out -Force
            }
          }

          if (Test-Path "ladybird/Build/release") {
            Get-ChildItem "ladybird/Build/release" -Recurse -File |
              Where-Object {
                $_.Name -match "CMakeError|CMakeOutput|\.log$"
              } |
              Select-Object -First 100 |
              ForEach-Object {
                $dest = Join-Path $out $_.Name
                Copy-Item $_.FullName $dest -Force
              }
          }

          git -C ladybird rev-parse HEAD |
            Set-Content "$out/ladybird-commit.txt"

          git -C ladybird status --short |
            Set-Content "$out/ladybird-status.txt"

          if ($env:LADYBIRD_VCPKG_ROOT -and
              (Test-Path "$env:LADYBIRD_VCPKG_ROOT/.git")) {
            git -C $env:LADYBIRD_VCPKG_ROOT rev-parse HEAD |
              Set-Content "$out/vcpkg-commit.txt"

            git -C $env:LADYBIRD_VCPKG_ROOT config --get remote.origin.promisor |
              Set-Content "$out/vcpkg-promisor.txt"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # 11. Optional GitHub prerelease
      # ------------------------------------------------------------
      - name: Publish prerelease
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          files: |
            ladybird/Ladybird-Windows-x64.zip
            ladybird/Ladybird-Windows-x64.zip.sha256
          body: |
            Automated Windows x64 build of Ladybird.

            Source ref: ${{ inputs.ref }}
            Source commit: ${{ github.sha }}

            CPU baseline:
            x86-64-v2

            Note:
            The ZIP contains the complete CMake build output.
            It has not yet been verified on a clean Windows machine.
