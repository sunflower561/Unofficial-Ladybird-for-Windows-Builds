
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Ladybird source branch"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.cache\vcpkg-downloads

    steps:
      # 1. 获取 Ladybird 源码
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.source_branch }}
          submodules: recursive
          fetch-depth: 0

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 3. 配置 MSVC x64 环境
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 安装 LLVM、NASM、pkg-config
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Build tools installation failed"
          }

          $llvm = "C:\Program Files\LLVM\bin"

          if (Test-Path $llvm) {
            $llvm >> $env:GITHUB_PATH
            $env:PATH = "$llvm;$env:PATH"
          }

          Write-Host "===== LLVM ====="
          clang-cl --version

          Write-Host "===== NASM ====="
          nasm -v

          Write-Host "===== MSVC ====="
          cl

      # 5. 安装 CMake、Ninja、aqtinstall
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed"
          }

          python -m pip install --upgrade cmake ninja aqtinstall

          if ($LASTEXITCODE -ne 0) {
            throw "Python dependencies installation failed"
          }

          # 获取 Python Scripts 目录
          $scripts = (
            python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          ).Trim()

          if (!(Test-Path $scripts)) {
            throw "Python Scripts directory not found: $scripts"
          }

          # 加入当前步骤和后续步骤 PATH
          $scripts >> $env:GITHUB_PATH
          $env:PATH = "$scripts;$env:PATH"

          Write-Host "Python Scripts: $scripts"

          Write-Host "===== CMake ====="
          cmake --version

          Write-Host "===== Ninja ====="
          ninja --version

          Write-Host "===== aqtinstall ====="
          aqt version

      # 6. 安装 Rust
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 7. Rust 缓存
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 8. 设置 Qt 版本
      - name: Select Qt version
        id: qt
        shell: pwsh
        run: |
          $version = "6.10.3"

          "version=$version" >> $env:GITHUB_OUTPUT
          "QT_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Qt version: $version"

      # 9. 缓存 Qt
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: windows-qt-6.10.3-msvc2022-x64-v2

      # 10. 安装 Qt
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 `
            -m qtpositioning `
            -O C:\Qt

          if ($LASTEXITCODE -ne 0) {
            throw "Qt 6.10.3 installation failed"
          }

          Write-Host "Qt installation completed"

      # 11. 配置 Qt 环境
      - name: Configure Qt
        shell: pwsh
        run: |
          $qt = "C:\Qt\6.10.3\msvc2022_64"

          if (!(Test-Path $qt)) {
            throw "Qt directory not found: $qt"
          }

          "QT_ROOT=$qt" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qt" >> $env:GITHUB_ENV
          "$qt\bin" >> $env:GITHUB_PATH

          Write-Host "Qt configured: $qt"

      # 12. 缓存 vcpkg
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-downloads
          key: windows-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            windows-vcpkg-

      # 13. 创建 vcpkg 缓存目录
      - name: Prepare vcpkg cache directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg"
          $downloads = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg-downloads"

          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$downloads" >> $env:GITHUB_ENV

          if (!(Test-Path $cache -PathType Container)) {
            throw "vcpkg binary cache directory creation failed"
          }

          if (!(Test-Path $downloads -PathType Container)) {
            throw "vcpkg downloads directory creation failed"
          }

          Write-Host "vcpkg cache: $cache"
          Write-Host "vcpkg downloads: $downloads"

      # 14. 检查所有编译环境
      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== Compiler ====="
          clang-cl --version
          cl

          Write-Host "===== CMake ====="
          cmake --version

          Write-Host "===== Ninja ====="
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue

          if (!$ninja) {
            throw "Ninja executable not found in PATH"
          }

          Write-Host "Ninja path: $($ninja.Source)"
          ninja --version

          Write-Host "===== Rust ====="
          rustc --version
          cargo --version

          Write-Host "===== Qt ====="
          qmake --version

          Write-Host "===== aqtinstall ====="
          aqt version

          Write-Host "===== vcpkg cache ====="

          if (!(Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE -PathType Container)) {
            throw "vcpkg binary cache directory missing"
          }

          if (!(Test-Path $env:VCPKG_DOWNLOADS -PathType Container)) {
            throw "vcpkg downloads directory missing"
          }

          Write-Host "vcpkg cache ready"

      # 15. 编译 Ladybird
      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $ErrorActionPreference = "Stop"

          # 再次确认 Ninja
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue

          if (!$ninja) {
            throw "Ninja is unavailable before compilation"
          }

          # 确保 vcpkg 缓存目录存在
          New-Item -ItemType Directory -Force `
            -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          New-Item -ItemType Directory -Force `
            -Path $env:VCPKG_DOWNLOADS | Out-Null

          # 自动计算并行任务
          $cpu = [Environment]::ProcessorCount

          $memory = [math]::Floor(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          )

          $jobs = [math]::Min(
            $cpu,
            [math]::Max(1, [math]::Floor($memory / 3))
          )

          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$jobs"
          $env:VCPKG_MAX_CONCURRENCY = "$jobs"

          Write-Host "===== Build Configuration ====="
          Write-Host "CPU cores: $cpu"
          Write-Host "Memory: $memory GB"
          Write-Host "Parallel jobs: $jobs"
          Write-Host "Ninja: $($ninja.Source)"
          Write-Host "vcpkg cache: $env:VCPKG_DEFAULT_BINARY_CACHE"

          Write-Host "===== Start Ladybird Build ====="

          py Meta\ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird compilation failed: $LASTEXITCODE"
          }

      # 16. 收集编译产物
      - name: Package Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $env:GITHUB_WORKSPACE "Build\release"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $bin = Join-Path $stage "bin"

          if (!(Test-Path "$build\bin")) {
            throw "Build\release\bin not found"
          }

          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # 复制编译目录
          Copy-Item "$build\bin\*" $bin -Recurse -Force

          # 执行 CMake 安装规则
          $install = Join-Path $env:RUNNER_TEMP "ladybird-install"

          New-Item -ItemType Directory -Force -Path $install | Out-Null

          cmake --install $build --prefix $install

          if ($LASTEXITCODE -eq 0) {
            Copy-Item "$install\*" $stage -Recurse -Force
          } else {
            Write-Warning "CMake install failed; using build output"
          }

          # 收集 vcpkg DLL
          $vcpkgBin = "$build\vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
              Copy-Item -Destination $bin -Force
          }

          # 收集可能存在的资源目录
          $resourceDirs = @(
            "share",
            "res",
            "resources",
            "Base",
            "UI"
          )

          foreach ($dir in $resourceDirs) {
            $source = Join-Path $build $dir

            if (Test-Path $source) {
              Copy-Item $source $stage -Recurse -Force
            }
          }

          # 查找 Ladybird.exe
          $mainExe = Join-Path $bin "Ladybird.exe"

          if (!(Test-Path $mainExe)) {
            $found = Get-ChildItem $bin -Filter "Ladybird.exe" -Recurse |
              Select-Object -First 1

            if ($found) {
              $mainExe = $found.FullName
            } else {
              throw "Ladybird.exe not found in build output"
            }
          }

          # 部署 Qt 运行库
          $windeployqt = Join-Path $env:QT_ROOT "bin\windeployqt.exe"

          if (!(Test-Path $windeployqt)) {
            throw "windeployqt.exe not found"
          }

          & $windeployqt --release --compiler-runtime --no-translations $mainExe

          if ($LASTEXITCODE -ne 0) {
            throw "Qt deployment failed"
          }

          Write-Host "===== Package Contents ====="

          Get-ChildItem $stage -Recurse -File |
            Select-Object FullName, Length

      # 17. 创建 ZIP
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Ladybird-Windows-x64.zip"

          if (!(Test-Path $stage)) {
            throw "Package directory not found"
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue

          if ($sevenZip) {
            7z a -tzip -mx=1 $zip "$stage\*"

            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip compression failed"
            }
          } else {
            Add-Type -AssemblyName System.IO.Compression
            Add-Type -AssemblyName System.IO.Compression.FileSystem

            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $stage,
              $zip,
              [System.IO.Compression.CompressionLevel]::Fastest,
              $false
            )
          }

          if (!(Test-Path $zip)) {
            throw "ZIP file was not created"
          }

          Get-Item $zip | Select-Object Name, Length

      # 18. 上传编译产物
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: Ladybird-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
