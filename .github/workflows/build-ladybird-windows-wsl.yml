
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird branch, tag, or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      # --------------------------------------------------
      # 2. Toolchains
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          python -m pip install --upgrade pip
          python -m pip install cmake

          clang-cl --version
          cmake --version
          ninja --version
          python --version
          rustc --version

      # --------------------------------------------------
      # 3. Inspect source manifest
      # --------------------------------------------------
      - name: Inspect Ladybird manifest
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if (!$baseline) {
            throw "vcpkg builtin-baseline missing."
          }

          Write-Host "Ladybird revision:"
          git rev-parse HEAD

          Write-Host "vcpkg baseline:"
          Write-Host $baseline

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

          Write-Host "Checking CPU baseline option:"
          Select-String `
            -Path "Meta/CMake/cmake_options.cmake" `
            -Pattern "LADYBIRD_BASELINE_CPU_TARGET" `
            -Context 1,2

          Write-Host "Checking CPU compile flags:"
          Select-String `
            -Path "Meta/CMake/compile_options.cmake" `
            -Pattern "x86-64-v2|target-cpu" `
            -Context 2,2

      # --------------------------------------------------
      # 4. Cache
      # --------------------------------------------------
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            ladybird/.cache/vcpkg
            ladybird/Build/release/vcpkg_installed
          key: ladybird-windows-vcpkg-${{ hashFiles('ladybird/vcpkg.json') }}
          restore-keys: |
            ladybird-windows-vcpkg-

      # --------------------------------------------------
      # 5. Checkout exact vcpkg baseline
      # --------------------------------------------------
      - name: Checkout vcpkg baseline
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          git clone --filter=blob:none --no-checkout `
            https://github.com/microsoft/vcpkg.git $root

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed."
          }

          git -C $root fetch origin $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline fetch failed."
          }

          git -C $root checkout --detach $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline checkout failed."
          }

          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "Local vcpkg toolchain not found."
          }

          foreach ($port in @("curl", "nghttp2")) {
            $portfile = Join-Path $root "ports/$port/portfile.cmake"

            if (!(Test-Path $portfile)) {
              throw "Missing vcpkg base port: $port"
            }
          }

          Write-Host "Using vcpkg:"
          git -C $root rev-parse HEAD

          "LADYBIRD_VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 6. Inspect overlays
      # --------------------------------------------------
      - name: Inspect overlay ports
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $overlayRoot = Join-Path $PWD "Meta/CMake/vcpkg/overlay-ports"

          if (!(Test-Path $overlayRoot)) {
            throw "Ladybird overlay ports directory missing."
          }

          foreach ($port in @("curl", "nghttp2")) {
            $file = Join-Path $overlayRoot "$port/portfile.cmake"

            if (!(Test-Path $file)) {
              throw "Missing Ladybird overlay: $file"
            }

            Write-Host "========== $port overlay =========="
            Get-Content $file
          }

      # --------------------------------------------------
      # 7. Prepare vcpkg environment
      # --------------------------------------------------
      - name: Prepare vcpkg environment
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:LADYBIRD_VCPKG_ROOT

          $env:VCPKG_ROOT = $root
          $env:VCPKG_ROOT_DIR = $root

          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"

          $env:VCPKG_DOWNLOADS = Join-Path $PWD ".cache/vcpkg/downloads"

          New-Item -ItemType Directory -Force `
            -Path $env:VCPKG_DOWNLOADS | Out-Null

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_ROOT_DIR=$env:VCPKG_ROOT_DIR"

          Write-Host "Local toolchain:"
          Test-Path "$root/scripts/buildsystems/vcpkg.cmake"

      # --------------------------------------------------
      # 8. Bootstrap vcpkg
      # --------------------------------------------------
      - name: Bootstrap vcpkg
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $bootstrap = Join-Path `
            $env:LADYBIRD_VCPKG_ROOT `
            "bootstrap-vcpkg.bat"

          if (!(Test-Path $bootstrap)) {
            throw "bootstrap-vcpkg.bat missing."
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          & "$env:LADYBIRD_VCPKG_ROOT/vcpkg.exe" version

      # --------------------------------------------------
      # 9. Clean build directory
      # --------------------------------------------------
      - name: Clean build
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($path in @(
            "Build/release",
            "Build/vcpkg-release",
            "dist/Ladybird"
          )) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Force `
            -Path "dist/Ladybird" | Out-Null

      # --------------------------------------------------
      # 10. Configure
      # --------------------------------------------------
      - name: Configure CMake
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:LADYBIRD_VCPKG_ROOT
          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source

          if (!(Test-Path $toolchain)) {
            throw "Local vcpkg toolchain missing."
          }

          Write-Host "Ninja: $ninja"
          Write-Host "Toolchain: $toolchain"

          $env:VCPKG_ROOT = $root
          $env:VCPKG_ROOT_DIR = $root

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_ROOT=$root" `
            "-DVCPKG_ROOT_DIR=$root" `
            "-DVCPKG_OVERLAY_PORTS=$PWD/Meta/CMake/vcpkg/overlay-ports" `
            "-DVCPKG_OVERLAY_TRIPLETS=$PWD/Meta/CMake/vcpkg/release-triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      # --------------------------------------------------
      # 11. Verify actual CMake configuration
      # --------------------------------------------------
      - name: Verify CMake and vcpkg configuration
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt missing."
          }

          $content = Get-Content $cache -Raw

          Write-Host "Checking toolchain..."
          Select-String -Path $cache `
            -Pattern "CMAKE_TOOLCHAIN_FILE|Z_VCPKG_ROOT_DIR|VCPKG_OVERLAY_PORTS|VCPKG_OVERLAY_TRIPLETS|LADYBIRD_BASELINE_CPU_TARGET"

          if ($content -match "Microsoft Visual Studio.*/VC/vcpkg") {
            throw "CMake is still using Visual Studio bundled vcpkg."
          }

          if ($content -notmatch [regex]::Escape(".vcpkg-upstream")) {
            throw "Local vcpkg root was not recorded in CMakeCache."
          }

          if ($content -notmatch "VCPKG_OVERLAY_PORTS:STRING=.*overlay-ports") {
            throw "Ladybird overlay ports are not configured."
          }

          if ($content -notmatch "LADYBIRD_BASELINE_CPU_TARGET:.*=ON") {
            throw "CPU baseline option is not enabled."
          }

          Write-Host "CMake configuration checks passed."

      # --------------------------------------------------
      # 12. Build
      # --------------------------------------------------
      - name: Build Ladybird
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build Build/release `
            --config Release `
            --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird compilation failed."
          }

      # --------------------------------------------------
      # 13. Install
      # --------------------------------------------------
      - name: Install Ladybird
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          cmake --install Build/release `
            --config Release `
            --prefix "$PWD/dist/Ladybird"

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird install failed."
          }

          $exe = Get-ChildItem "dist/Ladybird" `
            -Recurse -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found after install."
          }

          Write-Host "Executable:"
          Write-Host $exe.FullName

      # --------------------------------------------------
      # 14. Package
      # --------------------------------------------------
      - name: Package ZIP
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $revision = (git rev-parse --short HEAD).Trim()

          $zip = "Ladybird-Windows-x64-$revision.zip"
          $zipPath = Join-Path $PWD "dist/$zip"

          7z a -tzip $zipPath ".\dist\Ladybird\*"

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP packaging failed."
          }

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()

          "$hash  $zip" |
            Set-Content "$zipPath.sha256" -Encoding ascii

          Write-Host "ZIP:"
          Get-Item $zipPath | Select-Object Name, Length

          Write-Host "SHA256:"
          Write-Host $hash

      # --------------------------------------------------
      # 15. Upload ZIP
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/dist/Ladybird-Windows-x64-*.zip
            ladybird/dist/Ladybird-Windows-x64-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # --------------------------------------------------
      # 16. Upload diagnostics
      # --------------------------------------------------
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: |
            ladybird/Build/release/CMakeCache.txt
            ladybird/Build/release/compile_commands.json
            ladybird/Build/release/vcpkg-manifest-install.log
            ladybird/vcpkg.json
            ladybird/Meta/CMake/vcpkg/overlay-ports/**
            ladybird/.vcpkg-upstream/ports/curl/portfile.cmake
            ladybird/.vcpkg-upstream/ports/nghttp2/portfile.cmake
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------
      # 17. Optional prerelease
      # --------------------------------------------------
      - name: Publish prerelease
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            ladybird/dist/Ladybird-Windows-x64-*.zip
            ladybird/dist/Ladybird-Windows-x64-*.zip.sha256
