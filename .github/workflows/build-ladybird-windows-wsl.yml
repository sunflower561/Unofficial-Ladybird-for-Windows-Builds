name: Build Ladybird Windows (WSL2, Official)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ladybird 分支或标签（如 master）'
        required: true
        default: 'master'
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Ladybird source
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Show selected ref
        shell: bash
        run: |
          echo "Building Ladybird @ ${{ inputs.ref }}"
          git log -1 --oneline

      - name: Setup WSL2 (Ubuntu)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04

      - name: Build inside WSL2 (as non-root user)
        shell: wsl-bash {0}
        run: |
          echo "=== [Step 1] 创建普通用户 builder ==="
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          echo "=== [Step 2] 安装基础依赖和 FFmpeg 必需的硬件加速开发库 ==="
          sudo apt-get -o Acquire::http::Timeout=30 update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 install -y \
            curl zip unzip tar git autoconf autoconf-archive automake \
            build-essential ccache cmake libtool nasm ninja-build pkg-config \
            python3-venv qt6-base-dev qt6-tools-dev-tools qt6-wayland \
            libpulse-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libdrm-dev libvulkan-dev glslang-tools fonts-liberation2 \
            libva-dev libvdpau-dev software-properties-common wget

          echo "=== [Step 3] 安装 Clang 19 ==="
          wget --timeout=30 --tries=3 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main"
          sudo apt-get -o Acquire::http::Timeout=30 update -y
          sudo apt-get -o Acquire::http::Timeout=30 install -y clang-19 lld-19

          echo "=== [Step 4] 复制代码并配置权限 ==="
          WORKSPACE_DIR=$(wslpath '${{ github.workspace }}')
          mkdir -p /home/builder/ladybird
          cp -r "$WORKSPACE_DIR"/* /home/builder/ladybird/
          cp -r "$WORKSPACE_DIR"/.[!.]* /home/builder/ladybird/ 2>/dev/null || true
          chown -R builder:builder /home/builder/ladybird

          echo "=== [Step 5] 清理可能的脏缓存 ==="
          cd /home/builder/ladybird
          su builder -c "git config --global --add safe.directory '*'"
          rm -rf Build/release/vcpkg-deps/ffmpeg
          rm -rf Build/vcpkg-release/downloads/ffmpeg-ffmpeg-n9.0.2.tar.gz

          echo "=== [Step 6] 开始源码编译 (限制并发防 OOM) ==="
          echo "WSL 分配到的 CPU 核心数: $(nproc)"
          echo "WSL 分配到的内存总量: $(free -h | awk '/^Mem:/ {print $2}')"
          
          su builder -c "env CC=clang-19 CXX=clang++-19 VCPKG_MAX_CONCURRENCY=4 CMAKE_BUILD_PARALLEL_LEVEL=4 bash -l -c 'chmod +x Meta/ladybird.py && ./Meta/ladybird.py build --preset Release'"

          echo "=== [Step 7] 编译完成，打包产物 ==="
          mkdir -p "$WORKSPACE_DIR/dist"
          cp -R Build/release/bin "$WORKSPACE_DIR/dist/"
          chmod -R 777 "$WORKSPACE_DIR/dist"
          file "$WORKSPACE_DIR/dist/bin/Ladybird"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-wsl2-linux-${{ inputs.ref }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
