
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird Git ref (branch, tag, or commit)"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish a GitHub prerelease after a successful build"
        required: true
        default: false
        type: boolean

  workflow:
    push:
      branches:
        - main
      paths:
        - ".github/workflows/windows.yml"

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh

    env:
      LLVM_VERSION: "22.1.8"
      LLVM_ROOT: "C:\\LLVM-22.1.8"
      VCPKG_ROOT: "${{ github.workspace }}\\ladybird\\.vcpkg-upstream"
      BUILD_DIR: "Build/release"

    steps:
      # ---------------------------------------------------------
      # 1. Checkout workflow repository
      # ---------------------------------------------------------
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Checkout Ladybird source
      # ---------------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive

      # ---------------------------------------------------------
      # 3. Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ---------------------------------------------------------
      # 4. Rust
      # ---------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ---------------------------------------------------------
      # 5. Initialize MSVC x64 environment
      # ---------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------
      # 6. Install LLVM / Clang 22.1.8
      # ---------------------------------------------------------
      - name: Install LLVM 22.1.8
        run: |
          $ErrorActionPreference = "Stop"

          $llvmRoot = "C:\LLVM-22.1.8"
          $clang = Join-Path $llvmRoot "bin\clang-cl.exe"

          if (-not (Test-Path $clang)) {
            $installer = Join-Path $env:RUNNER_TEMP "LLVM-22.1.8-win64.exe"

            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"

            Write-Host "Downloading LLVM 22.1.8..."

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $installer `
              -UseBasicParsing

            Write-Host "Installing LLVM..."

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @("/S", "/D=$llvmRoot") `
              -Wait `
              -PassThru

            if ($process.ExitCode -ne 0) {
              throw "LLVM installer failed: $($process.ExitCode)"
            }
          }

          if (-not (Test-Path $clang)) {
            throw "clang-cl.exe was not installed."
          }

          $clangVersion = & $clang --version
          $clangVersion | Write-Host

          if (($clangVersion -join "`n") -notmatch "22\.1\.8") {
            throw "Unexpected Clang version."
          }

          "C:\LLVM-22.1.8\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

          Write-Host "LLVM 22.1.8 installation verified."

      # ---------------------------------------------------------
      # 7. Install build tools
      # ---------------------------------------------------------
      - name: Install build tools
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }

          if (-not (Get-Command pkgconfiglite -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite -y --no-progress
          }

          $ninjaPath = (Get-Command ninja.exe -ErrorAction Stop).Source

          Write-Host "Ninja: $ninjaPath"

          & $ninjaPath --version

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja verification failed."
          }

          nasm.exe -v

          if ($LASTEXITCODE -ne 0) {
            throw "NASM verification failed."
          }

      # ---------------------------------------------------------
      # 8. Verify compiler and toolchain
      # ---------------------------------------------------------
      - name: Verify toolchain
        run: |
          $ErrorActionPreference = "Stop"

          $clang = "C:\LLVM-22.1.8\bin\clang-cl.exe"
          $clangxx = "C:\LLVM-22.1.8\bin\clang++.exe"
          $lld = "C:\LLVM-22.1.8\bin\lld-link.exe"

          foreach ($file in @($clang, $clangxx, $lld)) {
            if (-not (Test-Path $file)) {
              throw "Missing LLVM tool: $file"
            }
          }

          & $clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "Clang verification failed."
          }

          Write-Host "MSVC environment:"
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          Write-Host "WindowsSdkDir=$env:WindowsSdkDir"

          if (-not $env:VCToolsInstallDir) {
            throw "MSVC environment is not initialized."
          }

          if (-not $env:WindowsSdkDir) {
            throw "Windows SDK is not available."
          }

          Write-Host "Toolchain verification passed."

      # ---------------------------------------------------------
      # 9. Read vcpkg baseline from Ladybird manifest
      # ---------------------------------------------------------
      - name: Read vcpkg baseline
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if (-not $baseline) {
            throw "Could not read builtin-baseline from vcpkg.json."
          }

          Write-Host "Ladybird vcpkg baseline: $baseline"

          "VCPKG_BASELINE=$baseline" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          $baseline | Out-File `
            -FilePath "$env:RUNNER_TEMP\vcpkg-baseline.txt" `
            -Encoding utf8

      # ---------------------------------------------------------
      # 10. Full clone vcpkg at exact baseline
      # ---------------------------------------------------------
      - name: Clone vcpkg
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = Join-Path $PWD ".vcpkg-upstream"

          if (Test-Path $vcpkgRoot) {
            Remove-Item $vcpkgRoot -Recurse -Force
          }

          $success = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Full vcpkg clone attempt $attempt / 3"

            if (Test-Path $vcpkgRoot) {
              Remove-Item $vcpkgRoot -Recurse -Force
            }

            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }

            Write-Warning "vcpkg clone failed."

            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $success) {
            throw "Could not clone vcpkg after 3 attempts."
          }

          Set-Location $vcpkgRoot

          git checkout $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "Could not checkout vcpkg baseline."
          }

          $actualCommit = (git rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0) {
            throw "Could not read vcpkg commit."
          }

          Write-Host "vcpkg root: $vcpkgRoot"
          Write-Host "vcpkg commit: $actualCommit"
          Write-Host "Expected baseline: $env:VCPKG_BASELINE"

          if ($actualCommit -ne $env:VCPKG_BASELINE) {
            throw "vcpkg commit does not match Ladybird baseline."
          }

          # Verify this is not a partial/promisor clone.
          $config = Get-Content ".git\config" -Raw

          if ($config -match '(?im)^\s*promisor\s*=\s*true\s*$') {
            throw "vcpkg is a promisor clone. Full clone required."
          }

          Write-Host "Full vcpkg clone verified."

      # ---------------------------------------------------------
      # 11. Bootstrap vcpkg
      # ---------------------------------------------------------
      - name: Bootstrap vcpkg
        working-directory: ladybird/.vcpkg-upstream
        run: |
          $ErrorActionPreference = "Stop"

          .\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          if (-not (Test-Path ".\vcpkg.exe")) {
            throw "vcpkg.exe was not generated."
          }

          .\vcpkg.exe version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version check failed."
          }

      # ---------------------------------------------------------
      # 12. Verify Ladybird overlays and vcpkg ports
      # ---------------------------------------------------------
      - name: Verify vcpkg overlays
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $ports = Join-Path $PWD "Meta\CMake\vcpkg\overlay-ports"
          $triplets = Join-Path $PWD "Meta\CMake\vcpkg\release-triplets"
          $triplet = Join-Path $triplets "x64-windows.cmake"

          $basePorts = Join-Path `
            $PWD `
            ".vcpkg-upstream\ports"

          foreach ($path in @($ports, $triplets, $triplet, $basePorts)) {
            if (-not (Test-Path $path)) {
              throw "Required vcpkg path is missing: $path"
            }
          }

          Write-Host "Overlay ports: $ports"
          Write-Host "Overlay triplets: $triplets"
          Write-Host "Base ports: $basePorts"

      # ---------------------------------------------------------
      # 13. Clean previous build directory
      # ---------------------------------------------------------
      - name: Prepare build directory
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $build = "Build/release"

          if (Test-Path $build) {
            Remove-Item $build -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $build |
            Out-Null

      # ---------------------------------------------------------
      # 14. Configure Ladybird
      # ---------------------------------------------------------
      - name: Configure Ladybird
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $ninjaPath = (Get-Command ninja.exe -ErrorAction Stop).Source

          $vcpkgToolchain = Join-Path `
            $PWD `
            ".vcpkg-upstream\scripts\buildsystems\vcpkg.cmake"

          $overlayPorts = Join-Path `
            $PWD `
            "Meta\CMake\vcpkg\overlay-ports"

          $overlayTriplets = Join-Path `
            $PWD `
            "Meta\CMake\vcpkg\release-triplets"

          $clang = "C:/LLVM-22.1.8/bin/clang-cl.exe"

          $arguments = @(
            "--preset", "Release",
            "-DCMAKE_C_COMPILER=$clang",
            "-DCMAKE_CXX_COMPILER=$clang",
            "-DCMAKE_MAKE_PROGRAM=$ninjaPath",
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain",
            "-DVCPKG_OVERLAY_PORTS=$overlayPorts",
            "-DVCPKG_OVERLAY_TRIPLETS=$overlayTriplets",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON",
            "-DLADYBIRD_VCPKG_TYPE=release",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          )

          Write-Host "Configuring Ladybird..."
          Write-Host "Compiler: $clang"
          Write-Host "Ninja: $ninjaPath"
          Write-Host "vcpkg: $vcpkgToolchain"

          & cmake @arguments 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\cmake-configure.log"

          $configureExitCode = $LASTEXITCODE

          if ($configureExitCode -ne 0) {
            throw "CMake configure failed: $configureExitCode"
          }

          Write-Host "CMake configure completed."

      # ---------------------------------------------------------
      # 15. Verify CMake selected the correct compiler
      # ---------------------------------------------------------
      - name: Verify CMake compiler
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $cachePath = "Build/release/CMakeCache.txt"

          if (-not (Test-Path $cachePath)) {
            throw "CMakeCache.txt was not generated."
          }

          $cache = Get-Content $cachePath -Raw

          # CMake may write Windows paths with either slash style.
          $expectedCompiler = "C:/LLVM-22.1.8/bin/clang-cl.exe"

          $compilerMatches = [regex]::Matches(
            $cache,
            '(?m)^CMAKE_(?:C|CXX)_COMPILER:[^=]*=(.+)$'
          )

          if ($compilerMatches.Count -lt 2) {
            throw "CMake compiler entries were not found."
          }

          foreach ($match in $compilerMatches) {
            $actualCompiler = $match.Groups[1].Value.Trim().Replace('\', '/')

            Write-Host "Detected compiler: $actualCompiler"

            if (-not $actualCompiler.Equals(
              $expectedCompiler,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Unexpected compiler: $actualCompiler"
            }
          }

          if ($cache -notmatch '(?m)^LADYBIRD_BASELINE_CPU_TARGET:BOOL=ON$' -and
              $cache -notmatch '(?m)^LADYBIRD_BASELINE_CPU_TARGET:UNINITIALIZED=ON$') {
            throw "CPU baseline option is not enabled in CMakeCache."
          }

          Write-Host "Clang compiler verification passed."
          Write-Host "CPU baseline option verification passed."

      # ---------------------------------------------------------
      # 16. Verify x86-64-v2 compile flags
      # ---------------------------------------------------------
      - name: Verify CPU baseline compile flags
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $compileCommands = "Build/release/compile_commands.json"

          if (-not (Test-Path $compileCommands)) {
            throw "compile_commands.json was not generated."
          }

          $commands = Get-Content $compileCommands -Raw |
            ConvertFrom-Json

          $total = 0
          $missing = @()

          foreach ($entry in $commands) {
            $commandText = ""

            if ($entry.command) {
              $commandText = $entry.command
            }
            elseif ($entry.arguments) {
              $commandText = $entry.arguments -join " "
            }

            if ($commandText -match 'clang-cl|clang\+\+') {
              $total++

              if ($commandText -notmatch '-march=x86-64-v2') {
                $missing += $entry.file
              }
            }
          }

          Write-Host "Compiler commands checked: $total"
          Write-Host "Commands missing x86-64-v2: $($missing.Count)"

          if ($total -eq 0) {
            throw "No Clang compile commands found."
          }

          if ($missing.Count -gt 0) {
            $missing | Select-Object -First 30 | ForEach-Object {
              Write-Host "Missing baseline: $_"
            }

            throw "Some compiler commands do not contain x86-64-v2."
          }

          Write-Host "All checked Clang commands use x86-64-v2."

      # ---------------------------------------------------------
      # 17. Build Ladybird
      # ---------------------------------------------------------
      - name: Build Ladybird
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Continue"

          $log = "Build/release-build.log"

          Write-Host "Starting Ladybird build..."
          Write-Host "Build directory: Build/release"

          # Use cmd redirection so the native process exit code
          # is preserved independently of PowerShell's pipeline.
          cmd.exe /d /s /c `
            "cmake --build Build/release --parallel 4 > Build\release-build.log 2>&1"

          $buildExitCode = $LASTEXITCODE

          Write-Host "Build exit code: $buildExitCode"

          if (Test-Path $log) {
            Write-Host "===== BUILD LOG TAIL ====="
            Get-Content $log -Tail 300
          }

          "LADYBIRD_BUILD_EXIT_CODE=$buildExitCode" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($buildExitCode -ne 0) {
            throw "Ladybird build failed with exit code $buildExitCode."
          }

          Write-Host "Ladybird build completed."

      # ---------------------------------------------------------
      # 18. Locate generated executables
      # ---------------------------------------------------------
      - name: Inspect build outputs
        if: always()
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Continue"

          $build = "Build/release"

          if (Test-Path $build) {
            Write-Host "===== Generated EXE files ====="

            Get-ChildItem $build -Recurse -File -Filter "*.exe" |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            Write-Host "===== Generated DLL files ====="

            Get-ChildItem $build -Recurse -File -Filter "*.dll" |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      # ---------------------------------------------------------
      # 19. Verify browser executable exists
      # ---------------------------------------------------------
      - name: Verify browser executable
        if: success()
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $executables = Get-ChildItem `
            "Build/release" `
            -Recurse `
            -File `
            -Filter "*.exe"

          if (-not $executables) {
            throw "No EXE files were generated."
          }

          Write-Host "Generated executable files:"
          $executables | ForEach-Object {
            Write-Host "$($_.FullName) ($($_.Length) bytes)"
          }

          $browserCandidates = $executables | Where-Object {
            $_.Name -match '^(Ladybird|Browser|WebContent|WebWorker).*\.exe$'
          }

          if (-not $browserCandidates) {
            Write-Warning "No obvious browser executable name was found. Inspect the output list."
          }

      # ---------------------------------------------------------
      # 20. Package build directory
      # ---------------------------------------------------------
      - name: Package Windows x64 build
        if: success()
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $source = "Build/release"

          if (-not (Test-Path $source)) {
            throw "Build directory does not exist."
          }

          $packageRoot = Join-Path $PWD "package"
          $packageDir = Join-Path $packageRoot "Ladybird-Windows-x64"

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageDir |
            Out-Null

          Copy-Item "$source\*" $packageDir -Recurse -Force

          $commit = (git rev-parse HEAD).Trim()

          @"
          Ladybird Windows x64 build

          Upstream: https://github.com/LadybirdBrowser/ladybird
          Commit: $commit
          Compiler: LLVM/Clang 22.1.8
          Architecture: x86_64
          CPU baseline: x86-64-v2
          Configuration: Release preset

          Note:
          This archive contains the CMake build directory.
          It has not yet been verified as a portable distribution
          on a clean Windows machine.
          "@ | Out-File `
            -FilePath (Join-Path $packageDir "BUILD-INFO.txt") `
            -Encoding utf8

          $zip = Join-Path $packageRoot "Ladybird-Windows-x64.zip"

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Out-File `
              -FilePath (Join-Path $packageRoot "SHA256SUMS.txt") `
              -Encoding ascii

          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"

      # ---------------------------------------------------------
      # 21. Upload build artifact
      # ---------------------------------------------------------
      - name: Upload Windows x64 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            ladybird/package/Ladybird-Windows-x64.zip
            ladybird/package/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ---------------------------------------------------------
      # 22. Collect diagnostics
      # ---------------------------------------------------------
      - name: Collect diagnostics
        if: always()
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Continue"

          $diagnostics = Join-Path $PWD "diagnostics"

          New-Item -ItemType Directory -Force -Path $diagnostics |
            Out-Null

          $files = @(
            "Build/release/CMakeCache.txt",
            "Build/release/compile_commands.json",
            "Build/release/build.ninja",
            "Build/release-build.log",
            "vcpkg.json",
            ".vcpkg-upstream/vcpkg.json",
            ".vcpkg-upstream/versions/baseline.json"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              $destination = Join-Path $diagnostics `
                ([IO.Path]::GetFileName($file))

              Copy-Item $file $destination -Force
            }
          }

          if (Test-Path ".vcpkg-upstream") {
            git -C ".vcpkg-upstream" rev-parse HEAD |
              Out-File "$diagnostics\vcpkg-commit.txt" -Encoding utf8
          }

          git rev-parse HEAD |
            Out-File "$diagnostics\ladybird-commit.txt" -Encoding utf8

          git status --short |
            Out-File "$diagnostics\ladybird-status.txt" -Encoding utf8

          if (Test-Path "$env:RUNNER_TEMP\cmake-configure.log") {
            Copy-Item `
              "$env:RUNNER_TEMP\cmake-configure.log" `
              "$diagnostics\cmake-configure.log" `
              -Force
          }

          if (Test-Path "$env:RUNNER_TEMP\vcpkg-baseline.txt") {
            Copy-Item `
              "$env:RUNNER_TEMP\vcpkg-baseline.txt" `
              "$diagnostics\vcpkg-baseline.txt" `
              -Force
          }

          Get-ChildItem $diagnostics -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ---------------------------------------------------------
      # 23. Upload diagnostics even when build fails
      # ---------------------------------------------------------
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: |
            ladybird/diagnostics/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      # ---------------------------------------------------------
      # 24. Publish optional GitHub prerelease
      # ---------------------------------------------------------
      - name: Publish GitHub prerelease
        if: success() && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            ladybird/package/Ladybird-Windows-x64.zip
            ladybird/package/SHA256SUMS.txt
