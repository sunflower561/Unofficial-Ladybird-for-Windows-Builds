
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Ladybird source branch"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.cache\vcpkg-downloads

    steps:
      # 1. 获取指定分支源码
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.source_branch }}
          submodules: recursive
          fetch-depth: 0

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 3. 配置 MSVC x64 编译环境
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 安装 LLVM、NASM、pkg-config
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Build tools installation failed"
          }

          $llvm = "C:\Program Files\LLVM\bin"

          if (Test-Path $llvm) {
            Add-Content $env:GITHUB_PATH $llvm
          }

          clang-cl --version
          nasm -v
          cl

      # 5. 安装 CMake、Ninja、aqtinstall
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "pip upgrade failed"
          }

          python -m pip install --upgrade cmake ninja aqtinstall
          if ($LASTEXITCODE -ne 0) {
            throw "Python dependencies installation failed"
          }

          python --version
          cmake --version
          ninja --version
          aqt version

      # 6. 安装 Rust stable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 7. Rust 缓存
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 8. 固定 Qt 版本
      - name: Select Qt version
        id: qt
        shell: pwsh
        run: |
          $version = "6.10.3"

          "version=$version" >> $env:GITHUB_OUTPUT
          "QT_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Selected Qt version: $version"

      # 9. 缓存 Qt
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: windows-qt-6.10.3-msvc2022-x64-v2

      # 10. 安装 Qt 6.10.3
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 `
            -m qtpositioning `
            -O C:\Qt

          if ($LASTEXITCODE -ne 0) {
            throw "Qt 6.10.3 installation failed"
          }

          Write-Host "Qt installation completed"

      # 11. 配置 Qt
      - name: Configure Qt
        shell: pwsh
        run: |
          $qt = "C:\Qt\6.10.3\msvc2022_64"

          if (!(Test-Path $qt)) {
            throw "Qt directory not found: $qt"
          }

          "QT_ROOT=$qt" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qt" >> $env:GITHUB_ENV
          "$qt\bin" >> $env:GITHUB_PATH

          Write-Host "Qt configured: $qt"

      # 12. 缓存 vcpkg
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-downloads
          key: windows-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            windows-vcpkg-

      # 13. 检查编译环境
      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== Compiler ====="
          clang-cl --version
          cl

          Write-Host "===== CMake ====="
          cmake --version

          Write-Host "===== Ninja ====="
          ninja --version

          Write-Host "===== Rust ====="
          rustc --version
          cargo --version

          Write-Host "===== Qt ====="
          qmake --version

          Write-Host "===== aqtinstall ====="
          aqt version

          Write-Host "===== Qt Directory ====="
          Get-ChildItem $env:QT_ROOT

      # 14. 编译 Ladybird
      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $ErrorActionPreference = "Stop"

          $cpu = [Environment]::ProcessorCount

          $memory = [math]::Floor(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          )

          # 根据 CPU 和内存自动计算并行任务
          $jobs = [math]::Min(
            $cpu,
            [math]::Max(1, [math]::Floor($memory / 3))
          )

          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$jobs"
          $env:VCPKG_MAX_CONCURRENCY = "$jobs"

          Write-Host "CPU cores: $cpu"
          Write-Host "Memory: $memory GB"
          Write-Host "Parallel jobs: $jobs"

          Write-Host "===== Start Ladybird Release Build ====="

          py Meta\ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird compilation failed: $LASTEXITCODE"
          }

      # 15. 收集编译产物
      - name: Package Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $env:GITHUB_WORKSPACE "Build\release"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $bin = Join-Path $stage "bin"

          if (!(Test-Path "$build\bin")) {
            throw "Build\release\bin not found"
          }

          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # 复制编译产物
          Copy-Item "$build\bin\*" $bin -Recurse -Force

          # 执行 CMake 安装规则
          $install = Join-Path $env:RUNNER_TEMP "ladybird-install"

          New-Item -ItemType Directory -Force -Path $install | Out-Null

          cmake --install $build --prefix $install

          if ($LASTEXITCODE -eq 0) {
            Copy-Item "$install\*" $stage -Recurse -Force
          } else {
            Write-Warning "CMake install failed; using build output"
          }

          # 收集 vcpkg DLL
          $vcpkgBin = "$build\vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
              Copy-Item -Destination $bin -Force
          }

          # 收集资源目录
          $resourceDirs = @(
            "share",
            "res",
            "resources",
            "Base",
            "UI"
          )

          foreach ($dir in $resourceDirs) {
            $source = Join-Path $build $dir

            if (Test-Path $source) {
              Copy-Item $source $stage -Recurse -Force
            }
          }

          # 部署 Qt 运行库
          $windeployqt = Join-Path $env:QT_ROOT "bin\windeployqt.exe"

          $mainExe = Join-Path $bin "Ladybird.exe"

          if (!(Test-Path $mainExe)) {
            $found = Get-ChildItem $bin -Filter "Ladybird.exe" -Recurse |
              Select-Object -First 1

            if ($found) {
              $mainExe = $found.FullName
            } else {
              throw "Ladybird.exe not found"
            }
          }

          if (!(Test-Path $windeployqt)) {
            throw "windeployqt.exe not found"
          }

          & $windeployqt --release --compiler-runtime --no-translations $mainExe

          if ($LASTEXITCODE -ne 0) {
            throw "Qt deployment failed"
          }

          Write-Host "===== Package Contents ====="

          Get-ChildItem $stage -Recurse -File |
            Select-Object FullName, Length

      # 16. 创建 ZIP
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Ladybird-Windows-x64.zip"

          if (!(Test-Path $stage)) {
            throw "Package directory not found"
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue

          if ($sevenZip) {
            7z a -tzip -mx=1 $zip "$stage\*"

            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip compression failed"
            }
          } else {
            Add-Type -AssemblyName System.IO.Compression
            Add-Type -AssemblyName System.IO.Compression.FileSystem

            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $stage,
              $zip,
              [System.IO.Compression.CompressionLevel]::Fastest,
              $false
            )
          }

          Get-Item $zip | Select-Object Name, Length

      # 17. 上传 ZIP
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: Ladybird-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
