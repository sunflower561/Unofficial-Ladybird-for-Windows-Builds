
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag or commit SHA"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_DISABLE_METRICS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Validate selected upstream ref
        id: source
        shell: pwsh
        env:
          LADYBIRD_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          $ref = $env:LADYBIRD_REF.Trim()

          if ([string]::IsNullOrWhiteSpace($ref)) {
            throw "Please enter a branch, tag or commit SHA."
          }

          "ref=$ref" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Selected Ladybird ref: $ref"

      - name: Checkout Ladybird upstream
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ steps.source.outputs.ref }}
          path: ladybird
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Record source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $commit = (git -C ladybird rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot resolve Ladybird commit."
          }

          $commit | Out-File ladybird-commit.txt

          git -C ladybird status --short |
            Out-File ladybird-status.txt

          Write-Host "Ladybird commit: $commit"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          $installer = "$env:RUNNER_TEMP\LLVM-22.1.8-win64.exe"

          $expectedHash = "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
            throw "LLVM installer SHA256 mismatch."
          }

          $installDir = "C:\LLVM-22.1.8"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed: $($process.ExitCode)"
          }

          if (!(Test-Path "$installDir\bin\clang-cl.exe")) {
            throw "clang-cl.exe not found."
          }

          "$installDir\bin" |
            Out-File $env:GITHUB_PATH -Append

          & "$installDir\bin\clang-cl.exe" --version

      - name: Install Ninja NASM and pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja nasm pkgconfiglite -y --no-progress

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $nasm = (Get-Command nasm.exe -ErrorAction Stop).Source

          "NINJA_PATH=$ninja" |
            Out-File $env:GITHUB_ENV -Append

          "NASM_PATH=$nasm" |
            Out-File $env:GITHUB_ENV -Append

          ninja --version
          nasm -v

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Read vcpkg baseline
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "ladybird\vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "vcpkg builtin-baseline not found."
          }

          "baseline=$baseline" |
            Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Ladybird vcpkg baseline: $baseline"

      - name: Clone vcpkg at Ladybird baseline
        shell: pwsh
        env:
          VCPKG_BASELINE: ${{ steps.vcpkg.outputs.baseline }}
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $root

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed."
          }

          git -C $root checkout --detach $env:VCPKG_BASELINE

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline checkout failed."
          }

          $actual = (git -C $root rev-parse HEAD).Trim()

          if ($actual -ne $env:VCPKG_BASELINE) {
            throw "vcpkg baseline mismatch."
          }

          Write-Host "Local vcpkg commit: $actual"

          "VCPKG_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append

          "VCPKG_INSTALLATION_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append

      - name: Bootstrap local vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"
          $bootstrap = Join-Path $root "bootstrap-vcpkg.bat"

          if (!(Test-Path $bootstrap)) {
            throw "Local vcpkg bootstrap script missing."
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          $exe = Join-Path $root "vcpkg.exe"

          if (!(Test-Path $exe)) {
            throw "Local vcpkg.exe not found."
          }

          & $exe version

      - name: Verify local vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Resolve-Path ".vcpkg-upstream").Path
          $toolchain = Join-Path $root "scripts\buildsystems\vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "Local vcpkg toolchain missing."
          }

          $toolchain = (Resolve-Path $toolchain).Path

          if ($toolchain -match "Microsoft Visual Studio") {
            throw "Invalid Visual Studio vcpkg path."
          }

          $env:VCPKG_ROOT = $root
          $env:VCPKG_INSTALLATION_ROOT = $root

          Write-Host "Local vcpkg root: $root"
          Write-Host "Local vcpkg toolchain: $toolchain"

      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repo = $env:GITHUB_WORKSPACE
          $source = Join-Path $repo "ladybird"
          $build = Join-Path $source "Build\release"

          $vcpkgRoot = (Resolve-Path "$repo\.vcpkg-upstream").Path
          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "Local vcpkg toolchain missing."
          }

          $toolchain = (Resolve-Path $toolchain).Path

          if (Test-Path $build) {
            Remove-Item $build -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $build |
            Out-Null

          $ninja = $env:NINJA_PATH
          $clang = "C:/LLVM-22.1.8/bin/clang-cl.exe"

          if (!(Test-Path $ninja)) {
            throw "Ninja executable missing."
          }

          if (!(Test-Path $clang)) {
            throw "Clang compiler missing."
          }

          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_INSTALLATION_ROOT = $vcpkgRoot

          $args = @(
            "-S", $source,
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_MAKE_PROGRAM=$ninja",
            "-DCMAKE_C_COMPILER=$clang",
            "-DCMAKE_CXX_COMPILER=$clang",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_ROOT=$vcpkgRoot",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DVCPKG_OVERLAY_TRIPLETS=$source/Meta/CMake/vcpkg/release-triplets",
            "-DVCPKG_OVERLAY_PORTS=$source/Meta/CMake/vcpkg/overlay-ports",
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          )

          Write-Host "CMake source: $source"
          Write-Host "CMake build: $build"
          Write-Host "CMake toolchain: $toolchain"

          & cmake @args

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed: $LASTEXITCODE"
          }

      - name: Verify CMake toolchain and CPU baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = "ladybird\Build\release"
          $cacheFile = Join-Path $build "CMakeCache.txt"

          if (!(Test-Path $cacheFile)) {
            throw "CMakeCache.txt missing."
          }

          $cache = Get-Content $cacheFile -Raw

          $root = (Resolve-Path ".vcpkg-upstream").Path.Replace('\', '/')
          $expectedToolchain = "$root/scripts/buildsystems/vcpkg.cmake"

          $toolchainMatch = [regex]::Match(
            $cache,
            '(?m)^CMAKE_TOOLCHAIN_FILE:[^=]*=(.+)$'
          )

          if (!$toolchainMatch.Success) {
            throw "CMAKE_TOOLCHAIN_FILE missing."
          }

          $actualToolchain = $toolchainMatch.Groups[1].Value.Trim().Replace('\', '/')

          if (!$actualToolchain.Equals(
            $expectedToolchain,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Wrong CMake toolchain: $actualToolchain"
          }

          $rootMatch = [regex]::Match(
            $cache,
            '(?m)^Z_VCPKG_ROOT_DIR:[^=]*=(.+)$'
          )

          if (!$rootMatch.Success) {
            throw "Z_VCPKG_ROOT_DIR missing."
          }

          $actualRoot = $rootMatch.Groups[1].Value.Trim().Replace('\', '/')

          if (!$actualRoot.Equals(
            $root,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Wrong vcpkg root: $actualRoot"
          }

          $baselineMatch = [regex]::Match(
            $cache,
            '(?m)^LADYBIRD_BASELINE_CPU_TARGET:[^=]*=(.+)$'
          )

          if (!$baselineMatch.Success -or $baselineMatch.Groups[1].Value.Trim() -ne "ON") {
            throw "CPU baseline option is not ON."
          }

          Write-Host "PASS: Local vcpkg toolchain."
          Write-Host "PASS: Local vcpkg root."
          Write-Host "PASS: CPU baseline."

      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = "ladybird\Build\release"
          $log = Join-Path $build "release-build.log"

          cmd.exe /d /s /c `
            "cmake --build `"$build`" --parallel 4 > `"$log`" 2>&1"

          $code = $LASTEXITCODE

          if ($code -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 250
            }

            throw "Ladybird build failed: $code"
          }

          Write-Host "Ladybird build completed."

      - name: Verify CPU baseline compile commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $file = "ladybird\Build\release\compile_commands.json"

          if (!(Test-Path $file)) {
            throw "compile_commands.json missing."
          }

          $commands = Get-Content $file -Raw | ConvertFrom-Json

          $clangCommands = @(
            $commands | Where-Object {
              $text = $_.command

              if (!$text -and $_.arguments) {
                $text = $_.arguments -join " "
              }

              $text -match "clang-cl|clang\+\+"
            }
          )

          if ($clangCommands.Count -eq 0) {
            throw "No Clang compile commands found."
          }

          $missing = @(
            $clangCommands | Where-Object {
              $text = $_.command

              if (!$text -and $_.arguments) {
                $text = $_.arguments -join " "
              }

              $text -notmatch "(^|\s)-march=x86-64-v2(\s|$)"
            }
          )

          if ($missing.Count -gt 0) {
            throw "$($missing.Count) Clang commands missing x86-64-v2."
          }

          $bad = @(
            $clangCommands | Where-Object {
              $text = $_.command

              if (!$text -and $_.arguments) {
                $text = $_.arguments -join " "
              }

              $text -match "-mavx2|-mavx|-march=native|/arch:"
            }
          )

          if ($bad.Count -gt 0) {
            throw "$($bad.Count) Clang commands contain unsupported CPU flags."
          }

          Write-Host "Verified $($clangCommands.Count) Clang compile commands."

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics |
            Out-Null

          $files = @(
            "ladybird\Build\release\CMakeCache.txt",
            "ladybird\Build\release\compile_commands.json",
            "ladybird\Build\release\release-build.log",
            "ladybird\Build\release\vcpkg-manifest-install.log",
            "ladybird-commit.txt",
            "ladybird-status.txt"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item $file diagnostics -Force
            }
          }

          if (Test-Path ".vcpkg-upstream\.git") {
            git -C .vcpkg-upstream rev-parse HEAD |
              Out-File diagnostics\vcpkg-commit.txt
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-diagnostics
          path: diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Package build directory
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = "ladybird\Build\release"

          if (!(Test-Path $build)) {
            throw "Build directory missing."
          }

          $zip = "Ladybird-Windows-x64-build.zip"

          Compress-Archive `
            -Path "$build\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  $zip" |
            Out-File "SHA256SUMS.txt" -Encoding ascii

          Write-Host "SHA256: $hash"

      - name: Upload Windows ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            Ladybird-Windows-x64-build.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          files: |
            Ladybird-Windows-x64-build.zip
            SHA256SUMS.txt
