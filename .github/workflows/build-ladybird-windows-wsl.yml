
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "Publish a GitHub prerelease"
        required: true
        default: false
        type: boolean

      clean_build:
        description: "Clean build directory before building"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CARGO_BUILD_JOBS: "4"

    steps:
      # --------------------------------------------------
      # 1. Checkout upstream Ladybird
      # --------------------------------------------------

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Record upstream revision
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $short = $sha.Substring(0, 12)

          "UPSTREAM_SHA=$sha" >> $env:GITHUB_ENV
          "UPSTREAM_SHORT=$short" >> $env:GITHUB_ENV

          Write-Host "Upstream SHA: $sha"

      # --------------------------------------------------
      # 2. Setup build environment
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # --------------------------------------------------
      # 3. Install LLVM, Ninja and dependencies
      # --------------------------------------------------

      - name: Install build tools
        shell: pwsh
        run: |
          choco install llvm ninja nasm pkgconfiglite 7zip -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey tool installation failed"
          }

          # Locate LLVM
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue

          if (!$clang) {
            $llvmCandidates = @(
              "C:\Program Files\LLVM\bin",
              "C:\ProgramData\chocolatey\bin"
            )

            foreach ($dir in $llvmCandidates) {
              if (Test-Path "$dir\clang-cl.exe") {
                $dir | Out-File -FilePath $env:GITHUB_PATH -Append
                $clang = Get-Item "$dir\clang-cl.exe"
                break
              }
            }
          }

          if (!$clang) {
            throw "clang-cl.exe not found"
          }

          # Locate Ninja
          $ninja = Get-Command ninja.exe -ErrorAction SilentlyContinue

          if (!$ninja) {
            $ninjaCandidates = @(
              "C:\ProgramData\chocolatey\bin",
              "C:\Program Files\Ninja"
            )

            foreach ($dir in $ninjaCandidates) {
              if (Test-Path "$dir\ninja.exe") {
                $dir | Out-File -FilePath $env:GITHUB_PATH -Append
                $ninja = Get-Item "$dir\ninja.exe"
                break
              }
            }
          }

          if (!$ninja) {
            throw "ninja.exe not found"
          }

          # Add tool directories to PATH for subsequent steps
          $clangDir = Split-Path $clang.Source
          $ninjaDir = Split-Path $ninja.Source

          $clangDir | Out-File -FilePath $env:GITHUB_PATH -Append
          $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Append

          Write-Host "clang-cl: $($clang.Source)"
          Write-Host "Ninja: $($ninja.Source)"

          clang-cl --version
          ninja --version
          nasm -v
          cmake --version
          rustc --version
          cargo --version

          python -m pip install --upgrade pip
          python -m pip install cmake

      # --------------------------------------------------
      # 4. Verify toolchain
      # --------------------------------------------------

      - name: Verify compiler and build tool
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction Stop
          $ninja = Get-Command ninja.exe -ErrorAction Stop

          Write-Host "Compiler: $($clang.Source)"
          Write-Host "Build tool: $($ninja.Source)"

          clang-cl --version
          ninja --version

          if ($LASTEXITCODE -ne 0) {
            throw "Toolchain verification failed"
          }

      # --------------------------------------------------
      # 5. Restore vcpkg cache
      # --------------------------------------------------

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: ladybird-vcpkg-windows-x64-v2-clangcl-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-vcpkg-windows-x64-v2-clangcl-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Configure vcpkg cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".cache/vcpkg" | Out-Null

          $cachePath = Join-Path $pwd ".cache/vcpkg"

          "VCPKG_DEFAULT_BINARY_CACHE=$cachePath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      # --------------------------------------------------
      # 6. Clean old build
      # --------------------------------------------------

      - name: Clean previous build
        if: inputs.clean_build
        shell: pwsh
        run: |
          Remove-Item "Build/release" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Previous build directory cleaned."

      # --------------------------------------------------
      # 7. Inspect upstream build script
      # --------------------------------------------------

      - name: Inspect Ladybird build script
        shell: pwsh
        run: |
          if (!(Test-Path "Meta/ladybird.py")) {
            throw "Meta/ladybird.py not found"
          }

          Write-Host "Ladybird build script:"
          Select-String `
            -Path "Meta/ladybird.py" `
            -Pattern "cmake|Build/release|preset" `
            -Context 1,1

      # --------------------------------------------------
      # 8. Configure CMake with portable CPU baseline
      # --------------------------------------------------

      - name: Configure Release with x86-64-v2 baseline
        shell: pwsh
        run: |
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $clang = (Get-Command clang-cl.exe -ErrorAction Stop).Source

          Write-Host "Using Ninja: $ninja"
          Write-Host "Using Clang: $clang"

          $env:CC = $clang
          $env:CXX = $clang

          cmake --preset Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            -DENABLE_CI_BASELINE_CPU=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

          if (!(Test-Path "Build/release/CMakeCache.txt")) {
            throw "CMakeCache.txt was not generated"
          }

          $cache = Get-Content "Build/release/CMakeCache.txt" -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "ENABLE_CI_BASELINE_CPU is not ON"
          }

          if ($cache -notmatch 'CMAKE_MAKE_PROGRAM:FILEPATH=') {
            throw "CMAKE_MAKE_PROGRAM is not configured"
          }

          Write-Host "CMake configured with portable CPU baseline."

      # --------------------------------------------------
      # 9. Build Ladybird
      # --------------------------------------------------

      - name: Build Ladybird
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $ninja = Get-Command ninja.exe -ErrorAction Stop
          $clang = Get-Command clang-cl.exe -ErrorAction Stop

          Write-Host "Ninja: $($ninja.Source)"
          Write-Host "Clang: $($clang.Source)"

          py Meta/ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      # --------------------------------------------------
      # 10. Verify CPU baseline after build
      # --------------------------------------------------

      - name: Verify CPU baseline
        shell: pwsh
        run: |
          $cacheFile = "Build/release/CMakeCache.txt"

          if (!(Test-Path $cacheFile)) {
            throw "CMakeCache.txt missing after build"
          }

          $cache = Get-Content $cacheFile -Raw

          if ($cache -notmatch 'ENABLE_CI_BASELINE_CPU:BOOL=ON') {
            throw "Portable CPU baseline was disabled during build"
          }

          if ($cache -notmatch 'CMAKE_MAKE_PROGRAM:FILEPATH=') {
            throw "CMake build program is missing"
          }

          Write-Host "CPU baseline cache check passed."

          if (Test-Path "Build/release/compile_commands.json") {
            $commands = Get-Content "Build/release/compile_commands.json" -Raw

            $badFlags = @(
              "-march=native",
              "-mavx2",
              "-mavx512",
              "/arch:AVX2",
              "/arch:AVX512"
            )

            foreach ($flag in $badFlags) {
              if ($commands.Contains($flag)) {
                throw "Potential non-portable compiler flag detected: $flag"
              }
            }

            Write-Host "Compile command scan passed."
          }
          else {
            Write-Warning "compile_commands.json unavailable; compiler flag scan skipped."
          }

      # --------------------------------------------------
      # 11. Install Ladybird
      # --------------------------------------------------

      - name: Install Ladybird
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null

          cmake --install Build/release --prefix "$pwd/dist/Ladybird"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake installation failed"
          }

          if (!(Test-Path "dist/Ladybird")) {
            throw "Install directory was not created"
          }

      # --------------------------------------------------
      # 12. Bundle runtime DLLs and Qt plugins
      # --------------------------------------------------

      - name: Bundle runtime dependencies
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"
          $bin = Join-Path $root "bin"

          New-Item -ItemType Directory -Force $bin | Out-Null

          # Locate vcpkg runtime DLL directory
          $vcpkgBin = Get-ChildItem `
            -Path "Build/release" `
            -Directory `
            -Recurse `
            -Filter "bin" |
            Where-Object {
              $_.FullName -match 'installed[/\\]x64-windows[/\\]bin$'
            } |
            Select-Object -First 1

          if ($vcpkgBin) {
            Write-Host "vcpkg DLL directory: $($vcpkgBin.FullName)"

            Get-ChildItem $vcpkgBin.FullName -Filter "*.dll" |
              Copy-Item -Destination $bin -Force
          }
          else {
            Write-Warning "vcpkg runtime DLL directory not found."
          }

          # Locate Qt runtime
          $qtCore = Get-ChildItem `
            -Path "Build/release" `
            -Filter "Qt6Core.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($qtCore) {
            $qtBin = $qtCore.Directory.FullName

            Write-Host "Qt runtime directory: $qtBin"

            Get-ChildItem $qtBin -Filter "*.dll" |
              Copy-Item -Destination $bin -Force

            $qtPlugins = Join-Path $qtBin "..\plugins"

            if (Test-Path $qtPlugins) {
              Copy-Item `
                -Path $qtPlugins `
                -Destination "$root\plugins" `
                -Recurse `
                -Force
            }
            else {
              Write-Warning "Qt plugins directory not found."
            }
          }
          else {
            Write-Warning "Qt6Core.dll not found."
          }

          # Copy helper executables
          Get-ChildItem `
            -Path "Build/release" `
            -Filter "*.exe" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -match '[/\\](bin|libexec)[/\\]'
            } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $bin -Force
            }

      # --------------------------------------------------
      # 13. Validate installed package
      # --------------------------------------------------

      - name: Validate package
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          if (!(Test-Path $root)) {
            throw "Package directory missing"
          }

          $exe = Get-ChildItem `
            -Path $root `
            -Filter "Ladybird.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found"
          }

          Write-Host "Main executable: $($exe.FullName)"

          $requiredDlls = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Network.dll"
          )

          foreach ($dll in $requiredDlls) {
            if (!(Test-Path (Join-Path $root "bin\$dll"))) {
              Write-Warning "Potentially missing runtime DLL: $dll"
            }
          }

          $dllCount = (Get-ChildItem $root -Filter "*.dll" -File -Recurse).Count

          Write-Host "Bundled DLL count: $dllCount"

      # --------------------------------------------------
      # 14. Remove development artifacts
      # --------------------------------------------------

      - name: Remove development artifacts
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in @(
                ".pdb",
                ".ilk",
                ".obj",
                ".exp",
                ".lib"
              )
            } |
            Remove-Item -Force

          Write-Host "Development artifacts removed."

      # --------------------------------------------------
      # 15. Create portable ZIP
      # --------------------------------------------------

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = "$pwd/dist/Ladybird"
          $zipName = "Ladybird-Windows-x64-x86-64-v2.zip"

          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive `
            -Path "$root\*" `
            -DestinationPath $zipName `
            -CompressionLevel Optimal

          if (!(Test-Path $zipName)) {
            throw "ZIP creation failed"
          }

          $size = (Get-Item $zipName).Length / 1MB

          Write-Host "ZIP size: $([math]::Round($size, 2)) MB"

          "PACKAGE_ZIP=$zipName" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 16. Verify ZIP
      # --------------------------------------------------

      - name: Verify ZIP contents
        shell: pwsh
        run: |
          $zip = $env:PACKAGE_ZIP

          tar -tf $zip | Out-File zip-list.txt

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity check failed"
          }

          $entries = Get-Content zip-list.txt

          if (!($entries -match 'Ladybird\.exe$')) {
            throw "Ladybird.exe missing from ZIP"
          }

          if (!($entries -match 'Qt6Core\.dll$')) {
            Write-Warning "Qt6Core.dll not found in ZIP listing."
          }

          Write-Host "ZIP verification completed."

      # --------------------------------------------------
      # 17. Generate release notes
      # --------------------------------------------------

      - name: Generate release notes
        shell: pwsh
        run: |
          $notes = @"
          # Ladybird Windows x64

          Upstream revision: $env:UPSTREAM_SHA

          ## CPU compatibility target

          - Target: x86-64-v2
          - Requires SSE4.2 and POPCNT
          - AVX is not a baseline requirement
          - AVX2 is not a baseline requirement
          - AVX-512 is not a baseline requirement

          ## Package

          - Windows x64
          - Portable ZIP
          - Release build
          - Based on upstream Ladybird

          ## Important

          This is an experimental third-party native Windows build.

          Windows native Clang-CL support is still experimental upstream.

          The CPU baseline setting does not independently prove that every
          third-party dependency or bundled binary follows the same baseline.

          Please report startup failures with your CPU model and Windows version.
          "@

          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      # --------------------------------------------------
      # 18. Upload artifact
      # --------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-x86-64-v2
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 19. Publish GitHub prerelease
      # --------------------------------------------------

      - name: Publish GitHub prerelease
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          files: ${{ env.PACKAGE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
