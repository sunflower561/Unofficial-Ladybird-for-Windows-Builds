```yaml
name: Build Ladybird Windows x64

# ================================================================
# 只允许手动启动
# 不会 push 自动编译
# 不会 pull_request 自动编译
# ================================================================
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird 分支 / Tag / Commit"
        required: true
        default: "master"
        type: string

      publish_release:
        description: "发布到 GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Windows x64

    runs-on: windows-latest

    timeout-minutes: 300

    steps:

      # ============================================================
      # 1. 获取 Ladybird 源码
      # ============================================================
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Show source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "Ladybird Windows x64 Build"
          Write-Host "================================================"

          Write-Host "Requested ref:"
          Write-Host "${{ inputs.ref }}"

          Write-Host ""
          Write-Host "Actual commit:"
          git log -1 --oneline

          Write-Host ""
          Write-Host "Repository:"
          git remote -v

          Write-Host "================================================"


      # ============================================================
      # 2. Python
      #
      # Ladybird 官方使用 ladybird.py
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip


      # ============================================================
      # 3. Visual Studio / MSVC
      #
      # Windows runner 自带 VS。
      # 使用官方推荐的 VS command environment。
      # ============================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # 4. CMake
      #
      # 官方要求 >= 3.30
      # 使用最新可用 CMake。
      # ============================================================
      - name: Setup latest CMake
        uses: lukka/get-cmake@latest


      # ============================================================
      # 5. Ninja
      #
      # 使用 Chocolatey。
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue

          if (-not $ninja) {
            throw "Ninja was not found after installation"
          }

          Write-Host "Ninja:"
          ninja --version


      # ============================================================
      # 6. pkg-config
      #
      # Ladybird 官方 Windows Clang-CL 文档明确要求：
      #
      # choco install pkgconfiglite -y
      # ============================================================
      - name: Install pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install pkgconfiglite -y --no-progress

          $pkg = Get-Command pkg-config -ErrorAction SilentlyContinue

          if (-not $pkg) {
            $pkg = Get-Command pkgconf -ErrorAction SilentlyContinue
          }

          if (-not $pkg) {
            throw "pkg-config was not found"
          }

          Write-Host "pkg-config:"
          pkg-config --version


      # ============================================================
      # 7. Rust
      #
      # 官方要求 Rust toolchain。
      #
      # 不使用不存在的：
      # rust-lang/rust-toolchain
      #
      # 直接使用官方 rustup-init。
      # ============================================================
      - name: Install Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rustup = "$env:USERPROFILE\.cargo\bin\rustup.exe"

          if (-not (Test-Path $rustup)) {

            Write-Host "Installing Rustup..."

            Invoke-WebRequest `
              -Uri "https://win.rustup.rs/x86_64" `
              -OutFile "$env:RUNNER_TEMP\rustup-init.exe"

            & "$env:RUNNER_TEMP\rustup-init.exe" `
              -y `
              --default-toolchain stable `
              --profile minimal
          }

          $cargoBin = "$env:USERPROFILE\.cargo\bin"

          if ($env:GITHUB_PATH -and (Test-Path $cargoBin)) {
            $cargoBin | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append
          }

          $env:PATH = "$cargoBin;$env:PATH"

          rustc --version
          cargo --version
          rustup --version


      # ============================================================
      # 8. 工具链检查
      # ============================================================
      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "================ TOOLCHAIN ================"

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version

          Write-Host ""
          Write-Host "Clang:"
          clang-cl --version

          Write-Host ""
          Write-Host "MSVC:"
          cl.exe

          Write-Host ""
          Write-Host "Rust:"
          rustc --version
          cargo --version

          Write-Host ""
          Write-Host "pkg-config:"
          pkg-config --version

          Write-Host ""
          Write-Host "==========================================="


      # ============================================================
      # 9. vcpkg binary cache
      #
      # 非常重要：
      # 先创建目录，再把环境变量传给 CMake。
      #
      # 避免你之前遇到：
      #
      # VCPKG_DEFAULT_BINARY_CACHE must be a directory
      # ============================================================
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: .cache\vcpkg
          key: |
            ladybird-vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'Meta/CMake/vcpkg/**') }}
          restore-keys: |
            ladybird-vcpkg-windows-x64-


      # ============================================================
      # 10. ccache cache
      # ============================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .cache\ccache
          key: |
            ladybird-ccache-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ladybird-ccache-windows-


      # ============================================================
      # 11. 创建缓存目录
      # ============================================================
      - name: Prepare build cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".cache\vcpkg" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".cache\ccache" |
            Out-Null

          Write-Host ""
          Write-Host "vcpkg cache:"
          Write-Host "$PWD\.cache\vcpkg"

          Write-Host ""
          Write-Host "ccache:"
          Write-Host "$PWD\.cache\ccache"


      # ============================================================
      # 12. 设置环境变量
      #
      # 写入 GITHUB_ENV，保证后续所有 step 都能看到。
      # ============================================================
      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgCache = "$env:GITHUB_WORKSPACE\.cache\vcpkg"
          $ccacheDir = "$env:GITHUB_WORKSPACE\.cache\ccache"

          "VCPKG_DEFAULT_BINARY_CACHE=$vcpkgCache" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "CCACHE_DIR=$ccacheDir" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "VCPKG_MAX_CONCURRENCY=4" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "CMAKE_BUILD_PARALLEL_LEVEL=4" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          # 防止 CMake / vcpkg 因为 PATH 没刷新而找不到工具。
          $cargoBin = "$env:USERPROFILE\.cargo\bin"

          if (Test-Path $cargoBin) {
            $cargoBin | Out-File `
              $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append
          }

          Write-Host "VCPKG_DEFAULT_BINARY_CACHE=$vcpkgCache"
          Write-Host "CCACHE_DIR=$ccacheDir"


      # ============================================================
      # 13. 清理旧的构建目录
      #
      # 不删除 vcpkg binary cache。
      # 这样重新选择 branch 时仍然可以复用依赖。
      # ============================================================
      - name: Prepare clean build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            -Recurse `
            -Force `
            "Build\release" `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -Recurse `
            -Force `
            "dist" `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -Force `
            "Ladybird-Windows-x64.zip" `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            "dist" |
            Out-Null


      # ============================================================
      # 14. 构建 Ladybird
      #
      # 官方 Windows Clang-CL 文档：
      #
      # py Meta\ladybird.py build
      #
      # 使用 Release preset。
      # ============================================================
      - name: Build Ladybird
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
          CCACHE_DIR: ${{ github.workspace }}\.cache\ccache
          VCPKG_MAX_CONCURRENCY: "4"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "START LADYBIRD BUILD"
          Write-Host "================================================"

          Write-Host "Compiler:"
          clang-cl --version

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Running official build script..."

          py Meta\ladybird.py build

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird compilation failed: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Ladybird compilation completed."


      # ============================================================
      # 15. 检查原始 Windows 二进制
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = "$env:GITHUB_WORKSPACE\Build\release"

          if (-not (Test-Path $build)) {
            throw "Build/release does not exist"
          }

          Write-Host "Build directory:"
          Write-Host $build

          Write-Host ""
          Write-Host "Ladybird executable candidates:"

          Get-ChildItem `
            $build `
            -Recurse `
            -Filter "Ladybird.exe" |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $ladybird = Get-ChildItem `
            $build `
            -Recurse `
            -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (-not $ladybird) {
            throw "Ladybird.exe was not produced"
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $ladybird.FullName


      # ============================================================
      # 16. 官方 CMake InstallRules
      #
      # 绝对不要：
      #
      # Copy-Item Build\release\bin\*
      #
      # 然后自己猜哪些 DLL 可以删除。
      #
      # 官方文档明确说明：
      #
      # UI/cmake/InstallRules.cmake
      #
      # 定义发行时应该安装哪些文件。
      # ============================================================
      - name: Install Ladybird runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = "$env:GITHUB_WORKSPACE\Build\release"
          $prefix = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          if (Test-Path $prefix) {
            Remove-Item `
              -Recurse `
              -Force `
              $prefix
          }

          New-Item `
            -ItemType Directory `
            -Force `
            $prefix |
            Out-Null

          Write-Host ""
          Write-Host "================================================"
          Write-Host "CMAKE INSTALL"
          Write-Host "================================================"

          cmake `
            --install "$build" `
            --prefix "$prefix"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake install failed: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Install completed."


      # ============================================================
      # 17. 如果官方 install tree 没有 Ladybird.exe
      #     直接失败，不生成坏 ZIP。
      # ============================================================
      - name: Validate install tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          $ladybird = Get-ChildItem `
            $prefix `
            -Recurse `
            -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (-not $ladybird) {
            Write-Host ""
            Write-Host "Install tree:"
            Get-ChildItem `
              $prefix `
              -Recurse |
              Select-Object FullName |
              Format-Table -AutoSize

            throw "Ladybird.exe was not installed"
          }

          Write-Host ""
          Write-Host "Installed executable:"
          Write-Host $ladybird.FullName


      # ============================================================
      # 18. 发布包清理
      #
      # 只删除明确的开发文件。
      #
      # 不删除：
      # DLL
      # EXE
      # Qt plugins
      # resources
      # fonts
      # pdfjs
      # translations
      #
      # 防止再次出现 0xc0000142。
      # ============================================================
      - name: Remove debug symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "*.pdb" |
            Remove-Item -Force

          Write-Host "PDB files removed."


      # ============================================================
      # 19. 不删除 DLL / EXE
      #
      # 这里只检查发布目录。
      # ============================================================
      - name: Inspect runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          Write-Host ""
          Write-Host "================ RUNTIME ================"

          Write-Host ""
          Write-Host "EXE:"
          Get-ChildItem `
            $root `
            -Recurse `
            -Filter "*.exe" |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "DLL count:"

          $dlls = Get-ChildItem `
            $root `
            -Recurse `
            -Filter "*.dll"

          Write-Host $dlls.Count

          Write-Host ""
          Write-Host "PDB remaining:"

          $pdb = Get-ChildItem `
            $root `
            -Recurse `
            -Filter "*.pdb" `
            -ErrorAction SilentlyContinue

          if ($pdb) {
            throw "PDB files still exist"
          }

          Write-Host "0"

          Write-Host ""
          Write-Host "=========================================="


      # ============================================================
      # 20. Windows 运行测试
      #
      # 先尝试启动真正安装后的 Ladybird。
      #
      # 不使用 --no-build。
      # 不重新编译。
      # ============================================================
      - name: Smoke test Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          $ladybird = Get-ChildItem `
            $root `
            -Recurse `
            -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (-not $ladybird) {
            throw "Ladybird.exe not found"
          }

          Write-Host ""
          Write-Host "Starting:"
          Write-Host $ladybird.FullName

          $process = Start-Process `
            -FilePath $ladybird.FullName `
            -WorkingDirectory $ladybird.DirectoryName `
            -PassThru

          Start-Sleep -Seconds 12

          if ($process.HasExited) {

            Write-Host ""
            Write-Host "Ladybird exited during smoke test."

            Write-Host "Exit code:"
            Write-Host $process.ExitCode

            throw "Ladybird failed to start"
          }

          Write-Host ""
          Write-Host "Ladybird started successfully."

          Stop-Process `
            -Id $process.Id `
            -Force `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 21. 最终包大小
      # ============================================================
      - name: Calculate package size
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\dist\Ladybird"

          $files = Get-ChildItem `
            $root `
            -Recurse `
            -File

          $bytes = (
            $files |
            Measure-Object Length -Sum
          ).Sum

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Ladybird runtime"
          Write-Host "=========================================="

          Write-Host (
            "Files: {0}" -f $files.Count
          )

          Write-Host (
            "Size: {0:N2} MB" -f ($bytes / 1MB)
          )

          Write-Host "=========================================="


      # ============================================================
      # 22. ZIP
      #
      # ZIP 里面直接是：
      #
      # Ladybird.exe
      # DLL
      # resources
      # ...
      #
      # 解压后直接运行。
      # ============================================================
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "$env:GITHUB_WORKSPACE\dist\Ladybird"
          $zip = "$env:GITHUB_WORKSPACE\Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item `
              -Force `
              $zip
          }

          Compress-Archive `
            -Path "$root\*" `
            -DestinationPath "$zip" `
            -CompressionLevel Optimal

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL ZIP"
          Write-Host "=========================================="

          Write-Host "File:"
          Write-Host $info.FullName

          Write-Host (
            "Size: {0:N2} MB" -f
            ($info.Length / 1MB)
          )

          Write-Host "=========================================="


      # ============================================================
      # 23. GitHub Actions Artifact
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: Ladybird-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


      # ============================================================
      # 24. GitHub Release
      #
      # 只有手动 Run workflow 时才会运行。
      # ============================================================
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "windows-${{ inputs.ref }}-${{ github.run_number }}"
          name: "Ladybird Windows x64 - ${{ inputs.ref }} #${{ github.run_number }}"

          prerelease: true
          draft: false
          generate_release_notes: false

          body: |
            # Ladybird Windows x64

            Unofficial Windows build.

            Source:
            ${{ inputs.ref }}

            Commit:
            ${{ github.sha }}

            Toolchain:
            - Windows x64
            - Clang-CL
            - MSVC
            - CMake
            - Ninja
            - vcpkg
            - Rust

            Packaging:
            - CMake install rules
            - Debug symbols removed
            - Runtime DLLs retained
            - Resources retained

          files: |
            Ladybird-Windows-x64.zip
```
