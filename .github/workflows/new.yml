name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird 源代码分支 / Tag / Commit"
        required: true
        default: "release/2026.47"
        type: string
      publish_release:
        description: "构建完成后发布 GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      PACKAGE_NAME: Ladybird-Windows-x64

    steps:
      # --------------------------------------------------
      # 1. 检出 Ladybird
      # --------------------------------------------------
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          path: ladybird

      # --------------------------------------------------
      # 2. 输出源码版本信息
      # --------------------------------------------------
      - name: Record source revision
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $commit = (git rev-parse HEAD).Trim()
          $short = (git rev-parse --short HEAD).Trim()

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine source commit."
          }

          "LADYBIRD_COMMIT=$commit" >> $env:GITHUB_ENV
          "LADYBIRD_SHORT_COMMIT=$short" >> $env:GITHUB_ENV

          Write-Host "Requested ref: ${{ inputs.ref }}"
          Write-Host "Resolved commit: $commit"
          git log -1 --oneline

      # --------------------------------------------------
      # 3. 安装 Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # --------------------------------------------------
      # 4. 初始化 MSVC x64 环境
      # --------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # 5. 安装 LLVM / Ninja / NASM / pkg-config
      # LLVM 固定版本，避免 Chocolatey 默认版本漂移
      # --------------------------------------------------
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm --version=23.1.3 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM 23.1.3 installation failed."
          }

          choco install ninja nasm pkgconfiglite -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Build tools installation failed."
          }

          python -m pip install --upgrade pip cmake

          if ($LASTEXITCODE -ne 0) {
            throw "Python build tools installation failed."
          }

      # --------------------------------------------------
      # 6. 安装 Rust
      # --------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # --------------------------------------------------
      # 7. 验证工具链
      # --------------------------------------------------
      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Python ==="
          python --version

          Write-Host "=== CMake ==="
          cmake --version

          Write-Host "=== Ninja ==="
          ninja --version

          Write-Host "=== Rust ==="
          rustc --version
          cargo --version

          Write-Host "=== MSVC ==="
          cl.exe

          Write-Host "=== LLVM ==="
          $clang = (Get-Command clang-cl.exe -ErrorAction Stop).Source
          Write-Host "clang-cl path: $clang"
          clang-cl --version

          "LLVM_CLANG_CL=$clang" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 8. 检查 MSVC STL 与 Clang 兼容性
      # 不扫描所有条件分支并取最大值，避免误判
      # --------------------------------------------------
      - name: Verify MSVC STL compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $header = Join-Path $env:VCToolsInstallDir "include\yvals_core.h"

          if (!(Test-Path $header)) {
            throw "MSVC STL header not found: $header"
          }

          $content = Get-Content $header -Raw

          $stlVersion = "unknown"
          $stlUpdate = "unknown"

          if ($content -match '#define\s+_MSVC_STL_VERSION\s+(\d+)') {
            $stlVersion = $Matches[1]
          }

          if ($content -match '#define\s+_MSVC_STL_UPDATE\s+(\d+)') {
            $stlUpdate = $Matches[1]
          }

          $clangPath = $env:LLVM_CLANG_CL

          if (!(Test-Path $clangPath)) {
            throw "clang-cl not found: $clangPath"
          }

          $clangOutput = & $clangPath --version 2>&1 | Out-String

          if ($clangOutput -notmatch 'clang version\s+(\d+)') {
            throw "Unable to detect Clang major version."
          }

          $clangMajor = [int]$Matches[1]

          Write-Host "MSVC STL version: $stlVersion"
          Write-Host "MSVC STL update: $stlUpdate"
          Write-Host "Clang major: $clangMajor"

          if ($clangMajor -lt 22) {
            throw "Clang $clangMajor is too old for the detected MSVC STL. Clang 22 or newer is required."
          }

          # 使用实际 C++ 编译测试验证编译器和 STL 头文件
          $probe = Join-Path $env:RUNNER_TEMP "stl-probe.cpp"
          $output = Join-Path $env:RUNNER_TEMP "stl-probe.exe"

          @'
          #include <version>
          #include <string>
          #include <vector>
          #include <format>
          int main() {
              std::vector<int> v{1, 2, 3};
              std::string s = std::format("{}", v.size());
              return s.empty();
          }
          '@ | Set-Content -Encoding ascii $probe

          & $clangPath /nologo /std:c++latest /EHsc $probe "/Fe:$output"

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC STL C++ compile probe failed."
          }

          Write-Host "MSVC STL compile probe passed."

      # --------------------------------------------------
      # 9. 检查 Windows x64 编译环境
      # --------------------------------------------------
      - name: Verify target architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:VSCMD_ARG_TGT_ARCH -ne "x64") {
            throw "MSVC environment is not targeting x64."
          }

          $clang = $env:LLVM_CLANG_CL

          $target = & $clang -dumpmachine
          Write-Host "Clang target: $target"

          if ($target -notmatch "x86_64.*windows") {
            throw "Unexpected Clang target: $target"
          }

      # --------------------------------------------------
      # 10. 获取 vcpkg baseline
      # --------------------------------------------------
      - name: Resolve vcpkg baseline
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json

          if (!$manifest.'builtin-baseline') {
            throw "builtin-baseline not found in vcpkg.json."
          }

          $baseline = $manifest.'builtin-baseline'

          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid vcpkg baseline: $baseline"
          }

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

          Write-Host "vcpkg baseline: $baseline"

      # --------------------------------------------------
      # 11. 准备缓存目录
      # --------------------------------------------------
      - name: Prepare cache directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force ".cache\vcpkg" | Out-Null
          New-Item -ItemType Directory -Force ".cache\ccache" | Out-Null

      # --------------------------------------------------
      # 12. 缓存 vcpkg
      # --------------------------------------------------
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: windows-vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('ladybird/vcpkg.json') }}
          restore-keys: |
            windows-vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      # --------------------------------------------------
      # 13. 缓存 ccache
      # --------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: windows-ccache-${{ runner.os }}-${{ hashFiles('ladybird/**/CMakeLists.txt', 'ladybird/vcpkg.json') }}
          restore-keys: |
            windows-ccache-${{ runner.os }}-

      # --------------------------------------------------
      # 14. 清理构建目录
      # --------------------------------------------------
      - name: Clean previous build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item -Recurse -Force "ladybird\Build\release" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:PACKAGE_NAME.zip" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:PACKAGE_NAME.sha256" -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force "dist" | Out-Null

      # --------------------------------------------------
      # 15. 配置 CMake
      # --------------------------------------------------
      - name: Configure Ladybird
        shell: pwsh
        working-directory: ladybird
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
          CCACHE_DIR: ${{ github.workspace }}\.cache\ccache
        run: |
          $ErrorActionPreference = "Stop"

          $clang = $env:LLVM_CLANG_CL

          if (!(Test-Path $clang)) {
            throw "clang-cl executable missing."
          }

          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            throw "vcpkg toolchain file not found: $toolchain"
          }

          cmake -S . -B Build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER:FILEPATH="$clang" `
            -DCMAKE_CXX_COMPILER:FILEPATH="$clang" `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=ON `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== CMake configure failed ==="

            $angleLogs = Get-ChildItem Build -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "ANGLE|angle" -and
                $_.Extension -in ".log", ".txt"
              }

            foreach ($log in $angleLogs) {
              Write-Host "===== $($log.FullName) ====="
              Get-Content $log.FullName -Tail 200
            }

            throw "CMake configure failed."
          }

      # --------------------------------------------------
      # 16. 检查 CMake 配置结果
      # --------------------------------------------------
      - name: Verify CMake configuration
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Get-Content "Build\release\CMakeCache.txt" -Raw

          foreach ($entry in @(
            "CMAKE_BUILD_TYPE:STRING=Release",
            "VCPKG_TARGET_TRIPLET=x64-windows",
            "LADYBIRD_BASELINE_CPU_TARGET:BOOL=ON"
          )) {
            if ($cache -notmatch [regex]::Escape($entry)) {
              Write-Warning "CMake cache does not contain exact entry: $entry"
            }
          }

          if ($cache -notmatch "CMAKE_CXX_COMPILER:FILEPATH=.*clang-cl") {
            Write-Host "CMake compiler cache entry:"
            Select-String -Path "Build\release\CMakeCache.txt" -Pattern "CMAKE_CXX_COMPILER"
            throw "CMake is not configured with clang-cl."
          }

      # --------------------------------------------------
      # 17. 构建 Ladybird
      # --------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        working-directory: ladybird
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
          CCACHE_DIR: ${{ github.workspace }}\.cache\ccache
        run: |
          $ErrorActionPreference = "Stop"

          $env:CC = $env:LLVM_CLANG_CL
          $env:CXX = $env:LLVM_CLANG_CL

          Write-Host "Starting Ladybird Release build..."
          Write-Host "Compiler: $env:CXX"

          cmake --build Build/release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # --------------------------------------------------
      # 18. 验证主程序 PE 架构
      # --------------------------------------------------
      - name: Verify Ladybird executable
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem "Build\release" -Recurse -Filter "Ladybird.exe" -File |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found."
          }

          $bytes = [IO.File]::ReadAllBytes($exe.FullName)

          if ($bytes.Length -lt 256 -or
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A) {
            throw "Invalid Windows executable."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw "Invalid PE header offset."
          }

          if ($bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45) {
            throw "Invalid PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
            throw "Ladybird.exe is not an AMD64 executable."
          }

          Write-Host "Valid Windows x64 executable: $($exe.FullName)"
          "LADYBIRD_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 19. 安装运行时文件
      # --------------------------------------------------
      - name: Install Ladybird runtime
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $env:GITHUB_WORKSPACE "ladybird\Build\release"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"

          New-Item -ItemType Directory -Force $prefix | Out-Null

          cmake --install $build --prefix $prefix

          if ($LASTEXITCODE -ne 0) {
            throw "cmake --install failed."
          }

          if (!(Test-Path $prefix)) {
            throw "Runtime installation directory missing."
          }

      # --------------------------------------------------
      # 20. 整理运行时 DLL、Qt 插件和辅助程序
      # 保留目录结构，检查同名 DLL 冲突
      # --------------------------------------------------
      - name: Bundle runtime dependencies
        shell: pwsh
        working-directory: ladybird
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $bin = Join-Path $prefix "bin"
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "ladybird\Build\release\vcpkg_installed\x64-windows"

          New-Item -ItemType Directory -Force $bin | Out-Null

          # 确保主程序位于 bin
          $mainExe = Get-ChildItem $prefix -Recurse -Filter "Ladybird.exe" -File |
            Select-Object -First 1

          if (!$mainExe) {
            $mainExe = Get-Item $env:LADYBIRD_EXE
          }

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            Copy-Item $mainExe.FullName (Join-Path $bin "Ladybird.exe") -Force
          }

          # 从 vcpkg 收集 DLL，遇到不同内容的同名文件直接失败
          $dllSources = @(
            (Join-Path $vcpkg "bin"),
            (Join-Path $vcpkg "debug\bin")
          )

          foreach ($sourceDir in $dllSources) {
            if (!(Test-Path $sourceDir)) {
              continue
            }

            Get-ChildItem $sourceDir -Filter "*.dll" -File | ForEach-Object {
              $destination = Join-Path $bin $_.Name

              if (Test-Path $destination) {
                $existingHash = (Get-FileHash $destination -Algorithm SHA256).Hash
                $newHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash

                if ($existingHash -ne $newHash) {
                  throw "Conflicting runtime DLL: $($_.Name)"
                }
              } else {
                Copy-Item $_.FullName $destination
              }
            }
          }

          # 查找 Qt 平台插件
          $qtRoot = Join-Path $vcpkg "Qt6\plugins"

          if (!(Test-Path $qtRoot)) {
            $qtRoot = Join-Path $vcpkg "tools\Qt6\plugins"
          }

          $qwindows = Get-ChildItem $vcpkg -Recurse -Filter "qwindows.dll" -File |
            Select-Object -First 1

          if (!$qwindows) {
            throw "Qt platform plugin qwindows.dll not found."
          }

          $platformDir = Join-Path $bin "plugins\platforms"
          New-Item -ItemType Directory -Force $platformDir | Out-Null
          Copy-Item $qwindows.FullName (Join-Path $platformDir "qwindows.dll") -Force

          # 收集 Qt imageformats 插件
          $imagePlugin = Get-ChildItem $vcpkg -Recurse -Filter "qjpeg.dll" -File |
            Select-Object -First 1

          if ($imagePlugin) {
            $imageDir = Split-Path $imagePlugin.FullName -Parent
            $destination = Join-Path $bin "plugins\imageformats"

            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item (Join-Path $imageDir "*.dll") $destination -Force
          }

          # Qt 插件搜索路径
          @"
          [Paths]
          Plugins=plugins
          "@ | Set-Content -Encoding ascii (Join-Path $bin "qt.conf")

          # 收集 libexec 辅助程序
          $libexec = Join-Path $prefix "libexec"

          if (Test-Path $libexec) {
            Get-ChildItem $libexec -File | ForEach-Object {
              $destination = Join-Path $bin $_.Name

              if (Test-Path $destination) {
                $existingHash = (Get-FileHash $destination -Algorithm SHA256).Hash
                $newHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash

                if ($existingHash -ne $newHash) {
                  throw "Conflicting libexec file: $($_.Name)"
                }
              } else {
                Copy-Item $_.FullName $destination
              }
            }
          }

          Write-Host "Runtime dependency staging completed."

      # --------------------------------------------------
      # 21. 生成构建信息并验证包结构
      # --------------------------------------------------
      - name: Verify package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $prefix = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $bin = Join-Path $prefix "bin"

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Ladybird.exe missing from package bin directory."
          }

          if (!(Test-Path (Join-Path $bin "qt.conf"))) {
            throw "qt.conf missing."
          }

          if (!(Test-Path (Join-Path $bin "plugins\platforms\qwindows.dll"))) {
            throw "Qt Windows platform plugin missing."
          }

          $files = Get-ChildItem $prefix -Recurse -File

          if ($files.Count -eq 0) {
            throw "Package directory is empty."
          }

          Write-Host "Package file count: $($files.Count)"
          $files | Select-Object FullName, Length | Format-Table -AutoSize

          @"
          Ladybird Windows x64 build

          Source repository: https://github.com/LadybirdBrowser/ladybird
          Requested ref: ${{ inputs.ref }}
          Resolved commit: $env:LADYBIRD_COMMIT
          Build configuration: Release
          Architecture: x64
          Compiler: clang-cl
          vcpkg triplet: x64-windows

          This is an unofficial Windows build.
          Native Windows support is experimental.
          "@ | Set-Content -Encoding UTF8 (Join-Path $prefix "BUILD-INFO.txt")

      # --------------------------------------------------
      # 22. 创建 ZIP
      # --------------------------------------------------
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird"
          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path (Join-Path $root "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          $info = Get-Item $zip
          Write-Host "ZIP size: $([math]::Round($info.Length / 1MB, 2)) MB"

      # --------------------------------------------------
      # 23. 生成 SHA256
      # --------------------------------------------------
      - name: Generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $env:PACKAGE_NAME.zip" |
            Set-Content -Encoding ascii "$env:PACKAGE_NAME.sha256"

          Write-Host "SHA256: $hash"

      # --------------------------------------------------
      # 24. 上传构建产物
      # --------------------------------------------------
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-${{ github.run_number }}
          path: |
            Ladybird-Windows-x64.zip
            Ladybird-Windows-x64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # --------------------------------------------------
      # 25. 可选发布 GitHub Release
      # --------------------------------------------------
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          target_commitish: ${{ env.LADYBIRD_COMMIT }}
          body: |
            Unofficial Ladybird Windows x64 build.

            Source ref: ${{ inputs.ref }}
            Source commit: ${{ env.LADYBIRD_COMMIT }}

            Build configuration: Release
            Architecture: x64
            Compiler: LLVM clang-cl
            vcpkg triplet: x64-windows

            Native Windows support is experimental.
          files: |
            Ladybird-Windows-x64.zip
            Ladybird-Windows-x64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
