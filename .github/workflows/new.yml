
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag, or commit"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish a GitHub pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PACKAGE_NAME: Ladybird-Windows-x64
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      RUSTFLAGS: "-A deprecated"
      BUILD_TYPE: Release

    steps:
      # ------------------------------------------------------------
      # 1. Checkout packaging repository
      # ------------------------------------------------------------
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss")

          "BUILD_SHA=$shortSha" >> $env:GITHUB_ENV
          "BUILD_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV

          Write-Host "Packaging repository: $env:GITHUB_REPOSITORY"
          Write-Host "Packaging commit: $shortSha"

      # ------------------------------------------------------------
      # 2. Build tools
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm --version=22.1.8 --allow-downgrade -y

          $llvmBin = "C:\Program Files\LLVM\bin"

          if (!(Test-Path "$llvmBin\clang-cl.exe")) {
            throw "clang-cl.exe was not found in $llvmBin"
          }

          if (!(Test-Path "$llvmBin\clang.exe")) {
            throw "clang.exe was not found in $llvmBin"
          }

          $llvmBin >> $env:GITHUB_PATH

      - name: Install build utilities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja cmake git 7zip -y

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @(
            "git",
            "cmake",
            "ninja",
            "clang",
            "clang-cl",
            "cl",
            "rustc",
            "cargo",
            "python"
          )) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool : $($command.Source)"
          }

          Write-Host ""
          cmake --version
          ninja --version
          clang --version
          clang-cl --version
          cl
          rustc --version
          python --version

      - name: Verify LLVM target and MSVC compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = (& clang.exe -print-target-triple 2>&1 | Out-String).Trim()

          Write-Host "Clang target: $target"

          if ($target -notmatch "x86_64.*windows.*msvc") {
            throw "Unexpected Clang target: $target"
          }

          $testFile = Join-Path $env:RUNNER_TEMP "clang-msvc-test.cpp"

          @'
          #include <iostream>
          #include <vector>
          int main() {
              std::vector<int> values{1, 2, 3};
              std::cout << values.size() << std::endl;
              return 0;
          }
          '@ | Set-Content -Path $testFile -Encoding utf8

          clang-cl.exe /nologo /std:c++20 /EHsc /c $testFile `
            "/Fo$env:RUNNER_TEMP\clang-msvc-test.obj"

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl and MSVC STL compatibility test failed"
          }

          Write-Host "Clang target and MSVC STL test passed."

      # ------------------------------------------------------------
      # 3. Checkout Ladybird
      # ------------------------------------------------------------
      - name: Checkout Ladybird source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone https://github.com/LadybirdBrowser/ladybird.git ladybird

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Ladybird"
          }

          Set-Location ladybird

          git fetch --tags origin "${{ inputs.ref }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch requested ref: ${{ inputs.ref }}"
          }

          git checkout --detach FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout requested ref"
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize submodules"
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          "LADYBIRD_SHA=$sourceSha" >> $env:GITHUB_ENV

          Write-Host "Ladybird commit: $sourceSha"

      # ------------------------------------------------------------
      # 4. Bootstrap vcpkg using Ladybird's baseline
      # ------------------------------------------------------------
      - name: Read vcpkg baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "ladybird\vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline was not found in ladybird/vcpkg.json"
          }

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV

          Write-Host "Ladybird vcpkg baseline: $baseline"

      - name: Checkout and bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone https://github.com/microsoft/vcpkg.git vcpkg

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          Set-Location vcpkg

          git checkout --detach "$env:VCPKG_BASELINE"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout vcpkg baseline"
          }

          .\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          $vcpkgRoot = (Get-Location).Path
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

          "$vcpkgRoot" >> $env:GITHUB_PATH

          Write-Host "vcpkg root: $vcpkgRoot"
          .\vcpkg.exe version

      # ------------------------------------------------------------
      # 5. Create dav1d overlay port and apply MSVC 19.52 fix
      # ------------------------------------------------------------
      - name: Create dav1d MSVC compatibility overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $originalPort = Join-Path $env:VCPKG_ROOT "ports\dav1d"
          $overlayRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg-overlays"
          $overlayPort = Join-Path $overlayRoot "dav1d"

          if (!(Test-Path "$originalPort\portfile.cmake")) {
            throw "The dav1d portfile was not found: $originalPort"
          }

          New-Item -ItemType Directory -Force -Path $overlayRoot | Out-Null

          if (Test-Path $overlayPort) {
            Remove-Item $overlayPort -Recurse -Force
          }

          Copy-Item $originalPort $overlayPort -Recurse

          $portfile = Join-Path $overlayPort "portfile.cmake"
          $content = Get-Content $portfile -Raw

          # dav1d uses Meson in its vcpkg port.
          # Insert the compatibility fix after source acquisition and
          # before Meson configuration starts.
          $mesonMarker = "vcpkg_configure_meson"

          if (!$content.Contains($mesonMarker)) {
            throw "Could not find vcpkg_configure_meson in dav1d portfile. Refusing to apply an unverified overlay."
          }

          $patchCode = @'

          # ---------------------------------------------------------
          # Local workaround for MSVC 19.52 / MSVC 14.52.
          # Upstream dav1d fix:
          # a34e0685b9111b9eb1d7835ea7bea5b425dced73
          # ---------------------------------------------------------

          set(_dav1d_stdatomic "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")

          if(NOT EXISTS "${_dav1d_stdatomic}")
              message(FATAL_ERROR "dav1d stdatomic.h not found: ${_dav1d_stdatomic}")
          endif()

          file(READ "${_dav1d_stdatomic}" _dav1d_stdatomic_content)

          set(_dav1d_old "#if defined(__clang__) && __has_include_next(<stdatomic.h>)")

          set(_dav1d_new [=[
          #ifndef __has_include_next
          #define __has_include_next(x) 0
          #endif

          #if defined(__clang__) && __has_include_next(<stdatomic.h>)
          ]=])

          string(FIND "${_dav1d_stdatomic_content}" "${_dav1d_old}" _dav1d_match)

          if(_dav1d_match EQUAL -1)
              message(FATAL_ERROR "Expected __has_include_next expression was not found in dav1d stdatomic.h")
          endif()

          string(REPLACE
              "${_dav1d_old}"
              "${_dav1d_new}"
              _dav1d_stdatomic_content
              "${_dav1d_stdatomic_content}"
          )

          file(WRITE "${_dav1d_stdatomic}" "${_dav1d_stdatomic_content}")

          file(READ "${_dav1d_stdatomic}" _dav1d_verify_content)
          string(FIND "${_dav1d_verify_content}" "#define __has_include_next(x) 0" _dav1d_verify)

          if(_dav1d_verify EQUAL -1)
              message(FATAL_ERROR "dav1d MSVC compatibility patch verification failed")
          endif()

          message(STATUS "Applied dav1d MSVC 19.52 compatibility workaround")
          '@

          $index = $content.IndexOf($mesonMarker)

          $content = $content.Insert($index, $patchCode + "`r`n")

          Set-Content -Path $portfile -Value $content -Encoding utf8

          Write-Host "Created overlay port: $overlayPort"
          Write-Host "Overlay portfile patch injection verified."

          "VCPKG_OVERLAY_PORTS=$overlayRoot" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # 6. Clean previous build output
      # ------------------------------------------------------------
      - name: Clean build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "ladybird\Build\release",
            "dist"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

      # ------------------------------------------------------------
      # 7. Configure Ladybird
      # ------------------------------------------------------------
      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "ladybird\Build\release"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          cmake -S ladybird -B $buildDir `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_INSTALL=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Verify CMake compiler and overlay settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "ladybird\Build\release\CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt was not generated"
          }

          $content = Get-Content $cache -Raw

          foreach ($expected in @(
            "CMAKE_C_COMPILER:FILEPATH=",
            "CMAKE_CXX_COMPILER:FILEPATH=",
            "VCPKG_TARGET_TRIPLET:STRING=x64-windows"
          )) {
            if (!$content.Contains($expected)) {
              throw "Missing expected CMake cache entry: $expected"
            }
          }

          Write-Host "CMake cache verification passed."

      # ------------------------------------------------------------
      # 8. Build
      # ------------------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build ladybird\Build\release --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      # ------------------------------------------------------------
      # 9. Verify executables
      # ------------------------------------------------------------
      - name: Verify executable architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = Resolve-Path "ladybird\Build\release"

          $executables = Get-ChildItem $buildDir -Recurse -File -Filter "*.exe"

          if ($executables.Count -eq 0) {
            throw "No executable files were produced"
          }

          foreach ($exe in $executables) {
            $stream = [System.IO.File]::OpenRead($exe.FullName)

            try {
              $reader = New-Object System.IO.BinaryReader($stream)

              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()

              $stream.Position = $peOffset
              $signature = $reader.ReadUInt32()
              $machine = $reader.ReadUInt16()

              if ($signature -ne 0x00004550) {
                throw "Invalid PE executable: $($exe.FullName)"
              }

              if ($machine -ne 0x8664) {
                throw "Executable is not AMD64: $($exe.FullName)"
              }

              Write-Host "AMD64: $($exe.FullName)"
            }
            finally {
              $stream.Dispose()
            }
          }

      # ------------------------------------------------------------
      # 10. Stage runtime files
      # ------------------------------------------------------------
      - name: Stage runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = (Resolve-Path "ladybird\Build\release").Path
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\Ladybird-Windows-x64"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Copy generated executables and DLLs.
          Get-ChildItem $buildDir -Recurse -File |
            Where-Object {
              $_.Extension -in @(".exe", ".dll")
            } |
            ForEach-Object {
              Copy-Item $_.FullName $stage -Force
            }

          # Copy vcpkg runtime DLLs.
          $vcpkgBin = Join-Path $buildDir "vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -File -Filter "*.dll" |
              ForEach-Object {
                Copy-Item $_.FullName $stage -Force
              }
          }

          # Copy Ladybird resources when present.
          $resourceCandidates = @(
            "ladybird\Resources",
            "ladybird\resources",
            "ladybird\share",
            "ladybird\Build\release\share",
            "ladybird\Build\release\resources"
          )

          foreach ($resource in $resourceCandidates) {
            if (Test-Path $resource) {
              $destination = Join-Path $stage (Split-Path $resource -Leaf)

              Copy-Item $resource $destination -Recurse -Force
            }
          }

          # Preserve Qt plugins if they exist in the build tree.
          $qtPlugins = Get-ChildItem $buildDir -Directory -Recurse |
            Where-Object { $_.Name -eq "plugins" }

          foreach ($pluginDir in $qtPlugins) {
            $destination = Join-Path $stage "plugins"

            if (!(Test-Path $destination)) {
              Copy-Item $pluginDir.FullName $destination -Recurse -Force
            }
          }

          if (!(Get-ChildItem $stage -File -Filter "*.exe")) {
            throw "No executable was staged"
          }

          Write-Host "Staged package:"
          Get-ChildItem $stage -Recurse -File |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # 11. Launcher and build information
      # ------------------------------------------------------------
      - name: Create launcher and build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = "dist\Ladybird-Windows-x64"

          $mainExe = Get-ChildItem $stage -File -Filter "*.exe" |
            Where-Object { $_.Name -match "Ladybird" } |
            Select-Object -First 1

          if (!$mainExe) {
            $mainExe = Get-ChildItem $stage -File -Filter "*.exe" |
              Select-Object -First 1
          }

          if (!$mainExe) {
            throw "Could not find a Ladybird executable"
          }

          @"
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0$($mainExe.Name)" %*
          "@ | Set-Content "$stage\Start-Ladybird.bat" -Encoding ascii

          @"
          Product: Ladybird
          Platform: Windows x64
          Configuration: Release
          Source repository: https://github.com/LadybirdBrowser/ladybird
          Source ref: ${{ inputs.ref }}
          Source commit: $env:LADYBIRD_SHA
          Packaging commit: $env:BUILD_SHA
          Build timestamp UTC: $env:BUILD_TIMESTAMP
          vcpkg baseline: $env:VCPKG_BASELINE
          Compiler: clang-cl + MSVC STL
          dav1d workaround: a34e0685b9111b9eb1d7835ea7bea5b425dced73
          "@ | Set-Content "$stage\BUILD-INFO.txt" -Encoding utf8

      # ------------------------------------------------------------
      # 12. Package audit
      # ------------------------------------------------------------
      - name: Generate package inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = "dist\Ladybird-Windows-x64"

          Get-ChildItem $stage -Recurse -File |
            ForEach-Object {
              $relative = $_.FullName.Substring(
                (Resolve-Path $stage).Path.Length
              ).TrimStart("\")
              "$relative`t$($_.Length)"
            } |
            Set-Content "dist\PACKAGE-INVENTORY.txt" -Encoding utf8

      - name: Generate dependency report
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $stage = "dist\Ladybird-Windows-x64"
          $report = "dist\DEPENDENCIES.txt"

          "DLL dependency report" | Set-Content $report

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue

          if (!$dumpbin) {
            "dumpbin.exe was not found." | Add-Content $report
            exit 0
          }

          Get-ChildItem $stage -File -Filter "*.exe" |
            ForEach-Object {
              "`r`n===== $($_.Name) =====" | Add-Content $report
              dumpbin.exe /DEPENDENTS $_.FullName 2>&1 |
                Add-Content $report
            }

      # ------------------------------------------------------------
      # 13. ZIP and checksum
      # ------------------------------------------------------------
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "dist\Ladybird-Windows-x64"
          $zip = "dist\Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$source\*" -DestinationPath $zip -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP archive was not created"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $zip).Path
          )

          try {
            if ($archive.Entries.Count -eq 0) {
              throw "ZIP archive is empty"
            }

            Write-Host "ZIP entries: $($archive.Entries.Count)"
          }
          finally {
            $archive.Dispose()
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "dist\Ladybird-Windows-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

          Write-Host "SHA256: $hash"

      # ------------------------------------------------------------
      # 14. Upload artifacts
      # ------------------------------------------------------------
      - name: Upload Ladybird ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-audit
          path: |
            dist/PACKAGE-INVENTORY.txt
            dist/DEPENDENCIES.txt
            dist/Ladybird-Windows-x64/BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # 15. vcpkg diagnostics - run even when build fails
      # ------------------------------------------------------------
      - name: Locate vcpkg and dav1d diagnostic files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Searching for dav1d and vcpkg logs..."

          $patterns = @(
            "package-x64-windows-dbg-out.log",
            "package-x64-windows-rel-out.log",
            "vcpkg-manifest-install.log",
            "issue_body.md"
          )

          foreach ($pattern in $patterns) {
            Write-Host ""
            Write-Host "Searching for: $pattern"

            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File `
              -Filter $pattern -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }

      - name: Print dav1d failure log tail
        if: failure()
        shell: pwsh
        run: |
          $candidates = @(
            "$env:VCPKG_ROOT\buildtrees\dav1d\package-x64-windows-dbg-out.log",
            "$env:VCPKG_ROOT\buildtrees\dav1d\package-x64-windows-rel-out.log"
          )

          foreach ($file in $candidates) {
            if (Test-Path $file) {
              Write-Host ""
              Write-Host "===== $file ====="
              Get-Content $file -Tail 250
            }
          }

      - name: Upload vcpkg diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-vcpkg-diagnostics
          path: |
            vcpkg/buildtrees/dav1d/
            ladybird/Build/release/vcpkg-manifest-install.log
            ladybird/Build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------
      # 16. Optional GitHub pre-release
      # ------------------------------------------------------------
      - name: Publish GitHub pre-release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ env.BUILD_TIMESTAMP }}-${{ env.BUILD_SHA }}
          name: Ladybird Windows x64 ${{ env.BUILD_TIMESTAMP }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
