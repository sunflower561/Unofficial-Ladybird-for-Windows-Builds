
name: Ladybird Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag or commit SHA"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      UPSTREAM_REPO: https://github.com/LadybirdBrowser/ladybird.git
      BUILD_DIR: ladybird/Build/release
      VCPKG_ROOT: .vcpkg-upstream
      LLVM_VERSION: 22.1.8
      PACKAGE_NAME: Ladybird-Windows-x64

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey tool installation failed."
          }

      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:LLVM_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process -FilePath $installer `
            -ArgumentList "/S", "/D=C:\LLVM" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "LLVM installation failed: $($process.ExitCode)"
          }

          if (-not (Test-Path "C:\LLVM\bin\clang-cl.exe")) {
            throw "clang-cl.exe was not installed."
          }

          "C:\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tools = @(
            "cmake",
            "ninja",
            "clang-cl",
            "clang",
            "rustc",
            "cargo",
            "python",
            "git"
          )

          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue

            if (-not $command) {
              throw "Required tool not found: $tool"
            }

            Write-Host "$tool : $($command.Source)"
          }

          Write-Host "`n=== Compiler versions ==="
          clang-cl --version
          cmake --version
          ninja --version
          rustc --version
          python --version

      - name: Clone Ladybird upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone --filter=blob:none $env:UPSTREAM_REPO ladybird

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird clone failed."
          }

          Push-Location ladybird

          try {
            git fetch origin "${{ inputs.ref }}" --depth=1

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch requested upstream ref."
            }

            git checkout FETCH_HEAD

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to checkout requested upstream ref."
            }

            $commit = git rev-parse HEAD

            Write-Host "Ladybird commit: $commit"
            "LADYBIRD_COMMIT=$commit" >> $env:GITHUB_ENV
          }
          finally {
            Pop-Location
          }

      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "ladybird/vcpkg.json" -Raw |
            ConvertFrom-Json

          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline is missing from ladybird/vcpkg.json"
          }

          Write-Host "vcpkg baseline: $baseline"
          "value=$baseline" >> $env:GITHUB_OUTPUT

      - name: Checkout vcpkg at Ladybird baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed."
          }

          Push-Location $env:VCPKG_ROOT

          try {
            git checkout "${{ steps.baseline.outputs.value }}"

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to checkout vcpkg baseline."
            }

            .\bootstrap-vcpkg.bat -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed."
            }
          }
          finally {
            Pop-Location
          }

      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path
          $vcpkg = Join-Path $root ".vcpkg-upstream"
          $toolchain = Join-Path $vcpkg "scripts/buildsystems/vcpkg.cmake"

          $overlayPorts = Join-Path $root "ladybird/Meta/CMake/vcpkg/overlay-ports"
          $overlayTriplets = Join-Path $root "ladybird/Meta/CMake/vcpkg/release-triplets"

          if (-not (Test-Path $toolchain)) {
            throw "vcpkg toolchain not found: $toolchain"
          }

          if (-not (Test-Path $overlayPorts)) {
            throw "Ladybird overlay ports directory not found: $overlayPorts"
          }

          if (-not (Test-Path $overlayTriplets)) {
            throw "Ladybird release triplets directory not found: $overlayTriplets"
          }

          New-Item -ItemType Directory -Force -Path $env:BUILD_DIR |
            Out-Null

          cmake -S ladybird -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MAKE_PROGRAM="$(Get-Command ninja).Source" `
            -DCMAKE_C_COMPILER="C:/LLVM/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="C:/LLVM/bin/clang-cl.exe" `
            -DCMAKE_LINKER="C:/LLVM/bin/lld-link.exe" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_ROOT="$vcpkg" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_PORTS="$overlayPorts" `
            -DVCPKG_OVERLAY_TRIPLETS="$overlayTriplets" `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed."
          }

      - name: Validate CMake configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:BUILD_DIR "CMakeCache.txt"

          if (-not (Test-Path $cache)) {
            throw "CMakeCache.txt was not generated."
          }

          $lines = Get-Content $cache

          function Get-CMakeCacheValue {
            param([string]$Name)

            $pattern = "^$([regex]::Escape($Name)):[^=]+=(.*)$"

            $line = $lines |
              Where-Object { $_ -match $pattern } |
              Select-Object -First 1

            if ($null -eq $line) {
              return $null
            }

            return ($line -replace '^.*?=', '')
          }

          $checks = @(
            "CMAKE_TOOLCHAIN_FILE",
            "Z_VCPKG_ROOT_DIR",
            "VCPKG_MANIFEST_DIR",
            "VCPKG_TARGET_TRIPLET",
            "VCPKG_OVERLAY_PORTS",
            "VCPKG_OVERLAY_TRIPLETS",
            "CMAKE_GENERATOR",
            "CMAKE_BUILD_TYPE"
          )

          foreach ($name in $checks) {
            $value = Get-CMakeCacheValue $name

            Write-Host "$name = $value"

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Required CMake cache entry is missing: $name"
            }
          }

          $triplet = Get-CMakeCacheValue "VCPKG_TARGET_TRIPLET"

          if ($triplet -ne "x64-windows") {
            throw "Unexpected vcpkg triplet: $triplet"
          }

          Write-Host "`nCMake configuration validation completed."

      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $log = Join-Path $env:RUNNER_TEMP "ladybird-build.log"

          cmake --build $env:BUILD_DIR `
            --parallel $env:NUMBER_OF_PROCESSORS 2>&1 |
            Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      - name: Diagnose ICU data files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== ICU files in Build/release ==="

          $buildIcu = Join-Path $env:BUILD_DIR "share/Lagom/icu"

          if (Test-Path $buildIcu) {
            Get-ChildItem $buildIcu -File -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            Write-Host "Build ICU directory does not exist: $buildIcu"
          }

          Write-Host "`n=== ICU files in vcpkg ==="

          $vcpkgInstalled = Join-Path $env:VCPKG_ROOT "installed"

          if (Test-Path $vcpkgInstalled) {
            Get-ChildItem $vcpkgInstalled `
              -Filter "icudt*.dat" -File -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

          Write-Host "`n=== ICU CMake cache entries ==="

          $cache = Join-Path $env:BUILD_DIR "CMakeCache.txt"

          if (Test-Path $cache) {
            Select-String -Path $cache `
              -Pattern "ICU|LADYBIRD_ICU_DATA_FILE"
          }

      - name: Prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = (Resolve-Path $env:BUILD_DIR).Path
          $sourceBin = Join-Path $buildRoot "bin"
          $sourceShare = Join-Path $buildRoot "share/Lagom"

          $packageRoot = Join-Path $root "dist/$env:PACKAGE_NAME"
          $packageBin = Join-Path $packageRoot "bin"
          $packageShare = Join-Path $packageRoot "share/Lagom"

          $root = (Get-Location).Path

          if (-not (Test-Path $sourceBin)) {
            throw "Build bin directory not found: $sourceBin"
          }

          if (-not (Test-Path $sourceShare)) {
            throw "Build share/Lagom directory not found: $sourceShare"
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageBin |
            Out-Null

          New-Item -ItemType Directory -Force -Path $packageShare |
            Out-Null

          Write-Host "Copying runtime binaries and DLLs..."

          Get-ChildItem $sourceBin -File | ForEach-Object {
            $name = $_.Name

            if ($name -match '^(Test.*|test-.*)\.exe$') {
              Write-Host "Excluded test executable: $name"
              return
            }

            Copy-Item $_.FullName $packageBin -Force
          }

          Write-Host "Copying Qt plugin directories..."

          $pluginDirs = @(
            "platforms",
            "imageformats",
            "generic",
            "networkinformation",
            "position",
            "styles",
            "tls"
          )

          foreach ($name in $pluginDirs) {
            $source = Join-Path $sourceBin $name

            if (Test-Path $source -PathType Container) {
              Copy-Item $source $packageBin -Recurse -Force
              Write-Host "Copied Qt plugin directory: $name"
            }
          }

          Write-Host "Copying Lagom resources..."

          Copy-Item "$sourceShare/*" $packageShare -Recurse -Force

          Write-Host "Portable package staging completed."

      - name: Validate portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $share = Join-Path $package "share/Lagom"

          $requiredFiles = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "ImageDecoder.exe",
            "RequestServer.exe"
          )

          foreach ($name in $requiredFiles) {
            $path = Join-Path $bin $name

            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required runtime executable missing: $path"
            }

            Write-Host "Verified executable: $name"
          }

          $requiredResources = @(
            "fonts",
            "icons",
            "themes",
            "ladybird"
          )

          foreach ($name in $requiredResources) {
            $path = Join-Path $share $name

            if (-not (Test-Path $path -PathType Container)) {
              throw "Required resource directory missing: $path"
            }

            Write-Host "Verified resource directory: $name"
          }

          $qtPlatform = Join-Path $bin "platforms/qwindows.dll"

          if (-not (Test-Path $qtPlatform)) {
            throw "Qt Windows platform plugin is missing."
          }

          $icuDir = Join-Path $share "icu"

          $icuFiles = @()

          if (Test-Path $icuDir) {
            $icuFiles = @(
              Get-ChildItem $icuDir -Filter "icudt*.dat" -File
            )
          }

          if ($icuFiles.Count -eq 0) {
            throw "ICU data file is missing from the portable package. Check the ICU diagnostic step."
          }

          foreach ($file in $icuFiles) {
            Write-Host "Verified ICU data: $($file.Name)"
          }

          $pdfjs = Join-Path $share "ladybird/pdfjs"

          if (-not (Test-Path $pdfjs)) {
            Write-Warning "PDF.js resources not found in this build."
          }

          Write-Host "`n=== Package summary ==="

          $files = Get-ChildItem $package -File -Recurse
          $total = ($files | Measure-Object Length -Sum).Sum

          Write-Host "File count: $($files.Count)"
          Write-Host "Total size: $([math]::Round($total / 1MB, 2)) MB"

      - name: Write build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "dist/$env:PACKAGE_NAME"

          $info = @"
          Ladybird Windows x64
          ====================

          Upstream repository:
          $env:UPSTREAM_REPO

          Upstream commit:
          $env:LADYBIRD_COMMIT

          LLVM version:
          $env:LLVM_VERSION

          Build configuration:
          Release

          Architecture:
          x86_64

          CPU baseline:
          x86-64-v2 requested through LADYBIRD_BASELINE_CPU_TARGET

          Packaging:
          Curated portable runtime

          "@

          Set-Content -Path "$package/BUILD-INFO.txt" `
            -Value $info -Encoding UTF8

      - name: Create launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "dist/$env:PACKAGE_NAME"

          $launcher = @'
          @echo off
          setlocal
          cd /d "%~dp0"

          set "LADYBIRD_ICU_DATA=%~dp0share\Lagom\icu"

          if not exist "%~dp0bin\Ladybird.exe" (
              echo Ladybird.exe was not found.
              pause
              exit /b 1
          )

          start "" "%~dp0bin\Ladybird.exe" %*
          '@

          Set-Content -Path "$package/Start-Ladybird.bat" `
            -Value $launcher -Encoding ASCII

      - name: Create ZIP and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "dist/$env:PACKAGE_NAME"
          $zip = "dist/$env:PACKAGE_NAME.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          Set-Content "$zip.sha256" "$hash  $env:PACKAGE_NAME.zip"

          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"
          Write-Host "ZIP size: $([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}
          name: Ladybird Windows x64 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256

      - name: Collect failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== Build logs ==="

          $paths = @(
            "ladybird/Build/release/vcpkg-manifest-install.log",
            "ladybird/Build/release/CMakeFiles/CMakeError.log",
            "ladybird/Build/release/CMakeFiles/CMakeOutput.log",
            ".vcpkg-upstream/buildtrees"
          )

          New-Item -ItemType Directory -Force `
            -Path "diagnostics" | Out-Null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              if ((Get-Item $path).PSIsContainer) {
                Get-ChildItem $path -Recurse -File `
                  -Include "*out.log","*err.log","config.log","meson-log.txt" |
                  ForEach-Object {
                    $target = Join-Path "diagnostics" $_.Name
                    Copy-Item $_.FullName $target -Force
                  }
              }
              else {
                Copy-Item $path "diagnostics" -Force
              }
            }
          }

          if (Test-Path "diagnostics") {
            Get-ChildItem diagnostics -File |
              Select-Object Name, Length |
              Format-Table -AutoSize
          }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
