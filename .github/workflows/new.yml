
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag or commit"
        required: true
        default: "release/2026.47"
        type: string
      publish_release:
        description: "Publish ZIP to GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PACKAGE_NAME: Ladybird-Windows-x64
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: 1
      RUSTFLAGS: "-A deprecated"
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      # --------------------------------------------------
      # 1. Checkout packaging repository
      # --------------------------------------------------
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install latest stable Python 3.x
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # 3. Setup MSVC x64
      # --------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # 4. Setup latest stable Rust
      # --------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command rustc -ErrorAction SilentlyContinue)) {
            throw "Rust compiler not found."
          }

          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            throw "Cargo not found."
          }

          rustc --version
          cargo --version

      # --------------------------------------------------
      # 5. Install latest stable LLVM and build tools
      # --------------------------------------------------
      - name: Install LLVM and build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing latest available stable LLVM..."

          choco install llvm -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "LLVM installation failed."
          }

          Write-Host "Installing latest available build tools..."

          choco install ninja nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Build tools installation failed."
          }

          Write-Host "Installing latest CMake..."

          python -m pip install --upgrade pip cmake

          if ($LASTEXITCODE -ne 0) {
            throw "Python build tools installation failed."
          }

          $llvmBin = "C:\Program Files\LLVM\bin"
          $clangCl = Join-Path $llvmBin "clang-cl.exe"

          if (!(Test-Path $clangCl)) {
            throw "LLVM clang-cl.exe not found: $clangCl"
          }

          # Ensure the installed LLVM is first in PATH.
          $env:PATH = "$llvmBin;$env:PATH"

          $llvmBin | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          "LLVM_BIN=$llvmBin" >> $env:GITHUB_ENV
          "LLVM_CLANG_CL=$clangCl" >> $env:GITHUB_ENV

          Write-Host "LLVM binary directory: $llvmBin"
          Write-Host "LLVM compiler: $clangCl"

          & $clangCl --version

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute LLVM clang-cl."
          }

      # --------------------------------------------------
      # 5.1 Verify LLVM version and PATH priority
      # --------------------------------------------------
      - name: Verify LLVM installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedCompiler = [IO.Path]::GetFullPath($env:LLVM_CLANG_CL)

          $resolved = Get-Command clang-cl -ErrorAction Stop
          $resolvedPath = [IO.Path]::GetFullPath($resolved.Source)

          Write-Host "Resolved clang-cl: $resolvedPath"
          Write-Host "Expected clang-cl: $expectedCompiler"

          if ($resolvedPath -ine $expectedCompiler) {
            throw "PATH is resolving to the wrong clang-cl executable."
          }

          $versionOutput = (& $env:LLVM_CLANG_CL --version 2>&1 | Out-String)

          Write-Host $versionOutput

          $match = [regex]::Match(
            $versionOutput,
            'clang version\s+(\d+\.\d+\.\d+)'
          )

          if (!$match.Success) {
            throw "Unable to determine clang-cl version."
          }

          $actualVersion = $match.Groups[1].Value
          $clangMajor = [int]($actualVersion.Split('.')[0])

          "LLVM_VERSION=$actualVersion" >> $env:GITHUB_ENV
          "LLVM_MAJOR=$clangMajor" >> $env:GITHUB_ENV

          Write-Host "Detected LLVM version: $actualVersion"
          Write-Host "Detected LLVM major: $clangMajor"

      # --------------------------------------------------
      # 5.2 Verify MSVC STL and clang-cl compatibility
      # --------------------------------------------------
      - name: Verify clang-cl and MSVC STL compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking MSVC environment..."

          if ([string]::IsNullOrWhiteSpace($env:INCLUDE)) {
            throw "MSVC INCLUDE environment variable is missing. Run Setup MSVC before this step."
          }

          $includeDirs = $env:INCLUDE -split ';' |
            Where-Object { ![string]::IsNullOrWhiteSpace($_) }

          $stlHeader = $null

          foreach ($dir in $includeDirs) {
            $candidate = Join-Path $dir "yvals_core.h"

            if (Test-Path $candidate) {
              $stlHeader = $candidate
              break
            }
          }

          if (!$stlHeader) {
            throw "Unable to locate MSVC STL yvals_core.h through INCLUDE."
          }

          Write-Host "MSVC STL header: $stlHeader"

          $headerContent = Get-Content $stlHeader -Raw

          $stlVersionMatch = [regex]::Match(
            $headerContent,
            '(?m)^\s*#\s*define\s+_MSVC_STL_VERSION\s+(\d+)'
          )

          $stlUpdateMatch = [regex]::Match(
            $headerContent,
            '(?m)^\s*#\s*define\s+_MSVC_STL_UPDATE\s+(\d+)'
          )

          if (!$stlVersionMatch.Success) {
            throw "Unable to read _MSVC_STL_VERSION."
          }

          if (!$stlUpdateMatch.Success) {
            throw "Unable to read _MSVC_STL_UPDATE."
          }

          $stlVersion = $stlVersionMatch.Groups[1].Value
          $stlUpdate = $stlUpdateMatch.Groups[1].Value

          Write-Host "MSVC STL version: $stlVersion"
          Write-Host "MSVC STL update: $stlUpdate"

          # Extract compiler minimum version guards from the active STL header.
          $clangMinimums = [regex]::Matches(
            $headerContent,
            '__clang_major__\s*<\s*(\d+)'
          ) | ForEach-Object {
            [int]$_.Groups[1].Value
          }

          if ($clangMinimums.Count -gt 0) {
            $requiredMajor = ($clangMinimums | Measure-Object -Maximum).Maximum

            Write-Host "Detected Clang major-version guard: $requiredMajor"
            Write-Host "Installed Clang major version: $env:LLVM_MAJOR"

            if ([int]$env:LLVM_MAJOR -lt $requiredMajor) {
              throw "LLVM $env:LLVM_VERSION is below the detected MSVC STL Clang requirement ($requiredMajor)."
            }
          }
          else {
            Write-Host "No explicit __clang_major__ minimum guard found. The compile probe remains mandatory."
          }

          # Compile a real C++23 probe against the active MSVC STL.
          $probeDir = Join-Path $env:RUNNER_TEMP "ladybird-stl-probe"

          New-Item -ItemType Directory -Force $probeDir | Out-Null

          $probeSource = Join-Path $probeDir "stl_probe.cpp"
          $probeObject = Join-Path $probeDir "stl_probe.obj"

          @'
          #include <version>
          #include <cstddef>
          #include <string>
          #include <vector>
          #include <memory>
          #include <filesystem>
          #include <format>
          #include <ranges>
          #include <thread>
          #include <mutex>
          #include <optional>
          #include <span>
          #include <expected>

          int main()
          {
              std::vector<int> values { 1, 2, 3 };
              auto view = values | std::views::filter([](int value) { return value > 1; });
              std::string text = std::format("value={}", *view.begin());
              std::optional<int> number = 42;
              std::expected<int, int> result = number.value();

              return text.empty() || !result.has_value();
          }
          '@ | Set-Content -Path $probeSource -Encoding ASCII

          Write-Host "Compiling C++23 MSVC STL compatibility probe..."

          & $env:LLVM_CLANG_CL `
            /nologo `
            /c `
            /std:c++23 `
            /EHsc `
            /MD `
            /W4 `
            "/Fo$probeObject" `
            $probeSource

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl failed to compile the C++23 MSVC STL compatibility probe. Do not bypass this failure."
          }

          if (!(Test-Path $probeObject)) {
            throw "STL compatibility probe did not produce an object file."
          }

          "MSVC_STL_VERSION=$stlVersion" >> $env:GITHUB_ENV
          "MSVC_STL_UPDATE=$stlUpdate" >> $env:GITHUB_ENV
          "STL_COMPATIBILITY_PROBE=PASSED" >> $env:GITHUB_ENV

          Write-Host "clang-cl and MSVC STL compatibility probe PASSED."

      # --------------------------------------------------
      # 5.3 Verify build tools and CMake minimum version
      # --------------------------------------------------
      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version
          cl.exe

          $cmakeOutput = (& cmake --version 2>&1 | Out-String)

          $cmakeMatch = [regex]::Match(
            $cmakeOutput,
            'cmake version\s+(\d+\.\d+\.\d+)'
          )

          if (!$cmakeMatch.Success) {
            throw "Unable to determine CMake version."
          }

          $cmakeVersion = [version]$cmakeMatch.Groups[1].Value

          if ($cmakeVersion -lt [version]"3.30.0") {
            throw "CMake 3.30 or newer is required. Found $cmakeVersion."
          }

          "CMAKE_VERSION=$cmakeVersion" >> $env:GITHUB_ENV

          Write-Host "CMake version verification passed."

      # --------------------------------------------------
      # 6. Clone Ladybird source
      # --------------------------------------------------
      - name: Clone Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"

          git clone --filter=blob:none `
            https://github.com/LadybirdBrowser/ladybird.git $source

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird clone failed."
          }

          Push-Location $source

          try {
            git fetch origin "${{ inputs.ref }}" --tags

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch requested ref."
            }

            git checkout --detach FETCH_HEAD

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to checkout requested ref."
            }

            git submodule update --init --recursive

            if ($LASTEXITCODE -ne 0) {
              throw "Submodule initialization failed."
            }

            $commit = git rev-parse HEAD
            $shortCommit = git rev-parse --short HEAD

            "LADYBIRD_COMMIT=$commit" >> $env:GITHUB_ENV
            "LADYBIRD_SHORT_COMMIT=$shortCommit" >> $env:GITHUB_ENV

            Write-Host "Requested ref: ${{ inputs.ref }}"
            Write-Host "Resolved commit: $commit"

            git log -1 --oneline
          }
          finally {
            Pop-Location
          }

      # --------------------------------------------------
      # 7. Prepare vcpkg from upstream baseline
      # --------------------------------------------------
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-upstream"
          $manifestPath = Join-Path $source "vcpkg.json"

          if (!(Test-Path $manifestPath)) {
            throw "Upstream vcpkg.json not found."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline missing from vcpkg.json."
          }

          Write-Host "Ladybird vcpkg baseline: $baseline"

          git clone https://github.com/microsoft/vcpkg.git $vcpkg

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed."
          }

          Push-Location $vcpkg

          try {
            git checkout $baseline

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to checkout vcpkg baseline."
            }

            .\bootstrap-vcpkg.bat -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed."
            }

            $vcpkgCommit = git rev-parse HEAD

            Write-Host "Resolved vcpkg commit: $vcpkgCommit"

            "VCPKG_COMMIT=$vcpkgCommit" >> $env:GITHUB_ENV
          }
          finally {
            Pop-Location
          }

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 8. Clean previous build output
      # --------------------------------------------------
      - name: Clean previous build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"
          $build = Join-Path $source "Build\release"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"

          if (Test-Path $build) {
            Remove-Item $build -Recurse -Force
          }

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Force $dist | Out-Null

      # --------------------------------------------------
      # 9. Configure Ladybird with selected LLVM
      # --------------------------------------------------
      - name: Configure Ladybird
        id: configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"
          $build = Join-Path $source "Build\release"
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
          $overlay = Join-Path $source "Meta\CMake\vcpkg\release-triplets"

          $clangCl = $env:LLVM_CLANG_CL

          if (!(Test-Path $toolchain)) {
            throw "vcpkg toolchain file not found: $toolchain"
          }

          if (!(Test-Path $overlay)) {
            throw "Release triplet directory not found: $overlay"
          }

          if (!(Test-Path $clangCl)) {
            throw "LLVM compiler not found: $clangCl"
          }

          Write-Host "Using compiler: $clangCl"
          & $clangCl --version

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute LLVM compiler."
          }

          $env:CC = $clangCl
          $env:CXX = $clangCl

          cmake -S $source -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER:FILEPATH="$clangCl" `
            -DCMAKE_CXX_COMPILER:FILEPATH="$clangCl" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_ROOT="$env:VCPKG_ROOT" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_TRIPLETS="$overlay" `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::CMake configuration failed. Collecting vcpkg diagnostic logs."

            $angleLogDir = Join-Path $env:VCPKG_ROOT "buildtrees\angle"

            $logs = @(
              (Join-Path $angleLogDir "install-x64-windows-rel-out.log"),
              (Join-Path $angleLogDir "install-x64-windows-rel-err.log")
            )

            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "=================================================="
              Write-Host "ANGLE LOG: $log"
              Write-Host "=================================================="

              if (Test-Path $log) {
                Write-Host "Log size: $((Get-Item $log).Length) bytes"
                Write-Host "----- Last 250 lines -----"

                Get-Content $log -Tail 250

                Write-Host "----- Error matches -----"

                Select-String -Path $log `
                  -Pattern "error:|fatal error|FAILED:|CMake Error|undefined reference|LNK[0-9]+|error C[0-9]+" `
                  -Context 3,5 |
                  Select-Object -Last 80 |
                  ForEach-Object {
                    Write-Host $_
                  }
              }
              else {
                Write-Warning "Log file not found: $log"
              }
            }

            throw "CMake configuration failed. Check build logs above."
          }

      # --------------------------------------------------
      # 10. Verify CMake configuration and compiler
      # --------------------------------------------------
      - name: Verify CMake configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:GITHUB_WORKSPACE "ladybird\Build\release\CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt not found."
          }

          $content = Get-Content $cache -Raw

          $required = @(
            "CMAKE_BUILD_TYPE:STRING=Release",
            "LADYBIRD_BASELINE_CPU_TARGET:BOOL=ON"
          )

          foreach ($item in $required) {
            if ($content -notmatch [regex]::Escape($item)) {
              Write-Warning "CMake cache entry not found exactly: $item"
            }
          }

          $expectedCompiler = [IO.Path]::GetFullPath($env:LLVM_CLANG_CL)
          $expectedCompiler = $expectedCompiler.Replace("\", "/")

          foreach ($variable in @("CMAKE_C_COMPILER", "CMAKE_CXX_COMPILER")) {
            $pattern = "(?m)^" + [regex]::Escape($variable) + ":[^=]*=(.+)$"
            $match = [regex]::Match($content, $pattern)

            if (!$match.Success) {
              throw "$variable was not found in CMakeCache.txt."
            }

            $actualCompiler = $match.Groups[1].Value.Trim().Replace("\", "/")

            Write-Host "$variable = $actualCompiler"

            if ($actualCompiler -ine $expectedCompiler) {
              throw "$variable is not using the expected LLVM compiler. Expected: $expectedCompiler"
            }
          }

          Write-Host "CMake compiler verification passed."

      # --------------------------------------------------
      # 11. Build Ladybird
      # --------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        env:
          CC: ${{ env.LLVM_CLANG_CL }}
          CXX: ${{ env.LLVM_CLANG_CL }}
          RUSTFLAGS: "-A deprecated"
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"
          $build = Join-Path $source "Build\release"

          Push-Location $source

          try {
            Write-Host "Building Ladybird Release..."
            Write-Host "LLVM compiler: $env:LLVM_CLANG_CL"
            Write-Host "LLVM version: $env:LLVM_VERSION"
            Write-Host "MSVC STL: $env:MSVC_STL_VERSION / $env:MSVC_STL_UPDATE"

            cmake --build $build --parallel 4

            if ($LASTEXITCODE -ne 0) {
              throw "Ladybird build failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      # --------------------------------------------------
      # 12. Verify main executable
      # --------------------------------------------------
      - name: Verify main executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $env:GITHUB_WORKSPACE "ladybird\Build\release"

          $exe = Get-ChildItem $build -Recurse -File -Filter "Ladybird.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "Ladybird.exe not found."
          }

          $bytes = [IO.File]::ReadAllBytes($exe.FullName)

          if ($bytes.Length -lt 256) {
            throw "Ladybird.exe is unexpectedly small."
          }

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Invalid PE executable."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
            throw "Invalid PE header offset."
          }

          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw "Invalid PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x8664) {
            throw "Executable is not AMD64."
          }

          Write-Host "Valid Windows x64 executable:"
          Write-Host $exe.FullName

          "LADYBIRD_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 13. Stage runtime package
      # --------------------------------------------------
      - name: Stage runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path $env:GITHUB_WORKSPACE "ladybird"
          $build = Join-Path $source "Build\release"
          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"

          New-Item -ItemType Directory -Force $bin | Out-Null

          # Copy top-level build binaries and runtime DLLs.
          Get-ChildItem $build -File |
            Where-Object {
              $_.Extension -in @(".exe", ".dll")
            } |
            Copy-Item -Destination $bin -Force

          # Copy executable and DLL files from nested build directories.
          $runtimeDirs = @(
            "bin",
            "libexec"
          )

          foreach ($dir in $runtimeDirs) {
            $path = Join-Path $build $dir

            if (Test-Path $path) {
              Get-ChildItem $path -File -Recurse |
                Where-Object {
                  $_.Extension -in @(".exe", ".dll")
                } |
                ForEach-Object {
                  Copy-Item $_.FullName -Destination $bin -Force
                }
            }
          }

          # Ensure main executable is in bin.
          Copy-Item $env:LADYBIRD_EXE -Destination $bin -Force

          # Copy vcpkg runtime DLLs.
          $vcpkgBin = Join-Path $build "vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
              Copy-Item -Destination $bin -Force
          }

          # Copy vcpkg Qt plugins.
          $installed = Join-Path $build "vcpkg_installed"

          if (Test-Path $installed) {
            $pluginDirs = @(
              "platforms",
              "imageformats",
              "styles",
              "iconengines",
              "tls"
            )

            foreach ($pluginDir in $pluginDirs) {
              $matches = Get-ChildItem $installed -Directory -Recurse |
                Where-Object { $_.Name -eq $pluginDir }

              foreach ($match in $matches) {
                $target = Join-Path $bin $pluginDir

                New-Item -ItemType Directory -Force $target | Out-Null

                Get-ChildItem $match.FullName -File -Filter "*.dll" |
                  Copy-Item -Destination $target -Force
              }
            }
          }

          # Copy share and resource directories from build output.
          $resourceDirs = @(
            "share",
            "res",
            "resources"
          )

          foreach ($dir in $resourceDirs) {
            $path = Join-Path $build $dir

            if (Test-Path $path) {
              Copy-Item $path -Destination $package -Recurse -Force
            }
          }

          # Copy ICU data files when present.
          $icuFiles = Get-ChildItem $build -Recurse -File -Filter "*.dat" |
            Where-Object {
              $_.Name -match "icudt" -and
              $_.FullName -notmatch '[\\/]vcpkg_installed[\\/]'
            }

          foreach ($file in $icuFiles) {
            Copy-Item $file.FullName -Destination $bin -Force
          }

          # Copy PDF.js resources, excluding vcpkg's internal package copy.
          $pdfFiles = Get-ChildItem $build -Recurse -File |
            Where-Object {
              $_.FullName -match "pdf\.js|pdfjs" -and
              $_.FullName -notmatch '[\\/]vcpkg_installed[\\/]'
            }

          foreach ($file in $pdfFiles) {
            $relative = $file.FullName.Substring($build.Length).TrimStart("\")
            $target = Join-Path $package $relative
            $targetDir = Split-Path $target -Parent

            New-Item -ItemType Directory -Force $targetDir | Out-Null

            Copy-Item $file.FullName -Destination $target -Force
          }

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Ladybird.exe missing from staged package."
          }

          Write-Host "Runtime staging completed."

      # --------------------------------------------------
      # 14. Clean runtime package
      # --------------------------------------------------
      - name: Clean runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"

          $testPatterns = @(
            '^Test.*\.exe$',
            '^test-.*\.exe$',
            '^test-js-debugger$',
            '^test-js\.py$'
          )

          Get-ChildItem $package -File -Recurse | ForEach-Object {
            $file = $_

            foreach ($pattern in $testPatterns) {
              if ($file.Name -match $pattern) {
                Write-Host "Removing test artifact: $($file.FullName)"
                Remove-Item $file.FullName -Force
                break
              }
            }
          }

          $forbiddenExtensions = @(
            ".obj",
            ".o",
            ".pdb",
            ".ilk",
            ".exp",
            ".pch",
            ".gch",
            ".idb",
            ".ipch",
            ".tlog",
            ".lastbuildstate",
            ".recipe",
            ".lib"
          )

          Get-ChildItem $package -File -Recurse |
            Where-Object {
              $forbiddenExtensions -contains $_.Extension.ToLowerInvariant()
            } |
            ForEach-Object {
              Write-Host "Removing build artifact: $($_.FullName)"
              Remove-Item $_.FullName -Force
            }

          Write-Host "Package cleanup completed."

      # --------------------------------------------------
      # 15. Create launcher
      # --------------------------------------------------
      - name: Create launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $launcher = Join-Path $package "Start-Ladybird.bat"

          @'
          @echo off
          setlocal
          cd /d "%~dp0bin"
          Ladybird.exe %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Path $launcher -Encoding ASCII

      # --------------------------------------------------
      # 16. Generate build information
      # --------------------------------------------------
      - name: Generate build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"

          $rustVersion = (rustc --version | Out-String).Trim()
          $cargoVersion = (cargo --version | Out-String).Trim()
          $pythonVersion = (python --version | Out-String).Trim()
          $cmakeVersion = (cmake --version | Select-Object -First 1)
          $ninjaVersion = (ninja --version | Out-String).Trim()
          $clangVersion = (& $env:LLVM_CLANG_CL --version | Select-Object -First 1)

          $msvcVersion = (cl.exe 2>&1 | Select-Object -First 1)

          $sdkVersion = "Not detected"

          if ($env:WindowsSdkDir) {
            $sdkVersion = $env:WindowsSDKVersion
          }

          $info = @"
          Product: Ladybird for Windows x64
          Source: https://github.com/LadybirdBrowser/ladybird
          Requested ref: ${{ inputs.ref }}
          Commit: $env:LADYBIRD_COMMIT
          Build type: Release

          Compiler: LLVM clang-cl
          Compiler version: $env:LLVM_VERSION
          Compiler path: $env:LLVM_CLANG_CL
          Compiler identification: $clangVersion

          Toolchain: MSVC x64
          MSVC compiler: $msvcVersion
          Windows SDK: $sdkVersion

          MSVC STL version: $env:MSVC_STL_VERSION
          MSVC STL update: $env:MSVC_STL_UPDATE
          STL compatibility probe: $env:STL_COMPATIBILITY_PROBE

          Rust: $rustVersion
          Cargo: $cargoVersion
          Python: $pythonVersion
          CMake: $cmakeVersion
          Ninja: $ninjaVersion

          vcpkg triplet: x64-windows
          vcpkg baseline: $env:VCPKG_BASELINE
          vcpkg commit: $env:VCPKG_COMMIT

          CPU baseline: LADYBIRD_BASELINE_CPU_TARGET=ON
          CMake parallel level: $env:CMAKE_BUILD_PARALLEL_LEVEL

          Built at UTC: $((Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"))
          Packaging repository: $env:GITHUB_REPOSITORY
          Workflow run: $env:GITHUB_RUN_ID

          Notes:
          - Unofficial Windows x64 build.
          - Native Windows support is experimental.
          - Third-party dependencies follow the Ladybird vcpkg baseline.
          - LLVM, Rust, Python, CMake and Ninja use the latest available stable versions at build time.
          - clang-cl was checked against the active MSVC STL using a C++23 compile probe.
          - Keep the bin and share directories together.
          - Runtime stability has not been certified by this workflow.
          "@

          $info | Set-Content (Join-Path $package "BUILD-INFO.txt") -Encoding UTF8

      # --------------------------------------------------
      # 17. Verify package contents
      # --------------------------------------------------
      - name: Verify runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"

          $required = @(
            (Join-Path $bin "Ladybird.exe"),
            (Join-Path $package "Start-Ladybird.bat"),
            (Join-Path $package "BUILD-INFO.txt")
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required package file missing: $file"
            }
          }

          $files = Get-ChildItem $package -Recurse -File

          if ($files.Count -lt 50) {
            throw "Package contains unexpectedly few files: $($files.Count)"
          }

          $dllCount = ($files | Where-Object Extension -eq ".dll").Count
          $exeCount = ($files | Where-Object Extension -eq ".exe").Count

          Write-Host "Package files: $($files.Count)"
          Write-Host "EXE files: $exeCount"
          Write-Host "DLL files: $dllCount"

          if ($dllCount -eq 0) {
            throw "No runtime DLL files found."
          }

          if ($exeCount -lt 2) {
            throw "Expected main and helper executables."
          }

          $qwindows = Get-ChildItem $bin -Recurse -File -Filter "qwindows.dll"

          if (!$qwindows) {
            throw "Qt Windows platform plugin qwindows.dll missing."
          }

          $qtCore = Get-ChildItem $bin -File -Filter "Qt6Core.dll"

          if (!$qtCore) {
            throw "Qt6Core.dll missing."
          }

          Write-Host "Runtime package verification passed."

      # --------------------------------------------------
      # 18. Generate inventory
      # --------------------------------------------------
      - name: Generate package inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $inventory = Join-Path $package "PACKAGE-INVENTORY.txt"

          Get-ChildItem $package -Recurse -File |
            Where-Object { $_.FullName -ne $inventory } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($package.Length).TrimStart("\")
              "{0}`t{1}" -f $relative, $_.Length
            } |
            Set-Content $inventory -Encoding UTF8

      # --------------------------------------------------
      # 19. Generate dependency report
      # --------------------------------------------------
      - name: Generate dependency report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $report = Join-Path $package "DEPENDENCY-REPORT.txt"

          "Ladybird Windows x64 dependency report" |
            Set-Content $report -Encoding UTF8

          Get-ChildItem $bin -File -Filter "*.exe" |
            ForEach-Object {
              Add-Content $report "`n========================================"
              Add-Content $report "Executable: $($_.Name)"

              $output = & dumpbin /dependents $_.FullName 2>&1

              Add-Content $report ($output | Out-String)
            }

          Get-ChildItem $bin -File -Filter "*.dll" |
            ForEach-Object {
              Add-Content $report "`n========================================"
              Add-Content $report "DLL: $($_.Name)"

              $output = & dumpbin /dependents $_.FullName 2>&1

              Add-Content $report ($output | Out-String)
            }

      # --------------------------------------------------
      # 20. Create ZIP
      # --------------------------------------------------
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist\$env:PACKAGE_NAME"
          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path (Join-Path $package "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          $file = Get-Item $zip

          Write-Host "ZIP size: $([math]::Round($file.Length / 1MB, 2)) MB"

          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 21. Verify ZIP integrity
      # --------------------------------------------------
      - name: Verify ZIP integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [IO.Compression.ZipFile]::OpenRead($zip)

          try {
            if ($archive.Entries.Count -lt 50) {
              throw "ZIP contains too few entries."
            }

            $names = $archive.Entries.FullName

            if ($names -notcontains "bin/Ladybird.exe") {
              throw "Ladybird.exe missing from ZIP."
            }

            if ($names -notcontains "Start-Ladybird.bat") {
              throw "Launcher missing from ZIP."
            }

            Write-Host "ZIP entries: $($archive.Entries.Count)"
            Write-Host "ZIP integrity check passed."
          }
          finally {
            $archive.Dispose()
          }

      # --------------------------------------------------
      # 22. SHA256
      # --------------------------------------------------
      - name: Generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"

          $hash = Get-FileHash $zip -Algorithm SHA256
          $hashText = "$($hash.Hash)  $env:PACKAGE_NAME.zip"

          $hashText | Set-Content "$zip.sha256" -Encoding ASCII

          Write-Host $hashText

      # --------------------------------------------------
      # 23. Upload build artifact
      # --------------------------------------------------
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            Ladybird-Windows-x64.zip
            Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # --------------------------------------------------
      # 24. Upload audit reports
      # --------------------------------------------------
      - name: Upload package audit
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-Audit
          path: |
            dist/Ladybird-Windows-x64/BUILD-INFO.txt
            dist/Ladybird-Windows-x64/PACKAGE-INVENTORY.txt
            dist/Ladybird-Windows-x64/DEPENDENCY-REPORT.txt
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 25. Optional GitHub Release
      # --------------------------------------------------
      - name: Set release tag
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $tag = "windows-${{ github.run_number }}-$env:LADYBIRD_SHORT_COMMIT"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Ladybird Windows x64 ${{ env.RELEASE_TAG }}"
          prerelease: true
          generate_release_notes: true
          files: |
            Ladybird-Windows-x64.zip
            Ladybird-Windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
