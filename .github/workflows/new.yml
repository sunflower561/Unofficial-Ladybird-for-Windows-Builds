
name: Build Ladybird for Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit SHA"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish a GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PACKAGE_NAME: Ladybird-Windows-x64
      LLVM_VERSION: "22.1.8"
      BUILD_CONFIGURATION: Release
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: 1

    steps:
      # ------------------------------------------------------------
      # 1. Checkout this workflow repository
      # ------------------------------------------------------------
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Fetch the requested Ladybird upstream ref
      # ------------------------------------------------------------
      - name: Fetch Ladybird upstream
        shell: pwsh
        env:
          LADYBIRD_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:LADYBIRD_REF)) {
            throw "The upstream ref input is empty."
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "ladybird"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          git clone --no-checkout https://github.com/LadybirdBrowser/ladybird.git $destination

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Ladybird."
          }

          Push-Location $destination
          try {
            git fetch --force origin $env:LADYBIRD_REF

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch upstream ref: $env:LADYBIRD_REF"
            }

            git checkout --detach FETCH_HEAD

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout upstream ref."
            }

            $commit = (git rev-parse HEAD).Trim()
            $shortCommit = (git rev-parse --short HEAD).Trim()
            $branch = (git branch --show-current).Trim()

            "LADYBIRD_COMMIT=$commit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LADYBIRD_SHORT_COMMIT=$shortCommit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LADYBIRD_REQUESTED_REF=$env:LADYBIRD_REF" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

            Write-Host "Ladybird ref: $env:LADYBIRD_REF"
            Write-Host "Ladybird commit: $commit"
            Write-Host "Short commit: $shortCommit"
          }
          finally {
            Pop-Location
          }

      # ------------------------------------------------------------
      # 3. Set up Python and Rust
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 4. Install build tools
      # ------------------------------------------------------------
      - name: Install Ninja NASM and pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey build-tool installation failed."
          }

      - name: Setup LLVM
        uses: llvm-actions/setup-llvm@v1
        with:
          version: "22.1.8"

      # ------------------------------------------------------------
      # 5. Set up MSVC
      # Do not specify toolset 14.52: the runner selects its
      # installed toolset automatically.
      # ------------------------------------------------------------
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify compiler and build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tools = @(
            "cl",
            "clang-cl",
            "clang",
            "cmake",
            "ninja",
            "python",
            "rustc",
            "cargo",
            "nasm",
            "git"
          )

          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue

            if ($null -eq $command) {
              throw "Required tool not found: $tool"
            }

            Write-Host "$tool : $($command.Source)"
          }

          Write-Host "`nMSVC version:"
          cl

          Write-Host "`nLLVM version:"
          clang-cl --version

          Write-Host "`nCMake version:"
          cmake --version

          Write-Host "`nNinja version:"
          ninja --version

          Write-Host "`nPython version:"
          python --version

          Write-Host "`nRust version:"
          rustc --version

      # ------------------------------------------------------------
      # 6. Setup private vcpkg
      # Never clone into Visual Studio's built-in VC\vcpkg.
      # ------------------------------------------------------------
      - name: Setup private vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $vcpkgRoot = Join-Path $workspace ".vcpkg-upstream"
          $manifestPath = Join-Path $workspace "ladybird/vcpkg.json"

          Write-Host "Workspace: $workspace"
          Write-Host "Private vcpkg: $vcpkgRoot"
          Write-Host "Runner VCPKG_ROOT: $env:VCPKG_ROOT"

          if (!(Test-Path $manifestPath)) {
            throw "Ladybird vcpkg.json not found."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline is missing from Ladybird vcpkg.json."
          }

          Write-Host "Required vcpkg baseline: $baseline"

          # Only remove our workspace-local checkout.
          if (Test-Path $vcpkgRoot) {
            Remove-Item $vcpkgRoot -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone private vcpkg."
          }

          Push-Location $vcpkgRoot
          try {
            git checkout --detach $baseline

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout vcpkg baseline $baseline."
            }
          }
          finally {
            Pop-Location
          }

          $bootstrap = Join-Path $vcpkgRoot "bootstrap-vcpkg.bat"

          if (!(Test-Path $bootstrap)) {
            throw "vcpkg bootstrap script not found."
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $toolchain = Join-Path $vcpkgRoot "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $vcpkgExe)) {
            throw "Private vcpkg.exe was not generated."
          }

          if (!(Test-Path $toolchain)) {
            throw "Private vcpkg CMake toolchain is missing."
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_EXE=$vcpkgExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TOOLCHAIN=$toolchain" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Private vcpkg setup completed."

      - name: Verify private vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path $env:VCPKG_EXE)) {
            throw "Private vcpkg executable missing."
          }

          if (!(Test-Path $env:VCPKG_TOOLCHAIN)) {
            throw "Private vcpkg toolchain missing."
          }

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_TOOLCHAIN=$env:VCPKG_TOOLCHAIN"

          & $env:VCPKG_EXE version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version check failed."
          }

      # ------------------------------------------------------------
      # 7. Configure Ladybird
      # ------------------------------------------------------------
      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $source = Join-Path $workspace "ladybird"
          $build = Join-Path $source "Build/release"

          $overlayPorts = Join-Path $source "Meta/CMake/vcpkg/overlay-ports"
          $overlayTriplets = Join-Path $source "Meta/CMake/vcpkg/release-triplets"

          if (!(Test-Path $overlayPorts)) {
            throw "Ladybird overlay ports directory not found: $overlayPorts"
          }

          if (!(Test-Path $overlayTriplets)) {
            throw "Ladybird release triplets directory not found: $overlayTriplets"
          }

          New-Item -ItemType Directory -Force -Path $build | Out-Null

          $configureLog = Join-Path $workspace "configure.log"

          $arguments = @(
            "-S", $source,
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_TOOLCHAIN",
            "-DVCPKG_ROOT=$env:VCPKG_ROOT",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DVCPKG_HOST_TRIPLET=x64-windows",
            "-DVCPKG_OVERLAY_PORTS=$overlayPorts",
            "-DVCPKG_OVERLAY_TRIPLETS=$overlayTriplets",
            "-DVCPKG_MANIFEST_MODE=ON",
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON"
          )

          Write-Host "Configuring Ladybird..."
          Write-Host "Source: $source"
          Write-Host "Build: $build"
          Write-Host "Toolchain: $env:VCPKG_TOOLCHAIN"
          Write-Host "Overlay ports: $overlayPorts"
          Write-Host "Overlay triplets: $overlayTriplets"

          & cmake @arguments 2>&1 | Tee-Object -FilePath $configureLog

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed."
          }

          "LADYBIRD_BUILD_DIR=$build" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ------------------------------------------------------------
      # 8. Validate CMake configuration without assuming cache types
      # ------------------------------------------------------------
      - name: Validate CMake configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:LADYBIRD_BUILD_DIR "CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt not found."
          }

          $lines = Get-Content $cache

          function Get-CMakeCacheValue {
            param([string]$Name)

            $pattern = "^$([regex]::Escape($Name)):[^=]+=(.*)$"
            $line = $lines |
              Where-Object { $_ -match $pattern } |
              Select-Object -First 1

            if ($null -eq $line) {
              return $null
            }

            return ($line -replace '^.*?=', '')
          }

          $checks = @{
            "CMAKE_GENERATOR" = "Ninja"
            "CMAKE_BUILD_TYPE" = "Release"
            "CMAKE_TOOLCHAIN_FILE" = $env:VCPKG_TOOLCHAIN
            "VCPKG_ROOT" = $env:VCPKG_ROOT
          }

          foreach ($name in $checks.Keys) {
            $actual = Get-CMakeCacheValue $name

            if ([string]::IsNullOrWhiteSpace($actual)) {
              throw "CMake cache entry missing: $name"
            }

            Write-Host "$name = $actual"

            if ($actual -ne $checks[$name]) {
              throw "Unexpected CMake cache value for $name."
            }
          }

          $baseline = Get-CMakeCacheValue "LADYBIRD_BASELINE_CPU_TARGET"

          if ($null -ne $baseline) {
            Write-Host "LADYBIRD_BASELINE_CPU_TARGET = $baseline"
          }
          else {
            Write-Warning "Baseline option is not present in CMakeCache. The configure argument was supplied, but this alone does not prove the option is consumed by this source revision."
          }

      # ------------------------------------------------------------
      # 9. Build
      # ------------------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"

          $jobs = [Environment]::ProcessorCount
          if ($jobs -lt 1) {
            $jobs = 2
          }

          Write-Host "Building with $jobs parallel jobs."

          cmake --build $env:LADYBIRD_BUILD_DIR --parallel $jobs 2>&1 |
            Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # ------------------------------------------------------------
      # 10. Stage runtime package
      # ------------------------------------------------------------
      - name: Stage Ladybird runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $build = $env:LADYBIRD_BUILD_DIR
          $package = Join-Path $workspace "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $share = Join-Path $package "share/Lagom"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType Directory -Force -Path $share | Out-Null

          # Find the actual runtime bin directory.
          $sourceBin = Join-Path $build "bin"

          if (!(Test-Path (Join-Path $sourceBin "Ladybird.exe"))) {
            $sourceBin = $build
          }

          if (!(Test-Path (Join-Path $sourceBin "Ladybird.exe"))) {
            $found = Get-ChildItem $build -Filter "Ladybird.exe" -File -Recurse |
              Select-Object -First 1

            if ($null -eq $found) {
              throw "Ladybird.exe not found in build output."
            }

            $sourceBin = $found.Directory.FullName
          }

          Write-Host "Runtime binary source: $sourceBin"

          # Copy runtime files from the actual binary output directory.
          Get-ChildItem $sourceBin -File |
            Copy-Item -Destination $bin -Force

          # Copy Qt plugin directories.
          $pluginDirs = @(
            "platforms",
            "imageformats",
            "generic",
            "networkinformation",
            "position",
            "styles",
            "tls"
          )

          foreach ($directory in $pluginDirs) {
            $source = Join-Path $sourceBin $directory

            if (Test-Path $source) {
              Copy-Item $source -Destination $bin -Recurse -Force
            }
          }

          # Find installed share/Lagom resource tree first.
          $sourceShare = Join-Path $build "share/Lagom"

          if (!(Test-Path $sourceShare)) {
            $sourceShare = Join-Path $build "share/Lagom"
          }

          if (Test-Path $sourceShare) {
            Write-Host "Using installed resource tree: $sourceShare"
            Get-ChildItem $sourceShare -Force |
              Copy-Item -Destination $share -Recurse -Force
          }
          else {
            # Fallback for build trees which contain source resources.
            $resourceCandidates = @(
              (Join-Path $build "ladybird/Base/res"),
              (Join-Path $workspace "ladybird/Base/res")
            )

            $sourceResources = $resourceCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if ($null -eq $sourceResources) {
              throw "Neither share/Lagom nor Ladybird Base/res resources were found."
            }

            Write-Host "Using source resource tree: $sourceResources"

            $resourceLadybird = Join-Path $share "ladybird"
            New-Item -ItemType Directory -Force -Path $resourceLadybird | Out-Null

            Get-ChildItem $sourceResources -Force |
              Copy-Item -Destination $resourceLadybird -Recurse -Force
          }

          # If the installed layout has fonts/icons/themes directly under
          # share/Lagom, keep that layout. Do not create a second nested tree.

          # ICU runtime data: search build output and private vcpkg tree.
          $icuSearchRoots = @(
            $build,
            $env:VCPKG_ROOT
          ) | Where-Object { Test-Path $_ }

          $icuFiles = @()

          foreach ($searchRoot in $icuSearchRoots) {
            $icuFiles += Get-ChildItem $searchRoot -Filter "icudt*.dat" -File -Recurse -ErrorAction SilentlyContinue
          }

          $icuFiles = @(
            $icuFiles |
              Sort-Object FullName -Unique
          )

          if ($icuFiles.Count -eq 0) {
            throw "No icudt*.dat file found. The known runtime error requires ICU data; refusing to publish an incomplete package."
          }

          $icuDestination = Join-Path $share "icu"
          New-Item -ItemType Directory -Force -Path $icuDestination | Out-Null

          foreach ($icu in $icuFiles) {
            Copy-Item $icu.FullName -Destination $icuDestination -Force
            Write-Host "Included ICU data: $($icu.Name)"
          }

          # Include launcher.
          $launcher = @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "LADYBIRD_ICU_DATA=%~dp0share\Lagom\icu"
          start "" "%~dp0bin\Ladybird.exe" %*
          '@

          Set-Content -Path (Join-Path $package "Start-Ladybird.bat") -Value $launcher -Encoding ASCII

          Write-Host "Runtime staging completed."
          Write-Host "Package: $package"

      # ------------------------------------------------------------
      # 11. Remove tests and build artifacts
      # ------------------------------------------------------------
      - name: Clean runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"

          # Test executables are not part of the browser runtime.
          $testFiles = @(
            Get-ChildItem $bin -Filter "*.exe" -File -Recurse |
              Where-Object {
                $_.Name -match '^(Test.*|test-.*)\.exe$'
              }
          )

          foreach ($file in $testFiles) {
            Write-Host "Removing test executable: $($file.FullName)"
            Remove-Item $file.FullName -Force
          }

          # Remove development/debug artifacts, not runtime DLLs.
          $forbiddenExtensions = @(
            ".obj",
            ".o",
            ".pdb",
            ".ilk",
            ".exp",
            ".pch",
            ".gch",
            ".idb",
            ".ipch",
            ".tlog",
            ".lastbuildstate",
            ".recipe"
          )

          $badFiles = @(
            Get-ChildItem $package -File -Recurse |
              Where-Object {
                $forbiddenExtensions -contains $_.Extension.ToLowerInvariant()
              }
          )

          foreach ($file in $badFiles) {
            Write-Host "Removing build artifact: $($file.FullName)"
            Remove-Item $file.FullName -Force
          }

          # Remove CMake/Ninja build directories if accidentally copied.
          $forbiddenDirectories = @(
            "CMakeFiles",
            "Testing",
            "_deps"
          )

          foreach ($name in $forbiddenDirectories) {
            $directories = @(
              Get-ChildItem $package -Directory -Recurse |
                Where-Object { $_.Name -eq $name }
            )

            foreach ($directory in $directories) {
              Write-Host "Removing build directory: $($directory.FullName)"
              Remove-Item $directory.FullName -Recurse -Force
            }
          }

          # Never delete DLLs indiscriminately.
          Write-Host "Package cleanup completed."

      # ------------------------------------------------------------
      # 12. Validate required runtime files and resources
      # ------------------------------------------------------------
      - name: Validate runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $share = Join-Path $package "share/Lagom"

          $requiredExecutables = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "ImageDecoder.exe",
            "RequestServer.exe",
            "Hub.exe",
            "MediaServer.exe",
            "AudioServer.exe",
            "VideoDecoderServer.exe",
            "WebRTCClient.exe"
          )

          foreach ($name in $requiredExecutables) {
            if (!(Test-Path (Join-Path $bin $name))) {
              throw "Missing required runtime executable: $name"
            }
          }

          $requiredQtPlugins = @(
            "platforms/qwindows.dll",
            "imageformats/qjpeg.dll",
            "imageformats/qgif.dll",
            "imageformats/qico.dll"
          )

          foreach ($plugin in $requiredQtPlugins) {
            if (!(Test-Path (Join-Path $bin $plugin))) {
              throw "Missing Qt plugin: $plugin"
            }
          }

          $requiredResources = @(
            "fonts/SerenitySans-Regular.ttf",
            "fonts/NotoEmoji.ttf",
            "icons/48x48/app-browser.png",
            "ladybird/about-pages/newtab.html",
            "ladybird/about-pages/settings.html",
            "ladybird/about-pages/welcome.html",
            "ladybird/ladybird.css",
            "ladybird/utils.js",
            "ladybird/WebCompat.json"
          )

          foreach ($resource in $requiredResources) {
            if (!(Test-Path (Join-Path $share $resource))) {
              throw "Missing runtime resource: $resource"
            }
          }

          $icu = @(
            Get-ChildItem (Join-Path $share "icu") -Filter "icudt*.dat" -File -ErrorAction SilentlyContinue
          )

          if ($icu.Count -eq 0) {
            throw "ICU data file is missing from share/Lagom/icu."
          }

          # PDF.js must be complete if this source revision includes it.
          $pdfRoot = Join-Path $share "ladybird/pdfjs"

          if (Test-Path $pdfRoot) {
            $pdfRequired = @(
              "build/pdf.mjs",
              "build/pdf.worker.mjs",
              "build/pdf.sandbox.mjs",
              "web/viewer.html",
              "web/viewer.mjs",
              "web/viewer.css"
            )

            foreach ($item in $pdfRequired) {
              if (!(Test-Path (Join-Path $pdfRoot $item))) {
                throw "PDF.js component missing: $item"
              }
            }
          }
          else {
            Write-Warning "PDF.js resource directory not found in this source revision."
          }

          Write-Host "Runtime file validation passed."

      # ------------------------------------------------------------
      # 13. Generate build information and package inventory
      # ------------------------------------------------------------
      - name: Generate build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"

          $buildInfo = @(
            "Product: Ladybird for Windows x64"
            "Requested upstream ref: $env:LADYBIRD_REQUESTED_REF"
            "Upstream commit: $env:LADYBIRD_COMMIT"
            "Short commit: $env:LADYBIRD_SHORT_COMMIT"
            "Build configuration: Release"
            "LLVM version: $env:LLVM_VERSION"
            "vcpkg root: workspace-local .vcpkg-upstream"
            "Triplet: x64-windows"
            "CPU baseline option: LADYBIRD_BASELINE_CPU_TARGET=ON"
            "Built at UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "Repository: https://github.com/LadybirdBrowser/ladybird"
            "Packaging repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )

          Set-Content (Join-Path $package "BUILD-INFO.txt") $buildInfo -Encoding UTF8

          $inventory = Join-Path $package "PACKAGE-INVENTORY.txt"

          Get-ChildItem $package -File -Recurse |
            Where-Object {
              $_.Name -ne "PACKAGE-INVENTORY.txt"
            } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($package.Length).TrimStart('\')
              "$relative`t$($_.Length)"
            } |
            Set-Content $inventory -Encoding UTF8

          $files = @(Get-ChildItem $package -File -Recurse)
          $totalBytes = ($files | Measure-Object Length -Sum).Sum

          Write-Host "Package files: $($files.Count)"
          Write-Host "Package size: $([math]::Round($totalBytes / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # 14. DLL dependency report
      # This records direct imports. It is not a complete substitute
      # for runtime testing of dynamically loaded DLLs.
      # ------------------------------------------------------------
      - name: Generate DLL dependency report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $report = Join-Path $package "DEPENDENCY-REPORT.txt"

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue

          if ($null -eq $dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath

              if ($vsPath) {
                $candidate = Join-Path $vsPath "VC/Tools/MSVC"
                $dumpbin = Get-ChildItem $candidate -Filter dumpbin.exe -File -Recurse |
                  Where-Object { $_.FullName -match "\\Hostx64\\x64\\" } |
                  Select-Object -First 1
              }
            }
          }

          if ($null -eq $dumpbin) {
            "dumpbin.exe not found; dependency scan unavailable." |
              Set-Content $report -Encoding UTF8
            Write-Warning "Could not locate dumpbin.exe."
            return
          }

          $dumpbinPath = if ($dumpbin.Source) { $dumpbin.Source } else { $dumpbin.FullName }

          $binaries = Get-ChildItem $bin -File -Recurse |
            Where-Object {
              $_.Extension -in @(".exe", ".dll")
            }

          $output = New-Object System.Collections.Generic.List[string]

          foreach ($binary in $binaries) {
            $output.Add("")
            $output.Add("==================================================")
            $output.Add($binary.FullName)
            $output.Add("==================================================")

            $result = & $dumpbinPath /nologo /dependents $binary.FullName 2>&1

            foreach ($line in $result) {
              $output.Add([string]$line)
            }
          }

          $output | Set-Content $report -Encoding UTF8

          Write-Host "Dependency report generated: $report"

      # ------------------------------------------------------------
      # 15. Package size summary
      # ------------------------------------------------------------
      - name: Summarize package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"

          Write-Host "`nLargest package files:"
          Get-ChildItem $package -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 30 FullName,
              @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table -AutoSize

          Write-Host "`nFile extension summary:"
          Get-ChildItem $package -File -Recurse |
            Group-Object Extension |
            Sort-Object Count -Descending |
            Select-Object Name, Count |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # 16. Create ZIP and SHA256
      # ------------------------------------------------------------
      - name: Create Windows x64 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $package = Join-Path $workspace "dist/$env:PACKAGE_NAME"
          $zip = Join-Path $workspace "dist/$env:PACKAGE_NAME.zip"

          if (!(Test-Path (Join-Path $package "bin/Ladybird.exe"))) {
            throw "Cannot create ZIP: Ladybird.exe is missing."
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP archive was not created."
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE_NAME.zip" |
            Set-Content "$zip.sha256" -Encoding ASCII

          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"
          Write-Host "ZIP size: $([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB"

      # ------------------------------------------------------------
      # 17. Upload GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package audit reports
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-audit
          path: |
            dist/Ladybird-Windows-x64/BUILD-INFO.txt
            dist/Ladybird-Windows-x64/PACKAGE-INVENTORY.txt
            dist/Ladybird-Windows-x64/DEPENDENCY-REPORT.txt
            configure.log
            build.log
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # 18. Optional GitHub Pre-release
      # ------------------------------------------------------------
      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}-${{ env.LADYBIRD_SHORT_COMMIT }}
          name: Ladybird Windows x64 - Build ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 19. Collect failure diagnostics
      # ------------------------------------------------------------
      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = $env:GITHUB_WORKSPACE
          $diagnostics = Join-Path $workspace "diagnostics"

          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          $logs = @(
            "configure.log",
            "build.log"
          )

          foreach ($log in $logs) {
            $path = Join-Path $workspace $log

            if (Test-Path $path) {
              Copy-Item $path $diagnostics -Force
            }
          }

          $vcpkgBuildtrees = Join-Path $workspace ".vcpkg-upstream/buildtrees"

          if (Test-Path $vcpkgBuildtrees) {
            $patterns = @(
              "*-out.log",
              "*-err.log",
              "meson-log.txt",
              "config.log",
              "CMakeCache.txt"
            )

            foreach ($pattern in $patterns) {
              Get-ChildItem $vcpkgBuildtrees -Filter $pattern -File -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $safeName = ($_.FullName.Substring($vcpkgBuildtrees.Length)).TrimStart('\') -replace '[\\/:*?"<>|]', '_'
                  Copy-Item $_.FullName (Join-Path $diagnostics $safeName) -Force
                }
            }
          }

          $buildDir = Join-Path $workspace "ladybird/Build/release"

          if (Test-Path (Join-Path $buildDir "CMakeCache.txt")) {
            Copy-Item (Join-Path $buildDir "CMakeCache.txt") $diagnostics -Force
          }

          if (Test-Path $diagnostics) {
            Get-ChildItem $diagnostics -File |
              Select-Object Name, Length |
              Format-Table -AutoSize
          }

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-failure-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
