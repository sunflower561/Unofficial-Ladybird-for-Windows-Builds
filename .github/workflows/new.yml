
name: Build Ladybird for Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird upstream branch, tag, or commit SHA"
        required: true
        default: "master"
        type: string
      publish_release:
        description: "Publish GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Ladybird Windows x64
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PACKAGE_NAME: Ladybird-Windows-x64
      LLVM_VERSION: "22.1.8"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: 1

    steps:
      # ----------------------------------------------------------
      # 1. Checkout packaging repository
      # ----------------------------------------------------------
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Checkout requested Ladybird upstream ref
      # ----------------------------------------------------------
      - name: Fetch Ladybird upstream
        shell: pwsh
        env:
          LADYBIRD_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:LADYBIRD_REF)) {
            throw "Upstream ref is empty."
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "ladybird"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          git clone --no-checkout https://github.com/LadybirdBrowser/ladybird.git $destination

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird clone failed."
          }

          Push-Location $destination
          try {
            git fetch --force origin $env:LADYBIRD_REF

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch ref: $env:LADYBIRD_REF"
            }

            git checkout --detach FETCH_HEAD

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout requested ref."
            }

            $commit = (git rev-parse HEAD).Trim()
            $shortCommit = (git rev-parse --short HEAD).Trim()

            "LADYBIRD_COMMIT=$commit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LADYBIRD_SHORT_COMMIT=$shortCommit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LADYBIRD_REQUESTED_REF=$env:LADYBIRD_REF" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

            Write-Host "Requested ref: $env:LADYBIRD_REF"
            Write-Host "Commit: $commit"
          }
          finally {
            Pop-Location
          }

      # ----------------------------------------------------------
      # 3. Python and Rust
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ----------------------------------------------------------
      # 4. Build tools
      # ----------------------------------------------------------
      - name: Install Ninja NASM and pkg-config
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja nasm pkgconfiglite -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Build tool installation failed."
          }

      # ----------------------------------------------------------
      # 5. LLVM 22.1.8
      # ----------------------------------------------------------
      - name: Install LLVM 22.1.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install llvm --version=22.1.8 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "LLVM 22.1.8 installation failed."
          }

          $llvmBin = "C:\Program Files\LLVM\bin"
          $clangCl = Join-Path $llvmBin "clang-cl.exe"

          if (!(Test-Path $clangCl)) {
            throw "clang-cl.exe not found: $clangCl"
          }

          "LLVM_BIN=$llvmBin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $clangCl = Join-Path $env:LLVM_BIN "clang-cl.exe"

          $version = & $clangCl --version 2>&1
          $version | Write-Host

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl execution failed."
          }

          $versionText = $version -join "`n"

          if ($versionText -notmatch "22\.1\.8") {
            throw "Expected LLVM 22.1.8."
          }

          Write-Host "LLVM version verified."

      # ----------------------------------------------------------
      # 6. MSVC
      # ----------------------------------------------------------
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tools = @(
            "cl",
            "clang-cl",
            "cmake",
            "ninja",
            "python",
            "rustc",
            "cargo",
            "nasm",
            "git"
          )

          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue

            if ($null -eq $command) {
              throw "Required tool missing: $tool"
            }

            Write-Host "$tool : $($command.Source)"
          }

          cl
          clang-cl --version
          cmake --version
          ninja --version
          python --version
          rustc --version

      # ----------------------------------------------------------
      # 7. Private vcpkg
      # ----------------------------------------------------------
      - name: Setup private vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $vcpkgRoot = Join-Path $workspace ".vcpkg-upstream"
          $manifestPath = Join-Path $workspace "ladybird/vcpkg.json"

          Write-Host "Workspace: $workspace"
          Write-Host "Private vcpkg root: $vcpkgRoot"
          Write-Host "Runner VCPKG_ROOT: $env:VCPKG_ROOT"

          if (!(Test-Path $manifestPath)) {
            throw "Ladybird vcpkg.json not found."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "Ladybird builtin-baseline is missing."
          }

          Write-Host "vcpkg baseline: $baseline"

          if (Test-Path $vcpkgRoot) {
            Remove-Item $vcpkgRoot -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Private vcpkg clone failed."
          }

          Push-Location $vcpkgRoot
          try {
            git checkout --detach $baseline

            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg baseline checkout failed."
            }
          }
          finally {
            Pop-Location
          }

          $bootstrap = Join-Path $vcpkgRoot "bootstrap-vcpkg.bat"

          if (!(Test-Path $bootstrap)) {
            throw "vcpkg bootstrap script missing."
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $toolchain = Join-Path $vcpkgRoot "scripts/buildsystems/vcpkg.cmake"

          if (!(Test-Path $vcpkgExe)) {
            throw "Private vcpkg.exe missing."
          }

          if (!(Test-Path $toolchain)) {
            throw "Private vcpkg CMake toolchain missing."
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_EXE=$vcpkgExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_TOOLCHAIN=$toolchain" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Private vcpkg setup completed."

      - name: Verify private vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_TOOLCHAIN=$env:VCPKG_TOOLCHAIN"

          if (!(Test-Path $env:VCPKG_EXE)) {
            throw "Private vcpkg executable missing."
          }

          if (!(Test-Path $env:VCPKG_TOOLCHAIN)) {
            throw "Private vcpkg toolchain missing."
          }

          & $env:VCPKG_EXE version

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg version check failed."
          }

      # ----------------------------------------------------------
      # 8. Configure Ladybird
      # ----------------------------------------------------------
      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $source = Join-Path $workspace "ladybird"
          $build = Join-Path $source "Build/release"

          $overlayPorts = Join-Path $source "Meta/CMake/vcpkg/overlay-ports"
          $overlayTriplets = Join-Path $source "Meta/CMake/vcpkg/release-triplets"

          if (!(Test-Path $overlayPorts)) {
            throw "Overlay ports directory not found: $overlayPorts"
          }

          if (!(Test-Path $overlayTriplets)) {
            throw "Release triplets directory not found: $overlayTriplets"
          }

          New-Item -ItemType Directory -Force -Path $build | Out-Null

          $arguments = @(
            "-S", $source,
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_TOOLCHAIN",
            "-DVCPKG_ROOT=$env:VCPKG_ROOT",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DVCPKG_HOST_TRIPLET=x64-windows",
            "-DVCPKG_OVERLAY_PORTS=$overlayPorts",
            "-DVCPKG_OVERLAY_TRIPLETS=$overlayTriplets",
            "-DVCPKG_MANIFEST_MODE=ON",
            "-DLADYBIRD_BASELINE_CPU_TARGET=ON"
          )

          Write-Host "Source: $source"
          Write-Host "Build: $build"
          Write-Host "Toolchain: $env:VCPKG_TOOLCHAIN"
          Write-Host "vcpkg root: $env:VCPKG_ROOT"

          & cmake @arguments 2>&1 | Tee-Object -FilePath "$workspace/configure.log"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed."
          }

          "LADYBIRD_BUILD_DIR=$build" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ----------------------------------------------------------
      # 9. Validate CMake configuration
      # Normalize Windows paths before comparing.
      # ----------------------------------------------------------
      - name: Validate CMake configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = Join-Path $env:LADYBIRD_BUILD_DIR "CMakeCache.txt"

          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt missing."
          }

          $lines = Get-Content $cache

          function Get-CMakeCacheValue {
            param([string]$Name)

            $pattern = "^$([regex]::Escape($Name)):[^=]+=(.*)$"

            $line = $lines |
              Where-Object { $_ -match $pattern } |
              Select-Object -First 1

            if ($null -eq $line) {
              return $null
            }

            return ($line -replace '^.*?=', '').Trim()
          }

          function Normalize-PathValue {
            param([string]$Value)

            if ([string]::IsNullOrWhiteSpace($Value)) {
              return ""
            }

            $normalized = $Value.Trim().Replace('\', '/')

            while ($normalized.Contains('//')) {
              $normalized = $normalized.Replace('//', '/')
            }

            return $normalized.TrimEnd('/').ToLowerInvariant()
          }

          $checks = @{
            "CMAKE_GENERATOR" = "Ninja"
            "CMAKE_BUILD_TYPE" = "Release"
          }

          foreach ($name in $checks.Keys) {
            $actual = Get-CMakeCacheValue $name

            Write-Host "$name = $actual"

            if ($actual -ne $checks[$name]) {
              throw "Unexpected CMake cache value: $name"
            }
          }

          $pathChecks = @{
            "CMAKE_TOOLCHAIN_FILE" = $env:VCPKG_TOOLCHAIN
            "VCPKG_ROOT" = $env:VCPKG_ROOT
          }

          foreach ($name in $pathChecks.Keys) {
            $actual = Get-CMakeCacheValue $name
            $expected = $pathChecks[$name]

            Write-Host "$name (cache)    = $actual"
            Write-Host "$name (expected) = $expected"

            if ([string]::IsNullOrWhiteSpace($actual)) {
              throw "CMake cache entry missing: $name"
            }

            $actualNormalized = Normalize-PathValue $actual
            $expectedNormalized = Normalize-PathValue $expected

            if ($actualNormalized -ne $expectedNormalized) {
              throw "Unexpected CMake cache path: $name"
            }
          }

          $baseline = Get-CMakeCacheValue "LADYBIRD_BASELINE_CPU_TARGET"

          if ($null -ne $baseline) {
            Write-Host "LADYBIRD_BASELINE_CPU_TARGET = $baseline"
          }
          else {
            Write-Warning "CPU baseline option is not present in CMakeCache. Its actual consumption by this source revision is not verified."
          }

          Write-Host "CMake configuration validation passed."

      # ----------------------------------------------------------
      # 10. Build
      # ----------------------------------------------------------
      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"
          $jobs = [Environment]::ProcessorCount

          if ($jobs -lt 1) {
            $jobs = 2
          }

          Write-Host "Parallel jobs: $jobs"

          cmake --build $env:LADYBIRD_BUILD_DIR --parallel $jobs 2>&1 |
            Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed."
          }

      # ----------------------------------------------------------
      # 11. Stage runtime binaries and resources
      # ----------------------------------------------------------
      - name: Stage Ladybird runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $build = $env:LADYBIRD_BUILD_DIR
          $package = Join-Path $workspace "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $share = Join-Path $package "share/Lagom"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType Directory -Force -Path $share | Out-Null

          $mainExe = Get-ChildItem $build -Filter "Ladybird.exe" -File -Recurse |
            Select-Object -First 1

          if ($null -eq $mainExe) {
            throw "Ladybird.exe not found."
          }

          $sourceBin = $mainExe.Directory.FullName

          Write-Host "Runtime binary directory: $sourceBin"

          Get-ChildItem $sourceBin -File |
            Copy-Item -Destination $bin -Force

          $helperNames = @(
            "Compositor.exe",
            "Hub.exe",
            "ImageDecoder.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "SystemProbe.exe",
            "VideoDecoderServer.exe",
            "WebContent.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "AudioServer.exe"
          )

          foreach ($name in $helperNames) {
            $helper = Get-ChildItem $build -Filter $name -File -Recurse |
              Select-Object -First 1

            if ($null -ne $helper) {
              Copy-Item $helper.FullName -Destination $bin -Force
            }
          }

          $pluginDirs = @(
            "platforms",
            "imageformats",
            "generic",
            "networkinformation",
            "position",
            "styles",
            "tls"
          )

          foreach ($directory in $pluginDirs) {
            $plugin = Join-Path $sourceBin $directory

            if (Test-Path $plugin) {
              Copy-Item $plugin -Destination $bin -Recurse -Force
            }
          }

          $shareCandidates = @(
            (Join-Path $build "share/Lagom"),
            (Join-Path $build "share/lagom")
          )

          $sourceShare = $shareCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($null -ne $sourceShare) {
            Write-Host "Copying generated resource tree: $sourceShare"

            Get-ChildItem $sourceShare -Force |
              Copy-Item -Destination $share -Recurse -Force
          }
          else {
            $sourceResources = Join-Path $workspace "ladybird/Base/res"

            if (!(Test-Path $sourceResources)) {
              throw "No generated share/Lagom or Base/res resource tree found."
            }

            Write-Warning "Using source Base/res as fallback. Runtime resource lookup must be verified."

            $resourceDestination = Join-Path $share "ladybird"

            New-Item -ItemType Directory -Force -Path $resourceDestination | Out-Null

            Get-ChildItem $sourceResources -Force |
              Copy-Item -Destination $resourceDestination -Recurse -Force
          }

          # Copy external ICU data when the build uses it.
          $icuRoots = @(
            $build,
            $env:VCPKG_ROOT
          )

          $icuFiles = @()

          foreach ($root in $icuRoots) {
            if (Test-Path $root) {
              $icuFiles += Get-ChildItem $root -Filter "icudt*.dat" -File -Recurse -ErrorAction SilentlyContinue
            }
          }

          $icuFiles = @($icuFiles | Sort-Object FullName -Unique)

          if ($icuFiles.Count -gt 0) {
            $icuDestination = Join-Path $share "icu"

            New-Item -ItemType Directory -Force -Path $icuDestination | Out-Null

            foreach ($file in $icuFiles) {
              Copy-Item $file.FullName -Destination $icuDestination -Force
              Write-Host "Copied ICU data: $($file.Name)"
            }
          }
          else {
            Write-Warning "No external icudt*.dat found. ICU may be linked or packaged differently."
          }

          $launcher = @'
          @echo off
          setlocal
          cd /d "%~dp0"
          start "" "%~dp0bin\Ladybird.exe" %*
          '@

          Set-Content -Path (Join-Path $package "Start-Ladybird.bat") -Value $launcher -Encoding ASCII

          Write-Host "Runtime staging completed."

      # ----------------------------------------------------------
      # 12. Clean runtime package
      # ----------------------------------------------------------
      - name: Clean runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"

          $testFiles = @(
            Get-ChildItem $bin -Filter "*.exe" -File -Recurse |
              Where-Object {
                $_.Name -match '^(Test.*|test-.*)\.exe$'
              }
          )

          foreach ($file in $testFiles) {
            Write-Host "Removing test executable: $($file.Name)"
            Remove-Item $file.FullName -Force
          }

          $forbiddenExtensions = @(
            ".obj",
            ".o",
            ".pdb",
            ".ilk",
            ".exp",
            ".pch",
            ".gch",
            ".idb",
            ".ipch",
            ".tlog",
            ".lastbuildstate",
            ".recipe"
          )

          Get-ChildItem $package -File -Recurse |
            Where-Object {
              $forbiddenExtensions -contains $_.Extension.ToLowerInvariant()
            } |
            ForEach-Object {
              Write-Host "Removing build artifact: $($_.Name)"
              Remove-Item $_.FullName -Force
            }

          Write-Host "Cleanup completed. Runtime DLLs retained."

      # ----------------------------------------------------------
      # 13. Validate package
      # ----------------------------------------------------------
      - name: Validate runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $share = Join-Path $package "share/Lagom"

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Ladybird.exe missing."
          }

          if (!(Test-Path $share)) {
            throw "share/Lagom directory missing."
          }

          if (!(Test-Path (Join-Path $package "Start-Ladybird.bat"))) {
            throw "Launcher missing."
          }

          $helperNames = @(
            "Compositor.exe",
            "Hub.exe",
            "ImageDecoder.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "SystemProbe.exe",
            "VideoDecoderServer.exe",
            "WebContent.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "AudioServer.exe"
          )

          foreach ($name in $helperNames) {
            if (Test-Path (Join-Path $bin $name)) {
              Write-Host "Packaged helper: $name"
            }
          }

          $qtPlatform = Join-Path $bin "platforms/qwindows.dll"

          if (!(Test-Path $qtPlatform)) {
            Write-Warning "Qt qwindows.dll not found. Verify Qt plugin deployment."
          }

          $icuFiles = @(
            Get-ChildItem $package -Filter "icudt*.dat" -File -Recurse -ErrorAction SilentlyContinue
          )

          if ($icuFiles.Count -gt 0) {
            Write-Host "ICU data files:"
            $icuFiles | ForEach-Object { Write-Host $_.FullName }
          }
          else {
            Write-Warning "No external ICU data file packaged. Confirm the ICU data mechanism."
          }

          $pdfRoot = Join-Path $share "ladybird/pdfjs"

          if (Test-Path $pdfRoot) {
            $pdfFiles = @(
              "build/pdf.mjs",
              "build/pdf.worker.mjs",
              "build/pdf.sandbox.mjs",
              "web/viewer.html",
              "web/viewer.mjs",
              "web/viewer.css"
            )

            foreach ($item in $pdfFiles) {
              if (!(Test-Path (Join-Path $pdfRoot $item))) {
                Write-Warning "PDF.js file missing: $item"
              }
            }
          }

          Write-Host "Basic runtime package validation passed."

      # ----------------------------------------------------------
      # 14. Build information and inventory
      # ----------------------------------------------------------
      - name: Generate build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"

          $buildInfo = @(
            "Product: Ladybird for Windows x64"
            "Requested upstream ref: $env:LADYBIRD_REQUESTED_REF"
            "Upstream commit: $env:LADYBIRD_COMMIT"
            "Short commit: $env:LADYBIRD_SHORT_COMMIT"
            "Build configuration: Release"
            "LLVM version: $env:LLVM_VERSION"
            "vcpkg triplet: x64-windows"
            "CPU baseline option: LADYBIRD_BASELINE_CPU_TARGET=ON"
            "Built at UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "Upstream: https://github.com/LadybirdBrowser/ladybird"
            "Packaging repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )

          Set-Content (Join-Path $package "BUILD-INFO.txt") $buildInfo -Encoding UTF8

          $inventory = Join-Path $package "PACKAGE-INVENTORY.txt"

          Get-ChildItem $package -File -Recurse |
            Where-Object { $_.Name -ne "PACKAGE-INVENTORY.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($package.Length).TrimStart('\')
              "$relative`t$($_.Length)"
            } |
            Set-Content $inventory -Encoding UTF8

          $files = @(Get-ChildItem $package -File -Recurse)
          $totalBytes = ($files | Measure-Object Length -Sum).Sum

          Write-Host "File count: $($files.Count)"
          Write-Host "Package size MB: $([math]::Round($totalBytes / 1MB, 2))"

      # ----------------------------------------------------------
      # 15. DLL dependency report
      # ----------------------------------------------------------
      - name: Generate DLL dependency report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $package = Join-Path $env:GITHUB_WORKSPACE "dist/$env:PACKAGE_NAME"
          $bin = Join-Path $package "bin"
          $report = Join-Path $package "DEPENDENCY-REPORT.txt"

          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          $dumpbinPath = $null

          if ($null -ne $dumpbinCommand) {
            $dumpbinPath = $dumpbinCommand.Source
          }
          else {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath

              if ($vsPath) {
                $msvcRoot = Join-Path $vsPath "VC/Tools/MSVC"

                $found = Get-ChildItem $msvcRoot -Filter dumpbin.exe -File -Recurse |
                  Where-Object { $_.FullName -match "\\Hostx64\\x64\\" } |
                  Select-Object -First 1

                if ($null -ne $found) {
                  $dumpbinPath = $found.FullName
                }
              }
            }
          }

          if (!$dumpbinPath) {
            "dumpbin.exe unavailable; dependency report not generated." |
              Set-Content $report -Encoding UTF8
            return
          }

          $output = New-Object System.Collections.Generic.List[string]

          $binaries = Get-ChildItem $bin -File -Recurse |
            Where-Object { $_.Extension -in @(".exe", ".dll") }

          foreach ($binary in $binaries) {
            $output.Add("")
            $output.Add("==========================================")
            $output.Add($binary.FullName)
            $output.Add("==========================================")

            $result = & $dumpbinPath /nologo /dependents $binary.FullName 2>&1

            foreach ($line in $result) {
              $output.Add([string]$line)
            }
          }

          $output | Set-Content $report -Encoding UTF8

          Write-Host "Dependency report generated."

      # ----------------------------------------------------------
      # 16. ZIP and SHA256
      # ----------------------------------------------------------
      - name: Create Windows x64 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $package = Join-Path $workspace "dist/$env:PACKAGE_NAME"
          $zip = Join-Path $workspace "dist/$env:PACKAGE_NAME.zip"

          if (!(Test-Path (Join-Path $package "bin/Ladybird.exe"))) {
            throw "Ladybird.exe missing. Cannot create ZIP."
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path (Join-Path $package "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  $env:PACKAGE_NAME.zip" |
            Set-Content "$zip.sha256" -Encoding ASCII

          Write-Host "ZIP size: $([math]::Round((Get-Item $zip).Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      # ----------------------------------------------------------
      # 17. Upload artifacts
      # ----------------------------------------------------------
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-audit
          path: |
            dist/Ladybird-Windows-x64/BUILD-INFO.txt
            dist/Ladybird-Windows-x64/PACKAGE-INVENTORY.txt
            dist/Ladybird-Windows-x64/DEPENDENCY-REPORT.txt
            configure.log
            build.log
          if-no-files-found: warn
          retention-days: 14

      # ----------------------------------------------------------
      # 18. Optional pre-release
      # ----------------------------------------------------------
      - name: Publish GitHub Pre-release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ github.run_number }}-${{ env.LADYBIRD_SHORT_COMMIT }}
          name: Ladybird Windows x64 - Build ${{ github.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/Ladybird-Windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 19. Collect failure diagnostics
      # ----------------------------------------------------------
      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = $env:GITHUB_WORKSPACE
          $diagnostics = Join-Path $workspace "diagnostics"

          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          foreach ($name in @("configure.log", "build.log")) {
            $path = Join-Path $workspace $name

            if (Test-Path $path) {
              Copy-Item $path $diagnostics -Force
            }
          }

          $cache = Join-Path $workspace "ladybird/Build/release/CMakeCache.txt"

          if (Test-Path $cache) {
            Copy-Item $cache $diagnostics -Force
          }

          $buildtrees = Join-Path $workspace ".vcpkg-upstream/buildtrees"

          if (Test-Path $buildtrees) {
            $patterns = @(
              "*-out.log",
              "*-err.log",
              "meson-log.txt",
              "config.log"
            )

            foreach ($pattern in $patterns) {
              Get-ChildItem $buildtrees -Filter $pattern -File -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $relative = $_.FullName.Substring($buildtrees.Length).TrimStart('\')
                  $safeName = $relative -replace '[\\/:*?"<>|]', '_'
                  Copy-Item $_.FullName (Join-Path $diagnostics $safeName) -Force
                }
            }
          }

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-failure-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
