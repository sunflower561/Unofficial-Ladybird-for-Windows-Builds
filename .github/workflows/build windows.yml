
name: Build Ladybird for Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird branch, tag, or commit SHA"
        required: true
        default: "release/2026.47"
        type: string
      publish_release:
        description: "Publish the ZIP as a GitHub pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}

    env:
      LLVM_VERSION: "22.1.8"
      BUILD_TYPE: Release
      VCPKG_DISABLE_METRICS: 1
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create physical short build root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:RUNNER_TEMP "lb"
          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root "tmp") | Out-Null

          & robocopy.exe $env:GITHUB_WORKSPACE $root /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XD .git
          $rc = $LASTEXITCODE
          if ($rc -ge 8) {
            throw "Robocopy failed: exit code $rc"
          }
          $global:LASTEXITCODE = 0

          "BUILD_ROOT=$root" >> $env:GITHUB_ENV
          "TEMP=$root\tmp" >> $env:GITHUB_ENV
          "TMP=$root\tmp" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$root\.vcpkg-binary-cache" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path "$root\.vcpkg-binary-cache" | Out-Null

          if (!(Test-Path "$root\.github")) {
            throw "Packaging repository copy failed."
          }

          Write-Host "Physical short root: $root"
          Write-Host "Path length: $($root.Length)"

      - name: Set build metadata
        run: |
          $ErrorActionPreference = "Stop"

          $sha = "${{ github.sha }}".Substring(0,7)
          $time = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss")

          "PACKAGING_SHA=$sha" >> $env:GITHUB_ENV
          "BUILD_TIMESTAMP=$time" >> $env:GITHUB_ENV

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM and build utilities
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          choco install llvm --version=$env:LLVM_VERSION --allow-downgrade -y
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM installation failed"
          }

          if (!(Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) {
            throw "clang-cl missing"
          }

          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

          choco install ninja cmake git 7zip -y
          if ($LASTEXITCODE -ne 0) {
            throw "Build utilities installation failed"
          }

      - name: Verify toolchain and path setup
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          foreach ($t in @("git","cmake","ninja","clang-cl","cl","rustc","cargo","python")) {
            Write-Host "$t : $((Get-Command $t -ErrorAction Stop).Source)"
          }

          if ($env:BUILD_ROOT.Length -gt 35) {
            throw "Build root is too long: $env:BUILD_ROOT"
          }

          if (!(Test-Path $env:BUILD_ROOT)) {
            throw "Short build root missing"
          }

          git config --global core.longpaths true

          if ((git config --global --get core.longpaths).Trim() -ne "true") {
            throw "Git longpaths setup failed"
          }

          cmake --version
          ninja --version
          clang-cl --version
          rustc --version
          cargo --version

      - name: Checkout Ladybird source
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          git clone https://github.com/LadybirdBrowser/ladybird.git ladybird
          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird clone failed"
          }

          Push-Location ladybird
          try {
            git fetch --tags origin "${{ inputs.ref }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Fetch ref failed: ${{ inputs.ref }}"
            }

            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Ladybird checkout failed"
            }

            git submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) {
              throw "Submodule update failed"
            }

            $sha = (git rev-parse HEAD).Trim()
          }
          finally {
            Pop-Location
          }

          "LADYBIRD_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host "Ladybird SHA: $sha"

      - name: Read vcpkg baseline
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $m = Get-Content "ladybird\vcpkg.json" -Raw | ConvertFrom-Json
          $b = $m.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($b)) {
            throw "vcpkg baseline missing"
          }

          "VCPKG_BASELINE=$b" >> $env:GITHUB_ENV

      - name: Checkout and bootstrap vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed"
          }

          Push-Location vcpkg
          try {
            git checkout --detach "$env:VCPKG_BASELINE"
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg baseline checkout failed"
            }

            .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed"
            }

            $vr = (Get-Location).Path
            .\vcpkg.exe version
          }
          finally {
            Pop-Location
          }

          "VCPKG_ROOT=$vr" >> $env:GITHUB_ENV
          "$vr" >> $env:GITHUB_PATH

      - name: Create dav1d compatibility overlay
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $src = Join-Path $env:VCPKG_ROOT "ports\dav1d"
          $oroot = Join-Path $env:BUILD_ROOT "vcpkg-overlays"
          $port = Join-Path $oroot "dav1d"

          if (!(Test-Path "$src\portfile.cmake")) {
            throw "dav1d portfile missing"
          }

          New-Item -ItemType Directory -Force -Path $oroot | Out-Null

          if (Test-Path $port) {
            Remove-Item $port -Recurse -Force
          }

          Copy-Item $src $port -Recurse

          $pf = Join-Path $port "portfile.cmake"
          $c = Get-Content $pf -Raw

          $patch = @'
          # Work around MSVC stdatomic compatibility.
          set(_dav1d_stdatomic "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")
          if(NOT EXISTS "${_dav1d_stdatomic}")
              message(FATAL_ERROR "dav1d stdatomic.h not found: ${_dav1d_stdatomic}")
          endif()
          file(READ "${_dav1d_stdatomic}" _dav1d_content)
          set(_dav1d_old "#if defined(__clang__) && __has_include_next(<stdatomic.h>)")
          set(_dav1d_new [=[
          #ifndef __has_include_next
          #define __has_include_next(x) 0
          #endif
          #if defined(__clang__) && __has_include_next(<stdatomic.h>)
          ]=])
          string(FIND "${_dav1d_content}" "${_dav1d_old}" _dav1d_pos)
          if(_dav1d_pos EQUAL -1)
              message(FATAL_ERROR "dav1d stdatomic patch target not found")
          endif()
          string(REPLACE "${_dav1d_old}" "${_dav1d_new}" _dav1d_content "${_dav1d_content}")
          file(WRITE "${_dav1d_stdatomic}" "${_dav1d_content}")
          message(STATUS "Applied dav1d MSVC compatibility patch")
          '@

          $i = $c.IndexOf("vcpkg_configure_meson")
          if ($i -lt 0) {
            throw "dav1d patch anchor not found"
          }

          Set-Content $pf ($c.Insert($i,$patch+"`r`n")) -Encoding utf8
          "VCPKG_OVERLAY_PORTS=$oroot" >> $env:GITHUB_ENV

      - name: Create Release-only x64 triplet
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $src = Join-Path $env:VCPKG_ROOT "triplets\x64-windows.cmake"
          $dir = Join-Path $env:BUILD_ROOT "vcpkg-overlays\triplets"
          $dst = Join-Path $dir "x64-windows.cmake"

          if (!(Test-Path $src)) {
            throw "x64-windows triplet missing"
          }

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $src $dst -Force

          if ((Get-Content $dst -Raw) -notmatch "VCPKG_BUILD_TYPE") {
            Add-Content $dst "`r`nset(VCPKG_BUILD_TYPE release)`r`n"
          }

          "VCPKG_OVERLAY_TRIPLETS=$dir" >> $env:GITHUB_ENV

      # Deliberately no actions/cache step here.
      # The cache path previously used runner.temp in an unsupported context.
      # The vcpkg cache remains inside the physical short build root for this run.

      - name: Configure and build Ladybird
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          New-Item -ItemType Directory -Force -Path $env:TEMP,$env:TMP,$env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          if (Test-Path "ladybird\Build\release") {
            Remove-Item "ladybird\Build\release" -Recurse -Force
          }

          cmake -S ladybird -B ladybird\Build\release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link -DCMAKE_MAKE_PROGRAM=ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS" `
            "-DVCPKG_OVERLAY_TRIPLETS=$env:VCPKG_OVERLAY_TRIPLETS" `
            -DVCPKG_MANIFEST_MODE=ON -DVCPKG_MANIFEST_INSTALL=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

          $cache = Get-Content "ladybird\Build\release\CMakeCache.txt"

          if (!($cache | Where-Object { $_ -match "^LADYBIRD_BASELINE_CPU_TARGET:.*=ON$" })) {
            throw "CPU baseline option not ON"
          }

          if (!($cache | Where-Object { $_ -match "^CMAKE_CXX_COMPILER:.*clang-cl" })) {
            throw "clang-cl not selected"
          }

          cmake --build ladybird\Build\release --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      - name: Verify CPU flags and executable architectures
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $db = Get-Content "ladybird\Build\release\compile_commands.json" -Raw | ConvertFrom-Json

          $march = @($db | Where-Object {
            $line = $_.command
            if (!$line -and $_.arguments) {
              $line = $_.arguments -join " "
            }
            $line -match "-march=x86-64-v2"
          })

          if ($march.Count -eq 0) {
            throw "No compile command contains -march=x86-64-v2"
          }

          $build = (Resolve-Path "ladybird\Build\release").Path

          $names = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "Hub.exe"
          )

          $passed = 0

          foreach ($n in $names) {
            $f = Get-ChildItem $build -Recurse -File -Filter $n |
              Where-Object { $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' } |
              Select-Object -First 1

            if (!$f) {
              if ($n -in @("WebDriver.exe","WebRTCClient.exe","Hub.exe")) {
                Write-Warning "Optional executable missing: $n"
                continue
              }
              throw "Required executable missing: $n"
            }

            $s = [IO.File]::OpenRead($f.FullName)

            try {
              $r = [IO.BinaryReader]::new($s)
              $s.Position = 0x3C
              $o = $r.ReadInt32()

              if ($o -lt 0 -or $o + 6 -gt $s.Length) {
                throw "Invalid PE: $n"
              }

              $s.Position = $o

              if ($r.ReadUInt32() -ne 0x00004550 -or $r.ReadUInt16() -ne 0x8664) {
                throw "$n is not AMD64"
              }

              $passed++
            }
            finally {
              $s.Dispose()
            }
          }

          if ($passed -lt 6) {
            throw "Only $passed PE files passed architecture checks"
          }

      - name: Stage runtime package
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $b = (Resolve-Path "ladybird\Build\release").Path
          $stage = Join-Path $env:BUILD_ROOT "dist\Ladybird-Windows-x64"
          $bin = Join-Path $stage "bin"
          $share = Join-Path $stage "share"

          New-Item -ItemType Directory -Force -Path $bin,$share | Out-Null

          $exeNames = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "Hub.exe"
          )

          foreach ($n in $exeNames) {
            $f = Get-ChildItem $b -Recurse -File -Filter $n |
              Where-Object { $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' } |
              Select-Object -First 1

            if (!$f) {
              if ($n -in @("WebDriver.exe","WebRTCClient.exe","Hub.exe")) {
                Write-Warning "Optional executable omitted: $n"
                continue
              }
              throw "Required executable missing: $n"
            }

            Copy-Item $f.FullName (Join-Path $bin $n) -Force
          }

          Get-ChildItem $b -Recurse -File -Filter "*.dll" |
            Where-Object {
              $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
              $_.FullName -notmatch '[\\/]debug[\\/]'
            } |
            ForEach-Object {
              $d = Join-Path $bin $_.Name
              if (!(Test-Path $d)) {
                Copy-Item $_.FullName $d
              }
            }

          $vb = Join-Path $b "vcpkg_installed\x64-windows\bin"

          if (Test-Path $vb) {
            Get-ChildItem $vb -File -Filter "*.dll" | ForEach-Object {
              $d = Join-Path $bin $_.Name
              if (!(Test-Path $d)) {
                Copy-Item $_.FullName $d
              }
            }
          }

          $plugins = @(
            "platforms",
            "imageformats",
            "styles",
            "tls",
            "networkinformation",
            "position"
          )

          Get-ChildItem $b -Directory -Recurse |
            Where-Object Name -eq "plugins" |
            ForEach-Object {
              foreach ($pn in $plugins) {
                $src = Join-Path $_.FullName $pn

                if (Test-Path $src) {
                  $dst = Join-Path $bin $pn
                  New-Item -ItemType Directory -Force -Path $dst | Out-Null

                  Get-ChildItem $src -File -Filter "*.dll" | ForEach-Object {
                    $d = Join-Path $dst $_.Name
                    if (!(Test-Path $d)) {
                      Copy-Item $_.FullName $d
                    }
                  }
                }
              }
            }

          $ss = Join-Path $b "share"

          if (Test-Path $ss) {
            Get-ChildItem $ss -Force | ForEach-Object {
              $d = Join-Path $share $_.Name
              if (!(Test-Path $d)) {
                Copy-Item $_.FullName $d -Recurse -Force
              }
            }
          }

          foreach ($rr in @(
            "UI\Resources",
            "UI\Ladybird\Resources",
            "Resources",
            "resources"
          )) {
            $rp = Join-Path $b $rr

            if (Test-Path $rp) {
              Get-ChildItem $rp -Force | ForEach-Object {
                $d = Join-Path $share $_.Name
                if (!(Test-Path $d)) {
                  Copy-Item $_.FullName $d -Recurse -Force
                }
              }
            }
          }

          $icu = Get-ChildItem $b -Recurse -File -Filter "icudt*.dat" |
            Select-Object -First 1

          if (!$icu) {
            $icu = Get-ChildItem $env:VCPKG_ROOT -Recurse -File -Filter "icudt*.dat" |
              Where-Object FullName -match '[\\/]x64-windows[\\/]' |
              Select-Object -First 1
          }

          if (!$icu) {
            throw "ICU data file icudt*.dat not found"
          }

          $id = Join-Path $share "Lagom\icu"
          New-Item -ItemType Directory -Force -Path $id | Out-Null
          Copy-Item $icu.FullName (Join-Path $id $icu.Name) -Force

          $pdf = Get-ChildItem "ladybird" -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "build\pdf.mjs")) -and
              (Test-Path (Join-Path $_.FullName "web\viewer.html"))
            } |
            Select-Object -First 1

          if ($pdf) {
            $pd = Join-Path $share "Lagom\ladybird\pdfjs"
            New-Item -ItemType Directory -Force -Path (Split-Path $pd -Parent) | Out-Null
            Copy-Item $pdf.FullName $pd -Recurse -Force
          }

          foreach ($n in @("Ladybird.exe","WebContent.exe","Compositor.exe")) {
            if (!(Test-Path (Join-Path $bin $n))) {
              throw "Staged $n missing"
            }
          }

      - name: Verify and clean runtime package
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $stage = (Resolve-Path "dist\Ladybird-Windows-x64").Path
          $bin = Join-Path $stage "bin"
          $share = Join-Path $stage "share"
          $lib = Join-Path $stage "lib"
          $libexec = Join-Path $stage "libexec"

          if (!(Test-Path $bin -PathType Container)) {
            throw "bin missing"
          }

          if (!(Test-Path $share -PathType Container)) {
            throw "share missing"
          }

          # share is deliberately never modified by this cleanup step.
          $helpers = @(
            "AudioServer.exe",
            "Compositor.exe",
            "Hub.exe",
            "ImageDecoder.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "SystemProbe.exe",
            "VideoDecoderServer.exe",
            "WebContent.exe",
            "WebRTCClient.exe"
          )

          if (!(Test-Path $libexec -PathType Container)) {
            throw "libexec missing; cannot verify duplicates"
          }

          foreach ($n in $helpers) {
            $a = Join-Path $bin $n
            $b = Join-Path $libexec $n

            if (!(Test-Path $a -PathType Leaf)) {
              throw "Missing bin helper: $n"
            }

            if (!(Test-Path $b -PathType Leaf)) {
              throw "Missing libexec helper: $n"
            }

            $hashA = (Get-FileHash $a -Algorithm SHA256).Hash
            $hashB = (Get-FileHash $b -Algorithm SHA256).Hash

            if ($hashA -ne $hashB) {
              throw "Helper mismatch: $n"
            }
          }

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Ladybird.exe missing"
          }

          if (!(Test-Path (Join-Path $bin "WebDriver.exe"))) {
            throw "WebDriver.exe missing; refusing incomplete package"
          }

          Remove-Item $libexec -Recurse -Force

          if (Test-Path $lib) {
            Remove-Item $lib -Recurse -Force
          }

          foreach ($n in @("BUILD-INFO.txt","Start-Ladybird.bat")) {
            $p = Join-Path $stage $n
            if (Test-Path $p) {
              Remove-Item $p -Force
            }
          }

          if ((Test-Path $libexec) -or (Test-Path $lib)) {
            throw "Runtime cleanup incomplete"
          }

          foreach ($n in $helpers) {
            if (!(Test-Path (Join-Path $bin $n))) {
              throw "bin helper removed: $n"
            }
          }

          Write-Host "Preserved bin (including WebDriver.exe) and untouched share."

      - name: Runtime smoke test and crash capture
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $root = (Resolve-Path "dist\Ladybird-Windows-x64").Path
          $exe = Join-Path $root "bin\Ladybird.exe"
          $diag = Join-Path $env:RUNNER_TEMP "ladybird-diagnostics"
          $dump = Join-Path $diag "dumps"
          $log = Join-Path $diag "smoke-test.log"

          New-Item -ItemType Directory -Force -Path $dump | Out-Null

          "Ladybird Windows x64 smoke test`nExecutable: $exe`nUTC: $([DateTime]::UtcNow.ToString('o'))" |
            Set-Content $log

          $env:PATH = "$(Join-Path $root 'bin');$env:PATH"
          $env:ICU_DATA = Join-Path $root "share\Lagom\icu"
          $env:QT_PLUGIN_PATH = Join-Path $root "bin"

          foreach ($n in @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe",
            "Hub.exe"
          )) {
            $k = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\$n"

            New-Item $k -Force | Out-Null
            New-ItemProperty $k DumpFolder $dump -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty $k DumpType 2 -PropertyType DWord -Force | Out-Null
            New-ItemProperty $k DumpCount 5 -PropertyType DWord -Force | Out-Null
          }

          $p = Start-Process $exe -WorkingDirectory (Join-Path $root "bin") -PassThru

          "PID: $($p.Id)" | Add-Content $log

          Start-Sleep 20
          $p.Refresh()

          if ($p.HasExited) {
            "RESULT: FAILED; exit code $($p.ExitCode)" | Add-Content $log

            try {
              Get-WinEvent -FilterHashtable @{
                LogName = "Application"
                Id = 1000,1001
                StartTime = (Get-Date).AddMinutes(-10)
              } -ErrorAction Stop |
                Where-Object Message -match "Ladybird|lagom|WebContent|Compositor|AudioServer|MediaServer|RequestServer" |
                ForEach-Object {
                  $_.Message | Add-Content $log
                }
            }
            catch {
              $_.Exception.Message | Add-Content $log
            }

            Get-ChildItem $dump -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                "$($_.FullName) $($_.Length)" | Add-Content $log
              }

            Get-Content $log
            throw "Ladybird smoke test failed."
          }

          "RESULT: PASSED - process remained alive for 20 seconds" | Add-Content $log

          & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null

      - name: Prepare diagnostics for upload
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE

          $source = Join-Path $env:RUNNER_TEMP "ladybird-diagnostics"
          $destination = Join-Path $env:GITHUB_WORKSPACE "_upload\diagnostics"

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          if (Test-Path $source) {
            Copy-Item "$source\*" $destination -Recurse -Force
          }

      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-crash-diagnostics
          path: _upload/diagnostics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Generate package inventory and DLL report
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $stage = (Resolve-Path "dist\Ladybird-Windows-x64").Path

          Get-ChildItem $stage -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($stage.Length).TrimStart("\")
            "$rel`t$($_.Length)"
          } | Set-Content "dist\PACKAGE-INVENTORY.txt" -Encoding utf8

          "DLL dependency report" | Set-Content "dist\DEPENDENCIES.txt"

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue

          if (!$dumpbin) {
            "dumpbin.exe not available" | Add-Content "dist\DEPENDENCIES.txt"
          }
          else {
            Get-ChildItem $stage -Recurse -File |
              Where-Object Extension -in @(".exe",".dll") |
              ForEach-Object {
                "`r`n===== $($_.FullName) =====" | Add-Content "dist\DEPENDENCIES.txt"
                dumpbin.exe /DEPENDENTS $_.FullName 2>&1 |
                  Add-Content "dist\DEPENDENCIES.txt"
              }
          }

      - name: Create ZIP and SHA256
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $src = "dist\Ladybird-Windows-x64"
          $zip = "dist\Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP not created"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $a = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)

          try {
            if ($a.Entries.Count -eq 0) {
              throw "ZIP empty"
            }

            Write-Host "ZIP entries: $($a.Entries.Count)"
          }
          finally {
            $a.Dispose()
          }

          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  Ladybird-Windows-x64.zip" |
            Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

          Write-Host "SHA256: $h"

      - name: Copy release files to upload directory
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $upload = Join-Path $env:GITHUB_WORKSPACE "_upload"
          New-Item -ItemType Directory -Force -Path $upload | Out-Null

          Copy-Item "dist\Ladybird-Windows-x64.zip" $upload -Force
          Copy-Item "dist\SHA256SUMS.txt" $upload -Force
          Copy-Item "dist\PACKAGE-INVENTORY.txt" $upload -Force
          Copy-Item "dist\DEPENDENCIES.txt" $upload -Force

      - name: Upload Ladybird Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            _upload/Ladybird-Windows-x64.zip
            _upload/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-audit
          path: |
            _upload/PACKAGE-INVENTORY.txt
            _upload/DEPENDENCIES.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare vcpkg diagnostics
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location $env:BUILD_ROOT

          $destination = Join-Path $env:GITHUB_WORKSPACE "_upload\vcpkg-diagnostics"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          foreach ($relative in @(
            "vcpkg\buildtrees\qtbase",
            "vcpkg\buildtrees\dav1d",
            "vcpkg\buildtrees\angle",
            "vcpkg\buildtrees\openssl",
            "vcpkg\buildtrees\skia",
            "ladybird\Build\release\vcpkg-manifest-install.log"
          )) {
            $source = Join-Path $env:BUILD_ROOT $relative

            if (Test-Path $source) {
              $name = ($relative -replace '[\\/]', '_')
              Copy-Item $source (Join-Path $destination $name) -Recurse -Force
            }
          }

      - name: Upload vcpkg diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-vcpkg-diagnostics
          path: _upload/vcpkg-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish GitHub pre-release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ env.BUILD_TIMESTAMP }}-${{ env.PACKAGING_SHA }}
          name: Ladybird Windows x64 ${{ env.BUILD_TIMESTAMP }}
          prerelease: true
          generate_release_notes: true
          files: |
            _upload/Ladybird-Windows-x64.zip
            _upload/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
