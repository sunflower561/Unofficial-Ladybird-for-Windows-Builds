name: Build Ladybird Windows x64 x86-64-v3

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "手动填写 Ladybird 上游分支、Tag 或 Commit SHA"
        required: true
        default: "release/2026.48"
        type: string
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-x64-v3
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 - full v3 source build
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      LLVM_VERSION: "23.1.6"
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: "clear"
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      VCPKG_DEFAULT_TRIPLET: "x64-windows-v3"
      VCPKG_HOST_TRIPLET: "x64-windows"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create short build directory and clean binary cache
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lb"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          & robocopy.exe $env:GITHUB_WORKSPACE $root /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XD .git
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "Robocopy failed: $rc" }

          $tmp = Join-Path $root "tmp"
          $cache = Join-Path $root ".vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $tmp,$cache | Out-Null

          @(
            "BUILD_ROOT=$root"
            "TEMP=$tmp"
            "TMP=$tmp"
            "VCPKG_DEFAULT_BINARY_CACHE=$cache"
          ) | Add-Content $env:GITHUB_ENV

          Write-Host "Build root: $root"
          Write-Host "Vcpkg binary cache is empty; binary caching is disabled."
          $global:LASTEXITCODE = 0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned LLVM 23.1.6
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:LLVM_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.msi"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.msi"
          $log = Join-Path $env:RUNNER_TEMP "llvm-install.log"

          Invoke-WebRequest -Uri $url -OutFile $installer
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 100MB) {
            throw "LLVM installer is missing or unexpectedly small"
          }

          $args = @("/i", "`"$installer`"", "/qn", "/norestart", "/L*v", "`"$log`"")
          $p = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) {
            if (Test-Path $log) { Get-Content $log -Tail 150 }
            throw "LLVM installation failed: $($p.ExitCode)"
          }

          $clang = $null
          foreach ($candidate in @(
            "C:\Program Files\LLVM\bin\clang-cl.exe",
            "C:\Program Files (x86)\LLVM\bin\clang-cl.exe",
            "C:\LLVM\23.1.6\bin\clang-cl.exe",
            "C:\LLVM\bin\clang-cl.exe"
          )) {
            if (Test-Path $candidate) { $clang = $candidate; break }
          }
          if (!$clang) {
            foreach ($dir in @("C:\Program Files\LLVM","C:\Program Files (x86)\LLVM","C:\LLVM")) {
              if (Test-Path $dir) {
                $f = Get-ChildItem $dir -Filter clang-cl.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($f) { $clang = $f.FullName; break }
              }
            }
          }
          if (!$clang) {
            if (Test-Path $log) { Get-Content $log -Tail 150 }
            throw "clang-cl.exe not found"
          }

          $bin = Split-Path $clang -Parent
          $llvmRoot = Split-Path $bin -Parent
          $lld = Join-Path $bin "lld-link.exe"
          if (!(Test-Path $lld)) { throw "lld-link.exe not found" }

          $ver = (& $clang --version | Out-String)
          if ($ver -notmatch "23\.1\.6") { throw "Unexpected LLVM version: $ver" }

          @(
            "LLVM_ROOT=$llvmRoot"
            "LLVM_CLANG_CL=$clang"
            "LLVM_LLD_LINK=$lld"
            "CC=$clang"
            "CXX=$clang"
            "CFLAGS=/clang:-march=x86-64-v3"
            "CXXFLAGS=/clang:-march=x86-64-v3"
          ) | Add-Content $env:GITHUB_ENV
          "$bin" | Add-Content $env:GITHUB_PATH

          Write-Host "LLVM $version: $clang"

      # Chocolatey is intentionally retained.
      - name: Install remaining build tools
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja cmake git 7zip -y
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey installation failed" }

          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake verification failed" }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja verification failed" }
          git --version
          if ($LASTEXITCODE -ne 0) { throw "Git verification failed" }

      - name: Verify toolchain
        run: |
          $ErrorActionPreference = "Stop"
          $v = (& $env:LLVM_CLANG_CL --version | Out-String)
          if ($v -notmatch "23\.1\.6") { throw "LLVM 23.1.6 is required" }
          & $env:LLVM_LLD_LINK --version
          if ($LASTEXITCODE -ne 0) { throw "LLD verification failed" }
          cl
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment unavailable" }
          rustc -vV
          cargo --version
          python --version
          git config --global core.longpaths true
          Write-Host "C/C++ target: x86-64-v3"
          Write-Host "Rust target: x86-64-v3"

      - name: Checkout requested Ladybird ref
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT
          $requestedRef = "${{ inputs.ref }}"
          if ([string]::IsNullOrWhiteSpace($requestedRef)) { throw "Ladybird ref cannot be empty" }

          git clone https://github.com/LadybirdBrowser/ladybird.git ladybird
          if ($LASTEXITCODE -ne 0) { throw "Ladybird clone failed" }
          Set-Location ladybird

          git fetch --tags origin "$requestedRef"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch ref: $requestedRef" }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Ladybird checkout failed" }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "Submodule update failed" }

          $sha = (git rev-parse HEAD).Trim()
          if (!$sha) { throw "Could not determine Ladybird commit" }
          @("LADYBIRD_SHA=$sha","LADYBIRD_REF=$requestedRef") | Add-Content $env:GITHUB_ENV
          Write-Host "Ladybird ref: $requestedRef"
          Write-Host "Ladybird commit: $sha"

      - name: Apply Windows and v3 source patches
        run: |
          $ErrorActionPreference = "Stop"
          $ladybird = Join-Path $env:BUILD_ROOT "ladybird"

          # Keep the existing Windows CrashReport compatibility patch.
          $crash = Join-Path $ladybird "Libraries\LibWebView\CrashReport.cpp"
          if (!(Test-Path $crash)) { throw "CrashReport.cpp not found" }
          $s = Get-Content $crash -Raw
          $oldGlobal = "static DisableSandbox s_disable_sandbox { DisableSandbox::No };"
          if ($s.Contains($oldGlobal)) {
            $newGlobal = "#if !defined(AK_OS_WINDOWS)`nstatic DisableSandbox s_disable_sandbox { DisableSandbox::No };`n#endif"
            $s = $s.Replace($oldGlobal,$newGlobal)
          }
          $setterPattern = '(?s)void CrashReport::set_sandbox_is_disabled\(DisableSandbox disable_sandbox\)\s*\{\s*s_disable_sandbox\s*=\s*disable_sandbox;\s*\}'
          if ($s -match $setterPattern) {
            $setter = @'
          void CrashReport::set_sandbox_is_disabled(DisableSandbox disable_sandbox)
          {
          #if !defined(AK_OS_WINDOWS)
              s_disable_sandbox = disable_sandbox;
          #else
              (void)disable_sandbox;
          #endif
          }
          '@.Trim()
            $s = [regex]::Replace($s,$setterPattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $setter },1)
          }
          [IO.File]::WriteAllText($crash,$s,[Text.UTF8Encoding]::new($false))

          # Existing FontSkia warning fix.
          $font = Join-Path $ladybird "Services\Compositor\FontSkia.cpp"
          if (!(Test-Path $font)) { throw "FontSkia.cpp not found" }
          $fs = Get-Content $font -Raw
          $fs = $fs.Replace(
            "static bool s_use_test_font_rendering { false };",
            "[[maybe_unused]] static bool s_use_test_font_rendering { false };"
          )
          [IO.File]::WriteAllText($font,$fs,[Text.UTF8Encoding]::new($false))

          # Patch only the active native branch. Do NOT reject the inactive
          # x86-64-v2 baseline branch; LADYBIRD_BASELINE_CPU_TARGET is OFF.
          $cpu = Join-Path $ladybird "Meta\CMake\compile_options.cmake"
          if (!(Test-Path $cpu)) { throw "compile_options.cmake not found" }
          $cs = Get-Content $cpu -Raw
          $oldCpp = "add_cxx_compile_options(-march=native)"
          $newCpp = "add_cxx_compile_options(-march=x86-64-v3)"
          $oldRust = "set(RUSTC_TARGET_CPU_FLAGS -Ctarget-cpu=native)"
          $newRust = "set(RUSTC_TARGET_CPU_FLAGS -Ctarget-cpu=x86-64-v3)"

          if ($cs.Contains($oldCpp)) { $cs = $cs.Replace($oldCpp,$newCpp) }
          elseif (!$cs.Contains($newCpp)) { throw "Cannot locate upstream C++ native target" }
          if ($cs.Contains($oldRust)) { $cs = $cs.Replace($oldRust,$newRust) }
          elseif (!$cs.Contains($newRust)) { throw "Cannot locate upstream Rust native target" }

          [IO.File]::WriteAllText($cpu,$cs,[Text.UTF8Encoding]::new($false))
          $verify = Get-Content $cpu -Raw
          if ($verify.Contains($oldCpp) -or $verify.Contains($oldRust)) {
            throw "Native CPU target remains"
          }
          if (!$verify.Contains($newCpp) -or !$verify.Contains($newRust)) {
            throw "x86-64-v3 patch verification failed"
          }
          Write-Host "Active Ladybird C++ and Rust CPU targets patched to x86-64-v3."
          Write-Host "Inactive upstream baseline branches are retained."

      - name: Read upstream vcpkg baseline
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:BUILD_ROOT\ladybird"
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ([string]::IsNullOrWhiteSpace($baseline)) { throw "vcpkg builtin-baseline missing" }
          "VCPKG_BASELINE=$baseline" | Add-Content $env:GITHUB_ENV
          Write-Host "vcpkg baseline: $baseline"

      - name: Checkout and bootstrap vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          Set-Location vcpkg
          git checkout --detach "$env:VCPKG_BASELINE"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline checkout failed" }
          .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          $root = (Get-Location).Path
          "VCPKG_ROOT=$root" | Add-Content $env:GITHUB_ENV
          "$root" | Add-Content $env:GITHUB_PATH

      - name: Create dav1d MSVC compatibility overlay
        run: |
          $ErrorActionPreference = "Stop"
          $sourcePort = Join-Path $env:VCPKG_ROOT "ports\dav1d"
          $overlayRoot = Join-Path $env:BUILD_ROOT "vcpkg-overlays\ports"
          $overlayPort = Join-Path $overlayRoot "dav1d"
          if (!(Test-Path "$sourcePort\portfile.cmake")) { throw "dav1d portfile missing" }
          New-Item -ItemType Directory -Force -Path $overlayPort | Out-Null
          Copy-Item "$sourcePort\*" $overlayPort -Recurse -Force
          $portfile = Join-Path $overlayPort "portfile.cmake"
          $content = Get-Content $portfile -Raw

          if ($content -match "Applied dav1d MSVC stdatomic compatibility patch") {
            throw "dav1d overlay unexpectedly already patched"
          }
          $anchor = [regex]::Match($content,'(?s)(vcpkg_from_git\([\s\S]*?HEAD_REF\s+[^\r\n]+\s*\))')
          if (!$anchor.Success) { throw "Cannot identify dav1d source checkout block" }

          $patch = @'

          # Patch dav1d's MSVC compatibility header after source checkout.
          if (DEFINED SOURCE_PATH AND EXISTS "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")
              set(_dav1d_header "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")
              file(READ "${_dav1d_header}" _dav1d_text)
              set(_dav1d_old "#if defined(__clang__) && __has_include_next(<stdatomic.h>)")
              set(_dav1d_new "#if defined(__clang__)")
              string(FIND "${_dav1d_text}" "${_dav1d_old}" _dav1d_old_pos)
              if (NOT _dav1d_old_pos EQUAL -1)
                  string(REPLACE "${_dav1d_old}" "${_dav1d_new}" _dav1d_text "${_dav1d_text}")
                  file(WRITE "${_dav1d_header}" "${_dav1d_text}")
                  message(STATUS "Applied dav1d MSVC stdatomic compatibility patch")
              else()
                  string(FIND "${_dav1d_text}" "${_dav1d_new}" _dav1d_new_pos)
                  if (_dav1d_new_pos EQUAL -1)
                      message(FATAL_ERROR "Unrecognized dav1d stdatomic.h structure")
                  endif()
              endif()
          else()
              message(FATAL_ERROR "dav1d stdatomic.h not found after checkout")
          endif()
          '@

          $content = $content.Insert($anchor.Index + $anchor.Length,"`n$patch`n")
          [IO.File]::WriteAllText($portfile,$content,[Text.UTF8Encoding]::new($false))
          if ((Get-Content $portfile -Raw) -notmatch "Applied dav1d MSVC stdatomic compatibility patch") {
            throw "dav1d overlay patch insertion failed"
          }
          "VCPKG_OVERLAY_PORTS=$overlayRoot" | Add-Content $env:GITHUB_ENV

      - name: Create v3 triplet and clang-cl chainload toolchain
        run: |
          $ErrorActionPreference = "Stop"
          $overlay = Join-Path $env:BUILD_ROOT "vcpkg-overlays"
          $triplets = Join-Path $overlay "triplets"
          $toolchains = Join-Path $overlay "toolchains"
          New-Item -ItemType Directory -Force -Path $triplets,$toolchains | Out-Null

          # Target libraries: all release C/C++ ports use clang-cl + x86-64-v3.
          $triplet = @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)

          set(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "${CMAKE_CURRENT_LIST_DIR}/../toolchains/clang-cl-v3.cmake")

          set(VCPKG_C_FLAGS "/clang:-march=x86-64-v3")
          set(VCPKG_CXX_FLAGS "/clang:-march=x86-64-v3")
          set(VCPKG_C_FLAGS_RELEASE "/clang:-march=x86-64-v3")
          set(VCPKG_CXX_FLAGS_RELEASE "/clang:-march=x86-64-v3")

          set(VCPKG_ENV_PASSTHROUGH CC CXX CFLAGS CXXFLAGS RUSTFLAGS)
          '@
          Set-Content -Path (Join-Path $triplets "x64-windows-v3.cmake") -Value $triplet -Encoding utf8

          $toolchain = @'
          if(NOT DEFINED ENV{LLVM_CLANG_CL})
              message(FATAL_ERROR "LLVM_CLANG_CL environment variable is missing")
          endif()

          set(_clang "$ENV{LLVM_CLANG_CL}")
          set(CMAKE_C_COMPILER "${_clang}" CACHE FILEPATH "" FORCE)
          set(CMAKE_CXX_COMPILER "${_clang}" CACHE FILEPATH "" FORCE)
          set(CMAKE_C_FLAGS_INIT "/clang:-march=x86-64-v3")
          set(CMAKE_CXX_FLAGS_INIT "/clang:-march=x86-64-v3")
          set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreadedDLL" CACHE STRING "" FORCE)
          '@
          Set-Content -Path (Join-Path $toolchains "clang-cl-v3.cmake") -Value $toolchain -Encoding utf8

          "VCPKG_OVERLAY_TRIPLETS=$triplets" | Add-Content $env:GITHUB_ENV
          Write-Host "Created x64-windows-v3 target triplet."
          Write-Host "Host triplet remains x64-windows for build tools."

      - name: Configure Ladybird and build all target dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT
          $build = "ladybird\Build\release"
          if (Test-Path $build) { Remove-Item $build -Recurse -Force }

          # Prevent old native/v2 binary packages from being reused.
          $cache = Join-Path $env:BUILD_ROOT ".vcpkg-binary-cache"
          if (Test-Path $cache) { Remove-Item $cache -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          $clang = $env:LLVM_CLANG_CL
          $lld = $env:LLVM_LLD_LINK

          cmake -S ladybird -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DLADYBIRD_BASELINE_CPU_TARGET=OFF `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clang" `
            "-DCMAKE_LINKER=$lld" `
            "-DCMAKE_MAKE_PROGRAM=ninja" `
            -DCMAKE_C_FLAGS="/clang:-march=x86-64-v3" `
            -DCMAKE_CXX_FLAGS="/clang:-march=x86-64-v3" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-v3 `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DVCPKG_OVERLAY_TRIPLETS=$env:VCPKG_OVERLAY_TRIPLETS" `
            "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_INSTALL=ON `
            -DVCPKG_BINARY_SOURCES=clear `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
            foreach ($log in @(
              "$env:VCPKG_ROOT\buildtrees\dav1d\package-x64-windows-v3-rel-out.log",
              "$env:VCPKG_ROOT\buildtrees\dav1d\meson-x64-windows-v3-rel-out.log",
              "$env:BUILD_ROOT\ladybird\Build\release\vcpkg-manifest-install.log"
            )) {
              if (Test-Path $log) { Write-Host "===== $log ====="; Get-Content $log -Tail 160 }
            }
            throw "CMake configure or vcpkg dependency build failed"
          }

          $cacheText = Get-Content (Join-Path $build "CMakeCache.txt") -Raw
          if ($cacheText -notmatch 'LADYBIRD_BASELINE_CPU_TARGET:BOOL=OFF') {
            throw "LADYBIRD_BASELINE_CPU_TARGET is not OFF"
          }
          if ($cacheText -notmatch 'VCPKG_TARGET_TRIPLET:STRING=x64-windows-v3') {
            throw "vcpkg did not select x64-windows-v3"
          }
          Write-Host "CMake configure and vcpkg manifest dependency build completed."

      - name: Verify Ladybird compile commands use v3
        run: |
          $ErrorActionPreference = "Stop"
          $file = Join-Path $env:BUILD_ROOT "ladybird\Build\release\compile_commands.json"
          if (!(Test-Path $file)) { throw "compile_commands.json missing" }
          $entries = @(Get-Content $file -Raw | ConvertFrom-Json)
          if ($entries.Count -eq 0) { throw "compile_commands.json is empty" }

          $missing = @()
          $bad = @()
          foreach ($entry in $entries) {
            $cmd = [string]$entry.command
            if ([string]::IsNullOrWhiteSpace($cmd) -and $entry.arguments) { $cmd = $entry.arguments -join " " }
            if ($cmd -match '(?i)(-march=native|-Ctarget-cpu=native|-march=x86-64-v2)') { $bad += $entry.file }
            if ($entry.file -match '\.(c|cc|cpp|cxx)$' -and
                $cmd -notmatch '(?i)(/clang:)?-march=x86-64-v3') { $missing += $entry.file }
          }
          if ($bad.Count) { $bad | Select-Object -First 25 | ForEach-Object { Write-Host "Bad target: $_" }; throw "Invalid CPU target in compile commands" }
          if ($missing.Count) { $missing | Select-Object -First 25 | ForEach-Object { Write-Host "Missing v3: $_" }; throw "Some Ladybird C/C++ compile commands lack v3" }
          if ($env:RUSTFLAGS -notmatch 'target-cpu=x86-64-v3') { throw "Rust target is not v3" }

          Write-Host "Verified $($entries.Count) Ladybird compile commands."
          Write-Host "Rust RUSTFLAGS=$env:RUSTFLAGS"

      - name: Build Ladybird
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT
          cmake --build ladybird\Build\release --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Ladybird build failed" }

      - name: Install runtime and stage dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT
          $build = Join-Path $env:BUILD_ROOT "ladybird\Build\release"
          $prefix = Join-Path $env:BUILD_ROOT "runtime-install"
          if (Test-Path $prefix) { Remove-Item $prefix -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null

          cmake --install $build --config Release --component ladybird_Runtime --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "Runtime component installation failed" }

          $bin = Join-Path $prefix "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $installed = Join-Path $build "vcpkg_installed\x64-windows-v3"
          $depBin = Join-Path $installed "bin"
          if (Test-Path $depBin) {
            Get-ChildItem $depBin -File -Filter "*.dll" | ForEach-Object {
              $dest = Join-Path $bin $_.Name
              if (!(Test-Path $dest)) { Copy-Item $_.FullName $dest }
            }
          }

          # Locate Qt plugin tree from the v3 target installation.
          $pluginRoots = @(
            (Join-Path $installed "Qt6\plugins"),
            (Join-Path $installed "plugins"),
            (Join-Path $build "vcpkg_installed\x64-windows-v3\Qt6\plugins")
          ) | Where-Object { Test-Path $_ -PathType Container }

          $qwindows = $null
          foreach ($root in $pluginRoots) {
            $qwindows = Get-ChildItem $root -Recurse -File -Filter qwindows.dll |
              Where-Object { $_.FullName -match '[\\/]platforms[\\/]qwindows\.dll$' } |
              Select-Object -First 1
            if ($qwindows) { break }
          }
          if (!$qwindows) {
            $qwindows = Get-ChildItem $build -Recurse -File -Filter qwindows.dll |
              Where-Object { $_.FullName -match '[\\/]platforms[\\/]qwindows\.dll$' } |
              Select-Object -First 1
          }
          if (!$qwindows) { throw "Qt qwindows.dll not found" }

          $qtRoot = Split-Path $qwindows.Directory.FullName -Parent
          Get-ChildItem $qtRoot -Directory | ForEach-Object {
            $target = Join-Path $bin $_.Name
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem $_.FullName -File -Filter "*.dll" | ForEach-Object {
              $dest = Join-Path $target $_.Name
              if (!(Test-Path $dest)) { Copy-Item $_.FullName $dest }
            }
          }

          if (!(Test-Path (Join-Path $bin "platforms\qwindows.dll"))) {
            throw "Qt Windows platform plugin was not staged"
          }

          # Runtime resources.
          $lagom = Join-Path $prefix "share\Lagom"
          if (!(Test-Path $lagom -PathType Container)) {
            $sourceLagom = Join-Path $build "share\Lagom"
            if (Test-Path $sourceLagom) {
              New-Item -ItemType Directory -Force -Path (Join-Path $prefix "share") | Out-Null
              Copy-Item $sourceLagom $lagom -Recurse -Force
            }
          }
          if (!(Test-Path $lagom -PathType Container)) { throw "share/Lagom runtime resources missing" }

          $main = Get-ChildItem $bin -File -Filter "Ladybird.exe" | Select-Object -First 1
          if (!$main) {
            $main = Get-ChildItem $bin -File -Filter "*.exe" |
              Where-Object { $_.BaseName -ieq "ladybird" } | Select-Object -First 1
          }
          if (!$main) { throw "Ladybird main executable not found in runtime bin" }

          "RUNTIME_INSTALL_PREFIX=$prefix" | Add-Content $env:GITHUB_ENV
          "LADYBIRD_MAIN_EXE=$($main.Name)" | Add-Content $env:GITHUB_ENV
          Write-Host "Runtime staged at $prefix"
          Write-Host "Main executable: $($main.Name)"

      - name: Verify runtime package and x64 architecture
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:RUNTIME_INSTALL_PREFIX
          $bin = Join-Path $root "bin"
          $exe = Join-Path $bin $env:LADYBIRD_MAIN_EXE
          if (!(Test-Path $exe)) { throw "Main EXE missing" }

          $all = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @(".exe",".dll") })
          if (!$all.Count) { throw "No EXE/DLL runtime files found" }
          foreach ($file in $all) {
            $headers = & dumpbin.exe /HEADERS $file.FullName 2>&1
            if ($LASTEXITCODE -ne 0 -or (($headers | Out-String) -notmatch '8664 machine')) {
              throw "Non-x64 or unreadable PE file: $($file.FullName)"
            }
          }

          $badTools = @("androiddeployqt.exe","androiddeployqt6.exe","androidtestrunner.exe",
            "qmake.exe","qmake6.exe","qtpaths.exe","qtpaths6.exe","rcc.exe","syncqt.exe",
            "uic.exe","moc.exe","wasmdeployqt.exe","wasmdeployqt6.exe","windeployqt.exe","windeployqt6.exe")
          foreach ($tool in $badTools) {
            $found = Get-ChildItem $root -Recurse -File -Filter $tool | Select-Object -First 1
            if ($found) { throw "Qt development tool unexpectedly packaged: $($found.FullName)" }
          }

          Write-Host "PE architecture verified for $($all.Count) runtime EXE/DLL files."
          Write-Host "Note: PE machine type confirms x64, not the presence of every v3 instruction."

      - name: Runtime smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:RUNTIME_INSTALL_PREFIX
          $bin = Join-Path $root "bin"
          $exe = Join-Path $bin $env:LADYBIRD_MAIN_EXE
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$bin;$env:PATH"
          $env:QT_PLUGIN_PATH = $bin
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $bin "platforms"

          $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try {
            Start-Sleep -Seconds 20
            $p.Refresh()
            if ($p.HasExited) { throw "Ladybird exited during smoke test: $($p.ExitCode)" }
            Write-Host "Ladybird process remained running for 20 seconds."
          } finally {
            $p.Refresh()
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Generate build report and package inventory
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          if (!$env:BUILD_ROOT) { Write-Host "Build root unavailable"; exit 0 }
          $prefix = Join-Path $env:BUILD_ROOT "runtime-install"
          $dist = Join-Path $env:BUILD_ROOT "dist"
          $upload = Join-Path $env:GITHUB_WORKSPACE "_upload"
          New-Item -ItemType Directory -Force -Path $dist,$upload | Out-Null

          $inventory = Join-Path $dist "PACKAGE-INVENTORY.txt"
          if (Test-Path $prefix) {
            Get-ChildItem $prefix -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($prefix.Length).TrimStart("\")
              "$relative`t$($_.Length)"
            } | Set-Content $inventory
          } else {
            "Runtime package not created." | Set-Content $inventory
          }

          @"
          Ladybird Windows x64
          CPU compilation target: x86-64-v3
          Target C/C++ compiler: LLVM clang-cl $env:LLVM_VERSION
          Target Rust flags: $env:RUSTFLAGS
          vcpkg target triplet: x64-windows-v3
          vcpkg host triplet: x64-windows
          vcpkg binary cache: disabled (fresh source builds requested)
          Ladybird ref: $env:LADYBIRD_REF
          Ladybird commit: $env:LADYBIRD_SHA
          vcpkg baseline: $env:VCPKG_BASELINE
          Main executable: $env:LADYBIRD_MAIN_EXE
          Workflow run: $env:GITHUB_RUN_NUMBER
          Scope note: compiler-generated target code is configured for x86-64-v3; hand-written assembly, prebuilt external tools, and projects that override compiler flags require individual upstream verification.
          "@ | Set-Content (Join-Path $dist "BUILD-INFO.txt")

          Copy-Item $inventory $upload -Force
          Copy-Item (Join-Path $dist "BUILD-INFO.txt") $upload -Force

      - name: Create ZIP and SHA256
        if: success()
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:BUILD_ROOT "dist"
          $prefix = $env:RUNTIME_INSTALL_PREFIX
          $zip = Join-Path $dist "Ladybird-Windows-x64-x86-64-v3.zip"
          if (!(Test-Path $prefix -PathType Container)) { throw "Runtime package missing" }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $prefix "*") -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Ladybird-Windows-x64-x86-64-v3.zip" |
            Set-Content (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Prepare upload directory
        if: success()
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:BUILD_ROOT "dist"
          $upload = Join-Path $env:GITHUB_WORKSPACE "_upload"
          New-Item -ItemType Directory -Force -Path $upload | Out-Null
          foreach ($name in @("Ladybird-Windows-x64-x86-64-v3.zip","SHA256SUMS.txt","BUILD-INFO.txt","PACKAGE-INVENTORY.txt")) {
            $src = Join-Path $dist $name
            if (!(Test-Path $src -PathType Leaf)) { throw "Required package file missing: $src" }
            Copy-Item $src $upload -Force
          }

      - name: Upload Windows x64 v3 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-x86-64-v3
          path: |
            _upload/Ladybird-Windows-x64-x86-64-v3.zip
            _upload/SHA256SUMS.txt
            _upload/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-package-inventory
          path: |
            _upload/PACKAGE-INVENTORY.txt
            _upload/BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub pre-release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-x86-64-v3-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 x86-64-v3 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            _upload/Ladybird-Windows-x64-x86-64-v3.zip
            _upload/SHA256SUMS.txt
            _upload/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
