
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird branch, tag, or commit SHA"
        required: true
        default: "release/2026.48"
        type: string
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-x64-v3
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 x86-64-v3
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_DEFAULT_TRIPLET: x64-windows
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      LLVM_VERSION: "23.1.6"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create short physical build directory
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lb"

          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $root | Out-Null

          & robocopy.exe $env:GITHUB_WORKSPACE $root /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XD .git
          $rc = $LASTEXITCODE

          if ($rc -ge 8) {
            throw "Robocopy failed: $rc"
          }

          $tmp = Join-Path $root "tmp"
          $cache = Join-Path $root ".vcpkg-binary-cache"

          New-Item -ItemType Directory -Force -Path $tmp,$cache | Out-Null

          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "BUILD_ROOT=$root`nTEMP=$tmp`nTMP=$tmp`nVCPKG_DEFAULT_BINARY_CACHE=$cache`n",
            [Text.UTF8Encoding]::new($false)
          )

          Write-Host "Build root: $root"
          Write-Host "Robocopy exit code: $rc"
          $global:LASTEXITCODE = 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned LLVM 23.1.6
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:LLVM_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.msi"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.msi"
          $log = Join-Path $env:RUNNER_TEMP "llvm-install.log"

          Write-Host "Downloading official LLVM $version Windows x64 MSI"
          Write-Host $url

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "LLVM installer download failed"
          }

          if ((Get-Item $installer).Length -lt 100MB) {
            throw "LLVM installer is unexpectedly small"
          }

          Write-Host "Installing LLVM..."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/qn"
            "/norestart"
            "/L*v"
            "`"$log`""
          )

          $process = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            if (Test-Path $log) {
              Get-Content $log -Tail 100
            }
            throw "LLVM MSI installation failed: $($process.ExitCode)"
          }

          Write-Host "Searching for installed LLVM executables..."

          $searchRoots = @(
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\LLVM",
            "C:\LLVM"
          )

          $clang = $null

          $candidates = @(
            "C:\Program Files\LLVM\bin\clang-cl.exe",
            "C:\Program Files (x86)\LLVM\bin\clang-cl.exe",
            "C:\LLVM\23.1.6\bin\clang-cl.exe",
            "C:\LLVM\bin\clang-cl.exe"
          )

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $clang = $candidate
              break
            }
          }

          if (!$clang) {
            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem -Path $root `
                  -Filter "clang-cl.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($found) {
                  $clang = $found.FullName
                  break
                }
              }
            }
          }

          if (!$clang) {
            Write-Host "LLVM installation log:"
            if (Test-Path $log) {
              Get-Content $log -Tail 150
            }
            throw "clang-cl.exe was not found after LLVM installation"
          }

          $bin = Split-Path $clang -Parent
          $llvmRoot = Split-Path $bin -Parent
          $lld = Join-Path $bin "lld-link.exe"

          if (!(Test-Path $lld)) {
            throw "lld-link.exe not found beside clang-cl.exe: $lld"
          }

          Write-Host "Detected LLVM root: $llvmRoot"
          Write-Host "Detected clang-cl: $clang"
          Write-Host "Detected lld-link: $lld"

          $versionOutput = (& $clang --version | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "23\.1\.6") {
            throw "Wrong LLVM version. Expected 23.1.6. Actual: $versionOutput"
          }

          "LLVM_ROOT=$llvmRoot" >> $env:GITHUB_ENV
          "LLVM_CLANG_CL=$clang" >> $env:GITHUB_ENV
          "LLVM_LLD_LINK=$lld" >> $env:GITHUB_ENV

          "$bin" >> $env:GITHUB_PATH

          Write-Host "LLVM $version installed and verified."

      - name: Install remaining build tools
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja cmake git 7zip -y

          if ($LASTEXITCODE -ne 0) {
            throw "Build tools installation failed"
          }

          Write-Host "Installed Ninja, CMake, Git and 7-Zip."

      - name: Verify and lock toolchain
        run: |
          $ErrorActionPreference = "Stop"

          $clang = $env:LLVM_CLANG_CL
          $lld = $env:LLVM_LLD_LINK

          if (!(Test-Path $clang)) {
            throw "Pinned clang-cl.exe is missing: $clang"
          }

          if (!(Test-Path $lld)) {
            throw "Pinned lld-link.exe is missing: $lld"
          }

          Write-Host "===== Pinned clang-cl ====="
          & $clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl version check failed"
          }

          $versionOutput = (& $clang --version | Out-String)

          if ($versionOutput -notmatch "23\.1\.6") {
            throw "Wrong Clang version. Expected 23.1.6."
          }

          Write-Host "===== Pinned lld-link ====="
          & $lld --version

          if ($LASTEXITCODE -ne 0) {
            throw "lld-link verification failed"
          }

          Write-Host "===== MSVC ====="
          cl

          Write-Host "===== CMake ====="
          cmake --version

          if ($LASTEXITCODE -ne 0) {
            throw "CMake verification failed"
          }

          Write-Host "===== Ninja ====="
          ninja --version

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja verification failed"
          }

          Write-Host "===== Rust ====="
          rustc -vV

          if ($LASTEXITCODE -ne 0) {
            throw "Rust verification failed"
          }

          cargo --version
          python --version
          git --version

          git config --global core.longpaths true

          if ($LASTEXITCODE -ne 0) {
            throw "Git configuration failed"
          }

          Write-Host "Toolchain locked to LLVM $env:LLVM_VERSION"

      - name: Checkout Ladybird
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          git clone https://github.com/LadybirdBrowser/ladybird.git ladybird

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird clone failed"
          }

          Set-Location ladybird

          git fetch --tags origin "${{ inputs.ref }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch requested ref"
          }

          git checkout --detach FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird checkout failed"
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "Submodule update failed"
          }

          $sha = (git rev-parse HEAD).Trim()
          "LADYBIRD_SHA=$sha" >> $env:GITHUB_ENV

          Write-Host "Ladybird commit: $sha"

      - name: Patch Windows CrashReport unused variable
        run: |
          $ErrorActionPreference = "Stop"

          $file = Join-Path $env:BUILD_ROOT "ladybird\Libraries\LibWebView\CrashReport.cpp"

          if (!(Test-Path $file)) {
            throw "CrashReport.cpp not found: $file"
          }

          $source = Get-Content $file -Raw

          $oldGlobal = 'static DisableSandbox s_disable_sandbox { DisableSandbox::No };'

          $newGlobal = @'
          #if !defined(AK_OS_WINDOWS)
          static DisableSandbox s_disable_sandbox { DisableSandbox::No };
          #endif
          '@.Trim()

          if (!$source.Contains($oldGlobal)) {
            throw "Cannot locate s_disable_sandbox declaration; upstream source may have changed."
          }

          $source = $source.Replace($oldGlobal, $newGlobal)

          $pattern = '(?s)void CrashReport::set_sandbox_is_disabled\(DisableSandbox disable_sandbox\)\s*\{\s*s_disable_sandbox = disable_sandbox;\s*\}'

          $replacement = @'
          void CrashReport::set_sandbox_is_disabled(DisableSandbox disable_sandbox)
          {
          #if !defined(AK_OS_WINDOWS)
              s_disable_sandbox = disable_sandbox;
          #else
              (void)disable_sandbox;
          #endif
          }
          '@.Trim()

          $regex = [regex]::new($pattern)

          if ($regex.Matches($source).Count -ne 1) {
            throw "Cannot uniquely locate set_sandbox_is_disabled()"
          }

          $source = $regex.Replace($source, $replacement, 1)

          [IO.File]::WriteAllText(
            $file,
            $source,
            [Text.UTF8Encoding]::new($false)
          )

          $verify = Get-Content $file -Raw

          if ($verify -notmatch '#if !defined\(AK_OS_WINDOWS\)') {
            throw "Windows conditional patch verification failed"
          }

          if ($verify -match 'static DisableSandbox s_disable_sandbox' -and
              $verify -notmatch '(?s)#if !defined\(AK_OS_WINDOWS\)\s+static DisableSandbox s_disable_sandbox') {
            throw "CrashReport global variable guard verification failed"
          }

          Write-Host "CrashReport.cpp Windows warning patch applied."
          Write-Host "The original non-Windows behavior is preserved."

      - name: Read upstream vcpkg baseline
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:BUILD_ROOT\ladybird"

          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "vcpkg builtin-baseline missing"
          }

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV
          Write-Host "vcpkg baseline: $baseline"

      - name: Checkout and bootstrap vcpkg
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          git clone https://github.com/microsoft/vcpkg.git vcpkg

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed"
          }

          Set-Location vcpkg

          git checkout --detach "$env:VCPKG_BASELINE"

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline checkout failed"
          }

          .\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          $vcpkgRoot = (Get-Location).Path
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "$vcpkgRoot" >> $env:GITHUB_PATH

      - name: Create dav1d MSVC compatibility overlay
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePort = Join-Path $env:VCPKG_ROOT "ports\dav1d"
          $overlayRoot = Join-Path $env:BUILD_ROOT "vcpkg-overlays\ports"
          $overlayPort = Join-Path $overlayRoot "dav1d"

          if (!(Test-Path "$sourcePort\portfile.cmake")) {
            throw "Original dav1d portfile not found"
          }

          New-Item -ItemType Directory -Force -Path $overlayPort | Out-Null
          Copy-Item "$sourcePort\*" $overlayPort -Recurse -Force

          $portfile = Join-Path $overlayPort "portfile.cmake"
          $content = Get-Content $portfile -Raw

          $anchor = "    HEAD_REF master`r`n)"
          if (!$content.Contains($anchor)) {
            $anchor = "    HEAD_REF master`n)"
          }

          if (!$content.Contains($anchor)) {
            throw "Cannot locate dav1d vcpkg_from_github insertion point"
          }

          $patchLines = @(
            ""
            "# Local compatibility fix for MSVC preprocessing."
            'set(_dav1d_stdatomic "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")'
            'if (EXISTS "${_dav1d_stdatomic}")'
            '    file(READ "${_dav1d_stdatomic}" _dav1d_stdatomic_content)'
            '    set(_dav1d_old_condition'
            '        "#if defined(__clang__) && __has_include_next(<stdatomic.h>)"'
            '    )'
            '    set(_dav1d_new_condition'
            '        "#if defined(__clang__)"'
            '    )'
            '    string(FIND'
            '        "${_dav1d_stdatomic_content}"'
            '        "${_dav1d_old_condition}"'
            '        _dav1d_condition_position'
            '    )'
            '    if (_dav1d_condition_position EQUAL -1)'
            '        message(FATAL_ERROR'
            '            "dav1d stdatomic.h compatibility patch anchor not found. "'
            '            "Upstream source may have changed."'
            '        )'
            '    endif()'
            '    string(REPLACE'
            '        "${_dav1d_old_condition}"'
            '        "${_dav1d_new_condition}"'
            '        _dav1d_stdatomic_patched'
            '        "${_dav1d_stdatomic_content}"'
            '    )'
            '    file(WRITE'
            '        "${_dav1d_stdatomic}"'
            '        "${_dav1d_stdatomic_patched}"'
            '    )'
            '    message(STATUS'
            '        "Applied local dav1d MSVC stdatomic.h compatibility patch"'
            '    )'
            'else()'
            '    message(FATAL_ERROR "dav1d stdatomic.h not found")'
            'endif()'
          )

          $patch = ($patchLines -join "`n") + "`n"
          $insertAt = $content.IndexOf($anchor) + $anchor.Length
          $content = $content.Insert($insertAt, "`n" + $patch)

          Set-Content -Path $portfile -Value $content -Encoding utf8

          $overlayPortfile = Get-Content $portfile -Raw

          if ($overlayPortfile -notmatch "Applied local dav1d MSVC stdatomic.h compatibility patch") {
            throw "dav1d overlay patch insertion failed"
          }

          "VCPKG_OVERLAY_PORTS=$overlayRoot" >> $env:GITHUB_ENV

          Write-Host "dav1d overlay created: $overlayPort"
          Get-Content $portfile

      - name: Create vcpkg release triplet
        run: |
          $ErrorActionPreference = "Stop"

          $triplets = Join-Path $env:BUILD_ROOT "vcpkg-overlays\triplets"
          New-Item -ItemType Directory -Force -Path $triplets | Out-Null

          $source = Join-Path $env:VCPKG_ROOT "triplets\x64-windows.cmake"
          $target = Join-Path $triplets "x64-windows.cmake"

          Copy-Item $source $target -Force

          $content = Get-Content $target -Raw

          if ($content -notmatch "VCPKG_BUILD_TYPE") {
            Add-Content $target "`nset(VCPKG_BUILD_TYPE release)"
          }

          "VCPKG_OVERLAY_TRIPLETS=$triplets" >> $env:GITHUB_ENV

      - name: Configure Ladybird
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $build = "ladybird\Build\release"

          if (Test-Path $build) {
            Remove-Item $build -Recurse -Force
          }

          $clang = $env:LLVM_CLANG_CL
          $lld = $env:LLVM_LLD_LINK

          if (!(Test-Path $clang)) {
            throw "Pinned clang-cl not found: $clang"
          }

          if (!(Test-Path $lld)) {
            throw "Pinned lld-link not found: $lld"
          }

          Write-Host "C compiler: $clang"
          Write-Host "C++ compiler: $clang"
          Write-Host "Linker: $lld"

          & $clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl pre-configuration check failed"
          }

          cmake -S ladybird -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DLADYBIRD_BASELINE_CPU_TARGET=OFF `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clang" `
            "-DCMAKE_LINKER=$lld" `
            "-DCMAKE_MAKE_PROGRAM=ninja" `
            -DCMAKE_C_FLAGS="/clang:-march=x86-64-v3" `
            -DCMAKE_CXX_FLAGS="/clang:-march=x86-64-v3" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DVCPKG_OVERLAY_TRIPLETS=$env:VCPKG_OVERLAY_TRIPLETS" `
            "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_INSTALL=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake/vcpkg configuration failed."

            $logs = @(
              "$env:VCPKG_ROOT\buildtrees\dav1d\package-x64-windows-rel-out.log",
              "$env:VCPKG_ROOT\buildtrees\dav1d\meson-x64-windows-rel-out.log",
              "$env:BUILD_ROOT\ladybird\Build\release\vcpkg-manifest-install.log"
            )

            foreach ($log in $logs) {
              if (Test-Path $log) {
                Write-Host "===== $log ====="
                Get-Content $log -Tail 200
              }
            }

            throw "CMake configuration failed"
          }

          $cacheFile = Join-Path $build "CMakeCache.txt"

          if (!(Test-Path $cacheFile)) {
            throw "CMakeCache.txt not found"
          }

          $cache = Get-Content $cacheFile -Raw

          function Get-CacheValue {
            param([string]$Key)

            $pattern = "(?m)^" + [regex]::Escape($Key) + ":[^=]*=(.*)$"
            $match = [regex]::Match($cache, $pattern)

            if ($match.Success) {
              return $match.Groups[1].Value.Trim()
            }

            return $null
          }

          function Normalize-Path {
            param([string]$Path)

            if ([string]::IsNullOrWhiteSpace($Path)) {
              return ""
            }

            return [IO.Path]::GetFullPath($Path).
              Replace('\', '/').
              TrimEnd('/').
              ToLowerInvariant()
          }

          $expected = Normalize-Path $env:LLVM_CLANG_CL
          $actualC = Get-CacheValue "CMAKE_C_COMPILER"
          $actualCXX = Get-CacheValue "CMAKE_CXX_COMPILER"
          $actualLinker = Get-CacheValue "CMAKE_LINKER"

          Write-Host "===== CMake compiler verification ====="
          Write-Host "Expected: $expected"
          Write-Host "C compiler: $actualC"
          Write-Host "CXX compiler: $actualCXX"
          Write-Host "Linker: $actualLinker"

          if (!$actualC -or !$actualCXX) {
            throw "CMake compiler entries missing"
          }

          if ((Normalize-Path $actualC) -ne $expected) {
            throw "CMake C compiler does not match pinned LLVM: $actualC"
          }

          if ((Normalize-Path $actualCXX) -ne $expected) {
            throw "CMake CXX compiler does not match pinned LLVM: $actualCXX"
          }

          if (!(Test-Path $actualC)) {
            throw "CMake compiler executable does not exist: $actualC"
          }

          Write-Host "===== Verify actual CMake compiler version ====="

          $versionOutput = (& $actualC --version | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "23\.1\.6") {
            throw "Unexpected Clang version"
          }

          if ($actualLinker) {
            Write-Host "Selected linker: $actualLinker"
          }

          $cFlags = Get-CacheValue "CMAKE_C_FLAGS"
          $cxxFlags = Get-CacheValue "CMAKE_CXX_FLAGS"

          Write-Host "C flags: $cFlags"
          Write-Host "CXX flags: $cxxFlags"

          if ($cFlags -notmatch "x86-64-v3") {
            throw "C compiler is missing x86-64-v3 target flags"
          }

          if ($cxxFlags -notmatch "x86-64-v3") {
            throw "CXX compiler is missing x86-64-v3 target flags"
          }

          $baselineCpu = Get-CacheValue "LADYBIRD_BASELINE_CPU_TARGET"

          if ($baselineCpu -ne "OFF") {
            throw "LADYBIRD_BASELINE_CPU_TARGET must be OFF to prevent upstream x86-64-v2 flags."
          }

          Write-Host "SUCCESS: LLVM 23.1.6 verified."
          Write-Host "SUCCESS: x86-64-v3 compiler flags configured."
          Write-Host "SUCCESS: upstream x86-64-v2 baseline option disabled."

      - name: Inspect dav1d source patch
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          $sourceRoot = Join-Path $env:VCPKG_ROOT "buildtrees\dav1d\src"

          if (!(Test-Path $sourceRoot)) {
            Write-Host "dav1d source directory does not exist yet."
            exit 0
          }

          $headers = @(
            Get-ChildItem $sourceRoot -Recurse -File -Filter "stdatomic.h" |
            Where-Object {
              $_.FullName -match '[\\/]compat[\\/]msvc[\\/]stdatomic\.h$'
            }
          )

          if ($headers.Count -eq 0) {
            Write-Host "No matching dav1d stdatomic.h found in buildtrees."
            exit 0
          }

          foreach ($header in $headers) {
            Write-Host "===== $($header.FullName) ====="

            $content = Get-Content $header.FullName -Raw

            $content -split "`r?`n" |
              Where-Object {
                $_ -match 'has_include_next|defined\(__clang__\)'
              } |
              ForEach-Object {
                Write-Host $_
              }

            if ($content -match '#if defined\(__clang__\) && __has_include_next') {
              Write-Host "NOTICE: This copy still contains the original condition."
            }
            elseif ($content -match '#if defined\(__clang__\)') {
              Write-Host "Patched condition detected in this copy."
            }
          }

          Write-Host "Inspection completed. Build result is the final patch test."

      - name: Build Ladybird
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $clang = $env:LLVM_CLANG_CL
          $versionOutput = (& $clang --version | Out-String)

          if ($versionOutput -notmatch "23\.1\.6") {
            throw "Wrong Clang version before build: $versionOutput"
          }

          cmake --build ladybird\Build\release --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      - name: Verify build outputs
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $build = (Resolve-Path "ladybird\Build\release").Path

          $required = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe"
          )

          foreach ($name in $required) {
            $found = Get-ChildItem $build -Recurse -File -Filter $name |
              Where-Object {
                $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
                $_.FullName -notmatch '[\\/]debug[\\/]'
              } |
              Select-Object -First 1

            if (!$found) {
              throw "Required build output missing: $name"
            }

            Write-Host "Found: $($found.FullName)"
          }

      - name: Stage runtime package
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $build = (Resolve-Path "ladybird\Build\release").Path
          $stage = Join-Path $env:BUILD_ROOT "dist\Ladybird-Windows-x64"

          $bin = Join-Path $stage "bin"
          $libexec = Join-Path $stage "libexec"
          $share = Join-Path $stage "share"

          New-Item -ItemType Directory -Force -Path $bin,$libexec,$share | Out-Null

          $main = Get-ChildItem $build -Recurse -File -Filter "Ladybird.exe" |
            Where-Object {
              $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
              $_.FullName -notmatch '[\\/]debug[\\/]'
            } |
            Select-Object -First 1

          if (!$main) {
            throw "Ladybird.exe missing"
          }

          Copy-Item $main.FullName (Join-Path $bin "Ladybird.exe") -Force

          $helpers = @(
            "AudioServer.exe",
            "Compositor.exe",
            "ImageDecoder.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "SystemProbe.exe",
            "VideoDecoderServer.exe",
            "WebContent.exe",
            "WebRTCClient.exe"
          )

          foreach ($name in $helpers) {
            $found = Get-ChildItem $build -Recurse -File -Filter $name |
              Where-Object {
                $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
                $_.FullName -notmatch '[\\/]debug[\\/]'
              } |
              Select-Object -First 1

            if ($found) {
              Copy-Item $found.FullName (Join-Path $libexec $name) -Force
              Write-Host "Helper staged: $name"
            }
          }

          Get-ChildItem $build -Recurse -File -Filter "*.dll" |
            Where-Object {
              $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
              $_.FullName -notmatch '[\\/]debug[\\/]'
            } |
            ForEach-Object {
              $target = Join-Path $bin $_.Name
              if (!(Test-Path $target)) {
                Copy-Item $_.FullName $target
              }
            }

          $vcpkgBin = Join-Path $build "vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -File -Filter "*.dll" |
              ForEach-Object {
                $target = Join-Path $bin $_.Name
                if (!(Test-Path $target)) {
                  Copy-Item $_.FullName $target
                }
              }
          }

          Get-ChildItem $build -Directory -Recurse |
            Where-Object Name -eq "plugins" |
            ForEach-Object {
              foreach ($plugin in @(
                "platforms",
                "imageformats",
                "styles",
                "tls",
                "networkinformation",
                "position"
              )) {
                $source = Join-Path $_.FullName $plugin

                if (Test-Path $source) {
                  $target = Join-Path $bin $plugin
                  New-Item -ItemType Directory -Force -Path $target | Out-Null

                  Get-ChildItem $source -File -Filter "*.dll" |
                    ForEach-Object {
                      $destination = Join-Path $target $_.Name
                      if (!(Test-Path $destination)) {
                        Copy-Item $_.FullName $destination
                      }
                    }
                }
              }
            }

          $sourceShare = Join-Path $build "share"

          if (Test-Path $sourceShare) {
            Get-ChildItem $sourceShare -Force |
              ForEach-Object {
                $target = Join-Path $share $_.Name
                if (!(Test-Path $target)) {
                  Copy-Item $_.FullName $target -Recurse -Force
                }
              }
          }

          $cache = Get-Content (Join-Path $build "CMakeCache.txt") -Raw

          $match = [regex]::Match(
            $cache,
            '(?m)^LADYBIRD_ICU_DATA_FILE:[^=]*=(.*)$'
          )

          $icuData = ""

          if ($match.Success) {
            $icuData = $match.Groups[1].Value.Trim()
          }

          if ($icuData -and (Test-Path $icuData -PathType Leaf)) {
            $icuTarget = Join-Path $share "Lagom\icu"
            New-Item -ItemType Directory -Force -Path $icuTarget | Out-Null

            Copy-Item $icuData (Join-Path $icuTarget ([IO.Path]::GetFileName($icuData))) -Force

            "ICU_MODE=DAT" >> $env:GITHUB_ENV
            "ICU_DAT_NAME=$([IO.Path]::GetFileName($icuData))" >> $env:GITHUB_ENV
          }
          else {
            $icuDlls = @(Get-ChildItem $bin -File -Filter "icudt*.dll")

            if ($icuDlls.Count -eq 0) {
              throw "ICU data file or ICU data DLL not found"
            }

            "ICU_MODE=DLL" >> $env:GITHUB_ENV
          }

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Main executable missing from package"
          }

          Write-Host "Runtime package staged."

      - name: Verify package layout
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $stage = (Resolve-Path "dist\Ladybird-Windows-x64").Path
          $bin = Join-Path $stage "bin"
          $libexec = Join-Path $stage "libexec"

          if (!(Test-Path (Join-Path $bin "Ladybird.exe"))) {
            throw "Ladybird.exe missing"
          }

          foreach ($name in @(
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe"
          )) {
            if (!(Test-Path (Join-Path $libexec $name))) {
              throw "Required helper missing: $name"
            }
          }

          Write-Host "Package layout verified."

      - name: Runtime smoke test
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $root = (Resolve-Path "dist\Ladybird-Windows-x64").Path
          $bin = Join-Path $root "bin"
          $libexec = Join-Path $root "libexec"

          $env:PATH = "$bin;$libexec;$env:PATH"
          $env:QT_PLUGIN_PATH = $bin

          if ($env:ICU_MODE -eq "DAT") {
            $env:LADYBIRD_ICU_DATA = Join-Path $root "share\Lagom\icu\$env:ICU_DAT_NAME"
          }

          $process = Start-Process (Join-Path $bin "Ladybird.exe") `
            -WorkingDirectory $bin `
            -PassThru

          Start-Sleep -Seconds 20
          $process.Refresh()

          if ($process.HasExited) {
            throw "Ladybird exited during smoke test: $($process.ExitCode)"
          }

          Write-Host "Ladybird remained running for 20 seconds."

          & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          $global:LASTEXITCODE = 0

      - name: Generate package inventory
        if: always()
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location $env:BUILD_ROOT

          $stage = Join-Path $env:BUILD_ROOT "dist\Ladybird-Windows-x64"
          $output = Join-Path $env:BUILD_ROOT "dist"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          if (Test-Path $stage) {
            Get-ChildItem $stage -Recurse -File |
              ForEach-Object {
                $relative = $_.FullName.Substring($stage.Length).TrimStart("\")
                "$relative`t$($_.Length)"
              } |
              Set-Content (Join-Path $output "PACKAGE-INVENTORY.txt")
          }

          @"
          Ladybird Windows x64
          CPU target: x86-64-v3
          LLVM version: $env:LLVM_VERSION
          LLVM compiler: $env:LLVM_CLANG_CL
          Ladybird commit: $env:LADYBIRD_SHA
          vcpkg baseline: $env:VCPKG_BASELINE
          ICU mode: $env:ICU_MODE
          Workflow run: $env:GITHUB_RUN_NUMBER
          "@ | Set-Content (Join-Path $output "BUILD-INFO.txt")

      - name: Create ZIP and SHA256
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $stage = "dist\Ladybird-Windows-x64"
          $zip = "dist\Ladybird-Windows-x64.zip"

          if (!(Test-Path $stage)) {
            throw "Package directory missing"
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

          Write-Host "ZIP SHA256: $hash"

      - name: Prepare upload directory
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          $upload = Join-Path $env:GITHUB_WORKSPACE "_upload"
          New-Item -ItemType Directory -Force -Path $upload | Out-Null

          Copy-Item "dist\Ladybird-Windows-x64.zip" $upload -Force
          Copy-Item "dist\SHA256SUMS.txt" $upload -Force
          Copy-Item "dist\PACKAGE-INVENTORY.txt" $upload -Force
          Copy-Item "dist\BUILD-INFO.txt" $upload -Force

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64-x86-64-v3
          path: |
            _upload/Ladybird-Windows-x64.zip
            _upload/SHA256SUMS.txt
            _upload/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-package-inventory
          path: _upload/PACKAGE-INVENTORY.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub pre-release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-x86-64-v3-${{ github.run_number }}-${{ github.run_attempt }}
          name: Ladybird Windows x64 x86-64-v3 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            _upload/Ladybird-Windows-x64.zip
            _upload/SHA256SUMS.txt
            _upload/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
