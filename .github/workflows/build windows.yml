
name: Build Ladybird Windows x64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird source branch, tag or commit SHA"
        required: true
        default: "release/2026.47"
        type: string
      publish_release:
        description: "Publish ZIP to GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ladybird-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      PACKAGE_NAME: Ladybird-Windows-x64
      LLVM_VERSION: "22.1.8"
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: 1
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      RUSTFLAGS: "-A deprecated"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      BUILD_TYPE: Release

    steps:
      # 1. Checkout packaging repository
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss")
          "BUILD_SHA=$shortSha" >> $env:GITHUB_ENV
          "BUILD_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV
          Write-Host "Packaging repository: $env:GITHUB_REPOSITORY"
          Write-Host "Packaging commit: $shortSha"

      # 2. Install build tools
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm --version=$env:LLVM_VERSION --allow-downgrade -y
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM installation failed"
          }

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path "$llvmBin\clang-cl.exe")) {
            throw "clang-cl.exe was not found"
          }

          if (!(Test-Path "$llvmBin\clang.exe")) {
            throw "clang.exe was not found"
          }

          $llvmBin >> $env:GITHUB_PATH

      - name: Install build utilities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja cmake git 7zip -y
          if ($LASTEXITCODE -ne 0) {
            throw "Build utilities installation failed"
          }

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($tool in @(
            "git", "cmake", "ninja", "clang", "clang-cl",
            "cl", "rustc", "cargo", "python"
          )) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Host "$tool : $($command.Source)"
          }

          cmake --version
          ninja --version
          clang --version
          clang-cl --version
          rustc --version
          python --version

      - name: Verify LLVM and MSVC compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = (& clang.exe -print-target-triple 2>&1 | Out-String).Trim()
          Write-Host "Clang target: $target"

          if ($target -notmatch "x86_64.*windows.*msvc") {
            throw "Unexpected Clang target: $target"
          }

          $testFile = Join-Path $env:RUNNER_TEMP "clang-msvc-test.cpp"

          @'
          #include <iostream>
          #include <vector>
          int main() {
              std::vector<int> values{1, 2, 3};
              std::cout << values.size() << std::endl;
              return 0;
          }
          '@ | Set-Content -Path $testFile -Encoding utf8

          clang-cl.exe /nologo /std:c++20 /EHsc /c $testFile "/Fo$env:RUNNER_TEMP\clang-msvc-test.obj"

          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl and MSVC STL compatibility test failed"
          }

      # 3. Checkout Ladybird source
      - name: Checkout Ladybird source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone https://github.com/LadybirdBrowser/ladybird.git ladybird
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Ladybird"
          }

          Set-Location ladybird

          git fetch --tags origin "${{ inputs.ref }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch requested ref: ${{ inputs.ref }}"
          }

          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout requested ref"
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize submodules"
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          "LADYBIRD_SHA=$sourceSha" >> $env:GITHUB_ENV
          Write-Host "Ladybird commit: $sourceSha"

      # 4. Read vcpkg baseline
      - name: Read vcpkg baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $manifest = Get-Content "ladybird\vcpkg.json" -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'

          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "builtin-baseline was not found"
          }

          "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV
          Write-Host "Ladybird vcpkg baseline: $baseline"

      # 5. Checkout and bootstrap vcpkg
      - name: Checkout and bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone https://github.com/microsoft/vcpkg.git vcpkg
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          Set-Location vcpkg
          git checkout --detach "$env:VCPKG_BASELINE"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout vcpkg baseline"
          }

          .\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          $vcpkgRoot = (Get-Location).Path
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "$vcpkgRoot" >> $env:GITHUB_PATH
          .\vcpkg.exe version

      # 6. Create dav1d overlay port
      - name: Create dav1d MSVC compatibility overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $originalPort = Join-Path $env:VCPKG_ROOT "ports\dav1d"
          $overlayRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg-overlays"
          $overlayPort = Join-Path $overlayRoot "dav1d"

          if (!(Test-Path "$originalPort\portfile.cmake")) {
            throw "The dav1d portfile was not found"
          }

          New-Item -ItemType Directory -Force -Path $overlayRoot | Out-Null

          if (Test-Path $overlayPort) {
            Remove-Item $overlayPort -Recurse -Force
          }

          Copy-Item $originalPort $overlayPort -Recurse

          $portfile = Join-Path $overlayPort "portfile.cmake"
          $content = Get-Content $portfile -Raw

          $patchCode = @'
          # Local workaround for MSVC 19.52 / MSVC 14.52.
          set(_dav1d_stdatomic "${SOURCE_PATH}/include/compat/msvc/stdatomic.h")
          if(NOT EXISTS "${_dav1d_stdatomic}")
              message(FATAL_ERROR "dav1d stdatomic.h not found: ${_dav1d_stdatomic}")
          endif()

          file(READ "${_dav1d_stdatomic}" _dav1d_stdatomic_content)
          set(_dav1d_old "#if defined(__clang__) && __has_include_next(<stdatomic.h>)")
          set(_dav1d_new [=[
          #ifndef __has_include_next
          #define __has_include_next(x) 0
          #endif
          #if defined(__clang__) && __has_include_next(<stdatomic.h>)
          ]=])

          string(FIND "${_dav1d_stdatomic_content}" "${_dav1d_old}" _dav1d_match)
          if(_dav1d_match EQUAL -1)
              message(FATAL_ERROR "Expected dav1d stdatomic expression was not found")
          endif()

          string(REPLACE
              "${_dav1d_old}"
              "${_dav1d_new}"
              _dav1d_stdatomic_content
              "${_dav1d_stdatomic_content}"
          )

          file(WRITE "${_dav1d_stdatomic}" "${_dav1d_stdatomic_content}")
          message(STATUS "Applied dav1d MSVC compatibility workaround")
          '@

          $marker = "vcpkg_configure_meson"
          $index = $content.IndexOf($marker)

          if ($index -lt 0) {
            throw "Could not find vcpkg_configure_meson"
          }

          $content = $content.Insert($index, $patchCode + "`r`n")
          Set-Content -Path $portfile -Value $content -Encoding utf8

          "VCPKG_OVERLAY_PORTS=$overlayRoot" >> $env:GITHUB_ENV

      # 7. Create Release-only vcpkg triplet
      - name: Create Release-only vcpkg triplet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceTriplet = Join-Path $env:VCPKG_ROOT "triplets\x64-windows.cmake"
          $overlayRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg-overlays\triplets"
          $overlayTriplet = Join-Path $overlayRoot "x64-windows.cmake"

          if (!(Test-Path $sourceTriplet)) {
            throw "Built-in x64-windows triplet was not found"
          }

          New-Item -ItemType Directory -Force -Path $overlayRoot | Out-Null
          Copy-Item $sourceTriplet $overlayTriplet -Force

          $content = Get-Content $overlayTriplet -Raw

          if ($content -notmatch "VCPKG_BUILD_TYPE") {
            Add-Content -Path $overlayTriplet -Value "`r`nset(VCPKG_BUILD_TYPE release)`r`n"
          }

          "VCPKG_OVERLAY_TRIPLETS=$overlayRoot" >> $env:GITHUB_ENV

      # 8. Restore vcpkg binary cache
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-windows2025-x64-release-clang22-${{ hashFiles('ladybird/vcpkg.json', 'vcpkg-overlays/dav1d/portfile.cmake', 'vcpkg-overlays/triplets/x64-windows.cmake') }}

      - name: Initialize vcpkg binary cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Write-Host "vcpkg binary cache: $env:VCPKG_DEFAULT_BINARY_CACHE"

      # 9. Clean build directories
      - name: Clean build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($path in @(
            "ladybird\Build\release",
            "dist"
          )) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

      # 10. Configure Ladybird
      - name: Configure Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "ladybird\Build\release"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          cmake -S ladybird -B $buildDir `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS" `
            "-DVCPKG_OVERLAY_TRIPLETS=$env:VCPKG_OVERLAY_TRIPLETS" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_INSTALL=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      # 11. Verify CMake configuration
      - name: Verify CMake compiler and CPU baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "ladybird\Build\release\CMakeCache.txt"
          if (!(Test-Path $cache)) {
            throw "CMakeCache.txt was not generated"
          }

          $content = Get-Content $cache

          function Get-CMakeCacheValue {
            param([string]$Name)

            $line = $content |
              Where-Object { $_ -match "^$([regex]::Escape($Name)):[^=]*=" } |
              Select-Object -First 1

            if (!$line) {
              return $null
            }

            return ($line -replace "^[^=]*=", "").Trim()
          }

          $cCompiler = Get-CMakeCacheValue "CMAKE_C_COMPILER"
          $cxxCompiler = Get-CMakeCacheValue "CMAKE_CXX_COMPILER"
          $triplet = Get-CMakeCacheValue "VCPKG_TARGET_TRIPLET"
          $cpuBaseline = Get-CMakeCacheValue "LADYBIRD_BASELINE_CPU_TARGET"

          if ($cCompiler -notmatch "clang-cl(\.exe)?$") {
            throw "C compiler is not clang-cl: $cCompiler"
          }

          if ($cxxCompiler -notmatch "clang-cl(\.exe)?$") {
            throw "CXX compiler is not clang-cl: $cxxCompiler"
          }

          if ($triplet -ne "x64-windows") {
            throw "Unexpected vcpkg triplet: $triplet"
          }

          if ($cpuBaseline -ne "ON") {
            throw "CPU baseline is not enabled: $cpuBaseline"
          }

          Write-Host "Verified CPU baseline: x86-64-v2"

      # 12. Build Ladybird
      - name: Build Ladybird
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build ladybird\Build\release --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Ladybird build failed"
          }

      # 13. Verify executable architecture
      - name: Verify executable architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = (Resolve-Path "ladybird\Build\release").Path

          $runtimeExecutables = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "Hub.exe",
            "SystemProbe.exe"
          )

          $checked = 0

          foreach ($name in $runtimeExecutables) {
            $exe = Get-ChildItem $buildDir -Recurse -File -Filter $name |
              Where-Object {
                $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]'
              } |
              Select-Object -First 1

            if (!$exe) {
              if ($name -in @("SystemProbe.exe", "WebDriver.exe")) {
                Write-Warning "Optional executable not found: $name"
                continue
              }

              throw "Required runtime executable not found: $name"
            }

            $stream = [System.IO.File]::OpenRead($exe.FullName)

            try {
              $reader = New-Object System.IO.BinaryReader($stream)

              if ($stream.Length -lt 0x40) {
                throw "Invalid PE file: $($exe.FullName)"
              }

              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()

              if ($peOffset -lt 0 -or $peOffset + 6 -gt $stream.Length) {
                throw "Invalid PE header: $($exe.FullName)"
              }

              $stream.Position = $peOffset
              $signature = $reader.ReadUInt32()
              $machine = $reader.ReadUInt16()

              if ($signature -ne 0x00004550 -or $machine -ne 0x8664) {
                throw "Executable is not AMD64: $($exe.FullName)"
              }

              Write-Host "AMD64: $name"
              $checked++
            }
            finally {
              $stream.Dispose()
            }
          }

          if ($checked -lt 6) {
            throw "Too few executables passed architecture verification: $checked"
          }

      # 14. Stage runtime package
      - name: Stage runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = (Resolve-Path "ladybird\Build\release").Path
          $stage = "dist\Ladybird-Windows-x64"
          $bin = Join-Path $stage "bin"
          $share = Join-Path $stage "share"
          $lagomShare = Join-Path $share "Lagom"
          $browserResources = Join-Path $lagomShare "ladybird"

          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType Directory -Force -Path $lagomShare | Out-Null
          New-Item -ItemType Directory -Force -Path $browserResources | Out-Null

          $runtimeExecutables = @(
            "Ladybird.exe",
            "WebContent.exe",
            "Compositor.exe",
            "AudioServer.exe",
            "MediaServer.exe",
            "RequestServer.exe",
            "ImageDecoder.exe",
            "VideoDecoderServer.exe",
            "WebDriver.exe",
            "WebRTCClient.exe",
            "Hub.exe",
            "SystemProbe.exe"
          )

          foreach ($name in $runtimeExecutables) {
            $found = Get-ChildItem $buildDir -Recurse -File -Filter $name |
              Where-Object {
                $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]'
              } |
              Select-Object -First 1

            if (!$found) {
              if ($name -in @("SystemProbe.exe", "WebDriver.exe")) {
                Write-Warning "Optional executable not found: $name"
                continue
              }

              throw "Required executable not found: $name"
            }

            Copy-Item $found.FullName (Join-Path $bin $name) -Force
          }

          # Copy runtime DLLs
          $dllFiles = Get-ChildItem $buildDir -Recurse -File -Filter "*.dll" |
            Where-Object {
              $_.FullName -notmatch '[\\/]cargo[\\/]build[\\/]' -and
              $_.FullName -notmatch '[\\/]debug[\\/]'
            }

          foreach ($dll in $dllFiles) {
            $destination = Join-Path $bin $dll.Name
            if (!(Test-Path $destination)) {
              Copy-Item $dll.FullName $destination
            }
          }

          # Copy vcpkg runtime DLLs
          $vcpkgBin = Join-Path $buildDir "vcpkg_installed\x64-windows\bin"

          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -File -Filter "*.dll" |
              ForEach-Object {
                $destination = Join-Path $bin $_.Name
                if (!(Test-Path $destination)) {
                  Copy-Item $_.FullName $destination
                }
              }
          }

          # Copy Qt plugins
          $pluginTypes = @(
            "platforms",
            "imageformats",
            "styles",
            "position",
            "networkinformation",
            "tls"
          )

          $pluginRoots = Get-ChildItem $buildDir -Directory -Recurse |
            Where-Object { $_.Name -eq "plugins" }

          foreach ($pluginRoot in $pluginRoots) {
            foreach ($pluginType in $pluginTypes) {
              $sourcePluginDir = Join-Path $pluginRoot.FullName $pluginType

              if (!(Test-Path $sourcePluginDir)) {
                continue
              }

              $destinationPluginDir = Join-Path $bin $pluginType
              New-Item -ItemType Directory -Force -Path $destinationPluginDir | Out-Null

              Get-ChildItem $sourcePluginDir -File -Filter "*.dll" |
                ForEach-Object {
                  $destination = Join-Path $destinationPluginDir $_.Name
                  if (!(Test-Path $destination)) {
                    Copy-Item $_.FullName $destination
                  }
                }
            }
          }

          # Copy installed share resources
          $shareSource = Join-Path $buildDir "share"

          if (Test-Path $shareSource) {
            Get-ChildItem $shareSource -Directory |
              ForEach-Object {
                $destination = Join-Path $share $_.Name
                if (!(Test-Path $destination)) {
                  Copy-Item $_.FullName $destination -Recurse -Force
                }
              }
          }

          # Copy additional resources
          $resourceRoots = @(
            (Join-Path $buildDir "UI\Resources"),
            (Join-Path $buildDir "UI\Ladybird\Resources"),
            (Join-Path $buildDir "Resources"),
            (Join-Path $buildDir "resources")
          )

          foreach ($resourceRoot in $resourceRoots) {
            if (!(Test-Path $resourceRoot)) {
              continue
            }

            Get-ChildItem $resourceRoot -Force |
              ForEach-Object {
                $destination = Join-Path $lagomShare $_.Name
                if (!(Test-Path $destination)) {
                  Copy-Item $_.FullName $destination -Recurse -Force
                }
              }
          }

          # Locate ICU data
          $icuData = Get-ChildItem $buildDir -Recurse -File -Filter "icudt*.dat" |
            Select-Object -First 1

          if (!$icuData) {
            $icuData = Get-ChildItem $env:VCPKG_ROOT -Recurse -File -Filter "icudt*.dat" |
              Where-Object { $_.FullName -match '[\\/]x64-windows[\\/]' } |
              Select-Object -First 1
          }

          if ($icuData) {
            $icuDir = Join-Path $lagomShare "icu"
            New-Item -ItemType Directory -Force -Path $icuDir | Out-Null
            Copy-Item $icuData.FullName (Join-Path $icuDir $icuData.Name) -Force
          }
          else {
            throw "ICU data file was not found"
          }

          # Locate PDF.js
          $pdfCandidates = Get-ChildItem $buildDir -Directory -Recurse |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "build\pdf.mjs")) -and
              (Test-Path (Join-Path $_.FullName "web\viewer.html"))
            }

          if ($pdfCandidates.Count -eq 0) {
            throw "A complete PDF.js resource directory was not found"
          }

          $pdfSource = $pdfCandidates | Select-Object -First 1
          $pdfDestination = Join-Path $browserResources "pdfjs"

          if (Test-Path $pdfDestination) {
            Remove-Item $pdfDestination -Recurse -Force
          }

          Copy-Item $pdfSource.FullName $pdfDestination -Recurse -Force

          foreach ($required in @(
            "build\pdf.mjs",
            "build\pdf.worker.mjs",
            "web\viewer.html",
            "web\viewer.mjs"
          )) {
            if (!(Test-Path (Join-Path $pdfDestination $required))) {
              throw "PDF.js resource is missing: $required"
            }
          }

          foreach ($required in @(
            "bin\Ladybird.exe",
            "bin\WebContent.exe",
            "bin\Compositor.exe",
            "share\Lagom\ladybird\pdfjs\build\pdf.mjs",
            "share\Lagom\ladybird\pdfjs\web\viewer.html"
          )) {
            if (!(Test-Path (Join-Path $stage $required))) {
              throw "Required package path is missing: $required"
            }
          }

          Write-Host "Runtime package staged:"
          Get-ChildItem $stage -Recurse -File |
            Select-Object FullName, Length

      # 15. Create launcher and build information
      - name: Create launcher and build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = "dist\Ladybird-Windows-x64"
          $mainExe = Join-Path $stage "bin\Ladybird.exe"

          if (!(Test-Path $mainExe)) {
            throw "bin\Ladybird.exe was not found"
          }

          @'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          set "PATH=%ROOT%bin;%PATH%"
          set "ICU_DATA=%ROOT%share\Lagom\icu"
          set "QT_PLUGIN_PATH=%ROOT%bin"
          cd /d "%ROOT%bin"
          "%ROOT%bin\Ladybird.exe" %*
          '@ | Set-Content "$stage\Start-Ladybird.bat" -Encoding ascii

          @"
          Product: Ladybird
          Platform: Windows x64
          Configuration: Release
          Source repository: https://github.com/LadybirdBrowser/ladybird
          Source ref: ${{ inputs.ref }}
          Source commit: $env:LADYBIRD_SHA
          Packaging commit: $env:BUILD_SHA
          Build timestamp UTC: $env:BUILD_TIMESTAMP
          vcpkg baseline: $env:VCPKG_BASELINE
          Compiler: clang-cl + MSVC STL
          CPU baseline: x86-64-v2
          CMake option: LADYBIRD_BASELINE_CPU_TARGET=ON
          C++ target: x86-64-v2
          Rust target: x86-64-v2
          vcpkg build: Release-only
          Runtime layout: bin + share/Lagom
          PDF.js: share/Lagom/ladybird/pdfjs
          "@ | Set-Content "$stage\BUILD-INFO.txt" -Encoding utf8

      # 16. Runtime smoke test
      - name: Runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = (Resolve-Path "dist\Ladybird-Windows-x64\bin\Ladybird.exe").Path
          $root = (Resolve-Path "dist\Ladybird-Windows-x64").Path

          $env:PATH = "$root\bin;$env:PATH"
          $env:ICU_DATA = "$root\share\Lagom\icu"
          $env:QT_PLUGIN_PATH = "$root\bin"

          Write-Host "Launching Ladybird smoke test..."
          Write-Host "Executable: $exe"

          $process = Start-Process -FilePath $exe `
            -WorkingDirectory "$root\bin" `
            -PassThru

          Start-Sleep -Seconds 20
          $process.Refresh()

          if ($process.HasExited) {
            throw "Ladybird exited during smoke test. Exit code: $($process.ExitCode)"
          }

          Write-Host "Ladybird remained running for 20 seconds."

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      # 17. Package inventory
      - name: Generate package inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stage = "dist\Ladybird-Windows-x64"
          $stageRoot = (Resolve-Path $stage).Path

          Get-ChildItem $stage -Recurse -File |
            ForEach-Object {
              $relative = $_.FullName.Substring($stageRoot.Length).TrimStart("\")
              "$relative`t$($_.Length)"
            } |
            Set-Content "dist\PACKAGE-INVENTORY.txt" -Encoding utf8

      - name: Generate dependency report
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $stage = "dist\Ladybird-Windows-x64"
          $report = "dist\DEPENDENCIES.txt"

          "DLL dependency report" | Set-Content $report

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue

          if (!$dumpbin) {
            "dumpbin.exe was not found." | Add-Content $report
            exit 0
          }

          Get-ChildItem $stage -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            ForEach-Object {
              "`r`n===== $($_.FullName) =====" | Add-Content $report
              dumpbin.exe /DEPENDENTS $_.FullName 2>&1 | Add-Content $report
            }

      # 18. Create ZIP archive
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "dist\Ladybird-Windows-x64"
          $zip = "dist\Ladybird-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$source\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "ZIP archive was not created"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)

          try {
            if ($archive.Entries.Count -eq 0) {
              throw "ZIP archive is empty"
            }
            Write-Host "ZIP entries: $($archive.Entries.Count)"
          }
          finally {
            $archive.Dispose()
          }

      # 19. Generate SHA256
      - name: Generate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "dist\Ladybird-Windows-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          "$hash  Ladybird-Windows-x64.zip" |
            Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

          Write-Host "SHA256: $hash"

      # 20. Upload artifacts
      - name: Upload Ladybird ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-x64
          path: |
            dist/Ladybird-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload package audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-audit
          path: |
            dist/PACKAGE-INVENTORY.txt
            dist/DEPENDENCIES.txt
            dist/Ladybird-Windows-x64/BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 14

      # 21. vcpkg diagnostics
      - name: Locate vcpkg diagnostic files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Searching for vcpkg build logs..."

          foreach ($port in @("angle", "openssl", "skia", "dav1d")) {
            $directory = Join-Path $env:VCPKG_ROOT "buildtrees\$port"
            Write-Host ""
            Write-Host "===== $port ====="

            if (Test-Path $directory) {
              Get-ChildItem $directory -Recurse -File |
                Where-Object { $_.Name -match '(out|err)\.log$' } |
                Select-Object FullName, Length, LastWriteTime
            }
          }

      - name: Print vcpkg failure log tails
        if: failure()
        shell: pwsh
        run: |
          foreach ($port in @("angle", "openssl", "skia", "dav1d")) {
            $directory = Join-Path $env:VCPKG_ROOT "buildtrees\$port"

            if (!(Test-Path $directory)) {
              continue
            }

            $logs = Get-ChildItem $directory -Recurse -File |
              Where-Object { $_.Name -match '(out|err)\.log$' }

            foreach ($file in $logs) {
              Write-Host ""
              Write-Host "===== $($file.FullName) ====="
              Get-Content $file.FullName -Tail 100
            }
          }

      - name: Upload vcpkg diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-vcpkg-diagnostics
          path: |
            vcpkg/buildtrees/dav1d/
            vcpkg/buildtrees/angle/
            vcpkg/buildtrees/openssl/
            vcpkg/buildtrees/skia/
            ladybird/Build/release/vcpkg-manifest-install.log
            ladybird/Build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: warn
          retention-days: 7

      # 22. Optional GitHub pre-release
      - name: Publish GitHub pre-release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ladybird-windows-${{ env.BUILD_TIMESTAMP }}-${{ env.BUILD_SHA }}
          name: Ladybird Windows x64 ${{ env.BUILD_TIMESTAMP }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Ladybird-Windows-x64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
