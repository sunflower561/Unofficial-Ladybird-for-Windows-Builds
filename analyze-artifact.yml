
name: Analyze Ladybird Artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID"
        required: true
        default: "44169988377"
        type: string
      artifact_name:
        description: "Artifact name"
        required: true
        default: "Ladybird-Windows-x64"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Download existing artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          $ErrorActionPreference = "Stop"
          gh run download "$env:RUN_ID" `
            --repo "$env:GITHUB_REPOSITORY" `
            --name "$env:ARTIFACT_NAME" `
            --dir "$env:RUNNER_TEMP\ladybird-artifact"

      - name: Analyze ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $root = "$env:RUNNER_TEMP\ladybird-artifact"
          $zip = Get-ChildItem $root -Recurse -Filter "Ladybird-Windows-x64.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "Ladybird-Windows-x64.zip was not found."
          }

          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $report = [System.Collections.Generic.List[string]]::new()

          try {
            $entries = @($archive.Entries | Where-Object {
              $_.Name -ne ""
            })

            $total = ($entries | Measure-Object Length -Sum).Sum
            $compressed = ($entries | Measure-Object CompressedLength -Sum).Sum

            $report.Add("LADYBIRD WINDOWS ZIP SIZE REPORT")
            $report.Add("================================")
            $report.Add("Archive: $($zip.FullName)")
            $report.Add("Files: $($entries.Count)")
            $report.Add("Uncompressed: $([math]::Round($total / 1GB, 3)) GB")
            $report.Add("Compressed entries: $([math]::Round($compressed / 1MB, 2)) MB")
            $report.Add("")

            $report.Add("TOP 50 LARGEST FILES")
            $report.Add("--------------------")
            foreach ($e in ($entries | Sort-Object Length -Descending | Select-Object -First 50)) {
              $report.Add(("{0,10:N2} MB | {1}" -f ($e.Length / 1MB), $e.FullName))
            }

            $report.Add("")
            $report.Add("SIZE BY FILE EXTENSION")
            $report.Add("----------------------")
            $groups = $entries | Group-Object {
              $ext = [IO.Path]::GetExtension($_.Name).ToLowerInvariant()
              if ($ext) { $ext } else { "[no extension]" }
            } | ForEach-Object {
              [pscustomobject]@{
                Extension = $_.Name
                Count = $_.Count
                Bytes = ($_.Group | Measure-Object Length -Sum).Sum
              }
            } | Sort-Object Bytes -Descending

            foreach ($g in $groups) {
              $report.Add(("{0,-16} {1,7} files {2,10:N2} MB" -f $g.Extension, $g.Count, ($g.Bytes / 1MB)))
            }

            $report.Add("")
            $report.Add("DEBUG / BUILD FILES")
            $report.Add("-------------------")
            $debug = @($entries | Where-Object {
              $_.Name -match '\.(pdb|ilk|obj|exp|lib|pch|idb)$'
            })
            $debugBytes = ($debug | Measure-Object Length -Sum).Sum
            $report.Add("Count: $($debug.Count)")
            $report.Add("Total: $([math]::Round($debugBytes / 1MB, 2)) MB")
            foreach ($e in ($debug | Sort-Object Length -Descending | Select-Object -First 30)) {
              $report.Add(("{0,10:N2} MB | {1}" -f ($e.Length / 1MB), $e.FullName))
            }

            $report.Add("")
            $report.Add("DUPLICATE FILE CONTENTS (SHA256)")
            $report.Add("--------------------------------")
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $hashRows = foreach ($e in $entries) {
                $stream = $e.Open()
                try {
                  $hash = [Convert]::ToHexString($sha.ComputeHash($stream))
                  [pscustomobject]@{
                    Hash = $hash
                    Path = $e.FullName
                    Size = $e.Length
                  }
                } finally {
                  $stream.Dispose()
                }
              }

              $duplicates = $hashRows | Group-Object Hash | Where-Object Count -gt 1
              $report.Add("Duplicate groups: $($duplicates.Count)")
              foreach ($d in $duplicates) {
                $report.Add("")
                $report.Add("SHA256: $($d.Name)")
                foreach ($item in $d.Group) {
                  $report.Add("  $($item.Path)")
                }
              }
            } finally {
              $sha.Dispose()
            }

          } finally {
            $archive.Dispose()
          }

          $report | Set-Content "$env:GITHUB_WORKSPACE\Ladybird-Size-Report.txt" -Encoding UTF8
          $report | ForEach-Object { Write-Host $_ }

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Size-Report
          path: Ladybird-Size-Report.txt
          retention-days: 14
